const NEON = [0.30, 0.86, 1.00];       /* canyon rib colour                 */
const FOG  = [0.043, 0.059, 0.118];    /* == #0b0f1e, so the walls dissolve  */
const LIGHT = vNorm([0.36, 0.82, -0.44]);

const SPEED_BASE  = 62;
const SPEED_MAX   = 96;
const SPEED_BOOST = 46;
const BOOST_MAX   = 2.2;
const BOOST_REGEN = 0.30;

const MAX_OBSTACLES = 72;
const MAX_ENEMIES   = 7;
const MAX_BULLETS   = 64;
const MAX_PARTICLES = 260;

const Game = {
  state: "title",             /* title | run | paused | dead */
  pos: [0,0,0], vel: [0,0,0], quat: qIdent(),
  angVel: [0,0,0],            /* body-local pitch / yaw / roll rates */
  camPos: [0,0,0], camQuat: qIdent(),
  speed: SPEED_BASE, boostFuel: BOOST_MAX, boosting: false, boostLock: 0,
  shield: 100, damageTimer: 0, hitFlash: 0, shake: 0, slowT: 0,
  distance: 0, score: 0, rings: 0, kills: 0,
  mult: 1, grazeTime: 0, grazeCool: 0,
  best: parseFloat(store.get(K_BEST) || "0") || 0,
  time: 0, fireCool: 0,
  chunks: new Map(),          /* chunkIndex -> pool slot */
  obstacles: [], enemies: [], bullets: [], particles: [],
  nextSpawnChunk: 0, newBest: false,

  reset() {
    const fr = pathFrame(2);
    this.pos = fr.pos.slice();
    /* identity quat faces world -Z; the canyon runs +Z, so start turned round */
    this.quat = qNorm([0, 1, 0, 0]);
    this.vel = vScale(fr.tan, SPEED_BASE);
    this.angVel = [0,0,0];
    this.camQuat = this.quat.slice();
    this.camPos = vAdd(this.pos, qRotate(this.quat, [0, 1.7, 7.4]));
    this.speed = SPEED_BASE; this.boostFuel = BOOST_MAX; this.boosting = false; this.boostLock = 0;
    this.shield = 100; this.damageTimer = 0; this.hitFlash = 0; this.shake = 0; this.slowT = 0;
    this.distance = 0; this.score = 0; this.rings = 0; this.kills = 0;
    this.mult = 1; this.grazeTime = 0; this.grazeCool = 0;
    this.time = 0; this.fireCool = 0; this.newBest = false;
    this.obstacles.length = 0; this.enemies.length = 0;
    this.bullets.length = 0; this.particles.length = 0;
    this.nextSpawnChunk = 0;
    for (const slot of this.chunks.values()) { slot.free = true; slot.index = null; }
    this.chunks.clear();
  },

  start() {
    this.reset();
    this.state = "run";
    hideOverlay();
    document.getElementById("hud").classList.remove("hidden");
    document.body.classList.add("playing");
    Sound.resume();
  },

  togglePause() {
    if (this.state === "run") {
      this.state = "paused";
      Sound.engineLevel(0, false);
      showPause();
    } else if (this.state === "paused") {
      this.state = "run";
      hideOverlay();
      Sound.resume();
    }
  },

  primaryAction() {
    if (this.state === "title" || this.state === "dead") this.start();
    else if (this.state === "paused") this.togglePause();
  },

  die() {
    this.state = "dead";
    Sound.engineLevel(0, false);
    Sound.sDead();
    const d = Math.floor(this.distance);
    if (d > this.best) { this.best = d; this.newBest = true; store.set(K_BEST, String(d)); }
    burst(this.pos, [1.0, 0.55, 0.25], 42, 34);
    showGameOver();
  },

  damage(amount, color) {
    if (this.state !== "run") return;
    this.shield -= amount;
    this.damageTimer = 2.6;
    this.hitFlash = 1;
    this.slowT = Math.max(this.slowT, 0.14);   // a breath of hit-stop
    this.shake = Math.min(1.4, this.shake + amount * 0.020);
    this.mult = 1; this.grazeTime = 0;
    burst(this.pos, color || [1.0, 0.35, 0.42], 12, 18);
    Sound.sHit();
    if (this.shield <= 0) { this.shield = 0; this.die(); }
  }
};

/* ---- obstacle + entity factories (all counts hard-bounded) ---- */
function spawnObstaclesForChunk(ci) {
  if (ci < 3) return;                              /* clear run-up */
  const t0 = ci * CHUNK;
  const difficulty = clamp(ci / 90, 0, 1);
  /* density ramps with distance — the opening stretch stays readable */
  const n = 1 + Math.floor(hash1(ci * 2.7) * (1.3 + difficulty * 1.7));

  for (let k = 0; k < n; k++) {
    if (Game.obstacles.length >= MAX_OBSTACLES) return;
    const h = (x) => hash1(ci * 13.37 + k * 4.71 + x);
    const t = t0 + (k + 0.35 + h(1) * 0.4) * (CHUNK / n);
    const roll = h(2);
    const fr = pathFrame(t);
    const rad = corridorRadius(t);

    if (roll < 0.52) {
      /* ---- ring: fly through the middle for a bonus ---- */
      const off = h(3) * (rad * 0.34);
      const ang = h(4) * TAU;
      const c = vAdd(fr.pos, vAdd(vScale(fr.right, Math.cos(ang)*off), vScale(fr.up, Math.sin(ang)*off)));
      Game.obstacles.push({
        kind: "ring", t, center: c, fr, R: Math.max(3.4, rad * 0.32),
        spin: (h(5) - 0.5) * 1.4, phase: h(6) * TAU, prevSide: 0, hit: false, pop: 0
      });
    } else if (roll < 0.84) {
      /* ---- pylon: a bar across the corridor ---- */
      const ang = h(3) * TAU;
      const axis = vNorm(vAdd(vScale(fr.right, Math.cos(ang)), vScale(fr.up, Math.sin(ang))));
      const shift = (h(4) - 0.5) * rad * 0.55;
      const perp = vNorm(vCross(axis, fr.tan));
      const c = vAdd(fr.pos, vScale(perp, shift));
      Game.obstacles.push({
        kind: "pylon", t, center: c, fr, axis,
        len: rad * 2.1, r: 0.85 + difficulty * 0.5, phase: h(6) * TAU
      });
    } else {
      /* ---- rotating gate: two crossing bars turning about the tangent ---- */
      Game.obstacles.push({
        kind: "gate", t, center: fr.pos.slice(), fr,
        len: rad * 1.94, r: 0.72, ang: h(3) * TAU,
        spin: (h(4) < 0.5 ? -1 : 1) * (0.45 + difficulty * 0.85), bars: h(5) < 0.45 ? 3 : 2
      });
    }
  }

  /* interceptors thin in after the opening stretch */
  if (ci > 7 && Game.enemies.length < MAX_ENEMIES && hash1(ci * 8.13) < 0.28 + difficulty * 0.36) {
    spawnEnemy(t0 + CHUNK * 0.5);
  }
}

function spawnEnemy(t) {
  if (Game.enemies.length >= MAX_ENEMIES) return;
  const fr = pathFrame(t);
  const a = Math.random() * TAU, r = corridorRadius(t) * (0.25 + Math.random() * 0.4);
  const p = vAdd(fr.pos, vAdd(vScale(fr.right, Math.cos(a)*r), vScale(fr.up, Math.sin(a)*r)));
  Game.enemies.push({
    pos: p, vel: vScale(fr.tan, SPEED_BASE * 0.9), quat: qNorm([0,1,0,0]),
    hp: 2, cool: 0.6 + Math.random() * 0.9, life: 0, radius: 1.6, roll: Math.random() * TAU
  });
}

function fireBullet(from, dir, speed, owner, extraVel) {
  if (Game.bullets.length >= MAX_BULLETS) Game.bullets.shift();
  const base = extraVel || [0,0,0];
  Game.bullets.push({
    pos: from.slice(), vel: vAdd(vScale(dir, speed), base),
    life: owner === "p" ? 1.5 : 2.6, owner, dir: dir.slice()
  });
}

function burst(p, color, n, spread) {
  for (let i = 0; i < n; i++) {
    if (Game.particles.length >= MAX_PARTICLES) Game.particles.shift();
    const d = vNorm([Math.random()*2-1, Math.random()*2-1, Math.random()*2-1]);
    Game.particles.push({
      pos: p.slice(), vel: vScale(d, spread * (0.35 + Math.random())),
      life: 0.45 + Math.random() * 0.6, max: 1.05,
      size: 0.22 + Math.random() * 0.45, color
    });
  }
}
function ringPop(center, fr, radius) {
  const n = 20;
  for (let i = 0; i < n; i++) {
    if (Game.particles.length >= MAX_PARTICLES) Game.particles.shift();
    const a = i / n * TAU;
    const dir = vAdd(vScale(fr.right, Math.cos(a)), vScale(fr.up, Math.sin(a)));
    Game.particles.push({
      pos: vAdd(center, vScale(dir, radius)),
      vel: vAdd(vScale(dir, 11), vScale(fr.tan, 24)),
      life: 0.55, max: 0.55, size: 0.34, color: [1.0, 0.80, 0.30]
    });
  }
}

/* ---- canyon chunk streaming ---- */
function acquireSlot() {
  for (const s of R.chunkPool) if (s.free) return s;
  return null;
}
function updateChunks() {
  const shipChunk = Math.floor(Game.pos[2] / CHUNK_LEN);
  const lo = shipChunk - BEHIND, hi = shipChunk + AHEAD;

  for (const [ci, slot] of Game.chunks) {
    if (ci < lo || ci > hi) { slot.free = true; slot.index = null; Game.chunks.delete(ci); }
  }
  for (let ci = lo; ci <= hi; ci++) {
    if (ci < 0 || Game.chunks.has(ci)) continue;
    const slot = acquireSlot();
    if (!slot) continue;
    const g = buildChunk(ci);
    gl.bindVertexArray(slot.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, slot.vbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, g.verts);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, slot.ibo);
    gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, 0, g.idx);
    gl.bindVertexArray(null);
    slot.count = g.count; slot.index = ci; slot.free = false;
    Game.chunks.set(ci, slot);
    if (ci >= Game.nextSpawnChunk) { spawnObstaclesForChunk(ci); Game.nextSpawnChunk = ci + 1; }
  }
}

/* ---- collision helpers ---- */
function sphereHitShip(c, r) {
  const d = vSub(Game.pos, c);
  const rr = r + SHIP_R;
  return vLen2(d) < rr * rr;
}
/* capsule as a short chain of spheres — cheap and accurate enough in 3D */
function capsuleHit(center, axis, halfLen, r, point, pr) {
  const d = vSub(point, center);
  let s = clamp(vDot(d, axis), -halfLen, halfLen);
  const closest = vAdd(center, vScale(axis, s));
  const dd = vSub(point, closest);
  const rr = r + pr;
  return vLen2(dd) < rr * rr;
}

/* ---- per-frame simulation ---- */
function updateGame(dt) {
  const G = Game;
  G.time += dt;

  /* ---------------- steering: torque toward target rates, with momentum ---- */
  const boostWanted = Input.boostHeld && G.boostFuel > 0.05 && G.boostLock <= 0;
  if (boostWanted) {
    if (!G.boosting) Sound.sBoost();
    G.boosting = true;
    G.boostFuel -= dt;
    if (G.boostFuel <= 0) { G.boostFuel = 0; G.boosting = false; G.boostLock = 2.4; }
  } else {
    G.boosting = false;
    if (G.boostLock > 0) G.boostLock -= dt;
    else G.boostFuel = Math.min(BOOST_MAX, G.boostFuel + BOOST_REGEN * dt);
  }

  const ramp = clamp(G.distance / 9000, 0, 1);
  const target = (SPEED_BASE + ramp * (SPEED_MAX - SPEED_BASE)) + (G.boosting ? SPEED_BOOST : 0);
  G.speed = approach(G.speed, target, G.boosting ? 4.0 : 2.0, dt);

  /* Target angular rates. Pitch = local X, yaw = local Y, roll = local Z.
     Yaw input also commands roll, which is what makes a turn read as a bank. */
  const agility = 1.0 - 0.22 * clamp((G.speed - SPEED_BASE) / SPEED_BOOST, 0, 1);
  const tPitch =  Input.steerY *  1.55 * agility;
  const tYaw   = -Input.steerX *  1.15 * agility;
  const tRoll  = -Input.steerX *  2.35 - Input.rollIn * 2.2;

  /* momentum: rates chase their targets, they do not snap to them */
  G.angVel[0] = approach(G.angVel[0], tPitch, 6.5, dt);
  G.angVel[1] = approach(G.angVel[1], tYaw,   5.2, dt);
  G.angVel[2] = approach(G.angVel[2], tRoll,  4.0, dt);

  G.quat = qIntegrate(G.quat, G.angVel, dt);

  const fwd   = qRotate(G.quat, [0, 0, -1]);
  const upV   = qRotate(G.quat, [0, 1, 0]);
  const right = qRotate(G.quat, [1, 0, 0]);

  /* velocity carries a little inertia off the nose direction — slight drift */
  const wanted = vScale(fwd, G.speed);
  G.vel = [
    approach(G.vel[0], wanted[0], 7.0, dt),
    approach(G.vel[1], wanted[1], 7.0, dt),
    approach(G.vel[2], wanted[2], 7.0, dt)
  ];
  G.pos = vAdd(G.pos, vScale(G.vel, dt));

  /* ---------------- canyon containment + near-miss grazing ---------------- */
  const t  = nearestT(G.pos);
  const fr = pathFrame(t);
  const radial = vSub(G.pos, fr.pos);
  const along  = vDot(radial, fr.tan);
  const offVec = vSub(radial, vScale(fr.tan, along));
  const offLen = vLen(offVec);
  const clear  = corridorRadius(t);
  const gap    = clear - offLen;

  if (gap < SHIP_R) {
    /* pushed back inside, bled speed, and hurt */
    const n = offLen > 1e-4 ? vScale(offVec, 1 / offLen) : [1,0,0];
    G.pos = vAdd(fr.pos, vAdd(vScale(fr.tan, along), vScale(n, clear - SHIP_R - 0.05)));
    const vn = vDot(G.vel, n);
    if (vn > 0) G.vel = vSub(G.vel, vScale(n, vn * 1.5));
    /* A scrape costs shield and speed ONCE, then degrades into a steady drag
       while you stay in contact. Applying the impact cost every frame would
       make the penalty depend on the frame rate — and would stall the ship. */
    if (G.damageTimer < 1.4) {
      G.damage(6 + Math.min(10, vn * 0.16), [0.45, 0.85, 1.0]);
      G.speed *= 0.84;
    } else {
      G.speed = approach(G.speed, SPEED_BASE * 0.62, 2.4, dt);
    }
  } else if (gap < 4.2) {
    G.grazeTime += dt;
    G.grazeCool = 0.5;
    if (Math.random() < dt * 7) Sound.sGraze();
  } else {
    G.grazeCool -= dt;
    if (G.grazeCool <= 0) G.grazeTime = approach(G.grazeTime, 0, 1.6, dt);
  }
  G.mult = 1 + Math.min(3.0, G.grazeTime * 0.65);

  /* ---------------- distance + score ---------------- */
  const gained = Math.max(0, vDot(vScale(G.vel, dt), fr.tan));
  G.distance += gained;
  G.score += gained * G.mult * 1.15;

  /* shield trickles back when nothing has hit you for a while */
  if (G.damageTimer > 0) G.damageTimer -= dt;
  else G.shield = Math.min(100, G.shield + 2.4 * dt);
  G.hitFlash = Math.max(0, G.hitFlash - dt * 4.5);
  G.shake = Math.max(0, G.shake - dt * 2.2);

  /* ---------------- firing ---------------- */
  G.fireCool -= dt;
  if (Input.fireHeld && G.fireCool <= 0) {
    G.fireCool = 0.11;
    const nose = vAdd(G.pos, vScale(fwd, 2.6));
    fireBullet(vAdd(nose, vScale(right,  0.9)), fwd, 210, "p", vScale(fwd, G.speed * 0.35));
    fireBullet(vAdd(nose, vScale(right, -0.9)), fwd, 210, "p", vScale(fwd, G.speed * 0.35));
    Sound.sFire();
  }

  /* ---------------- obstacles ---------------- */
  for (let i = G.obstacles.length - 1; i >= 0; i--) {
    const o = G.obstacles[i];
    if (o.t < t - 12) { G.obstacles.splice(i, 1); continue; }
    if (o.t > t + 200) continue;                 /* not near enough to matter */

    if (o.kind === "ring") {
      o.phase += o.spin * dt;
      if (o.pop > 0) o.pop -= dt;
      const d = vSub(G.pos, o.center);
      const side = vDot(d, o.fr.tan);
      if (o.prevSide < 0 && side >= 0 && !o.hit) {
        const rad = vLen(vSub(d, vScale(o.fr.tan, side)));
        if (rad < o.R - 0.5) {
          o.hit = true; o.pop = 0.45;
          G.rings++; G.score += 260 * G.mult;
          ringPop(o.center, o.fr, o.R);
          Sound.sRing();
          flash("RING +" + Math.round(260 * G.mult));
        } else if (rad < o.R + 0.9) {
          o.hit = true;
          G.damage(9, [1.0, 0.8, 0.3]);
        }
      }
      o.prevSide = side;

    } else if (o.kind === "pylon") {
      if (capsuleHit(o.center, o.axis, o.len * 0.5, o.r, G.pos, SHIP_R)) {
        if (G.damageTimer < 2.2) {
          G.damage(34, [1.0, 0.45, 0.2]);
          const push = vNorm(vSub(G.pos, o.center));
          G.pos = vAdd(G.pos, vScale(push, 1.6));
        }
      }

    } else if (o.kind === "gate") {
      o.ang += o.spin * dt;
      for (let b = 0; b < o.bars; b++) {
        const a = o.ang + b * Math.PI / o.bars;
        const axis = vNorm(vAdd(vScale(o.fr.right, Math.cos(a)), vScale(o.fr.up, Math.sin(a))));
        if (capsuleHit(o.center, axis, o.len * 0.5, o.r, G.pos, SHIP_R)) {
          if (G.damageTimer < 2.2) {
            G.damage(30, [0.9, 0.35, 1.0]);
            const push = vNorm(vSub(G.pos, o.center));
            G.pos = vAdd(G.pos, vScale(push, 1.6));
          }
          break;
        }
      }
    }
  }

  /* ---------------- enemies ---------------- */
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    e.life += dt;
    const toShip = vSub(G.pos, e.pos);
    const dist = vLen(toShip);
    if (dist > 460 || e.pos[2] < G.pos[2] - 130) { G.enemies.splice(i, 1); continue; }

    const et = nearestT(e.pos);
    const efr = pathFrame(et);

    /* pursuit curve: aim at a lead point, but always keep tracking down-tunnel
       so they never stall out in a corner */
    let goal;
    if (dist > 70) {
      goal = vAdd(G.pos, vScale(fwd, 26));
    } else {
      const lead = vAdd(G.pos, vScale(G.vel, 0.35));
      goal = vAdd(lead, vScale(efr.tan, 34));
    }
    const desired = vScale(vNorm(vSub(goal, e.pos)), SPEED_BASE * 1.06 + 12);
    e.vel = [
      approach(e.vel[0], desired[0], 1.7, dt),
      approach(e.vel[1], desired[1], 1.7, dt),
      approach(e.vel[2], desired[2], 1.7, dt)
    ];
    e.pos = vAdd(e.pos, vScale(e.vel, dt));

    /* keep them off the walls */
    const er = vSub(e.pos, efr.pos);
    const ea = vDot(er, efr.tan);
    const eo = vSub(er, vScale(efr.tan, ea));
    const eol = vLen(eo);
    const elim = corridorRadius(et) - 2.6;
    if (eol > elim && eol > 1e-4) {
      const n = vScale(eo, 1 / eol);
      e.pos = vAdd(efr.pos, vAdd(vScale(efr.tan, ea), vScale(n, elim)));
      const vn = vDot(e.vel, n);
      if (vn > 0) e.vel = vSub(e.vel, vScale(n, vn * 1.4));
    }

    /* orient the hull along its own velocity */
    const ef = vNorm(e.vel);
    const eright = vNorm(vCross([0,1,0], ef));
    const eup = vCross(ef, eright);
    e.axes = { f: ef, r: eright, u: eup };
    e.roll += dt * 1.1;

    /* shoot when close and roughly aimed */
    e.cool -= dt;
    if (e.cool <= 0 && dist < 190 && dist > 16) {
      e.cool = 1.0 + Math.random() * 1.1;
      const aim = vNorm(vSub(vAdd(G.pos, vScale(G.vel, dist / 150)), e.pos));
      fireBullet(vAdd(e.pos, vScale(aim, 2.2)), aim, 128, "e");
      Sound.blip("square", 340, 120, 0.10, 0.06, 1600);
    }

    if (dist < e.radius + SHIP_R + 0.6) {
      G.damage(38, [1.0, 0.3, 0.4]);
      burst(e.pos, [1.0, 0.4, 0.3], 18, 26);
      G.enemies.splice(i, 1);
    }
  }

  /* ---------------- bullets ---------------- */
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.life -= dt;
    b.pos = vAdd(b.pos, vScale(b.vel, dt));
    if (b.life <= 0) { G.bullets.splice(i, 1); continue; }

    if (b.owner === "p") {
      for (let j = G.enemies.length - 1; j >= 0; j--) {
        const e = G.enemies[j];
        const d = vSub(b.pos, e.pos);
        if (vLen2(d) < (e.radius + 0.9) * (e.radius + 0.9)) {
          e.hp--;
          burst(b.pos, [1.0, 0.85, 0.4], 6, 14);
          G.bullets.splice(i, 1);
          if (e.hp <= 0) {
            burst(e.pos, [1.0, 0.45, 0.25], 22, 30);
            G.enemies.splice(j, 1);
            G.kills++; G.score += 420 * G.mult;
            Sound.sKill();
            flash("INTERCEPTOR DOWN");
          }
          break;
        }
      }
    } else {
      if (sphereHitShip(b.pos, 0.7)) {
        G.damage(13, [1.0, 0.3, 0.35]);
        G.bullets.splice(i, 1);
        continue;
      }
    }
    /* bullets die on the canyon wall too */
    const bt = nearestT(b.pos);
    const bfr = pathFrame(bt);
    const brv = vSub(b.pos, bfr.pos);
    const ba = vDot(brv, bfr.tan);
    if (vLen(vSub(brv, vScale(bfr.tan, ba))) > corridorRadius(bt) + 2.0) {
      burst(b.pos, [0.5, 0.85, 1.0], 4, 10);
      G.bullets.splice(i, 1);
    }
  }

  /* ---------------- particles ---------------- */
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    p.pos = vAdd(p.pos, vScale(p.vel, dt));
    p.vel = vScale(p.vel, 1 - 1.4 * dt);
  }

  /* ---------------- camera: trails, lags, and swings on the roll ---------- */
  const camLag = 1 - Math.exp(-7.5 * dt);
  const back = 9.4 + (G.boosting ? 2.2 : 0) + clamp((G.speed - SPEED_BASE) * 0.035, 0, 2.4);
  const wantPos = vAdd(G.pos, qRotate(G.quat, [0, 2.05, back]));
  G.camPos = vLerp(G.camPos, wantPos, camLag);
  /* orientation lags harder than position — that difference IS the 3D feel */
  G.camQuat = qSlerp(G.camQuat, G.quat, 1 - Math.exp(-5.4 * dt));

  if (G.shake > 0.001) {
    const s = G.shake * 0.55;
    G.camPos = vAdd(G.camPos, [
      (Math.random()*2-1) * s, (Math.random()*2-1) * s, (Math.random()*2-1) * s
    ]);
  }

  Sound.engineLevel(clamp((G.speed - 40) / 90, 0, 1), true);
}

/* --------------------------------------------------------------- render */
function drawScene() {
  const G = Game;

  /* view = inverse(camera world matrix). Building the camera in world space
     first is what lets the roll and the positional lag be independent. */
  qToMat4(R.camWorld, G.camQuat, G.camPos, 1);
  mInvert(R.view, R.camWorld);
  mMul(R.viewProj, R.proj, R.view);

  /* rotation-only view for the starfield */
  R.rotView.set(R.view);
  R.rotView[12] = 0; R.rotView[13] = 0; R.rotView[14] = 0;
  mMul(R.rotProj, R.proj, R.rotView);

  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fbScene);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  gl.viewport(0, 0, R.fbW, R.fbH);
  gl.clearBufferfv(gl.COLOR, 0, [FOG[0], FOG[1], FOG[2], 1]);
  gl.clearBufferfv(gl.COLOR, 1, [0, 0, 0, 1]);
  gl.clear(gl.DEPTH_BUFFER_BIT);

  /* ---- stars, pinned at the far plane, no depth write ---- */
  gl.depthMask(false);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(R.progStars.program);
  gl.uniformMatrix4fv(R.progStars.u.uRotProj, false, R.rotProj);
  gl.bindVertexArray(R.starVAO);
  gl.drawArrays(gl.POINTS, 0, R.starCount);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);

  /* ---- canyon ---- */
  const P = R.progCanyon;
  gl.useProgram(P.program);
  gl.uniformMatrix4fv(P.u.uViewProj, false, R.viewProj);
  gl.uniform3fv(P.u.uCamPos, G.camPos);
  gl.uniform3fv(P.u.uLightDir, LIGHT);
  gl.uniform3fv(P.u.uShipPos, G.pos);
  gl.uniform3fv(P.u.uFogColor, FOG);
  gl.uniform3fv(P.u.uNeon, NEON);
  gl.uniform1f(P.u.uFogDensity, 0.00335);
  gl.uniform1f(P.u.uTime, G.time);
  for (const slot of Game.chunks.values()) {
    if (slot.free || !slot.count) continue;
    gl.bindVertexArray(slot.vao);
    gl.drawElements(gl.TRIANGLES, slot.count, gl.UNSIGNED_SHORT, 0);
  }

  /* ---- everything instanced ---- */
  const I = R.progInst;
  gl.useProgram(I.program);
  gl.uniformMatrix4fv(I.u.uViewProj, false, R.viewProj);
  gl.uniform3fv(I.u.uCamPos, G.camPos);
  gl.uniform3fv(I.u.uLightDir, LIGHT);
  gl.uniform3fv(I.u.uFogColor, FOG);
  gl.uniform1f(I.u.uFogDensity, 0.00335);

  const camT = nearestT(G.camPos);

  /* rings + gates + pylons */
  for (const o of Game.obstacles) {
    if (o.t < camT - 6 || o.t > camT + 112) continue;

    if (o.kind === "ring") {
      const s = o.R * (o.pop > 0 ? 1 + (0.45 - o.pop) * 0.9 : 1);
      const c = Math.cos(o.phase), sn = Math.sin(o.phase);
      const xa = vScale(vAdd(vScale(o.fr.right, c), vScale(o.fr.up, sn)), s);
      const ya = vScale(vAdd(vScale(o.fr.right, -sn), vScale(o.fr.up, c)), s);
      const za = vScale(o.fr.tan, s);
      mFromAxes(tmpM, xa, ya, za, o.center);
      const glowE = o.hit ? 0.28 : 1.55 + 0.5 * Math.sin(Game.time * 3.4 + o.phase);
      const col = o.hit ? [0.32,0.36,0.44] : [1.0, 0.80, 0.30];
      const em  = o.hit ? [0.30,0.40,0.55] : [1.0, 0.78, 0.26];
      pushInstance(R.mRing, tmpM, col, em, glowE);

    } else if (o.kind === "pylon") {
      const za = vScale(o.axis, o.len);
      const xa = vScale(vNorm(vCross(o.axis, o.fr.tan)), o.r);
      const ya = vScale(vNorm(vCross(o.axis, xa)), o.r);
      mFromAxes(tmpM, xa, ya, za, o.center);
      pushInstance(R.mTube, tmpM, [0.30, 0.21, 0.38],
                   [1.0, 0.28, 0.40], 0.52 + 0.16 * Math.sin(Game.time * 2.0 + o.phase));

    } else if (o.kind === "gate") {
      for (let b = 0; b < o.bars; b++) {
        const a = o.ang + b * Math.PI / o.bars;
        const axis = vNorm(vAdd(vScale(o.fr.right, Math.cos(a)), vScale(o.fr.up, Math.sin(a))));
        const za = vScale(axis, o.len);
        const xa = vScale(vNorm(vCross(axis, o.fr.tan)), o.r);
        const ya = vScale(vNorm(vCross(axis, xa)), o.r);
        mFromAxes(tmpM, xa, ya, za, o.center);
        pushInstance(R.mTube, tmpM, [0.26, 0.18, 0.40], [0.82, 0.30, 1.0], 0.72);
      }
    }
  }

  /* bullets: stretched glowing rods along their own velocity */
  for (const b of Game.bullets) {
    const d = vNorm(b.vel);
    const xr = vNorm(vCross(Math.abs(d[1]) > 0.9 ? [1,0,0] : [0,1,0], d));
    const yr = vCross(d, xr);
    const len = b.owner === "p" ? 3.4 : 2.4;
    const rad = b.owner === "p" ? 0.16 : 0.24;
    mFromAxes(tmpM, vScale(xr, rad), vScale(yr, rad), vScale(d, len), b.pos);
    if (b.owner === "p") pushInstance(R.mTube, tmpM, [1.0, 0.92, 0.55], [1.0, 0.84, 0.32], 2.6);
    else                 pushInstance(R.mTube, tmpM, [1.0, 0.45, 0.50], [1.0, 0.26, 0.34], 2.4);
  }

  /* interceptors */
  for (const e of Game.enemies) {
    if (!e.axes) continue;
    const c = Math.cos(e.roll), s = Math.sin(e.roll);
    const xa = vAdd(vScale(e.axes.r, c), vScale(e.axes.u, s));
    const ya = vAdd(vScale(e.axes.r, -s), vScale(e.axes.u, c));
    mFromAxes(tmpM, xa, ya, vScale(e.axes.f, -1), e.pos);   /* hull nose is -Z */
    pushInstance(R.mEnemy, tmpM, [0.36, 0.10, 0.16], [1.0, 0.22, 0.30], 1.25);
  }

  /* particles */
  for (const p of Game.particles) {
    const k = clamp(p.life / p.max, 0, 1);
    const s = p.size * (0.25 + k * 0.8);
    mFromAxes(tmpM, [s,0,0], [0,s,0], [0,0,s], p.pos);
    pushInstance(R.mShard, tmpM, p.color, p.color, 1.0 * k + 0.25);
  }

  /* the ship itself, plus two emissive engine cans */
  if (Game.state !== "title") {
    qToMat4(tmpM, Game.quat, Game.pos, 1);
    pushInstance(R.mShip, tmpM, [0.62, 0.66, 0.78], [0.20, 0.55, 0.95], 0.55);

    const f = qRotate(Game.quat, [0,0,-1]);
    const r = qRotate(Game.quat, [1,0,0]);
    const u = qRotate(Game.quat, [0,1,0]);
    const thrust = Game.boosting ? 1.0 : 0.45 + 0.12 * Math.sin(Game.time * 22);
    for (const side of [-1, 1]) {
      const base = vAdd(Game.pos, vAdd(vScale(r, side * 0.78), vAdd(vScale(f, -1.5), vScale(u, 0.05))));
      const L = 0.9 + thrust * 3.0;
      const c = vAdd(base, vScale(f, -L * 0.5));
      mFromAxes(tmpM, vScale(r, 0.22), vScale(u, 0.22), vScale(f, -L), c);
      const col = Game.boosting ? [1.0, 0.75, 0.35] : [0.40, 0.80, 1.0];
      pushInstance(R.mTube, tmpM, col, col, 1.1 + thrust * 1.5);
    }
  }

  flushMesh(R.mRing);
  flushMesh(R.mTube);
  flushMesh(R.mEnemy);
  flushMesh(R.mShard);
  flushMesh(R.mShip);

  /* ---------------- bloom: downsample-blur the emissive buffer ---------- */
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  gl.bindVertexArray(R.quadVAO);

  const B = R.progBlur;
  gl.useProgram(B.program);
  gl.uniform1i(B.u.uTex, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.viewport(0, 0, R.halfW, R.halfH);

  /* pass 1: emissive -> blurA, horizontal */
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fbBlurA);
  gl.bindTexture(gl.TEXTURE_2D, R.texEmis);
  gl.uniform2f(B.u.uDir, 1.35 / R.halfW, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  /* pass 2: blurA -> blurB, vertical */
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fbBlurB);
  gl.bindTexture(gl.TEXTURE_2D, R.texBlurA);
  gl.uniform2f(B.u.uDir, 0, 1.35 / R.halfH);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  /* pass 3 + 4: widen it */
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fbBlurA);
  gl.bindTexture(gl.TEXTURE_2D, R.texBlurB);
  gl.uniform2f(B.u.uDir, 3.1 / R.halfW, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fbBlurB);
  gl.bindTexture(gl.TEXTURE_2D, R.texBlurA);
  gl.uniform2f(B.u.uDir, 0, 3.1 / R.halfH);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* ---------------- composite to the screen ---------------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.drawBuffers([gl.BACK]);
  gl.viewport(0, 0, R.w, R.h);
  const C = R.progComp;
  gl.useProgram(C.program);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.texScene);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, R.texBlurB);
  gl.uniform1i(C.u.uScene, 0);
  gl.uniform1i(C.u.uBloom, 1);
  gl.uniform1f(C.u.uBloomStrength, 0.85);
  gl.uniform1f(C.u.uFlash, Game.hitFlash);
  gl.uniform1f(C.u.uTime, Game.time);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.bindVertexArray(null);
}

/* ------------------------------------------------------------- 9. UI */
const el = {
  hud: document.getElementById("hud"),
  dist: document.getElementById("distVal"),
  score: document.getElementById("scoreVal"),
  shield: document.getElementById("shieldVal"),
  shieldBar: document.getElementById("shieldBar"),
  shieldFill: document.querySelector("#shieldBar > i"),
  boost: document.getElementById("boostVal"),
  boostFill: document.querySelector("#boostBar > i"),
  spd: document.getElementById("spdVal"),
  ring: document.getElementById("ringVal"),
  multi: document.getElementById("multi"),
  flash: document.getElementById("flash"),
  damage: document.getElementById("damage"),
  overlay: document.getElementById("overlay"),
  card: document.getElementById("overlayCard"),
  mute: document.getElementById("muteBtn")
};

let flashTimer = 0;
function flash(text) {
  el.flash.textContent = text;
  el.flash.classList.add("show");
  flashTimer = 1.1;
}

let hudAcc = 0;
function updateHUD(dt) {
  const G = Game;
  hudAcc += dt;
  if (flashTimer > 0) {
    flashTimer -= dt;
    if (flashTimer <= 0) el.flash.classList.remove("show");
  }
  el.damage.classList.toggle("on", G.hitFlash > 0.25);
  if (hudAcc < 0.066) return;
  hudAcc = 0;

  el.dist.innerHTML = Math.floor(G.distance).toLocaleString() + '<span style="font-size:14px"> m</span>';
  el.score.textContent = Math.floor(G.score).toLocaleString();
  const sh = Math.round(G.shield);
  el.shield.textContent = sh + "%";
  el.shieldFill.style.width = sh + "%";
  el.shieldBar.classList.toggle("low", sh < 34);
  el.boostFill.style.width = (G.boostFuel / BOOST_MAX * 100) + "%";
  el.boost.textContent = G.boostLock > 0 ? "CHARGING" : (G.boosting ? "ACTIVE" : "READY");
  el.spd.innerHTML = Math.round(G.speed) + '<span style="font-size:12px"> u/s</span>';
  el.ring.textContent = G.rings + " / " + G.kills;
  const m = G.mult;
  el.multi.textContent = "GRAZE x" + m.toFixed(1);
  el.multi.classList.toggle("on", m > 1.08);
}

function hideOverlay() { el.overlay.classList.add("hidden"); }
function showOverlay(html) {
  el.card.innerHTML = html;
  el.overlay.classList.remove("hidden");
}

const CONTROL_HELP = `
  <div class="keys">
    <div><b>WASD / Arrows</b> — pitch &amp; bank</div>
    <div><b>Q / E</b> — roll</div>
    <div><b>Space</b> — fire</div>
    <div><b>Shift</b> — boost</div>
    <div><b>P / Esc</b> — pause</div>
    <div><b>M</b> — mute</div>
    <div><b>Gamepad</b> — left stick steer, RT fire, LT boost</div>
    <div><b>Touch</b> — drag to steer, buttons to fire &amp; boost</div>
  </div>`;

function showTitle() {
  Game.state = "title";
  el.hud.classList.add("hidden");
  document.body.classList.remove("playing");
  showOverlay(`
    <h1>VOIDRUNNER</h1>
    <p class="sub">Overclock &middot; True 3D</p>
    <p>Thread a procedurally generated neon canyon that curves in every axis.
       Skim the walls for a graze multiplier, fly clean through the gold rings,
       and shoot the interceptors before they shoot you.</p>
    ${CONTROL_HELP}
    <div class="stats">
      <div class="stat"><div class="label">Best distance</div>
        <div class="value accent">${Math.floor(Game.best).toLocaleString()} m</div></div>
    </div>
    <button class="btn" id="btnStart">Launch</button>
  `);
  document.getElementById("btnStart").onclick = () => Game.start();
}

function showPause() {
  showOverlay(`
    <h2>Paused</h2>
    <p class="sub">Systems holding</p>
    ${CONTROL_HELP}
    <button class="btn" id="btnResume">Resume</button>
    <button class="btn ghost" id="btnQuit">Abort run</button>
  `);
  document.getElementById("btnResume").onclick = () => Game.togglePause();
  document.getElementById("btnQuit").onclick = () => { hideOverlay(); showTitle(); };
}

function showGameOver() {
  el.hud.classList.add("hidden");
  document.body.classList.remove("playing");
  showOverlay(`
    <h2>Hull breached</h2>
    <p class="sub">Run terminated</p>
    ${Game.newBest ? '<div class="newbest">New best distance</div>' : ""}
    <div class="stats">
      <div class="stat"><div class="label">Distance</div>
        <div class="value accent">${Math.floor(Game.distance).toLocaleString()} m</div></div>
      <div class="stat"><div class="label">Score</div>
        <div class="value">${Math.floor(Game.score).toLocaleString()}</div></div>
      <div class="stat"><div class="label">Rings</div>
        <div class="value">${Game.rings}</div></div>
      <div class="stat"><div class="label">Kills</div>
        <div class="value">${Game.kills}</div></div>
    </div>
    <p style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5)">
      Best ${Math.floor(Game.best).toLocaleString()} m</p>
    <button class="btn" id="btnAgain">Fly again</button>
    <button class="btn ghost" id="btnMenu">Menu</button>
  `);
  document.getElementById("btnAgain").onclick = () => Game.start();
  document.getElementById("btnMenu").onclick = () => showTitle();
}

function toggleMute() {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  el.mute.innerHTML = Sound.muted ? "&#128263;" : "&#9835;";
}
el.mute.onclick = toggleMute;
el.mute.innerHTML = Sound.muted ? "&#128263;" : "&#9835;";
document.getElementById("pauseBtn").onclick = () => {
  if (Game.state === "run" || Game.state === "paused") Game.togglePause();
};

document.addEventListener("visibilitychange", () => {
  if (document.hidden && Game.state === "run") Game.togglePause();
});

/* --------------------------------------------------------------- loop */
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (fatalShown) return;
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  /* clamp so a tab switch or a stall can never teleport the ship into a wall */
  dt = clamp(dt, 0.0005, 0.05);

  /* damage hit-stop: decays in real time, scales sim time (no GL changes) */
  if (Game.slowT > 0) { Game.slowT = Math.max(0, Game.slowT - dt); dt *= 0.45; }

  pollInput();

  if (Game.state === "run") {
    updateGame(dt);
    updateChunks();
    updateHUD(dt);
  } else if (Game.state === "title") {
    /* slow fly-by behind the ship so the menu is not a black screen */
    Game.time += dt;
    const t = 4 + Game.time * 2.2;
    const fr = pathFrame(t);
    Game.pos = fr.pos.slice();
    Game.camPos = vAdd(fr.pos, vAdd(vScale(fr.tan, -14),
                       vAdd(vScale(fr.up, 2.4), vScale(fr.right, Math.sin(Game.time * 0.4) * 5))));
    const look = vNorm(vSub(vAdd(fr.pos, vScale(fr.tan, 40)), Game.camPos));
    /* derive a quaternion from a look direction via a lookAt matrix inverse */
    mLookAt(R.view, Game.camPos, vAdd(Game.camPos, look), [0,1,0]);
    mInvert(R.camWorld, R.view);
    Game.camQuat = quatFromMatrix(R.camWorld);
    updateChunks();
  }

  /* always draw — a paused or finished run keeps its frozen scene behind the
     overlay, which is far better than a black rectangle */
  drawScene();
}

/* Extract a rotation quaternion from the upper 3x3 of a world matrix. */
function quatFromMatrix(m) {
  const m00=m[0], m01=m[4], m02=m[8];
  const m10=m[1], m11=m[5], m12=m[9];
  const m20=m[2], m21=m[6], m22=m[10];
  const tr = m00 + m11 + m22;
  let x, y, z, w;
  if (tr > 0) {
    const s = Math.sqrt(tr + 1.0) * 2;
    w = 0.25 * s; x = (m21 - m12) / s; y = (m02 - m20) / s; z = (m10 - m01) / s;
  } else if (m00 > m11 && m00 > m22) {
    const s = Math.sqrt(1.0 + m00 - m11 - m22) * 2;
    w = (m21 - m12) / s; x = 0.25 * s; y = (m01 + m10) / s; z = (m02 + m20) / s;
  } else if (m11 > m22) {
    const s = Math.sqrt(1.0 + m11 - m00 - m22) * 2;
    w = (m02 - m20) / s; x = (m01 + m10) / s; y = 0.25 * s; z = (m12 + m21) / s;
  } else {
    const s = Math.sqrt(1.0 + m22 - m00 - m11) * 2;
    w = (m10 - m01) / s; x = (m02 + m20) / s; y = (m12 + m21) / s; z = 0.25 * s;
  }
  return qNorm([x, y, z, w]);
}

/* ------------------------------------------------------------- boot */
if (gl) {
  auditCorridor();
  if (initRenderer()) {
    Game.reset();
    Game.state = "title";
    showTitle();
    requestAnimationFrame(frame);
  }
}
</script>
