<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Echo — Listen and Answer</title>
<meta name="theme-color" content="#fdf3e3">
<meta name="description" content="Little stories read out loud, answered with pictures. A listening game for children who cannot read yet — a dog at the pond, a red balloon, cookies with Grandma.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Echo">
<meta name="format-detection" content="telephone=no">
<style>
  :root {
    --bg: #fdf3e3;
    --bg2: #ffe6c4;
    --ink: #4a3421;
    --dim: rgba(74,52,33,0.62);
    --accent: #e2683c;
    --green: #3f8f6f;
    --panel: #fff9ef;
    --line: rgba(74,52,33,0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }

  /* ---- header (title strip). Top-right 100x52 belongs to the icon buttons. */
  #hdr {
    flex: 0 0 auto; height: 52px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 108px 0 max(14px, env(safe-area-inset-left));
    overflow: hidden;
  }
  #hdr .mark { font-size: 17px; font-weight: 800; letter-spacing: 0.26em; color: var(--accent); }
  #hdr .st { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #topbtns {
    position: absolute;
    top: max(4px, env(safe-area-inset-top));
    right: max(6px, env(safe-area-inset-right));
    display: flex; gap: 6px; z-index: 8;
  }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--panel); color: var(--ink);
    border: 2px solid var(--line);
    font-family: inherit; font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .iconbtn:active { background: #ffd9a8; }
  body:not(.playing) #topbtns { display: none; }

  /* ---- picture ---- */
  #artwrap {
    flex: 0 0 auto; min-height: 96px; height: min(52vh, 74vw); position: relative;
    margin: auto max(10px, env(safe-area-inset-left)) 6px max(10px, env(safe-area-inset-right));
    border-radius: 18px; overflow: hidden;
    border: 3px solid rgba(74,52,33,0.14);
    box-shadow: 0 6px 18px rgba(120,80,40,0.14);
    background: #cdeaf6;
  }
  canvas#art { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---- panel ---- */
  #panel {
    flex: 0 0 auto; margin-bottom: auto;
    padding: 0 max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; justify-content: center;
  }
  #caption {
    font-size: clamp(16px, 4.4vw, 24px); line-height: 1.28; font-weight: 600;
    text-align: center; margin: 4px 0 10px; min-height: 3.4em;
    display: flex; align-items: center; justify-content: center;
  }
  body.nospeech #caption { font-size: clamp(18px, 5.2vw, 28px); font-weight: 700; }
  #caption.q { color: var(--accent); font-weight: 800; }

  #choices { display: flex; gap: 8px; justify-content: center; align-items: stretch; }
  #choices.two { gap: 16px; }
  #choices:empty { display: none; }
  .choice {
    flex: 1 1 0; min-width: 100px; max-width: 168px; height: 122px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 2px; padding: 5px 4px 4px;
    border-radius: 16px; border: 3px solid var(--line);
    background: var(--panel); color: var(--ink);
    font-family: inherit; cursor: pointer; position: relative;
    transition: transform 0.12s ease;
  }
  .choice canvas { display: block; width: 100%; height: 90px; border-radius: 10px; }
  .choice .lab { font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: 0.02em;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .choice:active { transform: scale(0.96); }
  .choice.good { border-color: var(--green); background: #e6f6ee; animation: pop 0.45s ease; }
  .choice.show { border-color: var(--green); background: #e6f6ee; animation: ring 1s ease infinite; }
  .choice.faded { opacity: 0.55; }
  .choice[disabled] { cursor: default; }
  @keyframes pop { 0%{transform:scale(1)} 45%{transform:scale(1.09)} 100%{transform:scale(1)} }
  @keyframes ring { 0%,100%{box-shadow:0 0 0 0 rgba(63,143,111,0.45)} 50%{box-shadow:0 0 0 8px rgba(63,143,111,0)} }

  #btnrow { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
  .bigbtn {
    flex: 1 1 0; max-width: 240px; min-height: 56px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 14px; border: 3px solid rgba(226,104,60,0.55);
    background: #ffe0cf; color: #a8401b;
    font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer;
  }
  .bigbtn:active { background: #ffcbb0; }
  .bigbtn.go { border-color: rgba(63,143,111,0.55); background: #dff3ea; color: #26694f; }
  .bigbtn[hidden] { display: none; }

  /* ---- overlay cards ---- */
  #overlay {
    position: absolute; inset: 0; z-index: 10; display: none;
    align-items: safe center; justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 90% at 50% 0%, rgba(255,244,226,0.94), rgba(255,225,190,0.97));
    overflow-y: auto;
  }
  #overlay.on { display: flex; }
  .card {
    width: min(560px, 100%);
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 20px;
    padding: 20px 18px 18px;
    box-shadow: 0 18px 46px rgba(140,95,45,0.22);
    text-align: center;
  }
  .eyebrow { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--dim); }
  h1 { margin: 4px 0 2px; font-size: clamp(34px, 11vw, 62px); letter-spacing: 0.16em; font-weight: 800; line-height: 1; color: var(--accent); }
  h2 { margin: 2px 0 6px; font-size: clamp(20px, 6vw, 30px); letter-spacing: 0.04em; font-weight: 800; }
  .tagline { font-size: 13.5px; color: var(--dim); margin-bottom: 10px; line-height: 1.4; }
  .keys { display: grid; grid-template-columns: 1fr; gap: 5px; font-size: 12.5px; color: var(--dim);
    margin: 10px auto 4px; max-width: 380px; text-align: left; }
  .keys > div { display: flex; justify-content: space-between; gap: 10px;
    border-bottom: 1px dashed rgba(74,52,33,0.16); padding-bottom: 4px; }
  .keys span { color: var(--ink); font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0 4px; }
  .stat { background: #fff2dd; border: 2px solid var(--line); border-radius: 12px; padding: 8px 6px; }
  .stat .k { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
  .stat .v { font-size: clamp(18px, 5vw, 24px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .v.accent { color: var(--accent); }
  .cardbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 56px; padding: 0 24px;
    border-radius: 14px; border: 3px solid rgba(226,104,60,0.55);
    background: #ffe0cf; color: #a8401b;
    font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer;
  }
  .btn:active { background: #ffcbb0; }
  .btn.ghost { border-color: var(--line); color: var(--ink); background: #fff2dd; }
  .grown { font-size: 11.5px; color: var(--dim); margin-top: 10px; line-height: 1.4; }

  /* landscape phone: picture left, words and pictures to tap on the right */
  @media (max-height: 560px) and (orientation: landscape) {
    #stage { flex-direction: row; }
    #hdr { display: none; }
    #artwrap { flex: 1 1 44%; height: auto; margin: max(8px, env(safe-area-inset-top)) 6px max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
    #panel { flex: 1 1 56%; margin-bottom: 0; justify-content: center; overflow-y: auto;
      padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) 0; }
    #caption { min-height: 2.6em; margin: 2px 0 6px; font-size: clamp(14px, 3.4vh, 20px); }
    .choice { height: 116px; }
    .choice canvas { height: 84px; }
    .bigbtn { min-height: 48px; font-size: 13px; }
  }
  @media (max-height: 620px) { .keys { display: none; } .card { padding: 14px 14px 12px; } h1 { font-size: clamp(28px, 9vw, 44px); } }
</style>
</head>
<body>
<div id="stage">
  <div id="hdr"><span class="mark">ECHO</span><span class="st" id="storyName"></span></div>
  <div id="topbtns">
    <button class="iconbtn" id="muteBtn" type="button" aria-label="Sound on or off">&#9835;</button>
    <button class="iconbtn" id="pauseBtn" type="button" aria-label="Take a break">&#10073;&#10073;</button>
  </div>
  <div id="artwrap"><canvas id="art"></canvas></div>
  <div id="panel">
    <div id="caption"></div>
    <div id="choices"></div>
    <div id="btnrow">
      <button class="bigbtn" id="replayBtn" type="button" aria-label="Hear it again">&#128266; AGAIN</button>
      <button class="bigbtn go" id="nextBtn" type="button" aria-label="Next">NEXT &#9654;</button>
    </div>
  </div>
  <div id="overlay"></div>
</div>
<script>
/* =========================================================================
   ECHO — the listening game for the Overclock arcade.
   `echo` prints back what you give it; here a story is read aloud and a
   child echoes it back by tapping a picture. Built for a listener who
   cannot read yet: every word is spoken, every answer is a picture.
   It finds her listening level by playing with her, then moves it.
   One file, no assets, oscillator audio, speech via the browser API.
   MARKER: ECHO_LISTENING_GAME_V1
   ========================================================================= */
"use strict";

var TAU = Math.PI * 2;
var K_SAVE = 'echo_v1';
var K_MUTE = 'echo_muted_v1';

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function loadStr(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function saveStr(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

/* ---------------------------------------------------------------- audio -- */
/* Warm and quiet. There is no failure sound in this game — the "not that
   one" cue is a soft low note, kinder than silence and never a buzzer. */
var actx = null, muted = loadStr(K_MUTE, '0') === '1', master = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} } return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.35;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function setMuted(m) {
  muted = m; saveStr(K_MUTE, m ? '1' : '0');
  if (master) master.gain.value = m ? 0 : 0.35;
  var b = document.getElementById('muteBtn');
  if (b) { b.innerHTML = m ? '&#128263;' : '&#9835;'; b.setAttribute('aria-label', m ? 'Turn sound on' : 'Turn sound off'); }
  if (m) stopSpeech();
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!actx || muted) return;
  try {
    var t = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(24, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
var sfx = {
  page:  function () { tone('sine', 620, 880, 0.10, 0.05); },
  yes:   function () { tone('sine', 523, 523, 0.16, 0.11); tone('sine', 659, 659, 0.18, 0.10, 0.13); tone('sine', 784, 784, 0.30, 0.10, 0.26); },
  soft:  function () { tone('sine', 330, 294, 0.26, 0.07); },
  star:  function () { var i; for (i = 0; i < 5; i++) tone('sine', 523 * Math.pow(1.2, i), 523 * Math.pow(1.2, i), 0.20, 0.07, i * 0.10); },
  up:    function () { tone('triangle', 440, 660, 0.22, 0.07); tone('triangle', 660, 880, 0.26, 0.06, 0.18); }
};

/* =============================================================== speech == */
/* speechSynthesis is a browser API, not an asset — but it is missing in
   headless browsers and locked-down machines, and it hands out its voice
   list asynchronously. Never assume, never throw: if it is not there the
   game still plays, the words stay on screen, and the speaker button goes
   away rather than promising something that will not happen. */
var SPEECH = { api: false, voices: 0, voice: null, ok: false, spoken: 0, failed: 0 };
var SAID = [];                 /* everything Echo has said, or would have said */
function speechApi() {
  try {
    return !!(window.speechSynthesis &&
      typeof window.speechSynthesis.speak === 'function' &&
      typeof window.SpeechSynthesisUtterance === 'function');
  } catch (e) { return false; }
}
function refreshVoices() {
  SPEECH.api = speechApi();
  SPEECH.voices = 0; SPEECH.voice = null;
  if (SPEECH.api) {
    try {
      var vs = window.speechSynthesis.getVoices() || [];
      SPEECH.voices = vs.length;
      var i;
      for (i = 0; i < vs.length; i++) if (vs[i] && /^en[-_]US/i.test(vs[i].lang || '')) { SPEECH.voice = vs[i]; break; }
      if (!SPEECH.voice) for (i = 0; i < vs.length; i++) if (vs[i] && /^en/i.test(vs[i].lang || '')) { SPEECH.voice = vs[i]; break; }
      if (!SPEECH.voice && vs.length) SPEECH.voice = vs[0];
    } catch (e) { SPEECH.voices = 0; }
  }
  SPEECH.ok = SPEECH.api && SPEECH.voices > 0;
  updateSpeakUI();
}
function stopSpeech() {
  if (!speechApi()) return;
  try { window.speechSynthesis.cancel(); } catch (e) {}
}
/* Read plainly and warmly, a little slower than default — not baby-talk,
   just an unhurried adult reading a story. */
function say(text, onend) {
  if (!SPEECH.ok || muted || !text) return false;
  try {
    window.speechSynthesis.cancel();
    var u = new window.SpeechSynthesisUtterance(String(text));
    u.volume = 1; u.lang = 'en-US';
    ocApply(u, SPEECH.voice);
    if (onend) { u.onend = onend; u.onerror = onend; }
    window.speechSynthesis.speak(u);
    SPEECH.spoken++;
    return true;
  } catch (e) {
    SPEECH.failed++; SPEECH.ok = false; updateSpeakUI();
    return false;
  }
}
function updateSpeakUI() {
  var b = document.getElementById('replayBtn');
  if (b) b.hidden = !SPEECH.ok;
  if (document.body) {
    if (SPEECH.ok) document.body.classList.remove('nospeech');
    else document.body.classList.add('nospeech');
  }
}

/* ================================================================= art === */
/* Everything is drawn procedurally. Icons are authored in a unit box that
   runs -0.5..0.5 in both axes and then scaled by a transform, so one
   drawing works as a 90px answer picture and as half a storybook scene. */
function circ(g, x, y, r, f) { g.beginPath(); g.arc(x, y, Math.abs(r), 0, TAU); if (f) { g.fillStyle = f; g.fill(); } }
function ell(g, x, y, rx, ry, f, rot) { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, TAU); if (f) { g.fillStyle = f; g.fill(); } }
function rr(g, x, y, w, h, r, f) {
  var m = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + m, y); g.arcTo(x + w, y, x + w, y + h, m); g.arcTo(x + w, y + h, x, y + h, m);
  g.arcTo(x, y + h, x, y, m); g.arcTo(x, y, x + w, y, m); g.closePath();
  if (f) { g.fillStyle = f; g.fill(); }
}
function pth(g, pts, f) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath(); if (f) { g.fillStyle = f; g.fill(); }
}
function ln(g, x1, y1, x2, y2, c, w) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = c; g.lineWidth = w; g.stroke(); }
function curve(g, x1, y1, cx, cy, x2, y2, c, w) { g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(cx, cy, x2, y2); g.strokeStyle = c; g.lineWidth = w; g.stroke(); }
function star5(g, x, y, r, f) {
  var i, a, rad; g.beginPath();
  for (i = 0; i < 10; i++) { a = -Math.PI / 2 + i * Math.PI / 5; rad = (i % 2) ? r * 0.44 : r; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  g.closePath(); g.fillStyle = f; g.fill();
}
function eyeDot(g, x, y, r) { circ(g, x, y, r, '#3a2a1e'); }
function smile(g, x, y, w, d, c, lw) {
  g.beginPath(); g.moveTo(x - w, y); g.quadraticCurveTo(x, y + d, x + w, y);
  g.strokeStyle = c || '#3a2a1e'; g.lineWidth = lw || 0.018; g.stroke();
}

var ICON = {};
function drawIcon(g, name, x, y, s, t) {
  var f = ICON[name];
  if (!f) return false;
  g.save();
  g.translate(x, y); g.scale(s, s);
  g.lineCap = 'round'; g.lineJoin = 'round';
  try { f(g, t || 0); } catch (e) {}
  g.restore();
  return true;
}

/* ---- animals ---- */
ICON.dog = function (g) {
  var body = '#c98a4b', dark = '#a86c33';
  curve(g, 0.20, 0.00, 0.36, -0.04, 0.32, -0.20, dark, 0.055);
  rr(g, -0.13, 0.08, 0.085, 0.22, 0.042, dark);
  rr(g, 0.10, 0.08, 0.085, 0.22, 0.042, dark);
  ell(g, 0.04, 0.02, 0.235, 0.155, body);
  rr(g, -0.05, 0.10, 0.085, 0.20, 0.042, body);
  rr(g, 0.16, 0.10, 0.085, 0.20, 0.042, body);
  circ(g, -0.23, -0.11, 0.155, body);
  ell(g, -0.31, -0.23, 0.055, 0.105, dark, -0.45);
  ell(g, -0.34, -0.04, 0.115, 0.078, '#eac492');
  circ(g, -0.435, -0.065, 0.033, '#3a2a1e');
  eyeDot(g, -0.205, -0.15, 0.026);
  smile(g, -0.35, 0.015, 0.055, 0.045, '#3a2a1e', 0.016);
  ell(g, -0.35, 0.055, 0.032, 0.042, '#e2683c');
};
ICON.cat = function (g) {
  var body = '#9aa3ad', dark = '#7d8791';
  curve(g, 0.20, 0.02, 0.38, 0.00, 0.34, -0.22, body, 0.05);
  rr(g, -0.12, 0.10, 0.075, 0.20, 0.037, dark);
  rr(g, 0.10, 0.10, 0.075, 0.20, 0.037, dark);
  ell(g, 0.04, 0.04, 0.225, 0.145, body);
  rr(g, -0.04, 0.12, 0.075, 0.18, 0.037, body);
  rr(g, 0.15, 0.12, 0.075, 0.18, 0.037, body);
  pth(g, [[-0.32, -0.20], [-0.28, -0.35], [-0.20, -0.24]], body);
  pth(g, [[-0.14, -0.22], [-0.09, -0.35], [-0.05, -0.19]], body);
  circ(g, -0.19, -0.11, 0.148, body);
  eyeDot(g, -0.26, -0.13, 0.026); eyeDot(g, -0.12, -0.13, 0.026);
  pth(g, [[-0.19, -0.05], [-0.155, -0.085], [-0.225, -0.085]], '#e2837c');
  smile(g, -0.19, -0.035, 0.045, 0.04, '#3a2a1e', 0.014);
  g.strokeStyle = 'rgba(58,42,30,0.6)'; g.lineWidth = 0.011;
  ln(g, -0.30, -0.05, -0.42, -0.08, 'rgba(58,42,30,0.6)', 0.011);
  ln(g, -0.30, -0.02, -0.42, -0.01, 'rgba(58,42,30,0.6)', 0.011);
  ln(g, -0.08, -0.05, 0.04, -0.08, 'rgba(58,42,30,0.6)', 0.011);
  ln(g, -0.08, -0.02, 0.04, -0.01, 'rgba(58,42,30,0.6)', 0.011);
};
ICON.frog = function (g) {
  var body = '#6fbf4f', dark = '#4f9a35';
  ell(g, -0.28, 0.24, 0.13, 0.055, dark); ell(g, 0.28, 0.24, 0.13, 0.055, dark);
  ell(g, 0, 0.10, 0.30, 0.20, body);

function skyGrad(g, W, H, top, bot) {

function puff(g, x, y, r, f) {
  g.beginPath();

function tufts(g, W, H, y, col) {
  var i, j; g.strokeStyle = col; g.lineWidth = Math.max(1, H * 0.007);

/* The hub peeks into every game's save, so a corrupt value has to render as
   a fresh start rather than throw. Every field is checked on the way in. */
function freshProfile() {
  return { v: 1, rung: 0, streak: 0, recent: [], items: 0, sinceProbe: 0,
    lockUp: 0, lockDown: 0, probeHit: 0, heard: {}, stars: 0, trail: [],
    q: { literal: [0, 0], infer: [0, 0], seq: [0, 0] } };
}
function isArr(a) { return Object.prototype.toString.call(a) === '[object Array]'; }
function num(v, d, lo, hi) { v = Number(v); if (!isFinite(v)) return d; return clamp(Math.round(v), lo, hi); }
/* strict: a value outside the legal range is corruption, not something to
   clamp — a save claiming rung 99 must render as a fresh start, not as the
   top rung, or a mangled file would drop her straight into the hard end. */
function strict(v, d, lo, hi) { v = Number(v); if (!isFinite(v) || v < lo || v > hi || v !== Math.round(v)) return d; return v; }
function readProfile() {
  var f = freshProfile(), o = null, k;
  try { o = JSON.parse(localStorage.getItem(K_SAVE) || 'null'); } catch (e) { o = null; }
  if (!o || typeof o !== 'object' || isArr(o)) return f;
  f.rung = strict(o.rung, 0, 0, MAXRUNG);
  f.streak = num(o.streak, 0, 0, 99);
  f.items = num(o.items, 0, 0, 1e6);
  f.sinceProbe = num(o.sinceProbe, 0, 0, 999);
  f.lockUp = num(o.lockUp, 0, 0, 99);
  f.lockDown = num(o.lockDown, 0, 0, 99);
  f.probeHit = num(o.probeHit, 0, 0, 1);
  f.stars = num(o.stars, 0, 0, 1e6);
  if (isArr(o.recent)) { for (k = 0; k < o.recent.length && f.recent.length < 8; k++) f.recent.push(o.recent[k] ? 1 : 0); }
  if (isArr(o.trail)) { for (k = Math.max(0, o.trail.length - 120); k < o.trail.length; k++) f.trail.push(num(o.trail[k], 0, 0, MAXRUNG)); }
  if (o.heard && typeof o.heard === 'object' && !isArr(o.heard)) {

var timers = [];

/* ---- talking, with a fallback clock so a missing voice never stalls ---- */
var talkToken = 0;
function estimateMs(text) { return 1100 + String(text).split(/\s+/).length * 420; }
function sayThen(text, cb, pad) {
  talkToken++;
  var tok = talkToken, fired = false;
  SAID.push(String(text));
  var done = function () { if (fired || tok !== talkToken) return; fired = true; if (cb) cb(); };
  var went = say(text, function () { later(done, 420 + (pad || 0)); });
  later(done, went ? estimateMs(text) + 5000 : estimateMs(text) + (pad || 0));
  return went;
}
function hush() { talkToken++; stopSpeech(); }

  artH = Math.max(60, Math.round(r.height));
  artCv.width = Math.round(artW * dpr);
  artCv.height = Math.round(artH * dpr);
  actx2d.setTransform(dpr, 0, 0, dpr, 0, 0);

}

  actx2d.save();

  else drawTitleArt(actx2d, artW, artH, nowT);

  window.requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  var dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  nowT += dt;
  artClock += dt;
  if (artClock >= 0.05) { artClock = 0; paintArt(); }
}

    g.clearRect(0, 0, w, h);
    if (typeof opt.scene === 'number' && G.story) {
      drawScene(g, w, h, sceneOf(G.story, opt.scene), nowT);
    } else {
      g.fillStyle = '#fff6e6'; g.fillRect(0, 0, w, h);
      drawIcon(g, opt.icon, w / 2, h / 2, Math.min(w, h) * 0.92, nowT);
    }
  }
}
function sceneOf(story, i) {
  var l = story.lines[i] || story.lines[0];
  return { bg: l.bg || story.bg, items: l.items || [] };
}

/* ============================================================== the game = */
function setCaption(text, isQ) {
  G.caption = text || '';
  capEl.textContent = G.caption;
  if (isQ) capEl.classList.add('q'); else capEl.classList.remove('q');
}
function setBody() {
  var playing = (G.state === 'story' || G.state === 'question' || G.state === 'reveal');
  document.body.classList[playing ? 'add' : 'remove']('playing');
}
function clearChoices() { choicesEl.innerHTML = ''; choicesEl.classList.remove('two'); G.shown = []; G.correctIdx = -1; }

function findQ(story, want) {
  var i;
  for (i = 0; i < story.qs.length; i++) {
    var q = story.qs[i];
    if (want === 'literal' && q.type === 'literal') return q;
    if (want !== 'literal' && q.type !== 'literal') return q;
  }
  return story.qs[0];
}
function buildProgram(story, rung) {
  var qs = [], i, k, want, q, steps = [];
  for (i = 0; i < rung.ask.length; i++) {
    want = rung.ask[i]; q = findQ(story, want);
    if (q && qs.indexOf(q) < 0) qs.push(q);
  }
  if (!qs.length) qs.push(story.qs[0]);
  if (rung.immediate) {
    q = qs[0];
    for (k = 0; k <= q.line; k++) steps.push({ k: 'line', i: k });
    steps.push({ k: 'q', q: q });
    for (k = q.line + 1; k < story.lines.length; k++) steps.push({ k: 'line', i: k });
    for (i = 1; i < qs.length; i++) steps.push({ k: 'q', q: qs[i] });
  } else {
    for (k = 0; k < story.lines.length; k++) steps.push({ k: 'line', i: k });
    for (i = 0; i < qs.length; i++) steps.push({ k: 'q', q: qs[i] });
  }
  steps.push({ k: 'end' });
  return steps;
}
function pickStory(rungIdx) {
  var r = RUNGS[clamp(rungIdx, 0, MAXRUNG)], pool = [], i, best = 1e9;
  for (i = 0; i < STORIES.length; i++) {
    var n = STORIES[i].lines.length;
    if (n >= r.minL && n <= r.maxL) pool.push(STORIES[i]);
  }
  if (!pool.length) pool = STORIES.slice(0);
  for (i = 0; i < pool.length; i++) best = Math.min(best, PROF.heard[pool[i].id] || 0);
  var fresh = [];
  for (i = 0; i < pool.length; i++) if ((PROF.heard[pool[i].id] || 0) === best) fresh.push(pool[i]);
  if (fresh.length > 1 && G.story) {
    var f2 = [];
    for (i = 0; i < fresh.length; i++) if (fresh[i].id !== G.story.id) f2.push(fresh[i]);
    if (f2.length) fresh = f2;
  }
  return fresh[(Math.random() * fresh.length) | 0];
}

function startStory() {
  clearTimers(); hush(); clearChoices();
  G.probing = (PROF.sinceProbe >= 16 && PROF.rung < MAXRUNG);
  G.rung = clamp(PROF.rung + (G.probing ? 1 : 0), 0, MAXRUNG);
  G.story = pickStory(G.rung);
  G.steps = buildProgram(G.story, RUNGS[G.rung]);
  G.step = -1; G.rightThisStory = 0; G.askedThisStory = 0;
  G.replayedLine = -1;
  storyName.textContent = G.story.title;
  overlay.classList.remove('on');
  initAudio();
  nextStep();
}
function nextStep() {
  clearTimers();
  G.step++;
  var s = G.steps[G.step];
  if (!s) { finishStory(); return; }
  if (s.k === 'line') showLine(s.i);
  else if (s.k === 'q') askQuestion(s.q);
  else finishStory();
}
function showLine(i) {
  G.state = 'story'; setBody();
  clearChoices();
  G.line = i;
  var l = G.story.lines[i];
  G.scene = sceneOf(G.story, i);
  setCaption(l.t, false);
  nextBtn.hidden = false;
  sfx.page();
  sayThen(l.t, nextStep, 450);
}
function optionsPhrase(shown) {
  var w = [], i;
  for (i = 0; i < shown.length; i++) w.push(shown[i].word);
  if (w.length === 2) return 'Is it ' + w[0] + ', or ' + w[1] + '?';
  return 'Is it ' + w.slice(0, w.length - 1).join(', ') + ', or ' + w[w.length - 1] + '?';
}
function askQuestion(q) {
  G.state = 'question'; setBody();
  G.q = q; G.picked = -1; G.locked = false;
  G.askedThisStory++;
  nextBtn.hidden = true;
  var rung = RUNGS[G.rung];
  var n = Math.min(rung.choices, q.opts.length);
  var pool = q.opts.slice(0, n), i, j, tmp;
  for (i = pool.length - 1; i > 0; i--) { j = (Math.random() * (i + 1)) | 0; tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp; }
  G.shown = pool;
  G.correctIdx = pool.indexOf(q.opts[0]);
  choicesEl.innerHTML = '';
  choicesEl.classList[n === 2 ? 'add' : 'remove']('two');
  for (i = 0; i < pool.length; i++) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'choice'; b.setAttribute('data-i', String(i));
    b.setAttribute('aria-label', pool[i].word);
    b.innerHTML = '<canvas></canvas><span class="lab"></span>';
    b.querySelector('.lab').textContent = pool[i].word;
    choicesEl.appendChild(b);
  }
  window.requestAnimationFrame(paintChoices);
  G.scene = sceneOf(G.story, q.line);
  if (rung.reprompt) {
    setCaption(G.story.lines[q.line].t, false);
    sayThen(G.story.lines[q.line].t, function () { speakQuestion(q); }, 400);
  } else {
    speakQuestion(q);
  }
}
function speakQuestion(q) {
  setCaption(q.q, true);
  sayThen(q.q, function () { sayThen(optionsPhrase(G.shown), null, 0); }, 250);
}
function replayNow() {
  initAudio();
  clearTimers(); hush();
  G.replays++;
  if (G.state === 'question' || G.state === 'reveal') {
    if (G.q) speakQuestion(G.q);
  } else if (G.state === 'story' && G.story) {
    var l = G.story.lines[G.line];
    setCaption(l.t, false);
    sayThen(l.t, nextStep, 450);
  }
}

/* ---- answering. There is no wrong-answer punishment in this game. ---- */
function onPick(i) {
  if (G.state !== 'question' || G.locked) return;
  G.locked = true; G.picked = i;
  initAudio();
  clearTimers(); hush();
  var right = (i === G.correctIdx);
  var btns = choicesEl.querySelectorAll('.choice'), k;
  for (k = 0; k < btns.length; k++) btns[k].disabled = true;
  var moved = record(right);
  G.lastRight = right;
  if (right) {
    G.rightThisStory++;
    if (btns[i]) btns[i].classList.add('good');
    sfx.yes();
    setCaption('Yes! ' + capFirst(G.shown[i].word) + '.', false);
    sayThen('Yes! ' + G.shown[i].word + '.', function () { later(nextStep, 250); }, 200);
  } else {
    G.state = 'reveal'; setBody();
    if (btns[i]) btns[i].classList.add('faded');
    sfx.soft();
    var q = G.q, l = G.story.lines[q.line];
    G.replayedLine = q.line;
    G.scene = sceneOf(G.story, q.line);
    setCaption(l.t, false);
    sayThen('Let us listen again. ' + l.t, function () {
      var bs = choicesEl.querySelectorAll('.choice'), n;
      for (n = 0; n < bs.length; n++) { bs[n].classList.remove('faded'); if (n === G.correctIdx) bs[n].classList.add('show'); }
      setCaption('This one. ' + capFirst(G.shown[G.correctIdx].word) + '.', false);
      sfx.star();
      sayThen('This one. ' + G.shown[G.correctIdx].word + '.', function () { later(nextStep, 400); }, 200);
    }, 450);
  }
  if (moved > 0) later(function () { sfx.up(); }, 900);
}
function capFirst(s) { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---- where she is, and where she is going ---- */
function record(correct) {
  var t = (G.q && G.q.type) || 'literal';
  if (!PROF.q[t]) PROF.q[t] = [0, 0];
  PROF.q[t][correct ? 0 : 1]++;
  PROF.items++; PROF.sinceProbe++;
  PROF.recent.push(correct ? 1 : 0);
  while (PROF.recent.length > 8) PROF.recent.shift();
  if (PROF.lockUp > 0) PROF.lockUp--;
  if (PROF.lockDown > 0) PROF.lockDown--;
  PROF.streak = correct ? PROF.streak + 1 : 0;
  var moved = 0, i;
  /* A probe is a peek at the rung above, so she is never stuck below her level.
     But two or three pictures means one lucky guess would hand her a whole level,
     which is how she ended up parked a rung too high. Make the probe confirm
     itself: the next item probes again, and only a second hit moves her. */
  if (G.probing) {
    G.probing = false;
    if (correct && PROF.rung < MAXRUNG) {
      if (PROF.probeHit) { moved = 1; PROF.probeHit = 0; PROF.sinceProbe = 0; }
      else { PROF.probeHit = 1; }        /* sinceProbe stays high: probe again next item */
    } else { PROF.probeHit = 0; PROF.sinceProbe = 0; }
  }
  /* Two pictures means a pure guess is right half the time, so three-right-in-a-row
     turns up by luck roughly every eighth item. Promoting on a streak alone ratchets
     her above her real level and parks her near 60% correct, so ask for a good run
     AND a good recent window before moving her up. */
  if (!moved && correct && PROF.streak >= 3 && PROF.rung < MAXRUNG && PROF.lockUp === 0) {
    var win = PROF.recent, good = 0;
    for (i = 0; i < win.length; i++) if (win[i]) good++;
    /* 0.85, not 0.75: at the right rung two pictures already put her near 75%,
       so a 0.75 gate promotes her straight out of the level that fits. Move her
       up only once the rung has clearly gone easy. */
    if (win.length >= 6 && good / win.length >= 0.85) moved = 1;
  }
  /* Dropping on two misses in four fires about one item in five even when she is
     placed correctly at ~80%, which is what made the level bounce. Three in five is
     still fast — about one story — but it means she is actually struggling. */
  if (!moved && !correct && PROF.rung > 0 && PROF.lockDown === 0) {
    var last = PROF.recent.slice(-5), w = 0;
    for (i = 0; i < last.length; i++) if (!last[i]) w++;
    if (w >= 3) moved = -1;
  }
  if (moved > 0) { PROF.rung = clamp(PROF.rung + 1, 0, MAXRUNG); PROF.streak = 0; PROF.recent = []; PROF.lockUp = 4; PROF.lockDown = 3; PROF.probeHit = 0; PROF.sinceProbe = 0; }
  else if (moved < 0) { PROF.rung = clamp(PROF.rung - 1, 0, MAXRUNG); PROF.streak = 0; PROF.recent = []; PROF.lockDown = 5; PROF.lockUp = 3; PROF.probeHit = 0; PROF.sinceProbe = 0; }
  PROF.trail.push(PROF.rung);
  while (PROF.trail.length > 120) PROF.trail.shift();
  writeProfile();
  return moved;
}

function finishStory() {
  clearTimers(); hush(); clearChoices();
  G.state = 'done'; setBody();
  nextBtn.hidden = true;
  if (G.story) PROF.heard[G.story.id] = (PROF.heard[G.story.id] || 0) + 1;
  PROF.stars += 1 + G.rightThisStory;
  writeProfile();
  var stars = '';
  var n = 1 + G.rightThisStory, i;
  for (i = 0; i < n; i++) stars += '⭐';
  card(
    '<div class="eyebrow">' + esc(G.story ? G.story.title : 'Story') + '</div>' +
    '<h2>GREAT LISTENING</h2>' +
    '<div style="font-size:34px;letter-spacing:6px;margin:6px 0 2px">' + stars + '</div>' +
    '<div class="tagline">That is a whole story, listened to all the way through.</div>' +
    '<div class="cardbtns">' +
      '<button class="btn" data-act="play" type="button">ANOTHER STORY</button>' +
      '<button class="btn ghost" data-act="title" type="button">ALL DONE</button>' +
    '</div>');
  sfx.star();
  later(function () { sayThen('Great listening!', null, 0); }, 260);
}

/* ================================================================ cards == */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function card(html) {
  overlay.innerHTML = '<div class="card">' + html + '</div>';
  overlay.classList.add('on');
}
function heardCount() { var k, n = 0; for (k in PROF.heard) if (Object.prototype.hasOwnProperty.call(PROF.heard, k) && PROF.heard[k] > 0) n++; return n; }
function titleScreen() {
  clearTimers(); hush(); clearChoices();
  G.state = 'title'; setBody();
  G.story = null; G.scene = null; G.q = null;
  storyName.textContent = '';
  setCaption('', false);
  nextBtn.hidden = true;
  card(
    '<div class="eyebrow">OVERCLOCK</div>' +
    '<h1>ECHO</h1>' +
    '<div class="tagline">A little story, read out loud. Then answer with a picture.</div>' +
    '<div class="keys">' +
      '<div>Tap a picture<span>to answer</span></div>' +
      '<div>The speaker button<span>reads it again</span></div>' +
      '<div>No timer, no score<span>nothing to lose</span></div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="k">Stories heard</div><div class="v accent">' + heardCount() + ' / ' + STORIES.length + '</div></div>' +
      '<div class="stat"><div class="k">Stars</div><div class="v">' + PROF.stars + '</div></div>' +
    '</div>' +
    '<div class="cardbtns">' +
      '<button class="btn" data-act="play" type="button">LISTEN TO A STORY</button>' +
      '<button class="btn ghost" data-act="grown" type="button">FOR GROWN-UPS</button>' +
    '</div>');
}
function pct(a) { var tot = a[0] + a[1]; return tot ? Math.round(a[0] * 100 / tot) + '%' : '--'; }
function grownScreen() {
  clearTimers(); hush();
  G.state = 'grown'; setBody();
  var r = RUNGS[clamp(PROF.rung, 0, MAXRUNG)];
  var inf = [PROF.q.infer[0] + PROF.q.seq[0], PROF.q.infer[1] + PROF.q.seq[1]];
  card(
    '<div class="eyebrow">FOR GROWN-UPS</div>' +
    '<h2>LISTENING LEVEL</h2>' +
    '<div class="tagline"><b>Level ' + (PROF.rung + 1) + ' of ' + (MAXRUNG + 1) + ' &mdash; ' + esc(r.name) + '</b><br>' +
      'Stories of ' + r.minL + (r.maxL !== r.minL ? ' to ' + r.maxL : '') + ' sentences, ' +
      (r.immediate ? 'question straight after the sentence' : 'questions at the end') + ', ' +
      r.choices + ' pictures to choose from.</div>' +
    '<canvas id="trail" width="440" height="90" style="width:100%;height:90px;background:#fff2dd;border:2px solid rgba(74,52,33,0.18);border-radius:12px"></canvas>' +
    '<div class="tagline" style="margin-top:6px">' + (PROF.trail.length > 1 ? 'Level over the last ' + PROF.trail.length + ' questions.' : 'Level so far.') + '</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="k">Literal answers</div><div class="v">' + pct(PROF.q.literal) + '</div></div>' +
      '<div class="stat"><div class="k">Thinking answers</div><div class="v">' + pct(inf) + '</div></div>' +
      '<div class="stat"><div class="k">Stories heard</div><div class="v">' + heardCount() + ' / ' + STORIES.length + '</div></div>' +
      '<div class="stat"><div class="k">Questions answered</div><div class="v">' + PROF.items + '</div></div>' +
    '</div>' +
    '<div class="grown">Echo finds her level by playing: three right in a row moves her up, two misses in a short run drops her back down, and every so often it quietly tries one question from the level above. Nothing here is timed and nothing is ever marked wrong on screen.</div>' +
    '<div class="cardbtns">' +
      '<button class="btn" data-act="title" type="button">BACK</button>' +
      '<button class="btn ghost" data-act="reset" type="button">START OVER</button>' +
    '</div>');
  drawTrail();
}
function drawTrail() {
  var cv = document.getElementById('trail');
  if (!cv) return;
  var g = cv.getContext('2d'), W = cv.width, H = cv.height, i;
  g.clearRect(0, 0, W, H);
  g.strokeStyle = 'rgba(74,52,33,0.14)'; g.lineWidth = 1;
  for (i = 0; i <= MAXRUNG; i++) {
    var y = H - 8 - (i / MAXRUNG) * (H - 20);
    g.beginPath(); g.moveTo(8, y); g.lineTo(W - 8, y); g.stroke();
  }
  var tr = PROF.trail;
  if (!tr.length) {
    g.fillStyle = 'rgba(74,52,33,0.5)'; g.font = '600 14px "Segoe UI", sans-serif'; g.textAlign = 'center';
    g.fillText('No questions answered yet', W / 2, H / 2 + 5);
    return;
  }
  g.strokeStyle = '#e2683c'; g.lineWidth = 3; g.lineJoin = 'round';
  g.beginPath();
  for (i = 0; i < tr.length; i++) {
    var x = 10 + (tr.length === 1 ? 0 : i / (tr.length - 1)) * (W - 20);
    var y2 = H - 8 - (tr[i] / MAXRUNG) * (H - 20);
    if (i === 0) g.moveTo(x, y2); else g.lineTo(x, y2);
  }
  g.stroke();
  var lx = 10 + (W - 20), ly = H - 8 - (tr[tr.length - 1] / MAXRUNG) * (H - 20);
  circ(g, lx, ly, 5, '#3f8f6f');
}
function pauseScreen() {

    '</div>');
}
function resumeGame() {
  overlay.classList.remove('on');

}

/* ================================================================ input == */
overlay.addEventListener('click', function (e) {

document.getElementById('muteBtn').addEventListener('click', function () { initAudio(); setMuted(!muted); });

window.addEventListener('keydown', function (e) {

});
window.addEventListener('touchstart', function () { document.body.classList.add('touch'); }, { passive: true });
window.addEventListener('blur', function () { hush(); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden && (G.state === 'story' || G.state === 'question' || G.state === 'reveal')) pauseScreen();

window.addEventListener('resize', function () { resize(); });

if (speechApi()) { try { window.speechSynthesis.onvoiceschanged = refreshVoices; } catch (e) {} }

    face: '<circle cx="50" cy="52" r="30" fill="#f06292"/>' +
      '<circle cx="40" cy="46" r="5" fill="#fff"/><circle cx="60" cy="46" r="5" fill="#fff"/>' +
      '<circle cx="41" cy="47" r="2.5" fill="#3e2723"/><circle cx="61" cy="47" r="2.5" fill="#3e2723"/>' +
      '<path d="M40 63 q10 9 20 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M28 30 l8 12 M72 30 l-8 12" stroke="#f06292" stroke-width="5" stroke-linecap="round"/>' },
  { id: 'moss', name: 'Moss', pitch: 0.95, rate: 0.62, hint: 'slow and calm',
    line: 'Hello. I am Moss. I will take my time.',
    face: '<circle cx="50" cy="52" r="31" fill="#66bb6a"/>' +
      '<path d="M38 46 q4 -4 8 0 M54 46 q4 -4 8 0" stroke="#1b3a1e" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
      '<path d="M38 62 q12 8 24 0" stroke="#1b3a1e" stroke-width="4" fill="none" stroke-linecap="round"/>' }
];
var OC_VOICE = { charId: 'sunny', uri: '' };
var OC_LIST = [];
function ocChar(id) { var i; for (i = 0; i < OC_CHARACTERS.length; i++) if (OC_CHARACTERS[i].id === id) return OC_CHARACTERS[i]; return OC_CHARACTERS[0]; }
function ocCur() { return ocChar(OC_VOICE.charId); }
function ocLoadVoice() {
  var raw = null, o = null;
  try { raw = localStorage.getItem(OC_VOICE_KEY); } catch (e) {}
  if (!raw) return;
  try { o = JSON.parse(raw); } catch (e) { return; }
  if (!o || typeof o !== 'object') return;
  if (typeof o.charId === 'string' && ocChar(o.charId).id === o.charId) OC_VOICE.charId = o.charId;
  if (typeof o.uri === 'string') OC_VOICE.uri = o.uri;
}
function ocSaveVoice() {
  try { localStorage.setItem(OC_VOICE_KEY, JSON.stringify({ charId: OC_VOICE.charId, uri: OC_VOICE.uri })); } catch (e) {}
}
function ocVoices() {
  var out = [], vs = [], i;
  try { vs = window.speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
  for (i = 0; i < vs.length; i++) if (vs[i] && /^en/i.test(vs[i].lang || '')) out.push(vs[i]);
  if (!out.length) out = vs.slice(0, 8);
  OC_LIST = out;
  return out;
}
function ocPickedVoice(fallback) {
  var i;
  if (!OC_LIST.length) ocVoices();
  if (OC_VOICE.uri) for (i = 0; i < OC_LIST.length; i++) if (OC_LIST[i].voiceURI === OC_VOICE.uri) return OC_LIST[i];
  return fallback || OC_LIST[0] || null;
}
/* the one call every game's say() makes */
function ocApply(u, fallbackVoice, rateOverride) {
  var C = ocCur();
  u.rate = rateOverride || C.rate;
  u.pitch = C.pitch;
  var v = ocPickedVoice(fallbackVoice);
  if (v) u.voice = v;
  return u;
}
function ocSpeak(text) {
  try {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return false;
    window.speechSynthesis.cancel();
    var u = new window.SpeechSynthesisUtterance(String(text));
    ocApply(u, null);
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}
function ocSpeechOK() {
  try { return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); } catch (e) { return false; }
}
/* ---- the picker: its own overlay and its own styles, so it drops into any
        of these games without touching that game's screen system ---- */
function ocVoiceUI() {
  if (!ocSpeechOK()) return;
  var st = document.createElement('style');
  st.textContent =
    '#ocVoiceBtn{position:fixed;left:max(10px,env(safe-area-inset-left));' +
    'bottom:max(10px,env(safe-area-inset-bottom));z-index:40;min-height:44px;padding:0 12px 0 8px;' +
    'display:inline-flex;align-items:center;gap:7px;border-radius:14px;cursor:pointer;' +
    'border:2px solid rgba(128,128,128,0.38);background:rgba(255,255,255,0.9);color:#333;' +
    'font:700 12px "Segoe UI",system-ui,sans-serif;letter-spacing:0.06em;}' +
    '#ocVoiceBtn svg{width:28px;height:28px;display:block}' +
    'body.playing #ocVoiceBtn{display:none}' +
    '#ocVoiceWrap{position:fixed;inset:0;z-index:60;background:rgba(12,18,14,0.72);' +
    'display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}' +
    '#ocVoiceWrap.on{display:flex}' +
    '#ocVoicePanel{background:#fff;border-radius:22px;padding:16px;max-width:560px;width:100%;' +
    'font-family:"Segoe UI",system-ui,sans-serif;color:#2f4030;box-shadow:0 12px 40px rgba(0,0,0,0.35)}' +
    '#ocVoicePanel h3{margin:0 0 12px;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;' +
    'text-align:center;color:#5d7159}' +
    '#ocVoiceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}' +
    '.ocvc{min-height:110px;border-radius:18px;border:4px solid rgba(47,64,48,0.18);background:#fff;' +
    'cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}' +
    '.ocvc.on{border-color:#43a047;background:#e8f5e9}' +
    '.ocvc svg{width:56px;height:56px;display:block}' +
    '.ocvc b{font-size:15px}.ocvc i{font-style:normal;font-size:11px;color:#5d7159;font-weight:700}' +
    '#ocVoiceGrown{font-size:11px;color:#5d7159;line-height:1.5;margin-top:10px;text-align:center}' +
    '#ocVoiceGrown select{font:inherit;font-size:11px;padding:3px 5px;border-radius:8px;' +
    'border:2px solid rgba(47,64,48,0.18);max-width:180px}' +
    '#ocVoiceDone{margin-top:12px;width:100%;min-height:52px;border-radius:14px;border:4px solid #2e7d32;' +
    'background:#81c784;color:#06280b;font:800 15px "Segoe UI",system-ui,sans-serif;letter-spacing:0.14em;cursor:pointer}' +
    '@media (max-height:460px){#ocVoiceGrid{grid-template-columns:repeat(4,1fr)}' +
    '.ocvc{min-height:88px}.ocvc i{display:none}#ocVoiceGrown{display:none}}';
  document.head.appendChild(st);

  var btn = document.createElement('button');
  btn.id = 'ocVoiceBtn'; btn.type = 'button';
  btn.setAttribute('aria-label', 'Choose who reads to you');

  var wrap = document.createElement('div');
  wrap.id = 'ocVoiceWrap';
  wrap.innerHTML = '<div id="ocVoicePanel"><h3>Who should read to you?</h3>' +
    '<div id="ocVoiceGrid"></div><div id="ocVoiceGrown"></div>' +
    '<button id="ocVoiceDone" type="button">DONE</button></div>';

  function svg(inner, cls) {
    return '<svg viewBox="0 0 100 100" class="' + (cls || '') + '" aria-hidden="true">' + inner + '</svg>';
  }
  function paintBtn() { btn.innerHTML = svg(ocCur().face) + '<span>' + ocCur().name + '</span>'; }
  function paintGrid() {
    var g = wrap.querySelector('#ocVoiceGrid'), h = '', i, c;
    for (i = 0; i < OC_CHARACTERS.length; i++) {
      c = OC_CHARACTERS[i];
      h += '<button class="ocvc' + (c.id === OC_VOICE.charId ? ' on' : '') + '" type="button" data-oc="' + c.id +
        '" aria-label="' + c.name + ', ' + c.hint + '">' + svg(c.face) +
        '<b>' + c.name + '</b><i>' + c.hint + '</i></button>';
    }
    g.innerHTML = h;
    var gr = wrap.querySelector('#ocVoiceGrown'), list = ocVoices();
    if (list.length > 1) {
      var cur = ocPickedVoice(null), s = 'Grown-ups: the device voice underneath is <select id="ocVoiceSel">';
      for (i = 0; i < list.length && i < 24; i++) {
        s += '<option value="' + list[i].voiceURI + '"' +
             (cur && list[i].voiceURI === cur.voiceURI ? ' selected' : '') + '>' +
             String(list[i].name).slice(0, 26) + '</option>';
      }
      gr.innerHTML = s + '</select>. More can be added in the device&rsquo;s own settings.';
      var sel = wrap.querySelector('#ocVoiceSel');
      if (sel) sel.addEventListener('change', function () { OC_VOICE.uri = sel.value; ocSaveVoice(); ocSpeak(ocCur().line); });
    } else { gr.innerHTML = ''; }
  }
  btn.addEventListener('click', function () { paintGrid(); wrap.classList.add('on'); });
  wrap.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-oc]') : null;
    if (t) {
      OC_VOICE.charId = ocChar(t.getAttribute('data-oc')).id;
      ocSaveVoice(); paintGrid(); paintBtn();
      ocSpeak(ocCur().line);
      return;
    }
    if (e.target === wrap || (e.target && e.target.id === 'ocVoiceDone')) {
      wrap.classList.remove('on');
      try { window.speechSynthesis.cancel(); } catch (err) {}
    }
  });
  document.body.appendChild(btn);
  document.body.appendChild(wrap);
  paintBtn();
}
ocLoadVoice();
try {
  if (ocSpeechOK() && window.speechSynthesis) window.speechSynthesis.onvoiceschanged = ocVoices;
} catch (e) {}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ocVoiceUI);
else ocVoiceUI();
window.setTimeout(function () { ocVoices(); }, 400);

</script>
</body>
</html>
