<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Break — Eight Ball</title>
<meta name="theme-color" content="#0b0f1e">
<meta name="description" content="Eight-ball pool on a circuit-board table. Real cushions, real spin, real rules — break the rack, call your group, sink the 8 last.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Break">
<meta name="format-detection" content="telephone=no">
<style>
  :root {
    --bg: #0b0f1e;
    --accent: #ffcc4d;
    --fg: #eaf2ff;
    --dim: rgba(234,242,255,0.58);
    --panel: rgba(9,13,30,0.62);
    --line: rgba(255,255,255,0.13);
    --felt: #10402f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  canvas#game { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  #topbtns {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    right: max(8px, env(safe-area-inset-right));
    display: flex; gap: 6px; z-index: 8;
  }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line);
    font-family: inherit; font-size: 15px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .iconbtn:active { background: rgba(255,204,77,0.22); }
  body:not(.playing) #topbtns { display: none; }

  /* ---- table-side controls ------------------------------------------- */
  #ctrls { display: none; }
  body.playing:not(.ovl) #ctrls { display: block; }
  .cluster {
    position: absolute; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  #spinwrap { left: max(10px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); }
  #actwrap  { right: max(10px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); }
  .padlbl { font-size: 9px; letter-spacing: 0.2em; color: var(--dim); font-weight: 800; }
  .tbtn {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    font-family: inherit; font-weight: 800; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
  }
  .tbtn:active { background: rgba(255,204,77,0.2); }
  #spinpad {
    width: 68px; height: 68px; border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, #ffffff, #b9c6d8 62%, #7c8798);
    position: relative; border: 2px solid rgba(255,204,77,0.5);
  }
  #spindot {
    position: absolute; left: 50%; top: 50%;
    width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; background: #d33b3b;
    box-shadow: 0 0 0 2px rgba(11,15,30,0.55);
    pointer-events: none;
  }
  #spinpad::after {
    content: ""; position: absolute; inset: 30%;
    border-radius: 50%; border: 1px dashed rgba(11,15,30,0.35);
    pointer-events: none;
  }
  .finerow { display: flex; gap: 6px; }
  .fine { width: 44px; height: 44px; border-radius: 12px; font-size: 15px; }
  #shootBtn {
    width: 84px; height: 56px; border-radius: 14px;
    font-size: 12px; letter-spacing: 0.14em;
    border-color: rgba(255,204,77,0.55); color: var(--accent);
    background: rgba(255,204,77,0.13);
    position: relative; overflow: hidden;
  }
  #shootBtn .fill {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
    background: rgba(255,204,77,0.32); pointer-events: none;
  }
  #shootBtn span { position: relative; }
  body.port #spinwrap { top: auto; bottom: max(10px, env(safe-area-inset-bottom)); transform: none; }
  body.port #actwrap  { top: auto; bottom: max(10px, env(safe-area-inset-bottom)); transform: none;
                        flex-direction: row-reverse; align-items: flex-end; gap: 8px; }

  /* ---- overlay cards -------------------------------------------------- */
  #overlay {
    position: absolute; inset: 0; z-index: 10;
    display: none;
    align-items: safe center; justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 90% at 50% 0%, rgba(11,15,30,0.80), rgba(6,8,18,0.96));
    overflow-y: auto;
  }
  #overlay.on { display: flex; }
  .card {
    width: min(540px, 100%);
    background: rgba(10,14,30,0.86);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 20px 20px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    text-align: center;
  }
  .eyebrow { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--dim); }
  h1 {
    margin: 6px 0 2px;
    font-size: clamp(30px, 9vw, 52px);
    letter-spacing: 0.1em; font-weight: 800; line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(255,204,77,0.45);
  }
  h2 { margin: 2px 0 6px; font-size: clamp(20px, 6vw, 30px); letter-spacing: 0.08em; font-weight: 800; }
  .tagline { font-size: 12.5px; color: var(--dim); letter-spacing: 0.04em; margin-bottom: 10px; line-height: 1.45; }
  .tagline b { color: var(--fg); }
  .keys {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px 14px;
    font-size: 12px; color: var(--dim);
    margin: 12px auto 4px; max-width: 470px; text-align: left;
  }
  .keys > div { display: flex; justify-content: space-between; gap: 8px;
    border-bottom: 1px dashed rgba(255,255,255,0.09); padding-bottom: 4px; }
  .keys span { color: var(--fg); font-weight: 700; }
  .keys .hdr { color: var(--accent); font-weight: 800; letter-spacing: 0.14em;
    font-size: 9.5px; text-transform: uppercase; border-bottom-style: solid; display: block; }
  .lbl { font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); margin: 14px 0 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 6px; }
  .stat { background: rgba(255,255,255,0.045); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; }
  .stat .k { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
  .stat .v { font-size: clamp(15px, 4.4vw, 21px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .v.accent { color: var(--accent); }
  .best { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .best b { color: var(--accent); }
  .btn {
    margin-top: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 26px;
    border-radius: 14px; border: 1px solid rgba(255,204,77,0.55);
    background: rgba(255,204,77,0.13); color: var(--accent);
    font-family: inherit; font-size: 13.5px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; cursor: pointer;
  }
  .btn:active { background: rgba(255,204,77,0.3); }
  .btn.ghost { border-color: var(--line); color: var(--fg); background: rgba(255,255,255,0.05); }
  .btn.sm { min-height: 44px; padding: 0 16px; font-size: 12px; letter-spacing: 0.1em; }
  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .paused { font-size: clamp(26px, 8vw, 46px); font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); }
  @media (max-height: 620px) {
    .card { padding: 14px 16px; border-radius: 16px; }
    .keys { display: none; }
    .btn { margin-top: 9px; }
    .stats { margin: 9px 0 4px; }
  }
  /* real usable height on an iPhone held sideways is ~342px — trim to fit */
  @media (max-height: 470px) {
    .card { padding: 11px 14px; }
    .tagline.long { display: none; }
    h1 { font-size: 30px; }
    .btn { min-height: 44px; margin-top: 7px; }
    .btn.sm { min-height: 42px; }
    .stats { margin: 7px 0 3px; gap: 6px; }
    .stat { padding: 5px 4px; }
    .stat .k { font-size: 8px; letter-spacing: 0.12em; }
    .lbl { margin: 7px 0 4px; }
    .best { font-size: 10.5px; margin-top: 5px; }
  }
  @media (max-width: 420px) {
    .fine { width: 42px; height: 42px; }
    #shootBtn { width: 76px; }
    .btn { padding: 0 18px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="topbtns">
    <button class="iconbtn" id="muteBtn" type="button" aria-label="Mute">&#9835;</button>
    <button class="iconbtn" id="pauseBtn" type="button" aria-label="Pause">&#10073;&#10073;</button>
  </div>
  <div id="ctrls">
    <div class="cluster" id="spinwrap">
      <div class="tbtn" id="spinpad" role="button" aria-label="Spin"><div id="spindot"></div></div>
      <div class="padlbl">SPIN</div>
    </div>
    <div class="cluster" id="actwrap">
      <div class="finerow">
        <button class="tbtn fine" id="aimL" type="button" aria-label="Aim left">&#9664;</button>
        <button class="tbtn fine" id="aimR" type="button" aria-label="Aim right">&#9654;</button>
      </div>
      <button class="tbtn" id="shootBtn" type="button" aria-label="Shoot"><div class="fill" id="shootFill"></div><span>SHOOT</span></button>
    </div>
  </div>
  <div id="overlay"></div>
</div>
<script>
/* =========================================================================
   BREAK — eight-ball pool for the Overclock arcade.
   The rack is a stack; the break is the statement that gets you out of it.
   Felt is a circuit board, balls are numbered bits, and the rules are the
   real ones: open table after the break, call your group, the 8 goes last.
   One file, no assets, oscillator + noise audio.
   ========================================================================= */
"use strict";

var TAU = Math.PI * 2;
var K_SAVE = 'break_v1';
var K_MUTE = 'break_muted_v1';

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function loadJSON(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return (v === null || typeof v !== 'object') ? d : v; } catch (e) { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function loadStr(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function saveStr(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
function intOf(v, d) { var n = parseInt(v, 10); return (isFinite(n) && n >= 0) ? n : d; }

/* seeded RNG so a scripted match is reproducible */
var _seed = (Math.random() * 4294967296) >>> 0;
function setSeed(s) { _seed = (s >>> 0) || 1; }
function rng() {
  _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0;
  var t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rnd(a, b) { return a + rng() * (b - a); }
function gauss() { var u = 1 - rng(), v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }

/* ================================================================ audio == */
var actx = null, muted = loadStr(K_MUTE, '0') === '1', master = null, noiseBuf = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(actx.destination);
    var len = Math.floor(actx.sampleRate * 0.35);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    var ch = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
}
function setMuted(m) {
  muted = m; saveStr(K_MUTE, m ? '1' : '0');
  if (master) master.gain.value = m ? 0 : 0.5;
  var b = document.getElementById('muteBtn');
  b.innerHTML = m ? '&#215;' : '&#9835;';
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!actx || muted) return;
  var t = actx.currentTime + (delay || 0);
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, freq, q, vol, delay) {
  if (!actx || muted || !noiseBuf) return;
  var t = actx.currentTime + (delay || 0);
  var s = actx.createBufferSource(); s.buffer = noiseBuf;
  s.playbackRate.value = 0.8 + Math.random() * 0.5;
  var bp = actx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.setValueAtTime(freq, t); bp.Q.value = q;
  var g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}
var sfxBudget = 0;
var sfx = {
  click: function (spd) {
    if (sfxBudget <= 0) return; sfxBudget--;
    var v = clamp(spd / 220, 0.06, 1);
    noise(0.028 + v * 0.02, 1500 + v * 2100, 7, 0.05 + v * 0.13);
    tone('sine', 900 + v * 1500, 500 + v * 700, 0.035, 0.02 + v * 0.05);
  },
  cushion: function (spd) {
    if (sfxBudget <= 0) return; sfxBudget--;
    var v = clamp(spd / 220, 0.05, 1);
    noise(0.07, 240 + v * 300, 2.2, 0.03 + v * 0.09);
  },
  pocket: function () {
    tone('sine', 420, 150, 0.14, 0.1);
    noise(0.16, 320, 1.6, 0.09, 0.02);
    noise(0.1, 700, 3, 0.05, 0.08);
  },
  /* a break is a STACK of detuned clicks, not one hit */
  smash: function () {
    if (!actx || muted) return;
    noise(0.09, 160, 1.4, 0.22);
    for (var i = 0; i < 15; i++) {
      var d = Math.pow(Math.random(), 1.7) * 0.20;
      var f = 1300 + Math.random() * 2600;
      noise(0.022 + Math.random() * 0.02, f, 8, 0.05 + Math.random() * 0.09, d);
      if (i % 3 === 0) tone('sine', f * 0.7, f * 0.4, 0.03, 0.03, d);
    }
  },
  foul:  function () { tone('sawtooth', 300, 110, 0.26, 0.13); tone('square', 150, 70, 0.3, 0.07, 0.05); },
  win:   function () { tone('triangle', 523, 523, 0.12, 0.13); tone('triangle', 659, 659, 0.12, 0.13, 0.12); tone('triangle', 784, 1046, 0.3, 0.14, 0.24); },
  lose:  function () { tone('sawtooth', 400, 60, 0.7, 0.16); tone('square', 200, 45, 0.7, 0.09, 0.06); },
  turn:  function () { tone('triangle', 500, 720, 0.09, 0.07); },
  place: function () { tone('square', 620, 620, 0.03, 0.05); },
  charge:function (p) { tone('square', 220 + p * 500, 230 + p * 520, 0.03, 0.025); }
};

/* ============================================================== geometry = */
var TW = 100, TH = 50;               /* playfield, in table units (inches-ish) */
var R = 1.125, D = R * 2;
var CM = 3.90;                       /* corner pocket mouth, along each rail  */
var SM = 3.10;                       /* side pocket mouth, half width         */
var JR = 0.40;                       /* pocket jaw radius                     */
var FRAME = 3.6;                     /* rail frame drawn beyond the playfield */
var HEAD = TW * 0.25;                /* head string — break from behind it    */
var FOOTX = TW * 0.75, FOOTY = TH / 2;

/* cushions: axis 0 = vertical rail (constant x), 1 = horizontal (constant y).
   n = inward normal.  span = [lo,hi] along the other axis.                   */
var CUSH = [
  { ax: 1, pos: 0,  nx: 0, ny: 1,  lo: CM, hi: TW / 2 - SM },
  { ax: 1, pos: 0,  nx: 0, ny: 1,  lo: TW / 2 + SM, hi: TW - CM },
  { ax: 1, pos: TH, nx: 0, ny: -1, lo: CM, hi: TW / 2 - SM },
  { ax: 1, pos: TH, nx: 0, ny: -1, lo: TW / 2 + SM, hi: TW - CM },
  { ax: 0, pos: 0,  nx: 1, ny: 0,  lo: CM, hi: TH - CM },
  { ax: 0, pos: TW, nx: -1, ny: 0, lo: CM, hi: TH - CM }
];
var JAWS = [];
(function () {
  for (var i = 0; i < CUSH.length; i++) {
    var c = CUSH[i];
    for (var e = 0; e < 2; e++) {
      var v = e ? c.hi : c.lo;
      var px = c.ax === 0 ? c.pos : v;
      var py = c.ax === 0 ? v : c.pos;
      JAWS.push({ x: px - c.nx * JR, y: py - c.ny * JR, r: JR });
    }
  }
})();
var POCKETS = [
  { x: 0, y: 0, name: 'top left', corner: true },
  { x: TW / 2, y: 0, name: 'top side', corner: false },
  { x: TW, y: 0, name: 'top right', corner: true },
  { x: 0, y: TH, name: 'bottom left', corner: true },
  { x: TW / 2, y: TH, name: 'bottom side', corner: false },
  { x: TW, y: TH, name: 'bottom right', corner: true }
];

/* =============================================================== physics = */
var GRAV = 386.09;
var MU_SLIDE = 0.45;
var MU_ROLL = 0.050;
var DRAG = 0.0006;            /* quadratic term: kills break speed, not roll */
var SPIN_DECAY = 90;          /* rad/s^2 on the vertical-axis spin           */
var CUSH_E = 0.80, CUSH_MU = 0.16;
var BALL_E = 0.95, BALL_MU = 0.012;
var STOP_V = 0.9;
var SUB_H = 1 / 400;          /* substep ceiling; distance rule shrinks it   */
var SUB_TRAVEL = R * 0.22;    /* no ball moves further than this per substep */
var MINV = 30, MAXV = 460;
var INERTIA = 0.4 * R * R;    /* I / m for a solid sphere                    */

var balls = [];
function mkBall(n) { return { n: n, x: 0, y: 0, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0, active: true, pocket: -1, potT: 0 }; }
for (var _i = 0; _i <= 15; _i++) balls.push(mkBall(_i));
var cue = balls[0];

function groupOf(n) { return n === 8 ? 'eight' : (n < 8 ? 'solid' : 'stripe'); }
function speed(b) { return Math.sqrt(b.vx * b.vx + b.vy * b.vy); }
function maxSpeed() { var m = 0; for (var i = 0; i < balls.length; i++) { if (!balls[i].active) continue; var s = speed(balls[i]); if (s > m) m = s; } return m; }
function anyMoving() { return maxSpeed() > 0; }

/* diagnostics — turned on by the physics proof harness */
var DBG = { strict: false, worstOverlap: 0, worstOutside: 0, worstKEGain: 0, keEvents: 0, collisions: 0, cushions: 0 };
function totalKE() {
  var e = 0;
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i]; if (!b.active) continue;
    e += 0.5 * (b.vx * b.vx + b.vy * b.vy);
    e += 0.5 * INERTIA * (b.wx * b.wx + b.wy * b.wy + b.wz * b.wz);
  }
  return e;
}
function keWatch(before) {
  var after = totalKE();
  DBG.keEvents++;
  var gain = (after - before) / Math.max(before, 1e-9);
  if (gain > DBG.worstKEGain) DBG.worstKEGain = gain;
}

/* --- shot bookkeeping ---------------------------------------------------- */
var shot = null;
function newShot() {
  return { first: 0, potted: [], scratch: false, rail: false, railBalls: {}, railCount: 0, contacts: 0 };
}

function noteRail(b) {
  if (!shot) return;
  if (shot.first) shot.rail = true;
  if (b.n !== 0 && !shot.railBalls[b.n]) { shot.railBalls[b.n] = 1; shot.railCount++; }
}

/* --- integrate one substep ---------------------------------------------- */
function integrate(h) {
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    if (!b.active) continue;
    b.x += b.vx * h; b.y += b.vy * h;

    /* contact-point velocity: cloth is at +z, so u = v + (wy*R, -wx*R) */
    var ux = b.vx + b.wy * R, uy = b.vy - b.wx * R;
    var us = Math.sqrt(ux * ux + uy * uy);
    if (us > 0.35) {
      var a = MU_SLIDE * GRAV;
      var hx = ux / us, hy = uy / us;
      b.vx -= a * h * hx; b.vy -= a * h * hy;
      var k = (5 * a * h) / (2 * R);
      b.wx += k * hy;
      b.wy -= k * hx;
    } else {
      var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (sp > 0) {
        var dec = MU_ROLL * GRAV * h;
        if (dec >= sp) { b.vx = 0; b.vy = 0; }
        else { b.vx -= dec * b.vx / sp; b.vy -= dec * b.vy / sp; }
      }
      b.wy = -b.vx / R; b.wx = b.vy / R;      /* hold the rolling constraint */
    }
    var sd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sd > 0) {
      var dd = DRAG * sd * sd * h;
      if (dd >= sd) { b.vx = 0; b.vy = 0; }
      else { b.vx -= dd * b.vx / sd; b.vy -= dd * b.vy / sd; }
    }
    if (Math.abs(b.wz) > 0) {
      var dz = SPIN_DECAY * h;
      if (dz >= Math.abs(b.wz)) b.wz = 0; else b.wz -= dz * (b.wz > 0 ? 1 : -1);
    }
    if (Math.sqrt(b.vx * b.vx + b.vy * b.vy) < STOP_V) {
      var uu = Math.sqrt((b.vx + b.wy * R) * (b.vx + b.wy * R) + (b.vy - b.wx * R) * (b.vy - b.wx * R));
      if (uu < 3) { b.vx = 0; b.vy = 0; b.wx = 0; b.wy = 0; }
    }
  }
}

/* --- cushion + jaw ------------------------------------------------------- */
function bounceNormal(b, nx, ny, sep) {
  b.x += nx * sep; b.y += ny * sep;
  var vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return;
  var before = DBG.strict ? totalKE() : 0;
  var tx = -ny, ty = nx;                         /* t = z_hat x n           */
  var vt = b.vx * tx + b.vy * ty;
  var spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
  var vnp = -vn * CUSH_E;
  var jn = Math.abs(vn) * (1 + CUSH_E);
  var ut = vt - b.wz * R;
  var jt = -2 * ut / 7;
  var lim = CUSH_MU * jn;
  if (jt > lim) jt = lim; else if (jt < -lim) jt = -lim;
  vt += jt;
  b.wz -= 2.5 * jt / R;
  b.vx = nx * vnp + tx * vt;
  b.vy = ny * vnp + ty * vt;
  b.wx *= 0.6; b.wy *= 0.6;
  if (DBG.strict) keWatch(before);
  DBG.cushions++;
  sfx.cushion(spd);
  noteRail(b);
  fxAdd({ x: b.x, y: b.y, t: 0.22, r: R * 1.4, c: '#7de2ff' });
}
function cushionPass() {
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    if (!b.active) continue;
    for (var c = 0; c < CUSH.length; c++) {
      var s = CUSH[c];
      var along = s.ax === 0 ? b.y : b.x;
      if (along < s.lo || along > s.hi) continue;
      var dist = (s.ax === 0 ? b.x : b.y) - s.pos;
      var pen = R - dist * (s.nx + s.ny);      /* nx+ny is +1 or -1         */
      if (pen > 0) bounceNormal(b, s.nx, s.ny, pen);
    }
    for (var j = 0; j < JAWS.length; j++) {
      var w = JAWS[j];
      var dx = b.x - w.x, dy = b.y - w.y;
      var dd = Math.sqrt(dx * dx + dy * dy);
      var need = R + w.r;
      if (dd < need && dd > 1e-9) bounceNormal(b, dx / dd, dy / dd, need - dd);
    }
  }
}

/* --- ball vs ball -------------------------------------------------------- */
function ballPass(withImpulse) {
  var touched = 0;
  for (var i = 0; i < balls.length; i++) {
    var a = balls[i]; if (!a.active) continue;
    for (var j = i + 1; j < balls.length; j++) {
      var b = balls[j]; if (!b.active) continue;
      var dx = b.x - a.x, dy = b.y - a.y;
      var d2 = dx * dx + dy * dy;
      if (d2 >= D * D || d2 < 1e-12) continue;
      var dist = Math.sqrt(d2);
      var nx = dx / dist, ny = dy / dist;
      var over = D - dist;
      a.x -= nx * over * 0.5; a.y -= ny * over * 0.5;
      b.x += nx * over * 0.5; b.y += ny * over * 0.5;
      if (over > 1e-7) touched++;
      if (!withImpulse) continue;
      var rvx = a.vx - b.vx, rvy = a.vy - b.vy;
      var vn = rvx * nx + rvy * ny;
      if (vn <= 0) continue;                     /* separating already      */
      var before = DBG.strict ? totalKE() : 0;
      var jn = (1 + BALL_E) * vn * 0.5;
      a.vx -= jn * nx; a.vy -= jn * ny;
      b.vx += jn * nx; b.vy += jn * ny;
      var tx = -ny, ty = nx;
      var ut = (a.vx - b.vx) * tx + (a.vy - b.vy) * ty + R * (a.wz + b.wz);
      var jt = -ut / 7;
      var lim = BALL_MU * jn;
      if (jt > lim) jt = lim; else if (jt < -lim) jt = -lim;
      a.vx += jt * tx; a.vy += jt * ty;
      b.vx -= jt * tx; b.vy -= jt * ty;
      a.wz += 2.5 * jt / R; b.wz += 2.5 * jt / R;
      if (DBG.strict) keWatch(before);
      DBG.collisions++;
      sfx.click(vn);
      fxAdd({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, t: 0.18, r: R * 1.2, c: '#ffffff' });
      if (shot) {
        shot.contacts++;
        if (a.n === 0 && !shot.first) shot.first = b.n;
        else if (b.n === 0 && !shot.first) shot.first = a.n;
      }
    }
  }
  return touched;
}

/* --- pockets ------------------------------------------------------------- */
function pocketPass() {
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    if (!b.active) continue;
    if (b.x >= 0 && b.x <= TW && b.y >= 0 && b.y <= TH) continue;
    /* it crossed a rail line — the cushions cannot be crossed, so this is
       a pocket mouth by construction. find which one. */
    var bi = 0, bd = 1e9;
    for (var p = 0; p < POCKETS.length; p++) {
      var dx = b.x - POCKETS[p].x, dy = b.y - POCKETS[p].y;
      var dd = dx * dx + dy * dy;
      if (dd < bd) { bd = dd; bi = p; }
    }
    b.active = false; b.pocket = bi; b.potT = 0;
    b.vx = 0; b.vy = 0; b.wx = 0; b.wy = 0; b.wz = 0;
    b.x = POCKETS[bi].x; b.y = POCKETS[bi].y;
    sfx.pocket();
    shake(4);
    if (shot) {
      if (b.n === 0) shot.scratch = true;
      else shot.potted.push({ n: b.n, pocket: bi });
      shot.rail = true;     /* a pot satisfies the drive-to-rail requirement */
    }
  }
}

function invariantPass() {
  for (var i = 0; i < balls.length; i++) {
    var a = balls[i]; if (!a.active) continue;
    var out = Math.max(-a.x, a.x - TW, -a.y, a.y - TH);
    if (out > DBG.worstOutside) DBG.worstOutside = out;
    for (var j = i + 1; j < balls.length; j++) {
      var b = balls[j]; if (!b.active) continue;
      var dx = b.x - a.x, dy = b.y - a.y;
      var ov = D - Math.sqrt(dx * dx + dy * dy);
      if (ov > DBG.worstOverlap) DBG.worstOverlap = ov;
    }
  }
}

function substep(h) {
  integrate(h);
  ballPass(true);
  cushionPass();
  /* relaxation: push overlaps apart until a ball pinned between another ball
     and a cushion has settled. one pass is not enough in a dense rack. */
  for (var it = 0; it < 6; it++) { if (!ballPass(false)) break; cushionPass(); }
  pocketPass();
  if (DBG.strict) invariantPass();
}

/* fixed substep SIZE (a distance budget), never a fixed count */
function simulate(dt) {
  var acc = dt, guard = 0;
  while (acc > 1e-9 && guard++ < 4000) {
    var vm = maxSpeed();
    if (vm <= 0) break;
    var h = SUB_H;
    var lim = SUB_TRAVEL / vm;
    if (lim < h) h = lim;
    if (h > acc) h = acc;
    if (h < 1e-6) h = 1e-6;
    substep(h);
    acc -= h;
  }
}

/* ================================================================ state == */
var STRENGTH = {
  idle:   { name: 'IDLE',   err: 0.028, topk: 4, pjit: 0.18, spots: 8,  think: 0.55 },
  kernel: { name: 'KERNEL', err: 0.0070, topk: 2, pjit: 0.09, spots: 26, think: 0.7 },
  root:   { name: 'ROOT',   err: 0.0022, topk: 1, pjit: 0.035, spots: 60, think: 0.85 }
};
function blankRec() { return { w: 0, l: 0 }; }
function loadSave() {
  var s = loadJSON(K_SAVE, {}) || {};
  var rec = {};
  for (var k in STRENGTH) {
    var r = (s.rec && s.rec[k]) || {};
    rec[k] = { w: intOf(r.w, 0), l: intOf(r.l, 0) };
  }
  return { rec: rec, bestClear: intOf(s.bestClear, 0), longestRun: intOf(s.longestRun, 0) };
}
var SAVE = loadSave();
function persist() { saveJSON(K_SAVE, { rec: SAVE.rec, bestClear: SAVE.bestClear, longestRun: SAVE.longestRun }); }

var G = {
  state: 'title',            /* title | play | pause | over                 */
  phase: 'aim',              /* aim | shooting | ballinhand                 */
  mode: 'cpu',
  strength: 'kernel',
  cpu: [null, 'kernel'],     /* per-seat CPU strength, null = human         */
  turn: 0,
  groups: [null, null],
  call: ['solid', 'solid'],
  open: true,
  isBreak: true,
  wasOnEight: [false, false],
  aim: 0,
  spin: { x: 0, y: 0 },
  power: 0, charging: false, chargeDir: 1,
  aiT: 0, aiPlan: null,
  msg: '', msgT: 0, msgCol: '#eaf2ff',
  banner: '', bannerT: 0,
  winner: -1, overReason: '',
  shotT: 0,
  run: [0, 0], bestRun: [0, 0], cleared: [0, 0],
  shots: 0
};
var fx = [];
function fxAdd(e) { if (fx.length < 60) fx.push(e); }
var shakeT = 0, shakeA = 0;
function shake(a) { shakeA = Math.max(shakeA, a); shakeT = 0.3; }
function say(t, col) { G.msg = t; G.msgT = 3.2; G.msgCol = col || '#eaf2ff'; }
function bannerSay(t) { G.banner = t; G.bannerT = 1.6; }

function seatName(i) {
  if (G.mode === 'two') return i === 0 ? 'PLAYER ONE' : 'PLAYER TWO';
  return G.cpu[i] ? STRENGTH[G.cpu[i]].name : 'YOU';
}
function shortSeat(i) {
  if (G.mode === 'two') return i === 0 ? 'P1' : 'P2';
  return G.cpu[i] ? STRENGTH[G.cpu[i]].name : 'YOU';
}
function groupLabel(g) { return g === 'solid' ? 'SOLIDS' : (g === 'stripe' ? 'STRIPES' : 'OPEN'); }
function remaining(g) {
  var n = 0;
  for (var i = 1; i <= 15; i++) if (balls[i].active && groupOf(balls[i].n) === g) n++;
  return n;
}
function onEight(p) { return G.groups[p] !== null && remaining(G.groups[p]) === 0; }

/* --- rack ---------------------------------------------------------------- */
function rack() {
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    b.vx = b.vy = b.wx = b.wy = b.wz = 0; b.active = true; b.pocket = -1;
  }
  var gap = D * 1.006;
  var rowdx = gap * Math.sqrt(3) / 2;
  var pos = [];
  for (var row = 0; row < 5; row++) {
    for (var k = 0; k <= row; k++) {
      pos.push({ x: FOOTX + row * rowdx, y: FOOTY + (k - row / 2) * gap });
    }
  }
  /* slot 0 apex, slot 4 centre of the third row, slots 10 & 14 back corners */
  var slot = new Array(15);
  slot[0] = 1; slot[4] = 8;
  var solids = [2, 3, 4, 5, 6, 7];
  var stripes = [9, 10, 11, 12, 13, 14, 15];
  function pull(arr) { return arr.splice((rng() * arr.length) | 0, 1)[0]; }
  if (rng() < 0.5) { slot[10] = pull(solids); slot[14] = pull(stripes); }
  else { slot[10] = pull(stripes); slot[14] = pull(solids); }
  var rest = solids.concat(stripes);
  for (var s = 0; s < 15; s++) {
    if (slot[s] === undefined) slot[s] = pull(rest);
  }
  for (var q = 0; q < 15; q++) {
    var bb = balls[slot[q]];
    bb.x = pos[q].x; bb.y = pos[q].y;
  }
  cue.x = HEAD * 0.55; cue.y = TH / 2;
  cue.vx = cue.vy = cue.wx = cue.wy = cue.wz = 0;
  cue.active = true; cue.pocket = -1;
}

function respotEight() {
  var e = balls[8];
  e.active = true; e.pocket = -1; e.vx = e.vy = e.wx = e.wy = e.wz = 0;
  var tries = [[FOOTX, FOOTY]];
  for (var d = 1; d < 70; d++) { tries.push([FOOTX + d * 0.9, FOOTY]); tries.push([FOOTX - d * 0.9, FOOTY]); }
  for (var i = 0; i < tries.length; i++) {
    var x = clamp(tries[i][0], R + 0.2, TW - R - 0.2), y = tries[i][1];
    if (spotFree(x, y, 8)) { e.x = x; e.y = y; return; }
  }
  e.x = FOOTX; e.y = FOOTY;
}
function spotFree(x, y, skipN) {
  if (x < R || x > TW - R || y < R || y > TH - R) return false;
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    if (!b.active || b.n === skipN) continue;
    var dx = b.x - x, dy = b.y - y;
    if (dx * dx + dy * dy < D * D * 1.02) return false;
  }
  return true;
}

/* ============================================================== rules ==== */
function legalFirst(n, p, wasOn) {
  if (n === 0 || !n) return false;
  if (G.groups[p] === null) return n !== 8;          /* open table: not the 8 */
  if (wasOn) return n === 8;
  return groupOf(n) === G.groups[p];
}
function legalTargets(p) {
  var out = [];
  if (G.wasOnEight[p] || onEight(p)) { if (balls[8].active) out.push(balls[8]); return out; }
  for (var i = 1; i <= 15; i++) {
    var b = balls[i];
    if (!b.active || b.n === 8) continue;
    if (G.groups[p] === null || groupOf(b.n) === G.groups[p]) out.push(b);
  }
  return out;
}

function takeShot() {
  G.wasOnEight[G.turn] = onEight(G.turn);
  shot = newShot();
  G.shotT = 0;
  G.phase = 'shooting';
  G.shots++;
  sfxBudget = 26;
}

function endGame(winner, reason) {
  G.winner = winner; G.overReason = reason;
  G.state = 'over';
  if (G.mode === 'cpu') {
    var human = G.cpu[0] === null ? 0 : 1;
    var key = G.strength;
    if (!SAVE.rec[key]) SAVE.rec[key] = blankRec();
    if (winner === human) SAVE.rec[key].w++; else SAVE.rec[key].l++;
    var c = G.cleared[human];
    if (c > SAVE.bestClear) SAVE.bestClear = c;
    if (G.bestRun[human] > SAVE.longestRun) SAVE.longestRun = G.bestRun[human];
    persist();
  } else {
    for (var s = 0; s < 2; s++) {
      if (G.cleared[s] > SAVE.bestClear) SAVE.bestClear = G.cleared[s];
      if (G.bestRun[s] > SAVE.longestRun) SAVE.longestRun = G.bestRun[s];
    }
    persist();
  }
  if (G.mode === 'cpu' && winner === (G.cpu[0] === null ? 0 : 1)) sfx.win(); else if (G.mode === 'cpu') sfx.lose(); else sfx.win();
  setTimeout(overScreen, 900);
}

function passTurn(foul) {
  G.run[G.turn] = 0;
  G.turn = 1 - G.turn;
  if (foul) { G.phase = 'ballinhand'; }
  else G.phase = 'aim';
  G.aiT = G.cpu[G.turn] ? STRENGTH[G.cpu[G.turn]].think : 0;
  G.aiPlan = null;
  G.power = 0; G.charging = false;
  sfx.turn();
}
function keepTurn() {
  G.phase = 'aim';
  G.aiT = G.cpu[G.turn] ? STRENGTH[G.cpu[G.turn]].think : 0;
  G.aiPlan = null;
  G.power = 0; G.charging = false;
}

function resolveShot() {
  if (!shot) { G.phase = 'aim'; return; }
  var me = G.turn, opp = 1 - me;
  var wasBreak = G.isBreak;
  var pottedNums = [];
  for (var i = 0; i < shot.potted.length; i++) pottedNums.push(shot.potted[i].n);
  var gotEight = pottedNums.indexOf(8) >= 0;

  /* count what this player cleared of their own group, for the save file */
  var foul = false, reason = '';

  if (!shot.first) { foul = true; reason = 'cue ball hit nothing'; }
  else if (!legalFirst(shot.first, me, G.wasOnEight[me])) {
    foul = true;
    reason = 'hit the ' + shot.first + ' first — wrong ball';
    if (shot.first === 8) reason = 'hit the 8 first';
  }
  if (!foul && !shot.rail && shot.potted.length === 0 && !shot.scratch) {
    foul = true; reason = 'no rail after contact';
  }
  if (shot.scratch) { foul = true; reason = reason || 'scratch — cue ball down'; if (reason.indexOf('scratch') < 0) reason = reason + ' + scratch'; }

  if (wasBreak) {
    G.isBreak = false;
    if (gotEight && !shot.scratch) {
      /* the 8 on the break is spotted, not a loss */
      respotEight();
      pottedNums.splice(pottedNums.indexOf(8), 1);
      gotEight = false;
      bannerSay('8 ON THE BREAK — RESPOTTED');
    }
    if (!foul && shot.potted.length === 0 && shot.railCount < 4) {
      foul = true; reason = 'illegal break — four balls must reach a rail';
    }
  }

  /* --- the 8 decides everything ---------------------------------------- */
  if (gotEight) {
    if (!foul && G.wasOnEight[me]) {
      tallyPots(me, pottedNums);
      endGame(me, 'The 8 fell clean.');
      return;
    }
    endGame(opp, foul ? ('The 8 went down on a foul — ' + reason + '.') : 'The 8 went down early.');
    return;
  }

  if (foul) {
    sfx.foul();
    say(shortSeat(me) + ' FOUL — ' + reason.toUpperCase(), '#ff6b6b');
    bannerSay('FOUL — BALL IN HAND');
    tallyPots(me, pottedNums);
    if (shot.scratch) { cue.active = true; cue.pocket = -1; cue.vx = cue.vy = cue.wx = cue.wy = cue.wz = 0; }
    passTurn(true);
    placeCueDefault();
    return;
  }

  /* --- group assignment on an open table -------------------------------- */
  var continues = false;
  if (G.open) {
    if (wasBreak) {
      continues = shot.potted.length > 0;
      if (continues) say('BREAK MADE — TABLE STILL OPEN', '#8effc1');
      else say('TABLE OPEN — CALL YOUR GROUP', '#ffcc4d');
    } else {
      var want = G.call[me];
      var hit = false;
      for (var q = 0; q < pottedNums.length; q++) if (groupOf(pottedNums[q]) === want) hit = true;
      if (hit) {
        G.groups[me] = want;
        G.groups[opp] = want === 'solid' ? 'stripe' : 'solid';
        G.open = false;
        continues = true;
        say(shortSeat(me) + ' TAKES ' + groupLabel(want), '#8effc1');
        bannerSay(groupLabel(want) + ' — ' + shortSeat(me));
      } else {
        continues = false;
        say(pottedNums.length ? 'CALLED ' + groupLabel(want) + ' — TABLE STILL OPEN' : 'MISS — TABLE STILL OPEN', '#ffcc4d');
      }
    }
  } else {
    for (var w = 0; w < pottedNums.length; w++) if (groupOf(pottedNums[w]) === G.groups[me]) continues = true;
    if (!continues) say('MISS — ' + shortSeat(opp) + ' IS UP', '#eaf2ff');
  }

  tallyPots(me, pottedNums);

  if (continues) {
    if (onEight(me)) { say(shortSeat(me) + ' IS ON THE 8', '#ffcc4d'); bannerSay('ON THE 8'); }
    keepTurn();
  } else {
    passTurn(false);
  }
}

function tallyPots(p, nums) {
  var own = 0;
  for (var i = 0; i < nums.length; i++) {
    var g = groupOf(nums[i]);
    if (G.groups[p] && g === G.groups[p]) own++;
    else if (!G.groups[p] && g !== 'eight') own++;
  }
  if (own > 0) {
    G.run[p] += own;
    G.cleared[p] += own;
    if (G.run[p] > G.bestRun[p]) G.bestRun[p] = G.run[p];
  }
}

function placeCueDefault() {
  /* park the cue somewhere legal so the state is always valid */
  var lo = G.isBreak ? R + 0.4 : R + 0.4;
  var hi = G.isBreak ? HEAD - R : TW - R - 0.4;
  for (var t = 0; t < 400; t++) {
    var x = rnd(lo, hi), y = rnd(R + 0.4, TH - R - 0.4);
    if (spotFree(x, y, 0)) { cue.x = x; cue.y = y; return; }
  }
  cue.x = HEAD * 0.55; cue.y = TH / 2;
}
function cuePlaceValid(x, y) {
  if (G.isBreak && x > HEAD) return false;
  return spotFree(x, y, 0);
}

/* ================================================================== aim == */
function ray(px, py, dx, dy) {
  /* first thing the cue ball centre meets travelling along (dx,dy) */
  var best = { t: 1e9, ball: null, cushion: null };
  for (var i = 1; i <= 15; i++) {
    var b = balls[i]; if (!b.active) continue;
    var ex = b.x - px, ey = b.y - py;
    var proj = ex * dx + ey * dy;
    if (proj <= 0) continue;
    var perp2 = ex * ex + ey * ey - proj * proj;
    if (perp2 > D * D) continue;
    var t = proj - Math.sqrt(Math.max(0, D * D - perp2));
    if (t >= 0 && t < best.t) { best.t = t; best.ball = b; best.cushion = null; }
  }
  for (var c = 0; c < CUSH.length; c++) {
    var s = CUSH[c];
    var n = s.ax === 0 ? s.nx : s.ny;
    var comp = s.ax === 0 ? dx : dy;
    var cur = s.ax === 0 ? px : py;
    var target = s.pos + n * R;
    if (Math.abs(comp) < 1e-9) continue;
    var tt = (target - cur) / comp;
    if (tt <= 0 || tt >= best.t) continue;
    var hx = px + dx * tt, hy = py + dy * tt;
    var along = s.ax === 0 ? hy : hx;
    if (along < s.lo || along > s.hi) continue;
    if (comp * n > 0) continue;                 /* moving away from the rail */
    best.t = tt; best.ball = null; best.cushion = s;
  }
  if (best.t > 1e8) {
    /* nothing in the way — it is heading straight for a pocket mouth */
    var far = 1e9;
    for (var e = 0; e < 4; e++) {
      var isX = e < 2, lim = (e % 2) ? (isX ? TW : TH) : 0;
      var cc = isX ? dx : dy, cv0 = isX ? px : py;
      if (Math.abs(cc) < 1e-9) continue;
      var tf = (lim - cv0) / cc;
      if (tf > 0 && tf < far) far = tf;
    }
    best.t = Math.min(far, 200); best.ball = null; best.cushion = null;
  }
  return best;
}

function currentCall() {
  if (!cue.active) return G.call[G.turn];
  var h = ray(cue.x, cue.y, Math.cos(G.aim), Math.sin(G.aim));
  if (h.ball && h.ball.n !== 8) return groupOf(h.ball.n);
  return G.call[G.turn];
}
function shootNow(power) {
  initAudio();
  if (G.open && !G.isBreak) G.call[G.turn] = currentCall();
  var V = MINV + (MAXV - MINV) * clamp(power, 0, 1);
  var dx = Math.cos(G.aim), dy = Math.sin(G.aim);
  cue.vx = dx * V; cue.vy = dy * V;
  var a = G.spin.x, b = -G.spin.y;
  var rx = -dy, ry = dx;
  var kk = 2.5 * V * b / R;
  cue.wz = -2.5 * V * a / R;
  cue.wx = -kk * rx;
  cue.wy = -kk * ry;
  var breaking = G.isBreak;
  takeShot();
  if (breaking) { sfx.smash(); shake(9); }
  else { shake(1.5 + power * 2.5); }
}

/* =================================================================== AI == */
function pathClear(ax, ay, bx, by, skipA, skipB) {
  var dx = bx - ax, dy = by - ay;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1e-6) return true;
  var ux = dx / len, uy = dy / len;
  for (var i = 0; i <= 15; i++) {
    var b = balls[i];
    if (!b.active) continue;
    if (b === skipA || b === skipB) continue;
    var ex = b.x - ax, ey = b.y - ay;
    var proj = ex * ux + ey * uy;
    if (proj < -R || proj > len + R) continue;
    var pp = clamp(proj, 0, len);
    var cx = ax + ux * pp - b.x, cy = ay + uy * pp - b.y;
    if (cx * cx + cy * cy < D * D * 0.985) return false;
  }
  return true;
}

function findShots(p, fromX, fromY) {
  var out = [];
  var targets = legalTargets(p);
  for (var i = 0; i < targets.length; i++) {
    var t = targets[i];
    for (var q = 0; q < POCKETS.length; q++) {
      var pk = POCKETS[q];
      var ox = t.x - pk.x, oy = t.y - pk.y;
      var od = Math.sqrt(ox * ox + oy * oy);
      if (od < 1e-6) continue;
      var gx = t.x + (ox / od) * D, gy = t.y + (oy / od) * D;
      if (gx < -1 || gx > TW + 1 || gy < -1 || gy > TH + 1) continue;
      var cx = gx - fromX, cy = gy - fromY;
      var cd = Math.sqrt(cx * cx + cy * cy);
      if (cd < D * 0.6) continue;
      var cutCos = (cx / cd) * (-ox / od) + (cy / cd) * (-oy / od);
      if (cutCos < 0.20) continue;
      if (!pathClear(fromX, fromY, gx, gy, cue, t)) continue;
      if (!pathClear(t.x, t.y, pk.x, pk.y, t, null)) continue;
      var score = Math.pow(cutCos, 1.7) * (1 / (1 + od / 42)) * (1 / (1 + cd / 66));
      if (!pk.corner) score *= 0.92;
      out.push({ ball: t.n, pocket: q, aim: Math.atan2(cy, cx), score: score, cd: cd, od: od, cut: cutCos });
    }
  }
  out.sort(function (a, b) { return b.score - a.score; });
  return out;
}

function aiBallInHand(p) {
  var st = STRENGTH[G.cpu[p]] || STRENGTH.kernel;
  var best = null, bestScore = -1;
  var loX = G.isBreak ? R + 1 : R + 1, hiX = G.isBreak ? HEAD - R - 0.5 : TW - R - 1;
  for (var i = 0; i < st.spots; i++) {
    var x, y;
    if (G.isBreak) { x = rnd(loX, hiX); y = TH / 2 + gauss() * 3; }
    else { x = rnd(loX, hiX); y = rnd(R + 1, TH - R - 1); }
    y = clamp(y, R + 0.6, TH - R - 0.6);
    if (!cuePlaceValid(x, y)) continue;
    var s;
    if (G.isBreak) { s = 1 - Math.abs(y - TH / 2) / 10; }
    else {
      var list = findShots(p, x, y);
      s = list.length ? list[0].score : 0;
    }
    if (s > bestScore) { bestScore = s; best = { x: x, y: y }; }
  }
  if (!best) { placeCueDefault(); return; }
  cue.x = best.x; cue.y = best.y;
  sfx.place();
}

function aiChooseShot(p) {
  var st = STRENGTH[G.cpu[p]] || STRENGTH.kernel;
  if (G.isBreak) {
    var apex = null, bd = 1e9;
    for (var i = 1; i <= 15; i++) {
      var b = balls[i]; if (!b.active) continue;
      var dd = (b.x - cue.x) * (b.x - cue.x) + (b.y - cue.y) * (b.y - cue.y);
      if (dd < bd) { bd = dd; apex = b; }
    }
    if (!apex) apex = balls[1];
    return { aim: Math.atan2(apex.y - cue.y, apex.x - cue.x) + gauss() * 0.006, power: 0.92 + rng() * 0.08, spin: { x: 0, y: 0 } };
  }
  var list = findShots(p, cue.x, cue.y);
  if (list.length) {
    var k = Math.min(st.topk, list.length);
    var pick = list[(rng() * k) | 0];
    var pw = clamp(0.30 + (pick.od + pick.cd) / 240 + (1 - pick.cut) * 0.22, 0.26, 0.95);
    pw = clamp(pw + gauss() * st.pjit, 0.2, 1);
    return { aim: pick.aim + gauss() * st.err, power: pw, spin: { x: 0, y: clamp(gauss() * 0.12, -0.3, 0.3) } };
  }
  /* safety: hit a legal ball and make sure something reaches a rail */
  var tg = legalTargets(p);
  if (!tg.length) return { aim: rnd(0, TAU), power: 0.5, spin: { x: 0, y: 0 } };
  var bestT = tg[0], bs = 1e9;
  for (var j = 0; j < tg.length; j++) {
    var dd2 = (tg[j].x - cue.x) * (tg[j].x - cue.x) + (tg[j].y - cue.y) * (tg[j].y - cue.y);
    if (!pathClear(cue.x, cue.y, tg[j].x, tg[j].y, cue, tg[j])) dd2 *= 9;
    if (dd2 < bs) { bs = dd2; bestT = tg[j]; }
  }
  return { aim: Math.atan2(bestT.y - cue.y, bestT.x - cue.x) + gauss() * st.err * 0.6, power: 0.55, spin: { x: 0, y: 0 } };
}

function aiTick(dt) {
  var p = G.turn;
  if (!G.cpu[p]) return;
  if (G.phase === 'shooting') return;
  G.aiT -= dt;
  if (G.aiT > 0) return;
  if (G.phase === 'ballinhand') {
    aiBallInHand(p);
    G.phase = 'aim';
    G.aiT = 0.45;
    return;
  }
  if (!G.aiPlan) {
    G.aiPlan = aiChooseShot(p);
    G.aim = G.aiPlan.aim;
    G.spin.x = G.aiPlan.spin.x; G.spin.y = G.aiPlan.spin.y;
    updateSpinDot();
    G.aiT = 0.5;                     /* let the guideline show for a beat  */
    return;
  }
  var plan = G.aiPlan;
  G.aiPlan = null;
  shootNow(plan.power);
}

var stage = document.getElementById('stage');

var L = { S: 6, ox: 0, oy: 0, rot: false, tw: 0, th: 0, msgY: 0, meter: { x: 0, y: 0, w: 10, h: 10 } };

var PAD = 68, FINE_W = 44, SHOOT_W = 84, SHOOT_H = 56, HUD = 46;
function layout() {
  var W = view.w, H = view.h;
  var portrait = H > W * 1.02;
  document.body.classList.toggle('port', portrait);
  var GUT = clamp(W * 0.16, 104, 165);
  var BOT = portrait ? 96 : 0;
  var availW = W - (portrait ? 24 : GUT * 2);
  var availH = H - HUD - BOT - 48;
  var tw = portrait ? TH : TW, th = portrait ? TW : TH;
  /* fit the whole table INCLUDING its rail frame — no cropped woodwork */
  var boxW = tw + FRAME * 2, boxH = th + FRAME * 2;
  var S = Math.max(1.2, Math.min(availW / boxW, availH / boxH));
  L.S = S; L.rot = portrait;
  L.tw = tw * S; L.th = th * S;
  L.ox = (W - boxW * S) / 2 + FRAME * S;
  L.oy = HUD + Math.max(0, (availH - boxH * S) / 2) + FRAME * S;
  L.meter.x = L.ox; L.meter.y = L.oy + L.th + FRAME * S + 8;
  L.meter.w = L.tw; L.meter.h = 10;
  L.msgY = L.meter.y + L.meter.h + 16;
}
function toScreen(tx, ty) {
  if (!L.rot) return { x: L.ox + tx * L.S, y: L.oy + ty * L.S };
  return { x: L.ox + (TH - ty) * L.S, y: L.oy + tx * L.S };
}
function toTable(sx, sy) {
  if (!L.rot) return { x: (sx - L.ox) / L.S, y: (sy - L.oy) / L.S };
  return { x: (sy - L.oy) / L.S, y: TH - (sx - L.ox) / L.S };
}
function resize() {
  var w = Math.max(240, stage.clientWidth || window.innerWidth);
  var h = Math.max(240, stage.clientHeight || window.innerHeight);
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.w = w; view.h = h; view.dpr = dpr;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  layout();
}

var ptr = { id: -1, mode: '' };
cv.addEventListener('pointerdown', function (e) {
  initAudio();
  if (!humanTurn() || G.phase === 'shooting') return;
  var t = toTable(e.clientX, e.clientY);
  ptr.id = e.pointerId;
  if (G.phase === 'ballinhand') {
    ptr.mode = 'hand';
    tryPlaceCue(t.x, t.y);
  } else {
    var dx = t.x - cue.x, dy = t.y - cue.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    ptr.mode = d < R * 4.5 ? 'sling' : 'aim';
    applyPointerAim(t);
  }
  e.preventDefault();
}, { passive: false });
cv.addEventListener('pointermove', function (e) {
  if (e.pointerId !== ptr.id) return;
  var t = toTable(e.clientX, e.clientY);
  if (ptr.mode === 'hand') tryPlaceCue(t.x, t.y);
  else applyPointerAim(t);
  e.preventDefault();
}, { passive: false });
window.addEventListener('pointerup', function (e) {
  if (e.pointerId !== ptr.id) return;
  if (ptr.mode === 'sling' && G.power > 0.03 && humanTurn() && G.phase === 'aim') { shootNow(G.power); G.power = 0; }
  else if (ptr.mode === 'hand' && G.phase === 'ballinhand') { G.phase = 'aim'; sfx.place(); say('BALL IN HAND PLACED', '#8effc1'); }
  ptr.id = -1; ptr.mode = '';
});

function applyPointerAim(t) {
  var dx = t.x - cue.x, dy = t.y - cue.y;
  if (Math.abs(dx) < 1e-6 && Math.abs(dy) < 1e-6) return;
  if (ptr.mode === 'sling') {
    G.aim = Math.atan2(-dy, -dx);
    var d = Math.sqrt(dx * dx + dy * dy);
    G.power = clamp((d - R * 1.4) / 26, 0, 1);
  } else {
    G.aim = Math.atan2(dy, dx);
  }
}
function tryPlaceCue(x, y) {
  x = clamp(x, R + 0.1, TW - R - 0.1);
  y = clamp(y, R + 0.1, TH - R - 0.1);
  if (G.isBreak) x = Math.min(x, HEAD - R * 0.2);

  if (k === 'm') { setMuted(!muted); return; }
  if (k === 'p' || k === 'escape') { if (G.state === 'play' || G.state === 'pause') togglePause(); return; }
  if (G.state === 'title' && (k === ' ' || k === 'enter')) { startGame('cpu', G.strength); return; }
  if (G.state === 'over' && (k === ' ' || k === 'enter' || k === 'r')) { startGame(G.mode, G.strength); return; }
  if (G.state !== 'play') return;

  keys[k] = 1;
  if (!humanTurn()) return;
  if (k === 'c') { G.spin.x = 0; G.spin.y = 0; updateSpinDot(); return; }
  if (k === 'w' || k === 's' || k === 'a' || k === 'd') { nudgeSpin(k); return; }

function nudgeSpin(k) {
  var st = 0.12;
  if (k === 'w') G.spin.y -= st;
  if (k === 's') G.spin.y += st;
  if (k === 'a') G.spin.x -= st;
  if (k === 'd') G.spin.x += st;
  var m = Math.sqrt(G.spin.x * G.spin.x + G.spin.y * G.spin.y);
  if (m > 0.5) { G.spin.x *= 0.5 / m; G.spin.y *= 0.5 / m; }
  updateSpinDot();
}
window.addEventListener('blur', function () { if (G.state === 'play') togglePause(); keys = {}; fineDir = 0; G.charging = false; });
document.addEventListener('visibilitychange', function () { if (document.hidden && G.state === 'play') togglePause(); });

/* --- gamepad -------------------------------------------------------------- */
var padPrevAny = false, padPrevA = false, padPrevStart = false;
function pollPad() {
  var list = navigator.getGamepads ? navigator.getGamepads() : null;
  if (!list) return;
  var gp = null;
  for (var i = 0; i < list.length; i++) if (list[i] && list[i].connected) { gp = list[i]; break; }
  if (!gp) return;
  var ax = gp.axes || [], bt = gp.buttons || [];
  function pr(i) { var b = bt[i]; return !!b && (b.pressed || b.value > 0.4); }
  var a0 = ax[0] || 0, a1 = ax[1] || 0, a2 = ax[2] || 0, a3 = ax[3] || 0;
  if (G.state === 'play' && humanTurn()) {
    if (Math.abs(a0) > 0.25 || Math.abs(a1) > 0.25) {
      if (G.phase === 'ballinhand') tryPlaceCue(cue.x + a0 * 0.7, cue.y + a1 * 0.7);
      else if (G.phase === 'aim') G.aim += (Math.abs(a0) > 0.9 ? a0 * 0.035 : a0 * 0.012);
    }
    if (Math.abs(a2) > 0.2 || Math.abs(a3) > 0.2) {
      G.spin.x = clamp(a2 * 0.5, -0.5, 0.5); G.spin.y = clamp(a3 * 0.5, -0.5, 0.5);
      var m = Math.sqrt(G.spin.x * G.spin.x + G.spin.y * G.spin.y);
      if (m > 0.5) { G.spin.x *= 0.5 / m; G.spin.y *= 0.5 / m; }
      updateSpinDot();
    }
    if (pr(0) && !padPrevA) startCharge();
    if (!pr(0) && padPrevA) releaseCharge();
    if (pr(1) && !padPrevAny) { G.spin.x = 0; G.spin.y = 0; updateSpinDot(); }
    if (pr(14)) fineDir = -1; else if (pr(15)) fineDir = 1; else if (fineDir && !document.querySelector('.fine:active')) fineDir = 0;
  }
  padPrevA = pr(0);
  var any = false;
  for (var j = 0; j < bt.length; j++) if (pr(j)) { any = true; break; }
  if (any && !padPrevAny && (G.state === 'title' || G.state === 'over')) startGame(G.mode, G.strength);
  if (pr(9) && !padPrevStart && (G.state === 'play' || G.state === 'pause')) togglePause();
  padPrevStart = pr(9);
  padPrevAny = any;
}

document.getElementById('muteBtn').addEventListener('click', function () { initAudio(); setMuted(!muted); });
document.getElementById('pauseBtn').addEventListener('click', function () { if (G.state === 'play' || G.state === 'pause') togglePause(); });

/* ================================================================ update = */
var aimHold = 0;
function update(dt) {
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeA = 0; }
  for (var f = fx.length - 1; f >= 0; f--) { fx[f].t -= dt; if (fx[f].t <= 0) fx.splice(f, 1); }
  if (G.msgT > 0) G.msgT -= dt;
  if (G.bannerT > 0) G.bannerT -= dt;
  for (var i = 0; i <= 15; i++) if (!balls[i].active && balls[i].potT < 1) balls[i].potT += dt * 2.5;
  if (G.state !== 'play') return;

  if (G.phase === 'shooting') {
    G.shotT += dt;
    if (G.shotT > 9) {
      var bleed = G.shotT > 13 ? 0.80 : 0.965;
      for (var q = 0; q <= 15; q++) { var b = balls[q]; b.vx *= bleed; b.vy *= bleed; if (speed(b) < 3.5) { b.vx = 0; b.vy = 0; } }
    }
    simulate(dt);
    if (!anyMoving()) resolveShot();
    return;
  }

  aiTick(dt);

  if (humanTurn() && G.phase === 'ballinhand') {
    var hx = (keys['arrowright'] ? 1 : 0) - (keys['arrowleft'] ? 1 : 0);
    var hy = (keys['arrowdown'] ? 1 : 0) - (keys['arrowup'] ? 1 : 0);
    if (hx || hy) tryPlaceCue(cue.x + hx * 26 * dt, cue.y + hy * 26 * dt);
  }
  if (humanTurn() && G.phase === 'aim') {
    var fine = keys['shift'] ? 1 : 0;
    var dir = 0;
    if (keys['arrowleft']) dir -= 1;
    if (keys['arrowright']) dir += 1;
    if (fineDir) { dir = fineDir; fine = 1; }
    if (dir) {
      aimHold += dt;
      var rate = fine ? 0.09 : (0.5 + Math.min(aimHold, 1.2) * 1.5);
      G.aim += dir * rate * dt;
    } else aimHold = 0;
    if (keys['arrowup']) { G.spin.y -= dt * 0.7; clampSpin(); }
    if (keys['arrowdown']) { G.spin.y += dt * 0.7; clampSpin(); }
  }

  if (G.charging) {
    G.power = Math.min(1, G.power + dt / 1.3);
    shootFill.style.height = Math.round(G.power * 100) + '%';
    if (Math.random() < 0.25) sfx.charge(G.power);
  }
}
function clampSpin() {
  var m = Math.sqrt(G.spin.x * G.spin.x + G.spin.y * G.spin.y);
  if (m > 0.5) { G.spin.x *= 0.5 / m; G.spin.y *= 0.5 / m; }
  updateSpinDot();
}

/* ================================================================ render = */
var BCOL = ['#f4f7ff', '#f2c231', '#3a78d8', '#d23b3b', '#8a5cd0', '#e2792a', '#2fa564', '#a2384a', '#191d2b',
            '#f2c231', '#3a78d8', '#d23b3b', '#8a5cd0', '#e2792a', '#2fa564', '#a2384a'];

function drawTable(t) {
  /* rail frame */
  ctx.fillStyle = '#141a2e';
  ctx.beginPath();
  ctx.roundRect(-FRAME, -FRAME, TW + FRAME * 2, TH + FRAME * 2, 2.2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(125,226,255,0.16)';
  ctx.lineWidth = 0.22;
  ctx.stroke();

  /* felt = board substrate */
  ctx.fillStyle = '#0e3b2c';
  ctx.beginPath();
  ctx.rect(-1.2, -1.2, TW + 2.4, TH + 2.4);
  ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.rect(-1.2, -1.2, TW + 2.4, TH + 2.4); ctx.clip();
  ctx.strokeStyle = 'rgba(126,255,196,0.055)';
  ctx.lineWidth = 0.18;
  for (var gx = 0; gx <= TW; gx += 6.25) { ctx.beginPath(); ctx.moveTo(gx, -1); ctx.lineTo(gx, TH + 1); ctx.stroke(); }
  for (var gy = 0; gy <= TH; gy += 6.25) { ctx.beginPath(); ctx.moveTo(-1, gy); ctx.lineTo(TW + 1, gy); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(126,255,196,0.10)';
  ctx.lineWidth = 0.3;
  for (var tr = 0; tr < 7; tr++) {
    var y0 = 5 + tr * 6.6;
    ctx.beginPath();
    ctx.moveTo(6, y0); ctx.lineTo(30 + tr * 3, y0);
    ctx.lineTo(38 + tr * 3, y0 + (tr % 2 ? 4 : -4));
    ctx.lineTo(TW - 8, y0 + (tr % 2 ? 4 : -4));
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(126,255,196,0.13)';
  for (var vi = 0; vi < 16; vi++) {
    var vx = 8 + (vi * 37) % (TW - 16), vy = 4 + (vi * 23) % (TH - 8);
    ctx.beginPath(); ctx.arc(vx, vy, 0.42, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* head string + foot spot */
  ctx.strokeStyle = 'rgba(234,242,255,0.13)';
  ctx.lineWidth = 0.16;
  ctx.beginPath(); ctx.moveTo(HEAD, 0); ctx.lineTo(HEAD, TH); ctx.stroke();
  ctx.fillStyle = 'rgba(234,242,255,0.28)';
  ctx.beginPath(); ctx.arc(FOOTX, FOOTY, 0.35, 0, TAU); ctx.fill();

  /* cushions */
  ctx.fillStyle = '#1d5a42';
  for (var c = 0; c < CUSH.length; c++) {
    var s = CUSH[c];
    if (s.ax === 1) {
      var yy = s.pos === 0 ? -1.5 : TH;
      ctx.fillRect(s.lo, yy, s.hi - s.lo, 1.5);
    } else {
      var xx = s.pos === 0 ? -1.5 : TW;
      ctx.fillRect(xx, s.lo, 1.5, s.hi - s.lo);
    }
  }
  /* diamonds */
  ctx.fillStyle = 'rgba(255,204,77,0.75)';
  for (var d1 = 1; d1 <= 7; d1++) {
    if (d1 === 4) continue;
    var dx = d1 * TW / 8;
    ctx.beginPath(); ctx.arc(dx, -2.35, 0.42, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(dx, TH + 2.35, 0.42, 0, TAU); ctx.fill();
  }
  for (var d2 = 1; d2 <= 3; d2++) {
    var dy = d2 * TH / 4;
    ctx.beginPath(); ctx.arc(-2.35, dy, 0.42, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(TW + 2.35, dy, 0.42, 0, TAU); ctx.fill();
  }

  /* pockets */
  for (var p = 0; p < POCKETS.length; p++) {
    var pk = POCKETS[p];
    var ox = pk.corner ? (pk.x === 0 ? -0.9 : 0.9) : 0;
    var oy = pk.corner ? (pk.y === 0 ? -0.9 : 0.9) : (pk.y === 0 ? -0.7 : 0.7);
    var rr = pk.corner ? 3.05 : 2.75;
    ctx.fillStyle = '#05070f';
    ctx.beginPath(); ctx.arc(pk.x + ox, pk.y + oy, rr, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(125,226,255,0.28)';
    ctx.lineWidth = 0.22;
    ctx.stroke();
  }
  /* jaw nubs */
  ctx.fillStyle = '#1d5a42';
  for (var j = 0; j < JAWS.length; j++) {
    ctx.beginPath(); ctx.arc(JAWS[j].x, JAWS[j].y, JAWS[j].r, 0, TAU); ctx.fill();
  }
}

function drawBall(b, t) {
  var col = BCOL[b.n];
  var stripe = b.n > 8;
  ctx.save();
  ctx.translate(b.x, b.y);
  /* shadow */
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.arc(0.22, 0.28, R, 0, TAU); ctx.fill();
  if (stripe) {
    ctx.fillStyle = '#f4f7ff';
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.clip();
    ctx.fillStyle = col;
    ctx.fillRect(-R, -R * 0.55, R * 2, R * 1.1);
    ctx.restore();
  } else {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  }
  if (b.n !== 0) {
    ctx.fillStyle = '#f7fbff';
    ctx.beginPath(); ctx.arc(0, 0, R * 0.46, 0, TAU); ctx.fill();
    if (R * L.S > 6.4) {
      /* the whole table is rotated in portrait — spin the numeral back upright */
      ctx.save();
      if (L.rot) ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = '#131826';
      ctx.font = '800 ' + (R * (b.n > 9 ? 0.60 : 0.70)) + 'px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(b.n), 0, R * 0.045);
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
    }
  }
  /* specular */
  var g = ctx.createRadialGradient(-R * 0.33, -R * 0.36, R * 0.05, -R * 0.2, -R * 0.22, R * 1.05);
  g.addColorStop(0, 'rgba(255,255,255,0.62)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.10)');
  g.addColorStop(1, 'rgba(0,0,0,0.30)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = 0.12;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawAim(t) {
  if (G.phase === 'shooting' || G.state !== 'play') return;
  if (!cue.active) return;
  var dx = Math.cos(G.aim), dy = Math.sin(G.aim);
  var hit = ray(cue.x, cue.y, dx, dy);
  var gx = cue.x + dx * hit.t, gy = cue.y + dy * hit.t;
  var mine = !G.cpu[G.turn];

  ctx.save();
  ctx.lineCap = 'round';
  ctx.setLineDash([1.5, 1.4]);
  ctx.lineWidth = 0.24;
  ctx.strokeStyle = mine ? 'rgba(255,255,255,0.85)' : 'rgba(255,204,77,0.7)';
  ctx.beginPath(); ctx.moveTo(cue.x, cue.y); ctx.lineTo(gx, gy); ctx.stroke();
  ctx.setLineDash([]);

  /* ghost ball at first contact */
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 0.2;
  ctx.beginPath(); ctx.arc(gx, gy, R, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath(); ctx.arc(gx, gy, R, 0, TAU); ctx.fill();

  if (hit.ball) {
    var ox = hit.ball.x - gx, oy = hit.ball.y - gy;
    var od = Math.sqrt(ox * ox + oy * oy) || 1;
    var ux = ox / od, uy = oy / od;
    var legal = legalFirst(hit.ball.n, G.turn, onEight(G.turn));
    ctx.strokeStyle = legal ? 'rgba(126,255,196,0.9)' : 'rgba(255,107,107,0.9)';
    ctx.lineWidth = 0.28;
    ctx.beginPath();
    ctx.moveTo(hit.ball.x, hit.ball.y);
    ctx.lineTo(hit.ball.x + ux * 16, hit.ball.y + uy * 16);
    ctx.stroke();
    /* the 90-degree rule: where the cue ball goes */
    var tx = -uy, ty = ux;
    var side = (dx * tx + dy * ty) > 0 ? 1 : -1;
    ctx.strokeStyle = 'rgba(125,226,255,0.55)';
    ctx.lineWidth = 0.2;
    ctx.setLineDash([1, 1.2]);
    ctx.beginPath();
    ctx.moveTo(gx, gy);
    ctx.lineTo(gx + tx * side * 9, gy + ty * side * 9);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawHandGhost() {
  if (G.phase !== 'ballinhand') return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,204,77,0.85)';
  ctx.lineWidth = 0.25;
  ctx.setLineDash([1.2, 1.2]);
  ctx.beginPath(); ctx.arc(cue.x, cue.y, R * 2.1, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  if (G.isBreak) {
    ctx.strokeStyle = 'rgba(255,204,77,0.35)';
    ctx.lineWidth = 0.2;
    ctx.beginPath(); ctx.moveTo(HEAD, 0); ctx.lineTo(HEAD, TH); ctx.stroke();
  }
  ctx.restore();
}

function ballChip(x, y, n, r, dim) {
  ctx.save();
  ctx.globalAlpha = dim ? 0.25 : 1;
  var stripe = n > 8;
  ctx.fillStyle = stripe ? '#f4f7ff' : BCOL[n];
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  if (stripe) {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
    ctx.fillStyle = BCOL[n];
    ctx.fillRect(x - r, y - r * 0.55, r * 2, r * 1.1);
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  var W = view.w;
  ctx.textAlign = 'left';
  for (var p = 0; p < 2; p++) {
    var y = 16 + p * 22;
    var act = (p === G.turn && G.state === 'play');
    ctx.font = '800 12px "Segoe UI", sans-serif';
    ctx.fillStyle = act ? '#ffcc4d' : 'rgba(234,242,255,0.5)';
    ctx.fillText((act ? '▸ ' : '  ') + shortSeat(p), 12, y + 4);
    ctx.font = '700 9px "Segoe UI", sans-serif';
    ctx.fillStyle = act ? 'rgba(234,242,255,0.8)' : 'rgba(234,242,255,0.35)';
    ctx.fillText(G.groups[p] ? groupLabel(G.groups[p]) : 'OPEN', 78, y + 3);
    var g = G.groups[p];
    var startN = g === 'stripe' ? 9 : 1;
    var narrow = W < 400;
    var cx0 = narrow ? 130 : 140, csp = narrow ? 11 : 13, crr = narrow ? 4.2 : 5;
    if (g) {
      for (var i = 0; i < 7; i++) {
        var n = startN + i;
        ballChip(cx0 + i * csp, y, n, crr, !balls[n].active);
      }
      if (remaining(g) === 0) ballChip(cx0 + 7 * csp, y, 8, crr, !balls[8].active);
    }
  }
  /* message line, kept clear of the top-right icon block */
  if (G.msgT > 0 && G.msg) {
    ctx.globalAlpha = clamp(G.msgT, 0, 1);
    ctx.font = '800 11px "Segoe UI", sans-serif';
    ctx.fillStyle = G.msgCol;
    ctx.textAlign = 'center';
    ctx.fillText(G.msg, W / 2, L.msgY);
    ctx.globalAlpha = 1;
  }

  /* power meter under the table */
  var m = L.meter;
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.roundRect(m.x, m.y, m.w, m.h, 5); ctx.fill();
  var pw = m.w * clamp(G.power, 0, 1);
  var gr = ctx.createLinearGradient(m.x, 0, m.x + m.w, 0);
  gr.addColorStop(0, '#7de2ff'); gr.addColorStop(0.55, '#ffcc4d'); gr.addColorStop(1, '#ff6b6b');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.roundRect(m.x, m.y, Math.max(0, pw), m.h, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1;
  for (var tk = 1; tk < 4; tk++) {
    var tx2 = m.x + m.w * tk / 4;
    ctx.beginPath(); ctx.moveTo(tx2, m.y); ctx.lineTo(tx2, m.y + m.h); ctx.stroke();
  }
  ctx.font = '800 9px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(234,242,255,0.7)';
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(G.power * 100) + '%', m.x + m.w, m.y - 3);
  ctx.textAlign = 'left';
  ctx.fillText('POWER', m.x, m.y - 3);

  /* open-table call chip */
  if (G.open && !G.isBreak && G.state === 'play') {
    ctx.textAlign = 'center';
    ctx.font = '800 10px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,204,77,0.92)';
    ctx.fillText('OPEN · CALLING ' + groupLabel(currentCall()), m.x + m.w / 2, m.y - 3);
    ctx.textAlign = 'left';
  }

  if (G.bannerT > 0 && G.banner) {
    ctx.save();
    ctx.globalAlpha = clamp(G.bannerT / 1.6, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.round(clamp(view.w * 0.045, 18, 34)) + 'px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ffcc4d';
    ctx.shadowColor = 'rgba(255,204,77,0.6)'; ctx.shadowBlur = 18;
    ctx.fillText(G.banner, view.w / 2, L.oy + L.th / 2);
    ctx.restore();
  }
}

function render(t) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#0b0f1e';
  ctx.fillRect(0, 0, view.w, view.h);
  if (G.state === 'title') return;

  ctx.save();
  if (shakeA > 0.01) {
    ctx.translate((Math.random() - 0.5) * shakeA, (Math.random() - 0.5) * shakeA);
    shakeA *= 0.9;
  }
  ctx.save();
  if (L.rot) { ctx.translate(L.ox + TH * L.S, L.oy); ctx.rotate(Math.PI / 2); }
  else ctx.translate(L.ox, L.oy);
  ctx.scale(L.S, L.S);

  drawTable(t);
  drawHandGhost();
  drawAim(t);
  for (var i = 15; i >= 0; i--) if (balls[i].active) drawBall(balls[i], t);

  for (var f = 0; f < fx.length; f++) {
    var e = fx[f];
    ctx.globalAlpha = clamp(e.t * 3, 0, 0.6);
    ctx.strokeStyle = e.c; ctx.lineWidth = 0.18;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1.6 - e.t * 2), 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.restore();
  drawHUD();
}

/* ================================================================== loop = */
var lastT = 0, timeAcc = 0;
function frame(now) {
  window.requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  var raw = (now - lastT) / 1000;
  lastT = now;
  if (raw > 0.05) raw = 0.05;
  if (raw < 0) raw = 0;
  pollPad();
  timeAcc += raw;
  update(raw);
  render(timeAcc);
}

/* ============================================================ debug hooks = */
window.BREAK_DEBUG = {
  G: G, balls: balls, DBG: DBG,
  TW: TW, TH: TH, R: R, D: D, MAXV: MAXV, POCKETS: POCKETS, CUSH: CUSH,
  setSeed: setSeed,
  toScreen: function (x, y) { return toScreen(x, y); },
  toTable: function (x, y) { return toTable(x, y); },
  start: function (mode, s1, s2, seed) {
    if (seed !== undefined) setSeed(seed);
    startGame(mode || 'cpu', s1 || 'kernel');
    if (s2 !== undefined) { G.cpu = [s1 === null ? null : s1, s2]; if (s1) G.mode = 'two'; }
    return true;
  },
  /* drop the balls exactly where a rule test needs them */
  setup: function (cfg) {
    for (var i = 0; i <= 15; i++) {
      var b = balls[i];
      b.active = false; b.vx = b.vy = b.wx = b.wy = b.wz = 0; b.pocket = -1; b.potT = 1;
    }
    cue.active = true; cue.x = cfg.cue[0]; cue.y = cfg.cue[1]; cue.potT = 1;
    for (var k = 0; k < cfg.balls.length; k++) {
      var s = cfg.balls[k];
      var bb = balls[s[0]];
      bb.active = true; bb.x = s[1]; bb.y = s[2]; bb.potT = 1;
    }
    if (cfg.turn !== undefined) G.turn = cfg.turn;
    if (cfg.groups !== undefined) G.groups = cfg.groups.slice();
    if (cfg.call !== undefined) G.call = cfg.call.slice();
    G.open = G.groups[0] === null && G.groups[1] === null;
    G.isBreak = !!cfg.isBreak;
    G.cpu = cfg.cpu !== undefined ? cfg.cpu.slice() : [null, null];
    G.mode = cfg.mode || 'two';
    G.state = 'play';
    G.phase = 'aim';
    G.winner = -1; G.overReason = '';
    G.msg = ''; G.msgT = 0;
    document.body.classList.add('playing');
    hideOverlay();
    return true;
  },
  shoot: function (aim, power, sx, sy) {
    G.aim = aim; G.spin.x = sx || 0; G.spin.y = sy || 0; updateSpinDot();
    shootNow(power);
    return true;
  },
  aimAt: function (x, y) { G.aim = Math.atan2(y - cue.y, x - cue.x); return G.aim; },
  bestShot: function () {
    var l = findShots(G.turn, cue.x, cue.y);
    if (!l.length) return null;
    return { aim: l[0].aim, ball: l[0].ball, pocket: l[0].pocket, cd: l[0].cd, od: l[0].od };
  },
  fastForward: function (seconds, step) {
    var h = step || 1 / 120, n = Math.ceil(seconds / h);
    for (var i = 0; i < n; i++) { update(h); if (G.state === 'over') break; }
    return { state: G.state, phase: G.phase, winner: G.winner };
  },
  settle: function (maxSeconds) {
    var t = 0, h = 1 / 120;
    while (G.phase === 'shooting' && t < (maxSeconds || 20)) { update(h); t += h; }
    return t;
  },
  snapshot: function () {
    var out = { state: G.state, phase: G.phase, turn: G.turn, open: G.open, isBreak: G.isBreak,
      groups: G.groups.slice(), winner: G.winner, reason: G.overReason, msg: G.msg,
      cue: [cue.x, cue.y, cue.active], shots: G.shots, run: G.run.slice(), cleared: G.cleared.slice(), balls: [] };
    for (var i = 0; i <= 15; i++) out.balls.push({ n: i, x: balls[i].x, y: balls[i].y, active: balls[i].active });
    return out;
  },
  strict: function (on) { DBG.strict = !!on; return DBG; },
  resetDbg: function () { DBG.worstOverlap = 0; DBG.worstOutside = 0; DBG.worstKEGain = 0; DBG.keEvents = 0; DBG.collisions = 0; DBG.cushions = 0; return DBG; },
  rack: rack,
  muteAll: function () { setMuted(true); }
};

/* ================================================================== boot = */
resize();
if (window.ResizeObserver) {
  try { new window.ResizeObserver(resize).observe(stage); } catch (e) {}
}
setMuted(muted);
updateSpinDot();
titleScreen();
window.requestAnimationFrame(frame);
</script>
