<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Solve — Pre-Algebra &amp; Algebra</title>
<meta name="theme-color" content="#0b0f1e">
<meta name="description" content="An algebra tutor for the Overclock arcade. Eight rungs from order of operations to equations with brackets, fractions and word problems. It finds your level by playing, and when you slip it names the rule and works the whole thing through, line by line.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solve">
<meta name="format-detection" content="telephone=no">
<style>
  :root {
    --bg: #0b0f1e;
    --accent: #ffcc4d;
    --fg: #eaf0ff;
    --dim: rgba(234,240,255,0.62);
    --panel: rgba(18,24,44,0.78);
    --line: rgba(234,240,255,0.14);
    --good: #63e2a8;
    --cool: #6fd8ff;
    --warn: #ff9f6e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: manipulation;
  }
  #stage { position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(38,52,102,0.55), rgba(11,15,30,0)),
      var(--bg); }
  canvas#bg { position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; z-index: 0; opacity: 0.34; pointer-events: none; }

  #topbtns {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    right: max(8px, env(safe-area-inset-right));
    display: flex; gap: 6px; z-index: 8;
  }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line);
    font-family: inherit; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .iconbtn:active { background: rgba(255,204,77,0.22); }
  body:not(.playing) #topbtns { display: none; }

  /* ------------------------------------------------------------ play UI -- */
  #play {
    position: absolute; inset: 0; display: none; flex-direction: column;
    padding: max(7px, env(safe-area-inset-top)) max(9px, env(safe-area-inset-right))
             max(9px, env(safe-area-inset-bottom)) max(9px, env(safe-area-inset-left));
    z-index: 2;
  }
  body.playing #play { display: flex; }

  #head { flex: none; display: flex; align-items: center; gap: 9px;
          height: 46px; padding-right: 104px; }
  .hbtn { height: 40px; min-width: 62px; padding: 0 11px; border-radius: 10px;
    background: rgba(255,204,77,0.10); border: 1px solid rgba(255,204,77,0.42);
    color: var(--accent); font-family: inherit; font-size: 10px; font-weight: 700;
    letter-spacing: 0.14em; cursor: pointer; }
  .hbtn:active { background: rgba(255,204,77,0.26); }
  #hinfo { flex: 1; min-width: 0; }
  #hname { display: flex; justify-content: space-between; gap: 8px;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--dim); white-space: nowrap; overflow: hidden; }
  #hname i { font-style: normal; overflow: hidden; text-overflow: ellipsis; }
  #hname b { color: var(--accent); flex: none; }
  #hbar { height: 6px; border-radius: 3px; background: rgba(234,240,255,0.10);
    margin-top: 6px; overflow: hidden; }
  #hbar i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--cool), var(--accent)); }

  #body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
    width: 100%; max-width: 980px; margin: 0 auto; }
  #work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* With nothing in the panel there is no reason to leave a hole in the middle
     of a phone screen — the question rides up into the space instead. */
  #work.blank { justify-content: center; }
  #work.blank #panel { flex: 0 0 auto; }
  #qtext { flex: none; display: none; font-size: 14px; line-height: 1.42;
    color: var(--fg); background: rgba(111,216,255,0.07);
    border: 1px solid rgba(111,216,255,0.26); border-left-width: 3px;
    border-radius: 9px; padding: 8px 11px; margin-bottom: 6px; text-align: left; }
  #qtext.on { display: block; }
  #qline { flex: none; text-align: center; line-height: 1.15;
    font-size: clamp(23px, 6.4vw, 40px); font-weight: 700; letter-spacing: 0.02em;
    padding: 2px 0; font-variant-numeric: tabular-nums; word-break: break-word; }
  #ansline { flex: none; text-align: center; line-height: 1.1;
    font-size: clamp(20px, 5.4vw, 31px); font-weight: 700; color: var(--dim);
    padding: 2px 0 4px; font-variant-numeric: tabular-nums; }
  #ansline.off { display: none; }
  #slot { color: var(--accent); display: inline-block; min-width: 1.6em;

  #panel { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    text-align: left; padding: 2px 1px; }
  #panel::-webkit-scrollbar { width: 5px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(234,240,255,0.18); border-radius: 3px; }
  .rulehead { border: 1px solid rgba(255,159,110,0.42); background: rgba(255,159,110,0.10);
    border-radius: 10px; padding: 8px 11px; margin-bottom: 7px; }
  .rulehead b { display: block; color: var(--warn); font-size: 11px;

  .rulehead span { font-size: 13px; line-height: 1.42; color: var(--fg); }
  .sline { display: flex; align-items: baseline; gap: 10px; padding: 5px 9px;
    border-radius: 9px; margin-bottom: 5px; background: rgba(234,240,255,0.05);
    border: 1px solid var(--line); }
  .sline.now { border-color: rgba(255,204,77,0.55); background: rgba(255,204,77,0.10); }
  .sline b { flex: none; font-size: clamp(15px, 4vw, 20px); font-weight: 700;
    color: var(--fg); font-variant-numeric: tabular-nums; min-width: 5em; }
  .sline em { flex: 1; min-width: 0; font-style: normal; font-size: 11.5px;

  .sline em u { text-decoration: none; color: var(--cool); }
  .hline { display: flex; gap: 9px; padding: 7px 10px; border-radius: 9px;

    border: 1px solid rgba(111,216,255,0.3); font-size: 13px; line-height: 1.38; }
  .hline i { flex: none; font-style: normal; color: var(--cool); font-weight: 700;

  #entry { flex: none; width: 100%; max-width: 400px; margin: 0 auto; }
  #hintrow { display: flex; gap: 8px; margin-bottom: 7px; }
  #hintrow.off { display: none; }
  .hintbtn { flex: 1; height: 42px; min-height: 40px; border-radius: 10px;

  .hintbtn:active { background: rgba(111,216,255,0.26); }
  .hintbtn.dead { opacity: 0.42; }
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .key { height: 50px; min-height: 44px; border-radius: 11px;

    color: var(--fg); font-family: inherit; font-size: 22px; font-weight: 700;

  .key:active { background: rgba(255,204,77,0.20); }
  .key.act { background: rgba(255,204,77,0.13); border-color: rgba(255,204,77,0.45);

  .key.sel { box-shadow: 0 0 0 2px var(--accent) inset; }
  #choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .ch { min-height: 54px; border-radius: 11px; background: rgba(234,240,255,0.055);

  .ch:active { background: rgba(255,204,77,0.20); }
  .ch.sel { box-shadow: 0 0 0 2px var(--accent) inset; }
  .ch small { color: var(--dim); font-size: 10px; font-weight: 700; }
  #teachbtns { display: flex; gap: 8px; justify-content: center; }
  #pad.off, #choices.off, #teachbtns.off { display: none; }

  /* ------------------------------------------------------------ overlay -- */
  #overlay {
    position: absolute; inset: 0; z-index: 10; display: none;
    align-items: safe center; justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 90% at 50% 0%, rgba(20,28,58,0.86), rgba(6,9,18,0.96));
    overflow-y: auto;
  }
  #overlay.on { display: flex; }
  .card { width: min(600px, 100%); background: rgba(16,21,40,0.94);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.65); text-align: center; }
  .eyebrow { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--dim); }
  h1 { margin: 5px 0 2px; font-size: clamp(30px, 9vw, 52px); letter-spacing: 0.16em;

  .tagline { font-size: 12.5px; color: var(--dim); letter-spacing: 0.02em; margin-bottom: 10px; line-height: 1.45; }
  .keys { display: grid; grid-template-columns: 1fr; gap: 5px; font-size: 12.5px;

  .keys > div { display: flex; justify-content: space-between; gap: 10px;

  .keys span { color: var(--fg); font-weight: 700; }
  .btn { margin-top: 13px; display: inline-flex; align-items: center; justify-content: center;

    border: 1px solid rgba(255,204,77,0.55); background: rgba(255,204,77,0.14);

  .btn.ghost { border-color: var(--line); color: var(--fg); background: rgba(234,240,255,0.05); }
  .btnrow { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }
  .paused { font-size: clamp(24px, 7vw, 40px); font-weight: 700; letter-spacing: 0.3em;

  .slist { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 10px; text-align: left; }
  .srow { display: flex; align-items: center; gap: 8px; min-height: 46px;
    padding: 5px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(234,240,255,0.045); color: var(--fg); font-family: inherit;
    width: 100%; text-align: left; }
  .srow.cur { border-color: rgba(255,204,77,0.6); background: rgba(255,204,77,0.10); }
  .srow.above { opacity: 0.45; }
  .srow .sn { flex: 1; min-width: 0; font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; }
  .srow .sn em { display: block; font-style: normal; font-size: 9.5px; font-weight: 400;
    color: var(--dim); letter-spacing: 0.04em; margin-top: 2px; }
  .srow .sp { flex: none; font-size: 11px; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }
  .mini { height: 5px; border-radius: 3px; background: rgba(234,240,255,0.10);
    overflow: hidden; margin-top: 4px; }
  .mini i { display: block; height: 100%; background: linear-gradient(90deg, var(--cool), var(--accent)); }
  .weak { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 8px; }
  .weak b { font-weight: 700; font-size: 11.5px; padding: 5px 9px; border-radius: 8px;
    background: rgba(255,159,110,0.14); border: 1px solid rgba(255,159,110,0.36);
    color: #ffb08a; text-align: left; }
  .note { font-size: 11px; color: var(--dim); margin-top: 9px; line-height: 1.45; }
  .grid2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 7px 4px;
    background: rgba(234,240,255,0.04); }
  .stat b { display: block; font-size: 19px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  canvas.spark { width: 100%; height: 62px; display: block; margin-top: 8px;
    border: 1px solid var(--line); border-radius: 10px; background: rgba(234,240,255,0.03); }

  @media (max-height: 620px) {
    .card { padding: 12px 14px 12px; border-radius: 12px; }
    .keys { display: none; }
    .slist { grid-template-columns: repeat(2, 1fr); }
    .srow { min-height: 44px; }
    .tagline { margin-bottom: 6px; font-size: 11.5px; }
    .btn { margin-top: 10px; min-height: 44px; }
  }
  @media (max-height: 560px) {
    #head { height: 40px; }
    #body { flex-direction: row; gap: 10px; align-items: stretch; }
    #work { flex: 1; min-width: 0; }
    #entry { width: 206px; max-width: 206px; flex: none; margin: 0; align-self: stretch;
      display: flex; flex-direction: column; justify-content: center; }
    .key { height: 42px; min-height: 40px; font-size: 19px; }
    .key.act { font-size: 15px; }
    .ch { min-height: 44px; font-size: 16px; }
    .hintbtn { height: 40px; }
    #hintrow { margin-bottom: 5px; }
    #qline { font-size: clamp(20px, 4.2vw, 30px); }
    #ansline { font-size: clamp(17px, 3.6vw, 24px); }
    #qtext { font-size: 12.5px; padding: 6px 9px; margin-bottom: 4px; }
    #fb { min-height: 20px; font-size: 11px; }
    .sline b { font-size: clamp(14px, 3.2vw, 18px); }
    .sline em { font-size: 10.5px; }
    .hline { font-size: 11.5px; padding: 6px 9px; }
  }
  @media (max-height: 460px) {
    .slist { grid-template-columns: repeat(2, 1fr); gap: 5px; }
    .card .eyebrow { display: none; }
    h1 { font-size: clamp(26px, 7vw, 36px); }
    h2 { font-size: 18px; margin: 0 0 4px; }
    .tagline { font-size: 11px; margin-bottom: 5px; }
    .srow .sn em { display: none; }
    .srow .mini { display: none; }
    .srow { min-height: 40px; padding: 4px 8px; }
    .srow .sn { font-size: 10.5px; }
    .btn { min-height: 42px; margin-top: 8px; }
    .card { padding: 10px 12px 12px; }
    .note { font-size: 10px; margin-top: 5px; }
    .weak b { font-size: 10.5px; padding: 3px 7px; }
    .weak { margin-top: 5px; gap: 4px; }
    .btnrow { gap: 7px; }
    canvas.spark { height: 46px; }
    .stat b { font-size: 16px; }
    .grid2 { margin-top: 6px; gap: 5px; }
  }
  @media (max-width: 380px) {
    #head { padding-right: 100px; gap: 6px; }
    .hbtn { min-width: 58px; padding: 0 7px; letter-spacing: 0.08em; }
    #pad { gap: 5px; }
    .key { font-size: 20px; }
  }
</style>

<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="topbtns">
    <button class="iconbtn" id="muteBtn" type="button" aria-label="Mute">&#9835;</button>
    <button class="iconbtn" id="pauseBtn" type="button" aria-label="Pause">&#10073;&#10073;</button>
  </div>
  <div id="play">
    <div id="head">
      <button class="hbtn" id="menuBtn" type="button">MENU</button>
      <div id="hinfo">
        <div id="hname"><i id="hlabel">&nbsp;</i><b id="hstreak"></b></div>
        <div id="hbar"><i id="hfill"></i></div>
      </div>
    </div>
    <div id="body">
      <div id="work">
        <div id="qtext"></div>
        <div id="qline"></div>
        <div id="ansline"><span id="qpre"></span><span id="slot"></span></div>
        <div id="panel"></div>
        <div id="fb"></div>
      </div>
      <div id="entry">
        <div id="hintrow"><button class="hintbtn" id="hintBtn" type="button">HINT</button></div>
        <div id="pad"></div>
        <div id="choices" class="off"></div>
        <div id="teachbtns" class="off"></div>
      </div>
    </div>
  </div>
  <div id="overlay"></div>
</div>
<script>
/* =========================================================================
   SOLVE — the Overclock arcade's algebra tutor.  solve-overclock-v1-marker
   Built for a fourteen-year-old: eight rungs from order of operations up to
   equations with brackets, fractions and word problems.

   Three things make this different from a worksheet:
     1. Nobody picks a level.  It places him by playing, promotes on a real
        run, demotes fast on misses, and quietly probes one rung up so he
        can never be stuck low.  The found rung is resumed, never re-earned.
     2. Getting one wrong is never a bare X.  It names the RULE he broke,
        recognises the specific wrong answer where it can (a sign slip and
        an order-of-operations slip get different words), and then walks the
        whole solution one line at a time, each line saying what was done
        and why.
     3. HINT gives the NEXT STEP, never the answer.

   Every question is generated.  Every answer is an exact rational, so
   "clean answer" is a guarantee rather than a hope.
   One file, no dependencies, no assets, all sound synthesized.
   ========================================================================= */
"use strict";

var SOLVE_MARKER = 'solve-overclock-v1-marker';
var K_SAVE = 'solve_v1';
var K_MUTE = 'solve_muted_v1';
var SET_LEN = 8;             /* items per set — he can stop after any set */

/* ---------------------------------------------------------------- utils -- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function loadStr(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function saveStr(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
function isNum(v) { return typeof v === 'number' && isFinite(v); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* The random source is swappable so the ladder simulation can seed it. */
var RND = Math.random;
function setRandom(fn) { RND = fn || Math.random; }
function rnd() { return RND(); }
function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }      /* inclusive */
function pick(a) { return a[(rnd() * a.length) | 0]; }
function coin() { return rnd() < 0.5; }
function sgn1() { return coin() ? 1 : -1; }
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = (rnd() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ------------------------------------------------------------ rationals -- */
/* Everything numeric in this game is an exact fraction.  That is what makes
   "no ugly answers" a property rather than a wish, and it lets 0.5 and 1/2
   be recognised as the same answer without any floating-point slop. */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
function R(n, d) {
  if (d === undefined) d = 1;
  if (!isNum(n) || !isNum(d) || d === 0) return { n: 0, d: 1, bad: true };
  n = Math.round(n); d = Math.round(d);
  if (d < 0) { n = -n; d = -d; }
  var g = gcd(n, d) || 1;
  return { n: n / g, d: d / g };
}
function Radd(a, b) { return R(a.n * b.d + b.n * a.d, a.d * b.d); }
function Rsub(a, b) { return R(a.n * b.d - b.n * a.d, a.d * b.d); }
function Rmul(a, b) { return R(a.n * b.n, a.d * b.d); }
function Rdiv(a, b) { return b.n === 0 ? R(0, 1) : R(a.n * b.d, a.d * b.n); }
function Rneg(a) { return R(-a.n, a.d); }
function Req(a, b) { return !!a && !!b && a.n === b.n && a.d === b.d; }
function Rint(a) { return a.d === 1; }
function Rnum(a) { return a.n / a.d; }
/* Display: whole number if it is one, else a terminating decimal if that is
   short and exact, else a proper fraction. */
function Rstr(a) {
  if (!a) return '?';
  if (a.d === 1) return String(a.n);
  if (100 % a.d === 0) {
    var v = (a.n * (100 / a.d)) / 100;
    return String(v);
  }
  return a.n + '/' + a.d;
}
function Rhtml(a) { return esc(Rstr(a)); }

/* Parse what he typed.  Accepts  12   -7   0.5   3/4   -2/3 . */
function parseAns(s) {
  s = String(s == null ? '' : s).trim();
  if (!s) return null;
  var m = /^(-?)(\d+)\/(\d+)$/.exec(s);
  if (m) {
    var d = parseInt(m[3], 10);
    if (!d) return null;

/* ================================================================ RUNGS == */
/* Eight rungs, low floor and a real ceiling.  gate/probeHits are per rung so

var RUNGS = [
  { id: 'ord',   name: 'Order of operations',   short: 'ORDER OF OPS',   blurb: 'Brackets, powers, times and divide, then plus and minus.', gate: 5, probeHits: 2, mc: false },
  { id: 'neg',   name: 'Negative numbers',      short: 'NEGATIVES',      blurb: 'Adding, subtracting and multiplying below zero.',          gate: 5, probeHits: 2, mc: false },
  { id: 'sub',   name: 'Evaluate by substitution', short: 'SUBSTITUTION', blurb: 'Put the value in for x and work it out.',                 gate: 5, probeHits: 2, mc: false },
  { id: 'like',  name: 'Combining like terms',  short: 'LIKE TERMS',     blurb: 'Tidy an expression down to as few terms as possible.',     gate: 6, probeHits: 3, mc: true },
  { id: 'one',   name: 'One-step equations',    short: 'ONE-STEP',       blurb: 'One move gets x on its own.',                              gate: 5, probeHits: 2, mc: false },

/* ------------------------------------------------- little display helpers */
var MUL = '×', DIV = '÷', MINUS = '-';

function xterm(c, v) {

  if (c === -1) return '-' + v;
  return c + v;
}
/* " + 5" / " - 5" for a signed constant tacked onto an expression */
function addC(n) { return n < 0 ? ' - ' + (-n) : ' + ' + n; }
function addX(c, v) {

  return (c < 0 ? ' - ' : ' + ') + (a === 1 ? v : a + v);
}
/* a linear expression px + q written the way a person writes it */
function linTxt(p, q, v) {
  v = v || 'x';
  if (p === 0) return String(q);

function linPlain(p, q, v) {

function step(line, act, why) { return { line: line, act: act || '', why: why || '' }; }

/* ======================================================= the generators == */
/* Each returns a complete item.  The contract every one of them keeps:
     plain   an ASCII form of the question that an outside parser can read
     ansR    the exact answer as a rational
     steps   a worked solution whose LAST line states that same answer
     traps   specific wrong answers we can name
   The content audit re-derives ansR from plain with its own parser and
   checks the last step agrees, so a generator that lies fails loudly. */

function baseItem(o) {
  o.traps = o.traps || [];
  o.vars = o.vars || null;
  o.word = o.word || '';
  o.prefix = o.prefix || '=';
  o.kind = o.kind || 'expr';
  /* A "common wrong answer" that happens to BE the right answer would mark a
     correct answer wrong.  Coefficients collide often enough that this has to
     be enforced rather than hoped for. */
  if (o.ansR) {
    var keep = [], seen = {}, i;
    for (i = 0; i < o.traps.length; i++) {
      var tr = o.traps[i];
      if (!tr || !tr.r || tr.r.bad) continue;
      if (Req(tr.r, o.ansR)) continue;
      var k = tr.r.n + '/' + tr.r.d;
      if (seen[k]) continue;
      seen[k] = 1; keep.push(tr);
    }

  }

}

/* ---- rung 0: order of operations --------------------------------------- */
function genOrder() {
  var t = rnd(), a, b, c, d, ans, q, plain, steps, traps, rule;
  if (t < 0.20) {                       /* a + b x c */

    ans = a + b * c; rule = 'ord-md';
    q = a + ' + ' + b + ' ' + MUL + ' ' + c;
    plain = a + ' + ' + b + '*' + c;
    steps = [
      step(q, 'Start.', ''),
      step(a + ' + ' + (b * c), 'Do ' + b + ' ' + MUL + ' ' + c + ' first.', 'Multiplying outranks adding, so it goes first even though it is written second.'),
      step(String(ans), 'Now add.', 'Nothing outranks it any more.')
    ];
    traps = [{ r: R((a + b) * c), rule: 'ord-md', msg: 'You added ' + a + ' and ' + b + ' first, then multiplied. Left to right is only the tie-breaker &mdash; ' + MUL + ' beats + outright.' }];
  } else if (t < 0.36) {                /* a x b + c  and  a x b - c */
    a = ri(2, 9); b = ri(2, 9); c = ri(2, 20);
    var minus = coin() && a * b > c;
    ans = minus ? a * b - c : a * b + c; rule = 'ord-md';
    q = a + ' ' + MUL + ' ' + b + (minus ? ' - ' : ' + ') + c;
    plain = a + '*' + b + (minus ? ' - ' : ' + ') + c;
    steps = [
      step(q, 'Start.', ''),
      step((a * b) + (minus ? ' - ' : ' + ') + c, 'Do ' + a + ' ' + MUL + ' ' + b + ' first.', 'The product is one number; only then does the ' + (minus ? 'subtraction' : 'addition') + ' happen.'),
      step(String(ans), minus ? 'Now subtract.' : 'Now add.', '')
    ];
    traps = [{ r: R(minus ? a * (b - c) : a * (b + c)), rule: 'ord-md', msg: 'You worked the ' + (minus ? 'subtraction' : 'addition') + ' first. There are no brackets there, so ' + a + ' only multiplies the ' + b + '.' }];
  } else if (t < 0.54) {                /* (a + b) x c  and  c x (a - b) */

    var sub = coin() && a > b;
    var inner = sub ? a - b : a + b;
    ans = inner * c; rule = 'ord-br';

      step(q, 'Start.', ''),
      step(inner + ' ' + MUL + ' ' + c, 'Work out the bracket.', 'Brackets outrank everything. Nothing outside them happens until they are gone.'),
      step(String(ans), 'Multiply.', '')
    ];
    traps = [{ r: R(sub ? a - b * c : a + b * c), rule: 'ord-br', msg: 'You multiplied only the ' + b + ' by ' + c + '. The brackets say ' + c + ' multiplies the whole of ' + inner + '.' }];
  } else if (t < 0.70) {                /* a + b div c  and  b div c - a */

    rule = 'ord-md';
    q = first ? (a + ' + ' + b + ' ' + DIV + ' ' + c) : (b + ' ' + DIV + ' ' + c + ' - ' + a);

    steps = [
      step(q, 'Start.', ''),
      step(first ? (a + ' + ' + k) : (k + ' - ' + a), 'Do ' + b + ' ' + DIV + ' ' + c + ' first.', 'Dividing ranks with multiplying, above plus and minus.'),
      step(String(ans), first ? 'Now add.' : 'Now subtract.', '')

  } else if (t < 0.86) {                /* a + b x c - d, three ranks in one line */

      step(q, 'Start.', ''),
      step(a + ' + ' + (b * c) + ' - ' + d, 'Do the multiplication.', 'It is the only thing on the top rank, so it goes first.'),
      step((a + b * c) + ' - ' + d, 'Add, working left to right.', 'Plus and minus rank equally, so now order really is left to right.'),

/* ---- rung 1: negative numbers ------------------------------------------ */
function genNeg() {
  var t = rnd(), a, b, ans, q, plain, steps, traps, rule;
  if (t < 0.18) {                       /* -a + b */

    plain = (negA ? '-' + a : String(a)) + ' - (-' + b + ')';
    steps = [
      step(q, 'Start.', ''),
      step((negA ? '-' + a : String(a)) + ' + ' + b, 'Two minus signs together become a plus.', 'Taking away a debt of ' + b + ' leaves you ' + b + ' better off.'),
      step(String(ans), 'Now add.', '')
    ];
    traps = [{ r: R((negA ? -a : a) - b), rule: 'neg-sub', msg: 'You subtracted ' + b + '. There are two minus signs: - (-' + b + ') is + ' + b + '.' }];
  } else if (t < 0.66) {                /* -a - b */
    a = ri(2, 18); b = ri(2, 18);

    steps = [
      step(q, 'Start.', ''),
      step('start at -' + a + ', move ' + b + ' further left', 'Both moves go the same way, so they pile up.', ''),
      step(String(ans), 'Down ' + a + ' then down ' + b + ' is down ' + (a + b) + '.', '')

      step(q, 'Start.', ''),
      step(a + ' ' + MUL + ' ' + b + ' = ' + (a * b), 'Multiply the sizes first, ignoring signs.', ''),
      step(String(ans), bothNeg ? 'Two negatives: the answer is positive.' : 'One negative: the answer is negative.', 'Count the minus signs. An even number of them cancels out.')

    traps = [{ r: R(bothNeg ? -(a * b) : a * b), rule: 'neg-mul', msg: 'The size is right, the sign is not. ' + (bothNeg ? 'Two negatives multiply to a POSITIVE.' : 'One negative and one positive multiply to a NEGATIVE.') }];

      step(q, 'Start.', ''),
      step(a + ' ' + DIV + ' ' + b + ' = ' + k, 'Divide the sizes first.', ''),

/* ---- rung 2: evaluating by substitution -------------------------------- */
function genSub() {
  var t = rnd(), xv, yv, a, b, ans, q, plain, steps, traps, rule, given;
  function inBr(v) { return v < 0 ? '(' + v + ')' : String(v); }

    a = ri(2, 9); b = ri(-12, 14);
    ans = a * xv + b; rule = 'sub-par';
    q = linTxt(a, b); plain = linPlain(a, b);
    given = 'x = ' + xv;
    steps = [
      step(q, 'Start, with x = ' + xv + '.', ''),
      step(a + ' ' + MUL + ' ' + inBr(xv) + addC(b), 'Put ' + inBr(xv) + ' in wherever x appears.', 'Brackets around the value keep its sign safe.'),

      step(String(ans), (b < 0 ? 'Subtract.' : 'Add.'), '')

    if (xv < 0) traps.push({ r: R(-(a * Math.abs(xv)) - Math.abs(b)), rule: 'sub-par', msg: 'The x part is right but the ' + b + ' lost its sign on the way through.' });

    xv = ri(-7, 8); if (xv === 0) xv = -2;

/* ---- rung 3: combining like terms (the one multiple-choice rung) -------- */

    addOpt(P + C, 0, 0, 'Everything got swept into one x term. An x term and a plain number are different kinds of thing and can never merge.', 'like');

/* ------------------------------ shared machinery for solving a x + b = c -- */
function termTxtR(aR) {

}
function addCR(bR) { return bR.n < 0 ? ' - ' + Rstr(Rneg(bR)) : ' + ' + Rstr(bR); }

  opt = opt || {};

  var out = [], cur = cR;
  out.push(step(term + (bR.n === 0 ? '' : addCR(bR)) + ' = ' + Rstr(cR), 'Start.', opt.startWhy || ''));
  if (bR.n !== 0) {
    cur = Rsub(cR, bR);
    var v = Rstr(bR.n < 0 ? Rneg(bR) : bR);
    out.push(step(term + ' = ' + Rstr(cur),
      (bR.n < 0 ? 'Add ' + v + ' to both sides.' : 'Subtract ' + v + ' from both sides.'),
      'That clears the number sitting next to the x. <u>Both</u> sides, always &mdash; the equation is a balance.'));
  }
  if (opt.undoAct) {
    out.push(step('x = ' + Rstr(rootR), opt.undoAct, opt.undoWhy || ''));
  } else if (!Req(aR, R(1))) {
    out.push(step('x = ' + Rstr(rootR), 'Divide both sides by ' + Rstr(aR) + '.',
      'x was being multiplied by ' + Rstr(aR) + ', so dividing is what undoes it.'));
  }
  if (out[out.length - 1].line.indexOf('x =') !== 0) {
    out.push(step('x = ' + Rstr(rootR), 'x is on its own.', ''));
  }
  var last = out[out.length - 1];
  last.why = (last.why ? last.why + ' ' : '') +
    '<u>Check:</u> put ' + Rstr(rootR) + ' back into the first line and both sides come to ' + Rstr(cR) + '.';
  return out;
}

/* ---- rung 4: one-step equations ---------------------------------------- */

  } else if (t < 0.50) {                /* x - a = b */

    steps = stepsLinear(R(1), R(-a), R(b), R(root));

}

/* ---- rung 5: two-step equations ---------------------------------------- */

  if (Object.prototype.toString.call(S.recent) !== '[object Array]') return false;
  if (S.recent.length < Math.min(RECENT_WINDOW, cfg.gate || 4)) return false;
  for (i = 0; i < S.recent.length; i++) if (S.recent[i]) hits++;
  return hits / S.recent.length >= PROMOTE_WIN;
}
function nextItemSpec() {
  var lvl = S.lvl, it, mode = 'level', rung = lvl;
  var due = S.since >= PROBE_EVERY + Math.floor(rnd() * 6) || readyToClimb();
  if (lvl < MAX_RUNG && (due || S.probeHit > 0)) { mode = 'probe'; rung = lvl + 1; }
  else if (lvl >= 2 && rnd() < REVIEW_CHANCE) {
    var rr = reviewRung();
    if (rr >= 0 && rr !== lvl) { mode = 'review'; rung = rr; }
  }
  it = generate(rung);
  it.mode = mode;
  it.rung = rung;
  it.hints = buildHints(it);
  return it;
}

/* A hint is the NEXT STEP, never the answer.  The first one is always the rule
   itself, so there is always something to give; after that come the step
   instructions, with any line that would give the number away filtered out. */
function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&'); }
/* Superscripts become ^n rather than vanishing, so 4<sup>2</sup> cannot be read
   as the number 42 - and so an exponent is never mistaken for the answer. */
function stripTags(s) {
  return String(s).replace(/<sup>([^<]*)<\/sup>/g, '^$1 ').replace(/<[^>]*>/g, '');
}
function buildHints(it) {
  var out = ['<u>The rule here:</u> ' + ruleTxt(it.rule)], i;
  var ansTxt = it.ansR ? Rstr(it.ansR) : (it.ansText || '');
  var re = ansTxt ? new RegExp('(^|[^0-9.^\\/-])' + escapeRe(ansTxt) + '([^0-9.\\/]|$)') : null;
  for (i = 1; i < it.steps.length; i++) {
    var a = it.steps[i].act;
    if (!a) continue;
    var flat = stripTags(a);
    if (re && re.test(flat)) continue;
    if (out.length >= 4) break;
    out.push(a);
  }
  return out;
}

/* ------------------------------------------------------- procedural bg -- */
var glyphs = [];
(function seedGlyphs() {
  var chars = ['x', '=', '+', '-', '×', '÷', '(', ')', '2', '7', 'y', '<', '>'];
  for (var i = 0; i < 46; i++) {
    glyphs.push({
      x: Math.random(), y: Math.random(),
      s: 10 + Math.random() * 26,
      v: 0.004 + Math.random() * 0.012,
      a: 0.04 + Math.random() * 0.07,
      c: chars[(Math.random() * chars.length) | 0]
    });
  }
})();
var view = { w: 600, h: 400, dpr: 1 };
function resize() {
  var w = Math.max(80, stage.clientWidth || 320);
  var h = Math.max(80, stage.clientHeight || 480);
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.w = w; view.h = h; view.dpr = dpr;
  bg.width = Math.round(w * dpr); bg.height = Math.round(h * dpr);
  drawBg();
}
function drawBg() {
  if (!bgx) return;
  var d = view.dpr;
  bgx.setTransform(d, 0, 0, d, 0, 0);
  bgx.clearRect(0, 0, view.w, view.h);
  bgx.strokeStyle = 'rgba(111,216,255,0.05)';
  bgx.lineWidth = 1;
  var gsz = 44, i;
  for (i = 0; i * gsz < view.w; i++) {
    bgx.beginPath(); bgx.moveTo(i * gsz + 0.5, 0); bgx.lineTo(i * gsz + 0.5, view.h); bgx.stroke();
  }
  for (i = 0; i * gsz < view.h; i++) {
    bgx.beginPath(); bgx.moveTo(0, i * gsz + 0.5); bgx.lineTo(view.w, i * gsz + 0.5); bgx.stroke();
  }
  for (i = 0; i < glyphs.length; i++) {
    var g = glyphs[i];
    bgx.font = '700 ' + Math.round(g.s) + 'px "Segoe UI", system-ui, sans-serif';
    bgx.fillStyle = 'rgba(234,240,255,' + g.a.toFixed(3) + ')';
    bgx.fillText(g.c, g.x * view.w, g.y * view.h);
  }
}
function stepBg(dt) {
  for (var i = 0; i < glyphs.length; i++) {
    var g = glyphs[i];
    g.y -= g.v * dt * 6;
    if (g.y < -0.05) { g.y = 1.06; g.x = Math.random(); }
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 140); });

var PAD_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'neg', '0', 'dot', 'sl', 'del', 'ok'];
var PAD_LABEL = { neg: '−', dot: '.', sl: '/', del: '⌫', ok: 'ENTER' };
(function buildPad() {
  var html = '', i;
  for (i = 0; i < PAD_KEYS.length; i++) {
    var k = PAD_KEYS[i];
    var act = (k === 'del' || k === 'ok' || k === 'sl' || k === 'neg' || k === 'dot');
    html += '<button class="key' + (act ? ' act' : '') + '" type="button" data-k="' + k + '">' +
            (PAD_LABEL[k] || k) + '</button>';
  }
  elPad.innerHTML = html;
})();
function pressKey(k) {
  if (G.state === 'right') { nextQuestion(); return; }
  if (G.state === 'teach') { teachNext(); return; }
  if (G.state !== 'ask' || !G.it || G.it.kind === 'mc') return;
  var e = G.entry;
  if (k === 'del') { G.entry = e.slice(0, -1); sfx.del(); paintEntry(); return; }
  if (k === 'ok') { submit(G.entry); return; }
  if (k === 'neg') {
    G.entry = (e.charAt(0) === '-') ? e.slice(1) : ('-' + e);
    sfx.tap(); paintEntry(); return;
  }
  if (e.replace('-', '').length >= 7) return;
  if (k === 'dot') {
    if (e.indexOf('.') >= 0 || e.indexOf('/') >= 0) return;
    if (!e || e === '-') G.entry = e + '0.'; else G.entry = e + '.';
    sfx.tap(); paintEntry(); return;
  }
  if (k === 'sl') {
    if (e.indexOf('/') >= 0 || e.indexOf('.') >= 0 || !e || e === '-') return;
    G.entry = e + '/'; sfx.tap(); paintEntry(); return;
  }
  if (/^[0-9]$/.test(k)) {
    if (e === '0') G.entry = k;
    else if (e === '-0') G.entry = '-' + k;
    else G.entry = e + k;
    sfx.tap(); paintEntry();
  }
}
function paintEntry() {
  elSlot.textContent = G.entry.length ? G.entry : ' ';
}

/* ------------------------------------------------------------- answering */
function noteRule(id, wrong) {
  if (!RULES[id]) return;
  if (!S.rules[id]) S.rules[id] = { w: 0, n: 0 };
  S.rules[id].n++;
  if (wrong) S.rules[id].w++;
}
function submit(val) {
  var it = G.it;
  if (!it || G.state !== 'ask') return;
  var right, chosen = null, parsed = null;
  if (it.kind === 'mc') {
    if (!isNum(val) || val < 0 || val >= it.choices.length) return;
    chosen = it.choices[val];
    right = !!chosen.correct;
  } else {
    parsed = parseAns(val);
    if (!parsed || parsed.bad) {
      elFb.className = 'teach';
      elFb.textContent = 'Finish typing a number first — then ENTER.';
      return;
    }
    right = Req(parsed, it.ansR);
  }
  S.rungs[it.rung] = S.rungs[it.rung] || { n: 0, c: 0 };
  S.rungs[it.rung].n++;
  noteRule(it.rule, !right);
  G.setI++;
  if (right) {
    S.rungs[it.rung].c++;
    S.solved++; S.run++;
    if (S.run > S.best) S.best = S.run;
    G.setRight++;
  } else {
    S.run = 0;
  }
  var moved = adapt(right, it.mode, G.usedHint);
  if (moved) G.moves.push(moved);
  saveNow();
  if (right) {
    G.state = 'right';
    G.holdT = 0.95;
    elFb.className = 'good';
    elFb.textContent = (G.usedHint ? 'Right — and you found it yourself from the step. '
                                   : (['Yes.', 'Correct.', 'That is it.', 'Clean.', 'Nice.'])[(rnd() * 5) | 0] + ' ') +
                       (S.run > 2 ? S.run + ' in a row.' : '');
    if (it.kind !== 'mc') { elSlot.textContent = Rstr(it.ansR); elPad.classList.add('off'); }
    else markChoices(it, val);      /* leave the options up so the tick is seen */
    elHintRow.classList.add('off');
    sfx.right();
    if (moved === 'up') { sfx.climb(); levelToast('up'); }
    paintHead();
  } else {
    if (moved === 'down') levelToast('down');
    startTeach(chosen, parsed);
  }
}
function markChoices(it, chosen) {
  var kids = elCh.children, i;
  for (i = 0; i < kids.length; i++) {
    if (it.choices[i] && it.choices[i].correct) {
      kids[i].style.borderColor = 'rgba(99,226,168,0.85)';
      kids[i].style.background = 'rgba(99,226,168,0.16)';
    } else if (i === chosen) {
      kids[i].style.borderColor = 'rgba(255,159,110,0.7)';
    }
  }
}
function levelToast(dir) {
  var r = rungAt(S.lvl);
  elFb.className = dir === 'up' ? 'good' : 'teach';
  elFb.innerHTML = dir === 'up'
    ? '&#9650; MOVED UP &mdash; rung ' + (S.lvl + 1) + ', ' + r.name.toLowerCase() + '.'
    : '&#9660; Back to rung ' + (S.lvl + 1) + ' for a bit &mdash; ' + r.name.toLowerCase() + '.';
}

/* ---------------------------------------------- the teaching, on a miss -- */
function startTeach(chosen, parsed) {
  var it = G.it, i, head = null;
  G.state = 'teach';
  G.teachI = 0;
  clearPanel();
  if (it.kind === 'mc' && chosen && chosen.why) {
    /* Name what he actually picked. "That is wrong" teaches nothing; "you
       picked 7x + 2, which is what you get if..." teaches the slip. */
    head = { t: ruleName(chosen.rule), b: 'You picked <b style="color:var(--fg)">' + chosen.html + '</b>. ' + chosen.why };
    noteRule(chosen.rule, true);
  } else if (parsed) {
    for (i = 0; i < it.traps.length; i++) {
      if (Req(parsed, it.traps[i].r)) {
        head = { t: ruleName(it.traps[i].rule), b: it.traps[i].msg };
        noteRule(it.traps[i].rule, true);
        break;
      }
    }
  }
  if (!head) head = { t: ruleName(it.rule), b: ruleTxt(it.rule) };
  saveNow();
  pushBlock('<div class="rulehead"><b>' + head.t + '</b><span>' + head.b + '</span></div>');
  elFb.className = 'teach';
  elFb.textContent = 'Not this time. Here it is, line by line.';
  elPad.classList.add('off');
  elCh.classList.add('off');

        ' of ' + RUNGS.length + ' right now: <b style="color:var(--accent)">' + rungAt(S.lvl).name + '</b>.</div>' +
      '<div class="slist">' + rows + '</div>' +
      (chips ? '<div class="note" style="margin-top:10px">Rules he is dropping most &mdash; these come back more often on purpose:</div><div class="weak">' + chips + '</div>' : '') +
      '<div class="note">' + S.played + ' questions asked' + (S.hinted ? ', ' + S.hinted + ' with a hint' : '') + '.</div>' +
      '<div class="btnrow"><button class="btn ghost" data-act="back">BACK</button></div>' +
    '</div>');
  drawSpark();
}
function drawSpark() {
  var c = document.getElementById('spark');
  if (!c) return;
  var w = c.clientWidth || 300, h = c.clientHeight || 62;
  var d = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.round(w * d); c.height = Math.round(h * d);
  var x = c.getContext('2d');
  if (!x) return;
  x.setTransform(d, 0, 0, d, 0, 0);
  x.clearRect(0, 0, w, h);
  var hist = (Object.prototype.toString.call(S.hist) === '[object Array]' && S.hist.length) ? S.hist : [[0, S.lvl]];
  var pts = hist.slice();
  pts.push([S.played, S.lvl]);
  var pad = 8, iw = w - pad * 2, ih = h - pad * 2, i;
  var maxN = Math.max(1, pts[pts.length - 1][0]);
  function px(n) { return pad + (maxN ? (n / maxN) * iw : 0); }
  function py(l) { return pad + ih - (l / MAX_RUNG) * ih; }
  x.strokeStyle = 'rgba(234,240,255,0.10)'; x.lineWidth = 1;
  for (i = 0; i <= MAX_RUNG; i += 2) {
    x.beginPath(); x.moveTo(pad, py(i) + 0.5); x.lineTo(w - pad, py(i) + 0.5); x.stroke();
  }
  x.strokeStyle = '#ffcc4d'; x.lineWidth = 2;
  x.beginPath();
  for (i = 0; i < pts.length; i++) {
    var X = px(pts[i][0]), Y = py(pts[i][1]);
    if (i === 0) x.moveTo(X, Y);
    else { x.lineTo(px(pts[i][0]), py(pts[i - 1][1])); x.lineTo(X, Y); }
  }
  x.stroke();
  x.fillStyle = '#6fd8ff';
  x.beginPath(); x.arc(px(pts[pts.length - 1][0]), py(pts[pts.length - 1][1]), 3.2, 0, 6.284); x.fill();
}

function setScreen() {
  G.state = 'pause';
  S.sets++;
  var ups = 0, downs = 0, i;
  for (i = 0; i < G.moves.length; i++) { if (G.moves[i] === 'up') ups++; else downs++; }
  saveNow();
  var note = ups && !downs ? 'You moved up a rung. Harder from here.'
    : (downs && !ups ? 'Dropped back a rung to steady it. That is the game working, not you failing.'
    : (ups && downs ? 'The level moved around a bit — it is still settling.'
    : 'Level held steady.'));
  showOverlay(
    '<div class="card">' +
      '<div class="eyebrow">Set of ' + SET_LEN + '</div>' +
      '<h2>' + G.setRight + ' OF ' + SET_LEN + '</h2>' +
      '<div class="grid2">' +
        '<div class="stat"><b>' + (S.lvl + 1) + '</b><span>Rung</span></div>' +
        '<div class="stat"><b>' + S.solved + '</b><span>Solved</span></div>' +
        '<div class="stat"><b>' + S.best + '</b><span>Best run</span></div>' +
      '</div>' +
      '<div class="tagline" style="margin-top:10px">' + rungAt(S.lvl).name + ' &mdash; ' + note + '</div>' +
      '<div class="btnrow">' +
        '<button class="btn" data-act="again">KEEP GOING</button>' +
        '<button class="btn ghost" data-act="progress">PROGRESS</button>' +
      '</div>' +
      '<div class="btnrow"><button class="btn ghost" data-act="title">MENU</button></div>' +
    '</div>');
}

function pauseScreen() {
  showOverlay(
    '<div class="card">' +
      '<div class="paused">Paused</div>' +
      '<div class="tagline" style="margin-top:10px">Rung ' + (S.lvl + 1) + ' &mdash; ' + rungAt(S.lvl).name + '</div>' +
      '<div class="btnrow">' +
        '<button class="btn" data-act="resume">RESUME</button>' +
        '<button class="btn ghost" data-act="progress">PROGRESS</button>' +
      '</div>' +
      '<div class="btnrow"><button class="btn ghost" data-act="title">MENU</button></div>' +
    '</div>');
}

overlay.addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  initAudio();
  var act = b.getAttribute('data-act');
  if (act === 'start' || act === 'again') { startPlay(act === 'again'); return; }
  if (act === 'progress') { G.prevState = G.prevState || G.state; progressScreen(); return; }
  if (act === 'ladder') { G.prevState = G.prevState || G.state; ladderScreen(); return; }
  if (act === 'back') { backFromInfo(); return; }
  if (act === 'resume') { resumePlay(); return; }
  if (act === 'title') { G.prevState = null; titleScreen(); return; }
});
function backFromInfo() {
  var p = G.prevState; G.prevState = null;
  if (p === 'title' || p === null || p === undefined) { titleScreen(); return; }
  if (G.setI >= SET_LEN) { setScreen(); return; }
  resumePlay();
}
function startPlay(continueSet) {
  hideOverlay();
  document.body.classList.add('playing');
  G.prevState = null;
  G.setI = 0; G.setRight = 0; G.moves = [];
  if (!continueSet) { /* fresh sitting */ }
  nextQuestion();
  setTimeout(resize, 0);
}
function resumePlay() {
  hideOverlay();
  document.body.classList.add('playing');
  G.prevState = null;
  if (G.pendingNext || !G.it) { G.pendingNext = false; nextQuestion(); setTimeout(resize, 0); return; }
  if (G.state === 'pause') G.state = G.pausedFrom || 'ask';
  G.pausedFrom = null;
  if (G.state === 'teach') paintTeachBtn();
  setTimeout(resize, 0);
}
function togglePause() {
  if (G.state === 'ask' || G.state === 'right' || G.state === 'teach') {
    if (G.state === 'right') G.pendingNext = true;
    G.pausedFrom = (G.state === 'right') ? 'ask' : G.state;
    G.prevState = null;
    G.state = 'pause';
    pauseScreen();
  } else if (G.state === 'pause' && overlay.querySelector('[data-act="resume"]')) resumePlay();
}

/* ================================================================ input == */
document.getElementById('menuBtn').addEventListener('click', function () {
  initAudio();
  if (G.state === 'right') G.pendingNext = true;
  G.pausedFrom = (G.state === 'right') ? 'ask' : G.state;
  G.prevState = null;
  G.state = 'pause';
  pauseScreen();
});
document.getElementById('muteBtn').addEventListener('click', function () { initAudio(); setMuted(!muted); });
document.getElementById('pauseBtn').addEventListener('click', function () { initAudio(); togglePause(); });

window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'm' || k === 'M') { initAudio(); setMuted(!muted); return; }
  if (G.state === 'title') {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); startPlay(false); }
    return;
  }
  if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); togglePause(); return; }
  if (G.state === 'pause') return;
  initAudio();
  if (G.state === 'teach') { if (k === 'Enter' || k === ' ') { e.preventDefault(); teachNext(); } return; }
  if (G.state === 'right') { if (k === 'Enter' || k === ' ') { e.preventDefault(); nextQuestion(); } return; }
  if (G.state !== 'ask' || !G.it) return;
  if (k === 'h' || k === 'H') { e.preventDefault(); giveHint(); return; }
  if (G.it.kind === 'mc') {
    var n = parseInt(k, 10);
    if (n >= 1 && n <= G.it.choices.length) { e.preventDefault(); submit(n - 1); }
    return;
  }
  if (/^[0-9]$/.test(k)) { e.preventDefault(); pressKey(k); }
  else if (k === '-') { e.preventDefault(); pressKey('neg'); }
  else if (k === '.') { e.preventDefault(); pressKey('dot'); }
  else if (k === '/') { e.preventDefault(); pressKey('sl'); }
  else if (k === 'Backspace') { e.preventDefault(); pressKey('del'); }
  else if (k === 'Enter') { e.preventDefault(); pressKey('ok'); }
}, false);
window.addEventListener('touchstart', function () { document.body.classList.add('touch'); }, { passive: true, once: true });

/* gamepad: dpad walks the pad, A presses, B deletes, Start pauses */
var padPrev = {};
function pollPad() {
  var pads = navigator.getGamepads ? navigator.getGamepads() : [];
  var p = null, i;
  for (i = 0; i < pads.length; i++) if (pads[i] && pads[i].connected) { p = pads[i]; break; }
  if (!p) return;
  function btn(n) { return !!(p.buttons[n] && p.buttons[n].pressed); }
  function edge(n) { var v = btn(n), was = padPrev[n]; padPrev[n] = v; return v && !was; }
  var ax = p.axes && p.axes.length ? p.axes[0] : 0;
  var ay = p.axes && p.axes.length > 1 ? p.axes[1] : 0;
  var l = edge(14) || (ax < -0.6 && !padPrev.lx), r = edge(15) || (ax > 0.6 && !padPrev.rx);
  var u = edge(12) || (ay < -0.6 && !padPrev.uy), dn = edge(13) || (ay > 0.6 && !padPrev.dy);
  padPrev.lx = ax < -0.6; padPrev.rx = ax > 0.6; padPrev.uy = ay < -0.6; padPrev.dy = ay > 0.6;
  if (G.state === 'title') { if (edge(0)) startPlay(false); return; }
  if (edge(9)) { togglePause(); return; }
  if (G.state === 'teach') { if (edge(0)) teachNext(); return; }
  if (G.state === 'right') { if (edge(0)) nextQuestion(); return; }
  if (G.state !== 'ask' || !G.it) return;
  if (edge(3)) { giveHint(); return; }
  if (G.it.kind === 'mc') {
    if (l || u) G.padSel = (G.padSel <= 0 ? G.it.choices.length : G.padSel) - 1;
    if (r || dn) G.padSel = (G.padSel + 1) % G.it.choices.length;
    if (l || r || u || dn) highlightPad();
    if (edge(0) && G.padSel >= 0) submit(G.padSel);
    return;
  }
  if (G.padSel < 0) G.padSel = 0;
  if (l) G.padSel = (G.padSel + PAD_KEYS.length - 1) % PAD_KEYS.length;
  if (r) G.padSel = (G.padSel + 1) % PAD_KEYS.length;
  if (u) G.padSel = (G.padSel + PAD_KEYS.length - 3) % PAD_KEYS.length;
  if (dn) G.padSel = (G.padSel + 3) % PAD_KEYS.length;
  if (l || r || u || dn) highlightPad();
  if (edge(0)) pressKey(PAD_KEYS[G.padSel]);
  if (edge(1)) pressKey('del');
}
function highlightPad() {
  var kids = elPad.children, i;
  for (i = 0; i < kids.length; i++) kids[i].classList.toggle('sel', i === G.padSel);
  var chs = elCh.children;
  for (i = 0; i < chs.length; i++) chs[i].classList.toggle('sel', i === G.padSel);
}

window.addEventListener('blur', function () {
  if (G.state === 'ask' || G.state === 'right' || G.state === 'teach') togglePause();
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden && (G.state === 'ask' || G.state === 'right' || G.state === 'teach')) togglePause();
});

/* ================================================================== loop = */
var lastT = 0;
function frame(now) {
  window.requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  var dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  pollPad();
  stepBg(dt);
  drawBg();
  if (G.state === 'right') {
    G.holdT -= dt;
    if (G.holdT <= 0) nextQuestion();
  }
}

/* ================================================================== boot = */
setMuted(muted);
titleScreen();
resize();
if (window.ResizeObserver) {
  try { new window.ResizeObserver(resize).observe(stage); } catch (e) {}
}
window.requestAnimationFrame(frame);

/* Test hooks.  The content audit and the ladder simulation drive these — the
   real generators and the real adapt(), never a copy. */
window.SOLVE_TEST = {
  marker: SOLVE_MARKER,
  RUNGS: RUNGS, RULES: RULES, MAX_RUNG: MAX_RUNG, SET_LEN: SET_LEN,
  R: R, Rstr: Rstr, Req: Req, Radd: Radd, Rsub: Rsub, Rmul: Rmul, Rdiv: Rdiv,
  parseAns: parseAns, setRandom: setRandom,
  generate: generate, nextItemSpec: nextItemSpec, buildHints: buildHints,
  adapt: adapt, promote: promote, demote: demote, reviewRung: reviewRung, readyToClimb: readyToClimb,
  freshSave: freshSave, sanitize: sanitize,
  state: function () { return S; },
  setState: function (o) { S = o; },
  game: function () { return G; },
  submit: function (v) { return submit(v); },
  press: function (k) { return pressKey(k); },
  /* Put a specific generated item on screen through the real paint path, so a
     scripted test can reach a rung's rarer shapes without waiting for one. */
  inject: function (it) {
    it.hints = buildHints(it);
    if (it.mode === undefined) it.mode = 'level';
    G.it = it; G.entry = ''; G.hintI = 0; G.usedHint = false; G.teachI = 0; G.padSel = -1;
    G.state = 'ask';
    paintQuestion();
    return it;
  },
  /* The ladder rig tunes the REAL constants — nothing is tuned on a copy. */
  tune: function (o) {
    var i;
    o = o || {};
    if (isNum(o.recentWindow)) RECENT_WINDOW = o.recentWindow;
    if (isNum(o.demoteMisses)) DEMOTE_MISSES = o.demoteMisses;
    if (isNum(o.promoteWin)) PROMOTE_WIN = o.promoteWin;
    if (isNum(o.probeEvery)) PROBE_EVERY = o.probeEvery;
    if (isNum(o.reviewChance)) REVIEW_CHANCE = o.reviewChance;
    if (isNum(o.gate)) for (i = 0; i < RUNGS.length; i++) RUNGS[i].gate = o.gate + (RUNGS[i].mc ? 1 : 0);
    if (isNum(o.probeHits)) for (i = 0; i < RUNGS.length; i++) RUNGS[i].probeHits = o.probeHits + (RUNGS[i].mc ? 1 : 0);
    return { RECENT_WINDOW: RECENT_WINDOW, DEMOTE_MISSES: DEMOTE_MISSES, PROMOTE_WIN: PROMOTE_WIN,
             PROBE_EVERY: PROBE_EVERY, REVIEW_CHANCE: REVIEW_CHANCE,
             gates: RUNGS.map(function (r) { return r.gate; }),
             probeHits: RUNGS.map(function (r) { return r.probeHits; }) };
  }
};
</script>
