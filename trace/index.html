<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Trace — Write Your Letters</title>
<meta name="theme-color" content="#fbf1de">
<meta name="description" content="A letter-formation game that finds a young writer's level and grows with her. Big ghost letters on handwriting lines, a start dot and arrows, every prompt spoken aloud. Trace a letter, trace your name, build a word. No timer, no score, nothing to fail.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trace">
<meta name="format-detection" content="telephone=no">
<style>
  :root {
    --bg: #fbf1de;
    --accent: #e2762b;
    --fg: #4a3628;
    --dim: rgba(74,54,40,0.62);
    --panel: rgba(255,250,240,0.92);
    --line: rgba(74,54,40,0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  canvas#game { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  #topbtns {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    right: max(8px, env(safe-area-inset-right));
    display: flex; gap: 6px; z-index: 6;
  }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--panel); color: var(--fg);
    border: 2px solid var(--line);
    font-family: inherit; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .iconbtn:active { background: #ffe6c4; }
  body:not(.playing) #topbtns { display: none; }

  #overlay {
    position: absolute; inset: 0; z-index: 10;
    display: none;
    align-items: safe center; justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 90% at 50% 0%, rgba(255,244,224,0.95), rgba(246,225,193,0.98));
    overflow-y: auto;
  }
  #overlay.on { display: flex; }
  .card {
    width: min(560px, 100%);
    background: #fffaf0;
    border: 3px solid #e8cfa8;
    border-radius: 22px;
    padding: 20px 18px 18px;
    box-shadow: 0 18px 40px rgba(150,110,60,0.22);
    text-align: center;
  }
  .eyebrow { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); }
  h1 {
    margin: 6px 0 2px;
    font-size: clamp(34px, 11vw, 60px);
    letter-spacing: 0.16em; font-weight: 800; line-height: 1;
    color: var(--accent);
  }
  h2 { margin: 2px 0 6px; font-size: clamp(19px, 6vw, 27px); letter-spacing: 0.06em; font-weight: 800; }
  .tagline { font-size: 13px; color: var(--dim); letter-spacing: 0.02em; margin-bottom: 8px; line-height: 1.45; }
  .keys {
    display: grid; grid-template-columns: 1fr; gap: 5px;
    font-size: 12.5px; color: var(--dim);
    margin: 12px auto 4px; max-width: 380px; text-align: left;
  }
  .keys > div { display: flex; justify-content: space-between; gap: 10px;
    border-bottom: 1px dashed rgba(74,54,40,0.16); padding-bottom: 4px; }
  .keys span { color: var(--fg); font-weight: 700; }
  .btn {
    margin-top: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 62px; padding: 0 32px;
    border-radius: 16px; border: 3px solid #c9611f;
    background: #f0a04b; color: #3b2a16;
    font-family: inherit; font-size: 18px; font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase; cursor: pointer;
  }
  .btn:active { background: #e2762b; }
  .btn.ghost { border-color: #d8bd96; color: var(--fg); background: #fdf0da; }
  .btn.small { min-height: 46px; font-size: 13px; padding: 0 16px; margin-top: 8px; letter-spacing: 0.06em; }
  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .paused { font-size: clamp(26px, 8vw, 44px); font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }

  /* grown-up panel */
  .slots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0 6px; }
  .slot {
    width: 46px; height: 56px; border-radius: 10px;
    border: 3px dashed #d8bd96; background: #fffdf7;
    font-family: inherit; font-size: 26px; font-weight: 800; color: var(--fg);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .slot.sel { border-style: solid; border-color: var(--accent); background: #ffe9cd; }
  .abc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 380px; margin: 8px auto 0; }
  .abc button {
    height: 44px; border-radius: 9px; border: 2px solid #e0c8a2; background: #fffdf7;
    font-family: inherit; font-size: 17px; font-weight: 800; color: var(--fg); cursor: pointer;
  }
  .abc button:active { background: #ffe6c4; }
  .row2 { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .hint { font-size: 11.5px; color: var(--dim); margin-top: 8px; line-height: 1.5; }
  .growth { text-align: left; max-width: 400px; margin: 10px auto 0; }
  .growth .g { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px;
    color: var(--dim); border-bottom: 1px dashed rgba(74,54,40,0.16); padding: 4px 0; }
  .growth .g b { color: var(--fg); }
  .grid26 { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; max-width: 400px; margin: 8px auto 0; }
  .grid26 span {
    height: 24px; border-radius: 5px; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    background: #f3e7d2; color: rgba(74,54,40,0.42);
  }
  .grid26 span.on { background: #cdeac4; color: #35682a; }
  .bar { height: 10px; border-radius: 6px; background: #f0e2c9; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: #8fc47f; }
  @media (max-height: 620px) {
    .card { padding: 12px 14px; border-radius: 16px; }
    .keys { display: none; }
    .btn { min-height: 54px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="topbtns">
    <button class="iconbtn" id="muteBtn" type="button" aria-label="Mute">&#9835;</button>
    <button class="iconbtn" id="pauseBtn" type="button" aria-label="Pause">&#10073;&#10073;</button>
  </div>
  <div id="overlay"></div>
</div>
<script>
/* =========================================================================
   TRACE — the Overclock arcade's game for someone who cannot read yet.
   A stack trace, and tracing letters with your finger.

   Built for a four-year-old whose fine motor control may be affected, so:
   every prompt is spoken aloud, the tolerance is enormous and ADAPTIVE, the
   game finds her level by playing with her and then moves it, there is no
   failure feedback of any kind anywhere, and she can never get stuck on a
   stroke — after a few seconds it demonstrates and then counts it done.
   Low floor, high ceiling: the ladder runs from one straight line all the
   way to lowercase and four-letter words, and the tolerance tightens only
   while she is comfortably clearing it.
   One file, no assets, oscillator audio, browser speech synthesis.
   ========================================================================= */
"use strict";

var TAU = Math.PI * 2;
var P = Math.PI;
var K_SAVE = 'trace_v1';
var K_MUTE = 'trace_muted_v1';
var TOL_START = 0.35;     /* stroke tolerance as a fraction of letter height */
var TOL_MIN = 0.14;       /* the tightest the ladder will ever ask for */
var TOL_MAX = 0.40;
var RATE = 0.85;          /* speech rate — slow and clear */
var ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[(Math.random() * a.length) | 0]; }
function loadStr(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function saveStr(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function rrect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

/* ---------------------------------------------------------------- audio -- */
var actx = null, muted = loadStr(K_MUTE, '0') === '1', master = null;
function initAudio() {
  if (actx) { try { if (actx.state === 'suspended') actx.resume(); } catch (e) {} return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.4;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function setMuted(m) {
  muted = !!m; saveStr(K_MUTE, muted ? '1' : '0');
  if (master) master.gain.value = muted ? 0 : 0.4;
  var b = document.getElementById('muteBtn');
  if (b) b.innerHTML = muted ? '&#215;' : '&#9835;';
  if (muted) shutUp();
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!actx || muted) return;
  try {
    var t = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(24, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
/* every cue here is warm or neutral — there is no "wrong" sound in this game */
var sfx = {
  blip:   function () { tone('sine', 660, 880, 0.09, 0.14); },
  step:   function () { tone('sine', 523, 784, 0.12, 0.12); },
  stroke: function () { tone('sine', 660, 990, 0.16, 0.16); tone('sine', 990, 1320, 0.18, 0.1, 0.09); },
  cheer:  function () {
    var n = [523, 659, 784, 1047];
    for (var i = 0; i < n.length; i++) tone('sine', n[i], n[i], 0.4, 0.13, i * 0.11);
  },
  fanfare: function () {
    var n = [523, 659, 784, 1047, 1319, 1047, 1319];
    for (var i = 0; i < n.length; i++) tone('sine', n[i], n[i], 0.5, 0.13, i * 0.14);
  },
  soft:   function () { tone('sine', 440, 440, 0.14, 0.07); },
  tap:    function () { tone('sine', 520, 520, 0.05, 0.06); }
};

/* --------------------------------------------------------------- speech -- */
/* Every prompt is read aloud, slowly. If the browser has no speech at all
   the game must still be completely playable — so nothing here may ever
   throw, and no game logic may wait on a speech callback. */
var SP = { ok: false };
try {
  SP.ok = !!(window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function' &&
             typeof window.speechSynthesis.speak === 'function');
} catch (e) { SP.ok = false; }
var lastSaid = '';
function shutUp() { if (!SP.ok) return; try { window.speechSynthesis.cancel(); } catch (e) {} }
function speak(text, rate, pitch) {
  lastSaid = String(text || '');
  if (!SP.ok || muted || !text) return false;
  try {
    var u = new window.SpeechSynthesisUtterance(String(text));
    /* the character she picked decides pitch and speed; an explicit rate
       argument still wins, because Trace slows right down while it spells a
       letter out stroke by stroke */
    ocApply(u, null, rate === undefined ? undefined : rate);
    u.volume = 1;
    u.onerror = function () {};
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}
function sayFresh(text, rate, pitch) { shutUp(); return speak(text, rate, pitch); }

var SOUND = {
  A: 'ah', B: 'buh', C: 'kuh', D: 'duh', E: 'eh', F: 'fff', G: 'guh', H: 'huh',
  I: 'ih', J: 'juh', K: 'kuh', L: 'lll', M: 'mmm', N: 'nnn', O: 'aw', P: 'puh',
  Q: 'kwuh', R: 'rrr', S: 'sss', T: 'tuh', U: 'uh', V: 'vvv', W: 'wuh',
  X: 'ks', Y: 'yuh', Z: 'zzz'
};
function letterName(ch) {
  var c = String(ch).toUpperCase();
  return c === 'A' ? 'ay' : c === 'I' ? 'eye' : c === 'W' ? 'double you' : c === 'Y' ? 'why' : c;
}
/* warm, not babyish */
var PRAISE = ['Nice work.', 'You did it.', 'That looks great.', 'Well done.', 'Excellent.', 'Beautiful writing.'];

/* ----------------------------------------------------------------- save -- */
function freshSave() {
  return {
    letters: {},      /* letters she has formed */
    words: {},        /* words she has built */
    /* A neutral default: this ships to other people's children, and the
       name to trace should be theirs, not one real child's. Changed in the
       grown-ups panel. */
    name: 'SAM',
    rung: 0,          /* where the ladder found her */
    tol: TOL_START,   /* the working tolerance, a fraction of letter height */
    clean: 0,         /* clean completions at this rung */
    struggle: 0,      /* assisted completions at this rung */
    history: [],      /* [{c:letter, a:neatness 0-100, x:1 if assisted}] */
    done: 0           /* total letters formed, ever */
  };
}
function loadSave() {
  var out = freshSave();
  var raw = null;
  try { raw = localStorage.getItem(K_SAVE); } catch (e) { return out; }
  if (!raw) return out;
  var v = null;
  try { v = JSON.parse(raw); } catch (e) { return out; }
  if (!v || typeof v !== 'object' || Array.isArray(v)) return out;
  try {
    if (v.letters && typeof v.letters === 'object' && !Array.isArray(v.letters)) {
      for (var k in v.letters) {
        if (Object.prototype.hasOwnProperty.call(v.letters, k) && /^[A-Za-z]$/.test(k) && v.letters[k]) out.letters[k] = true;
      }
    }
    if (v.words && typeof v.words === 'object' && !Array.isArray(v.words)) {
      for (var w in v.words) {
        if (Object.prototype.hasOwnProperty.call(v.words, w) && /^[A-Z]{2,8}$/.test(w) && v.words[w]) out.words[w] = true;
      }
    }
    if (typeof v.name === 'string') {
      var n = v.name.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 8);
      if (n.length > 0) out.name = n;
    }
    if (typeof v.rung === 'number' && isFinite(v.rung)) out.rung = clamp(Math.round(v.rung), 0, RUNGS.length - 1);
    if (typeof v.tol === 'number' && isFinite(v.tol)) out.tol = clamp(v.tol, TOL_MIN, TOL_MAX);
    if (typeof v.clean === 'number' && isFinite(v.clean)) out.clean = clamp(Math.round(v.clean), 0, 99);
    if (typeof v.struggle === 'number' && isFinite(v.struggle)) out.struggle = clamp(Math.round(v.struggle), 0, 99);
    if (typeof v.done === 'number' && isFinite(v.done)) out.done = clamp(Math.round(v.done), 0, 999999);
    if (Object.prototype.toString.call(v.history) === '[object Array]') {
      for (var i = 0; i < v.history.length && out.history.length < 40; i++) {
        var h = v.history[i];
        if (h && typeof h === 'object' && typeof h.c === 'string' && /^[A-Za-z]$/.test(h.c) &&
            typeof h.a === 'number' && isFinite(h.a)) {
          out.history.push({ c: h.c, a: clamp(Math.round(h.a), 0, 100), x: h.x ? 1 : 0 });
        }
      }
    }
  } catch (e) { return freshSave(); }
  return out;
}
function persist() { try { localStorage.setItem(K_SAVE, JSON.stringify(SV)); } catch (e) {} }

/* ------------------------------------------------------ letter geometry -- */
/* Each letter is an ordered list of STROKES in real handwriting order and
   direction. A stroke is a list of pen commands in a unit box:
     x 0..1 left..right, y 0 = top line, y 1 = baseline, y > 1 = descender.
   ['M',x,y]  pen down here
   ['L',x,y]  straight to
   ['A',cx,cy,rx,ry,a0,a1]  elliptical arc (angle 0 = right, -PI/2 = top,
                            +PI/2 = bottom; decreasing angle = anticlockwise)
   Sampled to polylines and resampled to even spacing — that even-spaced
   polyline is what the matcher walks. Capital I is deliberately a single
   sans-serif downstroke: it is the first rung of the whole ladder. */
var UPPER = {
  A: [[['M', .5, 0], ['L', .08, 1]], [['M', .5, 0], ['L', .92, 1]], [['M', .2, .68], ['L', .8, .68]]],
  B: [[['M', .14, 0], ['L', .14, 1]], [['M', .14, 0], ['A', .14, .25, .48, .25, -P / 2, P / 2], ['A', .14, .75, .54, .25, -P / 2, P / 2]]],
  C: [[['A', .5, .5, .42, .5, -P / 3, -5 * P / 3]]],
  D: [[['M', .14, 0], ['L', .14, 1]], [['M', .14, 0], ['A', .14, .5, .68, .5, -P / 2, P / 2]]],
  E: [[['M', .14, 0], ['L', .14, 1]], [['M', .14, 0], ['L', .84, 0]], [['M', .14, .5], ['L', .74, .5]], [['M', .14, 1], ['L', .84, 1]]],
  F: [[['M', .14, 0], ['L', .14, 1]], [['M', .14, 0], ['L', .84, 0]], [['M', .14, .5], ['L', .72, .5]]],
  G: [[['A', .5, .5, .42, .5, -P / 3, -2 * P]], [['M', .92, .5], ['L', .52, .5]]],
  H: [[['M', .14, 0], ['L', .14, 1]], [['M', .86, 0], ['L', .86, 1]], [['M', .14, .5], ['L', .86, .5]]],
  I: [[['M', .5, 0], ['L', .5, 1]]],
  J: [[['M', .62, 0], ['L', .62, .74], ['A', .36, .74, .26, .26, 0, P]]],
  K: [[['M', .14, 0], ['L', .14, 1]], [['M', .84, 0], ['L', .16, .56]], [['M', .16, .56], ['L', .86, 1]]],
  L: [[['M', .18, 0], ['L', .18, 1]], [['M', .18, 1], ['L', .84, 1]]],
  M: [[['M', .1, 0], ['L', .1, 1]], [['M', .1, 0], ['L', .5, .6], ['L', .9, 0], ['L', .9, 1]]],
  N: [[['M', .12, 0], ['L', .12, 1]], [['M', .12, 0], ['L', .88, 1]], [['M', .88, 0], ['L', .88, 1]]],
  O: [[['A', .5, .5, .42, .5, -P / 2, -P / 2 - 2 * P]]],
  P: [[['M', .14, 0], ['L', .14, 1]], [['M', .14, 0], ['A', .14, .28, .52, .28, -P / 2, P / 2]]],
  Q: [[['A', .5, .5, .42, .5, -P / 2, -P / 2 - 2 * P]], [['M', .62, .68], ['L', .95, 1.02]]],
  R: [[['M', .14, 0], ['L', .14, 1]], [['M', .14, 0], ['A', .14, .26, .5, .26, -P / 2, P / 2]], [['M', .14, .52], ['L', .88, 1]]],
  S: [[['A', .5, .28, .36, .28, -P / 4, -3 * P / 2], ['A', .5, .78, .36, .22, -P / 2, P * .85]]],
  T: [[['M', .5, 0], ['L', .5, 1]], [['M', .1, 0], ['L', .9, 0]]],
  U: [[['M', .12, 0], ['L', .12, .62], ['A', .5, .62, .38, .38, P, 0], ['L', .88, 0]]],
  V: [[['M', .08, 0], ['L', .5, 1], ['L', .92, 0]]],
  W: [[['M', .05, 0], ['L', .27, 1], ['L', .5, .18], ['L', .73, 1], ['L', .95, 0]]],
  X: [[['M', .12, 0], ['L', .88, 1]], [['M', .88, 0], ['L', .12, 1]]],
  Y: [[['M', .12, 0], ['L', .5, .52]], [['M', .88, 0], ['L', .5, .52]], [['M', .5, .52], ['L', .5, 1]]],
  Z: [[['M', .12, 0], ['L', .88, 0], ['L', .12, 1], ['L', .88, 1]]]
};
var LOWER = {
  a: [[['A', .46, .67, .3, .33, -P / 3, -P / 3 - 2 * P]], [['M', .76, .34], ['L', .76, 1]]],
  b: [[['M', .16, 0], ['L', .16, 1]], [['A', .16, .68, .46, .32, -P / 2, P / 2]]],
  c: [[['A', .5, .67, .32, .33, -P / 3, -5 * P / 3]]],
  d: [[['A', .42, .67, .3, .33, -P / 3, -P / 3 - 2 * P]], [['M', .72, 0], ['L', .72, 1]]],
  e: [[['M', .2, .72], ['L', .78, .72], ['A', .49, .67, .29, .33, .171, -5 * P / 3]]],
  f: [[['A', .42, .18, .22, .18, 0, -P], ['L', .2, 1]], [['M', .06, .42], ['L', .62, .42]]],
  g: [[['A', .45, .67, .3, .33, -P / 3, -P / 3 - 2 * P]], [['M', .75, .34], ['L', .75, 1.06], ['A', .5, 1.06, .25, .2, 0, P]]],
  h: [[['M', .16, 0], ['L', .16, 1]], [['A', .46, .66, .3, .3, -P, 0], ['L', .76, 1]]],

/* ---------------------------------------------------------------- state -- */
var G = {
  state: 'title',        /* title | menu | trace | word */
  t: 0,
  paused: false,
  parts: [],
  toast: '', toastT: 0

/* TR — the tracing activity. Exposed on purpose: the scripted tests drive it. */
var TR = {
  mode: 'letter',        /* letter | name */
  seq: [], seqIdx: 0,
  letter: 'I',
  stretch: false,
  strokes: [],           /* [{pts:[{x,y}px], prog, done, granted}] */
  idx: 0,
  ink: [],               /* [[{x,y} unit], ...] */
  drawing: false,
  touched: false,
  idleT: 0,
  demo: null,
  celT: 0,
  done: false,
  nameDone: false,
  assisted: false,
  errSum: 0, errN: 0,
  neat: 100,
  tol: 40
};
var WD = { word: 'CAT', pic: 'cat', need: [], tiles: [], slot: 0, celT: 0, hintT: 0 };

var stage = document.getElementById('stage');
var cv = document.getElementById('game');
var ctx = cv.getContext('2d', { alpha: false });
var view = { w: 900, h: 600, dpr: 1 };
var L = {
  box: { x: 0, y: 0, w: 10, h: 10 }, card: { x: 0, y: 0, w: 10, h: 10 },
  side: false, bs: 110, top: 0, mid: 0, base: 0
};
var zones = [];

function resize() {
  var w = Math.max(240, stage.clientWidth || window.innerWidth);
  var h = Math.max(240, stage.clientHeight || window.innerHeight);
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.w = w; view.h = h; view.dpr = dpr;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  layout();

}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

/* Landscape puts the big buttons in a column down the LEFT so the letter
   keeps the full height; portrait puts them along the bottom. Everything
   she taps is 110px where the screen allows it and never under 88. */
function layout() {
  var W = view.w, H = view.h;
  L.side = W > H * 1.24;
  var area;
  if (L.side) {
    L.bs = clamp(Math.floor((H - 16) / 3) - 6, 88, 110);
    var colW = L.bs + 16;
    area = { x: colW, y: 0, w: W - colW - 6, h: H };
  } else {
    L.bs = clamp(Math.floor((W - 30) / 3) - 8, 88, 110);
    var barH = L.bs + 20;
    area = { x: 0, y: 0, w: W, h: H - barH };
  }
  L.area = area;
  var topInset = 46;
  var cx = area.x + 8, cy = area.y + topInset;
  var cw = area.w - 16, chh = area.h - topInset - 8;
  L.card = { x: cx, y: cy, w: cw, h: chh };
  L.top = cy + chh * 0.13;
  L.base = cy + chh * 0.79;   /* 21% of the card left under the baseline for descenders */
  var lh = L.base - L.top;
  L.mid = isLower(TR.letter) ? L.top + lh * 0.35 : L.top + lh * 0.5;
  var lw = Math.min(lh * 0.82, cw * 0.62);
  L.box = { x: cx + (cw - lw) / 2, y: L.top, w: lw, h: lh };
  TR.tol = lh * SV.tol;
}

/* map the current letter's unit strokes into pixels */
function mapStrokes() {
  var u = buildUnit(TR.letter);
  if (!u) { TR.strokes = []; return; }
  var b = L.box;
  var keep = TR.strokes.length === u.length;
  var out = [];
  for (var i = 0; i < u.length; i++) {
    var pts = [];
    for (var j = 0; j < u[i].length; j++) pts.push({ x: b.x + u[i][j].x * b.w, y: b.y + u[i][j].y * b.h });
    out.push({
      pts: pts,
      prog: keep ? TR.strokes[i].prog : -1,
      done: keep ? TR.strokes[i].done : false,
      granted: keep ? TR.strokes[i].granted : false
    });
  }
  TR.strokes = out;
}

/* --------------------------------------------------------- the matcher --- */
/* Deliberately enormous tolerance. She has to start somewhere near the
   beginning of the stroke, move forward along it, and get most of the way
   to the end — but she may be a whole tolerance-radius off the line the
   entire time, may wobble, and may lift her finger and carry on. Nothing
   here can fail her; it only declines to advance, and even that is capped
   by the demonstration, which grants the stroke. */
function feedPoint(px, py) {
  if (TR.done || TR.idx >= TR.strokes.length) return;
  var s = TR.strokes[TR.idx];
  if (!s || s.done) return;
  var pts = s.pts, n = pts.length;
  var tol2 = TR.tol * TR.tol;
  var lo, hi;
  if (s.prog < 0) { lo = 0; hi = Math.max(2, Math.floor(n * 0.3)); }
  else { lo = s.prog; hi = Math.min(n - 1, s.prog + Math.max(5, Math.floor(n * 0.35))); }
  /* `best` is the FURTHEST point she has reached (that is what advances her);
     `near` is the CLOSEST one (that is what measures how neat it was — using
     the furthest would score everyone at exactly the tolerance radius) */
  var best = -1, near = Infinity;
  for (var i = 0; i < n; i++) {
    var d = dist2(px, py, pts[i].x, pts[i].y);
    if (d < near) near = d;                       /* nearest anywhere on the stroke */
    if (i >= lo && i <= hi && d <= tol2) best = i; /* furthest reached, in the window */
  }
  if (best > s.prog) {
    if (isFinite(near)) { TR.errSum += Math.sqrt(near); TR.errN++; }
    s.prog = best;
    TR.idleT = 0;
    if (TR.demo) TR.demo = null;
    var slack = Math.max(1, Math.floor(n * 0.15));
    if (s.prog >= n - 1 - slack) finishStroke(false);
  }
}
function finishStroke(granted) {
  var s = TR.strokes[TR.idx];
  if (!s || s.done) return;
  s.done = true; s.granted = !!granted; s.prog = s.pts.length - 1;
  if (granted) TR.assisted = true;
  sfx.stroke();
  var end = s.pts[s.pts.length - 1];
  for (var i = 0; i < 12; i++) burst(end.x, end.y);
  TR.idx++;
  TR.idleT = 0; TR.demo = null;
  if (TR.idx >= TR.strokes.length) finishLetter();
  else sayFresh(granted ? 'There it is. Now the next line.' : pick(['Good. Now the next line.', 'Yes. One more line.', 'Nice. Keep going.']));
}
function finishLetter() {
  TR.done = true;
  TR.celT = 0;
  var lh = L.box.h || 1;
  var meanErr = TR.errN > 0 ? TR.errSum / TR.errN : lh * 0.2;
  TR.neat = clamp(Math.round(100 * (1 - (meanErr / lh) / TOL_START)), 0, 100);
  SV.letters[TR.letter] = true;
  gradeLetter(TR.assisted, TR.neat);
  var lastOfName = TR.mode === 'name' && TR.seqIdx >= TR.seq.length - 1;
  if (lastOfName) {
    TR.nameDone = true;
    sfx.fanfare();
    for (var k = 0; k < 160; k++) burst(rnd(0, view.w), rnd(view.h * 0.2, view.h * 0.7));
    sayFresh('You wrote your whole name. ' + SV.name.split('').join('. ') + '. ' + SV.name + '!');
    toast('You wrote ' + SV.name + '!');
  } else {
    sfx.cheer();
    for (var i = 0; i < 80; i++) burst(L.box.x + Math.random() * L.box.w, L.box.y + Math.random() * L.box.h);
    sayFresh(pick(PRAISE) + ' That is the letter ' + letterName(TR.letter) + '. Tap the arrow when you want another.');
    toast('Letter ' + TR.letter + ' — done');
  }
}
function toast(txt) { G.toast = txt; G.toastT = 3; }
function burst(x, y) {
  if (G.parts.length > 320) return;
  G.parts.push({
    x: x, y: y, vx: rnd(-160, 160), vy: rnd(-280, -60), g: rnd(320, 520),
    r: rnd(4, 10), life: rnd(0.8, 1.8), t: 0, rot: rnd(0, TAU), vr: rnd(-8, 8),
    c: pick(['#f0a04b', '#5fb14e', '#e2762b', '#7fb3d5', '#f2b12e', '#c48fd0'])
  });
}

/* ----------------------------------------------------------- activities -- */
function startTrace(mode) {
  G.state = 'trace';
  document.body.classList.add('playing');
  hideOverlay();
  TR.mode = mode;
  TR.nameDone = false;
  if (mode === 'name') { TR.seq = SV.name.split(''); TR.seqIdx = 0; }
  else { TR.seq = []; TR.seqIdx = 0; }
  loadLetter();
}
function loadLetter() {
  if (TR.mode === 'name') {
    TR.letter = TR.seq[clamp(TR.seqIdx, 0, TR.seq.length - 1)];
    TR.stretch = false;
  } else {
    var p = pickLetter();
    TR.letter = p.ch; TR.stretch = p.stretch;
  }
  if (!buildUnit(TR.letter)) TR.letter = 'I';
  TR.idx = 0; TR.ink = []; TR.done = false; TR.nameDone = false; TR.celT = 0;
  G.toast = ""; G.toastT = 0;              /* the last letter's toast must not caption this one */
  TR.idleT = 0; TR.demo = null; TR.touched = false; TR.assisted = false;
  TR.errSum = 0; TR.errN = 0; TR.neat = 100;

}
function promptLetter() {
  var nm = letterName(TR.letter);
  var pre = TR.mode === 'name'
    ? 'Your name. This letter is ' + nm + '.'
    : 'This is the letter ' + nm + '. ' + nm + ' says ' + SOUND[TR.letter.toUpperCase()] + '.';
  sayFresh(pre + ' Start on the green dot, and follow the arrows.');
}
function nextLetter(dir) {
  if (TR.mode === 'name') {
    TR.seqIdx += dir;
    if (TR.seqIdx >= TR.seq.length) TR.seqIdx = 0;
    if (TR.seqIdx < 0) TR.seqIdx = TR.seq.length - 1;
  }
  loadLetter();
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function startWord(entry) {
  G.state = 'word';
  document.body.classList.add('playing');
  hideOverlay();
  var list = SV.rung >= 4 ? WORDS3.concat(WORDS4) : WORDS3;
  var e = entry || pick(list);
  WD.word = e.w; WD.pic = e.pic;
  WD.need = e.w.split('');
  WD.slot = 0; WD.celT = 0; WD.hintT = 0;
  G.toast = ""; G.toastT = 0;
  var pool = [], i;
  for (i = 0; i < ALPHA.length; i++) if (WD.need.indexOf(ALPHA[i]) < 0) pool.push(ALPHA[i]);
  shuffle(pool);
  var tiles = WD.need.slice();
  tiles.push(pool[0]);                       /* exactly one distractor: big tiles, low floor */
  WD.tiles = shuffle(tiles).map(function (c) { return { ch: c, used: false }; });
  layout();
  promptWord();
}
function promptWord() {
  var w = WD.word, i;
  var sounds = '';
  for (i = 0; i < w.length; i++) sounds += SOUND[w[i]] + (i < w.length - 1 ? ', ' : '');
  shutUp();
  speak('This is a ' + w.toLowerCase() + '.', RATE);
  speak(sounds + '.', 0.5, 1.05);
  speak('Tap the letters to spell ' + w.toLowerCase() + '.', RATE);
}
function tapTile(i) {
  var tile = WD.tiles[i];
  if (!tile || tile.used || WD.celT > 0) return;
  if (tile.ch === WD.need[WD.slot]) {
    tile.used = true;
    WD.slot++;
    sfx.step();
    if (WD.slot >= WD.need.length) {
      WD.celT = 3.4;
      SV.words[WD.word] = true;
      persist();
      sfx.cheer();
      for (var k = 0; k < 90; k++) burst(view.w / 2 + rnd(-140, 140), view.h * 0.45);
      shutUp();
      speak(pick(PRAISE) + ' You spelled ' + WD.word.toLowerCase() + '.', RATE);
      toast('You spelled ' + WD.word);
    } else {
      sayFresh(letterName(tile.ch) + '. Now find ' + letterName(WD.need[WD.slot]) + '.');
    }
  } else {
    /* no failure feedback: no red, no buzzer, no shake — just a warm hand
       on the shoulder and a glow around the one she is looking for */
    WD.hintT = 2.6;
    sfx.soft();
    sayFresh('Looking for ' + letterName(WD.need[WD.slot]) + '. It is glowing.');
  }
}

/* ---------------------------------------------------------------- zones -- */
function zone(id, x, y, w, h, kind, extra) {
  var z = { id: id, x: x, y: y, w: w, h: h, kind: kind };
  if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) z[k] = extra[k];
  zones.push(z);
  return z;
}
/* lay n big buttons out in the left column (landscape) or bottom bar */
function btnSlot(i, n) {
  var B = L.bs, W = view.w, H = view.h;
  if (L.side) {
    var gap = Math.max(4, (H - n * B) / (n + 1));
    return { x: 8, y: gap + i * (B + gap), w: B, h: B };
  }
  var g2 = Math.max(6, (W - n * B) / (n + 1));
  return { x: g2 + i * (B + g2), y: H - B - 10, w: B, h: B };
}
function buildZones() {
  zones = [];
  var W = view.w, H = view.h, i;
  if (G.state === 'menu') {
    var s0 = btnSlot(0, 2), s1 = btnSlot(1, 2);
    zone('speak', s0.x, s0.y, s0.w, s0.h, 'speak');
    zone('gear', s1.x, s1.y, s1.w, s1.h, 'gear');
    var a = L.area, pad = 14;
    if (L.side) {
      var pw = (a.w - pad * 4) / 3;
      var ph = Math.min(a.h - 74, pw * 1.25);
      for (i = 0; i < 3; i++) zone('act' + i, a.x + pad + i * (pw + pad), 52, pw, ph, 'panel', { act: i });
    } else {
      var pw2 = Math.min(a.w - pad * 2, 460);
      var ph2 = Math.max(120, (a.h - 52 - pad * 3) / 3);
      for (i = 0; i < 3; i++) zone('act' + i, a.x + (a.w - pw2) / 2, 50 + i * (ph2 + pad), pw2, ph2, 'panel', { act: i });
    }
  } else if (G.state === 'trace') {
    var b0 = btnSlot(0, 3), b1 = btnSlot(1, 3), b2 = btnSlot(2, 3);
    zone('back', b0.x, b0.y, b0.w, b0.h, 'back');
    zone('speak', b1.x, b1.y, b1.w, b1.h, 'speak');
    zone('next', b2.x, b2.y, b2.w, b2.h, 'next');
  } else if (G.state === 'word') {
    var c0 = btnSlot(0, 3), c1 = btnSlot(1, 3), c2 = btnSlot(2, 3);
    zone('back', c0.x, c0.y, c0.w, c0.h, 'back');
    zone('speak', c1.x, c1.y, c1.w, c1.h, 'speak');
    zone('next', c2.x, c2.y, c2.w, c2.h, 'next');
    var t = WD.tiles.length;
    var c = L.card;
    var maxCols = Math.max(1, Math.floor((c.w - 12) / 122));
    var cols = Math.min(t, Math.max(2, maxCols));
    var rows = Math.ceil(t / cols);
    var ts = clamp(Math.min((c.w - 24) / cols - 12, (c.h * 0.38) / rows - 12), 88, 132);
    var gy = c.y + c.h - rows * (ts + 12) - 2;
    L.tilesTop = gy;   /* the picture and the answer slots stack up from here */
    for (var q = 0; q < t; q++) {
      var r = Math.floor(q / cols), col = q % cols;
      var inRow = Math.min(cols, t - r * cols);
      var rowW = inRow * ts + (inRow - 1) * 12;
      zone('tile' + q, c.x + (c.w - rowW) / 2 + col * (ts + 12), gy + r * (ts + 12), ts, ts, 'tile', { ti: q });
    }
  }
}
function hitZone(x, y) {
  for (var i = zones.length - 1; i >= 0; i--) {
    var z = zones[i];
    if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) return z;
  }
  return null;
}
function activate(z) {
  initAudio();
  sfx.tap();
  if (z.kind === 'panel') {
    if (z.act === 0) startTrace('letter');
    else if (z.act === 1) startTrace('name');
    else startWord(null);
    return;
  }
  switch (z.id) {
    case 'speak': repeatPrompt(); break;
    case 'back': menuScreen(); break;
    case 'gear': settingsScreen(); break;
    case 'next':
      if (G.state === 'trace') { if (TR.mode === 'name' && TR.done) nextLetter(1); else if (TR.mode === 'name') nextLetter(1); else loadLetter(); }
      else startWord(null);
      break;
    default:
      if (z.kind === 'tile') tapTile(z.ti);
  }
}
function repeatPrompt() {
  if (G.state === 'trace') promptLetter();
  else if (G.state === 'word') promptWord();
  else if (G.state === 'menu') sayMenu();
  else sayFresh('Tap the big button to start writing.');
}
function sayMenu() { sayFresh('Pick one. Trace a letter. Trace your name. Or build a word.'); }

/* ---------------------------------------------------------------- input -- */
function evPos(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
var lastInk = null;
cv.addEventListener('pointerdown', function (e) {
  initAudio();
  e.preventDefault();
  if (G.paused) { setPaused(false); return; }
  var p = evPos(e);
  var z = hitZone(p.x, p.y);
  if (z) { activate(z); return; }
  if (G.state === 'trace' && !TR.done) {
    TR.drawing = true; TR.touched = true; TR.idleT = 0;
    lastInk = p;
    TR.ink.push([toUnit(p)]);
    feedPoint(p.x, p.y);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
cv.addEventListener('pointermove', function (e) {
  if (!TR.drawing || G.state !== 'trace') return;
  e.preventDefault();
  var p = evPos(e);
  var line = TR.ink[TR.ink.length - 1];
  if (lastInk && line) {
    /* interpolate: a fast or jerky finger must not skip past target points */
    var d = Math.sqrt(dist2(lastInk.x, lastInk.y, p.x, p.y));
    var steps = Math.min(80, Math.max(1, Math.ceil(d / Math.max(3, TR.tol * 0.35))));
    for (var i = 1; i <= steps; i++) {
      var q = { x: lerp(lastInk.x, p.x, i / steps), y: lerp(lastInk.y, p.y, i / steps) };
      line.push(toUnit(q));
      feedPoint(q.x, q.y);
    }
  }
  lastInk = p;
});
function endDraw() { TR.drawing = false; lastInk = null; }
window.addEventListener('pointerup', endDraw);
window.addEventListener('pointercancel', endDraw);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('touchstart', function () { document.body.classList.add('touch'); }, { passive: true, once: true });
function toUnit(p) { return { x: (p.x - L.box.x) / L.box.w, y: (p.y - L.box.y) / L.box.h }; }
function toPx(u) { return { x: L.box.x + u.x * L.box.w, y: L.box.y + u.y * L.box.h }; }

window.addEventListener('keydown', function (e) {
  var k = e.key ? e.key.toLowerCase() : '';
  if (k === ' ' || k.indexOf('arrow') === 0) e.preventDefault();
  initAudio();
  if (k === 'm') { setMuted(!muted); return; }
  if (k === 'p') { if (G.state === 'trace' || G.state === 'word') setPaused(!G.paused); return; }
  if (k === 'escape') { if (G.state === 'trace' || G.state === 'word') menuScreen(); return; }
  if (G.state === 'title' && (k === ' ' || k === 'enter')) { menuScreen(); return; }
  if (k === ' ' || k === 'enter') { repeatPrompt(); return; }
  if (G.state === 'menu') {
    if (k === '1') startTrace('letter');
    else if (k === '2') startTrace('name');
    else if (k === '3') startWord(null);
    return;
  }
  if (G.state === 'trace' && (k === 'arrowright' || k === 'arrowleft')) nextLetter(k === 'arrowright' ? 1 : -1);
  if (G.state === 'word' && k === 'arrowright') startWord(null);
});

var padPrev = {};
function pollPad() {
  var pads = null;
  try { pads = navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) { return; }
  if (!pads) return;
  var p = null;
  for (var i = 0; i < pads.length; i++) if (pads[i] && pads[i].connected) { p = pads[i]; break; }
  if (!p) return;
  function pressed(n) { return !!(p.buttons && p.buttons[n] && p.buttons[n].pressed); }
  function edge(n) { var was = padPrev[n]; padPrev[n] = pressed(n); return padPrev[n] && !was; }
  if (edge(0)) { initAudio(); if (G.state === 'title') menuScreen(); else repeatPrompt(); }
  if (edge(1)) { if (G.state === 'trace' || G.state === 'word') menuScreen(); }
  if (edge(15)) { if (G.state === 'trace') nextLetter(1); else if (G.state === 'word') startWord(null); }
  if (edge(14) && G.state === 'trace') nextLetter(-1);
}

window.addEventListener('blur', function () { if (G.state === 'trace' || G.state === 'word') setPaused(true); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden && (G.state === 'trace' || G.state === 'word')) setPaused(true);
});
document.getElementById('muteBtn').addEventListener('click', function () { initAudio(); setMuted(!muted); });
document.getElementById('pauseBtn').addEventListener('click', function () {

});
function setPaused(v) {

/* -------------------------------------------------------------- overlays -- */

function titleScreen() {

  G.paused = false;
  document.body.classList.remove('playing');
  showOverlay(
    '<div class="card">' +
      '<div class="eyebrow">Overclock Arcade</div>' +

      '<div class="tagline">Big letters on handwriting lines, and a voice that reads every prompt out loud. Trace a letter, trace your name, build a word. The game finds the right level by playing along, and grows with the writer. No timer, no score, nothing to fail.</div>' +

  else if (act === 'sel') { nameEdit.sel = parseInt(btn.getAttribute('data-i'), 10) || 0; renderSettings(); }
  else if (act === 'set') {

    SV.rung = clamp(SV.rung + 1, 0, RUNGS.length - 1);
    SV.tol = clamp(SV.tol * 0.93, TOL_MIN, TOL_MAX);
    SV.clean = 0; SV.struggle = 0; persist(); layout(); renderSettings();

    var keepName = SV.name;
    SV = freshSave(); SV.name = keepName; persist(); layout(); renderSettings();

/* --------------------------------------------------------------- update -- */
function update(dt) {
  G.t += dt;
  if (G.toastT > 0) G.toastT -= dt;
  for (var i = G.parts.length - 1; i >= 0; i--) {
    var p = G.parts[i];
    p.t += dt;
    p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.t >= p.life) G.parts.splice(i, 1);
  }
  if (G.paused) return;
  if (G.state === 'trace') {
    if (TR.done) {
      TR.celT += dt;
    } else {
      TR.idleT += dt;
      if (TR.demo) {
        TR.demo.t += dt * 0.55;
        if (TR.demo.t >= 1.3) {
          /* she has watched it — count the stroke and let her move on.
             Nobody gets stuck on a stroke in this game. */
          TR.demo = null;
          if (TR.touched) finishStroke(true);
          else TR.idleT = -6;
        }
      } else if (TR.idleT > (TR.touched ? 5 : 8)) {
        TR.demo = { t: 0 };
        TR.idleT = 0;
        sayFresh(TR.touched ? 'Watch. It goes like this.' : 'Watch. It goes like this.');
      }
    }
  } else if (G.state === 'word') {
    if (WD.hintT > 0) WD.hintT -= dt;
    if (WD.celT > 0) {
      WD.celT -= dt;
      if (WD.celT <= 0) startWord(null);
    }
  }
}

    } else if (z.act === 1) {
      ctx.fillStyle = '#fdf0da';
      rrect(ctx, cx - s * 0.58, cy - s * 0.32, s * 1.16, s * 0.64, 10); ctx.fill();
      ctx.strokeStyle = '#7fb3d5'; ctx.lineWidth = 3;
      rrect(ctx, cx - s * 0.58, cy - s * 0.32, s * 1.16, s * 0.64, 10); ctx.stroke();
      ctx.fillStyle = '#7fb3d5';
      rrect(ctx, cx - s * 0.58, cy - s * 0.32, s * 1.16, s * 0.17, 8); ctx.fill();
      ctx.fillStyle = '#e2762b';
      var fs = Math.min(s * 0.3, (s * 1.0) / Math.max(3, SV.name.length) * 1.7);
      ctx.font = '800 ' + Math.round(fs) + 'px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(SV.name, cx, cy + s * 0.08);
    } else {
      drawPic(ctx, 'cat', cx, cy - s * 0.12, s * 0.92);
      for (var ti = 0; ti < 3; ti++) {
        var tw = s * 0.26;
        ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#8fc47f'; ctx.lineWidth = 2.5;
        rrect(ctx, cx - tw * 1.7 + ti * tw * 1.2, cy + s * 0.36, tw, tw, 6);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#4a3628';
        ctx.font = '800 ' + Math.round(tw * 0.62) + 'px "Segoe UI", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('CAT'[ti], cx - tw * 1.7 + ti * tw * 1.2 + tw / 2, cy + s * 0.36 + tw / 2 + 1);
      }
    }
    ctx.fillStyle = '#4a3628';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(clamp(z.w * 0.07, 13, 20)) + 'px "Segoe UI", sans-serif';
    ctx.fillText(['TRACE A LETTER', 'TRACE YOUR NAME', 'BUILD A WORD'][z.act], z.x + z.w / 2, z.y + z.h - 20);
  }
}
function drawWord() {
  drawCard();
  var c = L.card;
  /* stack up from the tiles so a short landscape card cannot overlap itself */
  var tilesTop = L.tilesTop || (c.y + c.h * 0.6);
  var n = WD.need.length;
  var sw = clamp(Math.min((c.w - 40) / n, (tilesTop - c.y) * 0.3), 34, 72);
  var sy = tilesTop - sw * 0.95 - 12;
  var sx = c.x + c.w / 2 - (n * sw) / 2;
  var picS = clamp(Math.min(c.w * 0.5, (sy - c.y - 18)), 50, 260);
  drawPic(ctx, WD.pic, c.x + c.w / 2, c.y + (sy - c.y) / 2, picS);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < n; i++) {
    var filled = i < WD.slot;
    ctx.fillStyle = filled ? '#d8f0d0' : '#fdf0da';
    ctx.strokeStyle = (i === WD.slot && WD.celT <= 0) ? '#e2762b' : '#dcc09a';
    ctx.lineWidth = 3;
    rrect(ctx, sx + i * sw + 4, sy, sw - 8, sw * 0.95, 10);
    ctx.fill(); ctx.stroke();
    if (filled) {
      ctx.fillStyle = '#3d7a2e';
      ctx.font = '800 ' + Math.round(sw * 0.56) + 'px "Segoe UI", sans-serif';
      ctx.fillText(WD.need[i], sx + i * sw + sw / 2, sy + sw * 0.5);
    }
  }
  for (var z = 0; z < zones.length; z++) {
    if (zones[z].kind === 'tile') drawTile(zones[z]);
    else drawBtn(zones[z]);
  }
  if (WD.celT > 0) {
    ctx.fillStyle = '#3d7a2e';
    ctx.font = '800 ' + Math.round(clamp(view.w * 0.07, 22, 40)) + 'px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(WD.word + '!', c.x + c.w / 2, sy - sw * 0.55);
  }
}
function drawNameCelebration() {
  var c = L.card;
  var cx = c.x + c.w / 2, cy = c.y + c.h * 0.44;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var wob = Math.sin(G.t * 2.2) * 0.02;
  ctx.translate(cx, cy); ctx.rotate(wob); ctx.translate(-cx, -cy);
  ctx.fillStyle = '#fdf0da';
  rrect(ctx, c.x + c.w * 0.06, cy - c.h * 0.2, c.w * 0.88, c.h * 0.4, 18); ctx.fill();
  ctx.strokeStyle = '#7fb3d5'; ctx.lineWidth = 5;
  rrect(ctx, c.x + c.w * 0.06, cy - c.h * 0.2, c.w * 0.88, c.h * 0.4, 18); ctx.stroke();
  ctx.fillStyle = '#7fb3d5';
  rrect(ctx, c.x + c.w * 0.06, cy - c.h * 0.2, c.w * 0.88, c.h * 0.1, 16); ctx.fill();
  var fs = Math.min(c.h * 0.2, (c.w * 0.8) / Math.max(3, SV.name.length) * 1.5);
  ctx.fillStyle = '#ef5f3c';
  ctx.font = '800 ' + Math.round(fs) + 'px "Segoe UI", sans-serif';
  ctx.fillText(SV.name, cx, cy + c.h * 0.06);
  ctx.restore();
  ctx.fillStyle = '#3d7a2e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 ' + Math.round(clamp(view.w * 0.05, 18, 30)) + 'px "Segoe UI", sans-serif';
  ctx.fillText('THAT IS YOUR NAME!', cx, c.y + c.h * 0.86);
}
function drawParts() {
  for (var i = 0; i < G.parts.length; i++) {
    var p = G.parts[i];
    ctx.save();
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.5);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function render() {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  paperBg();
  buildZones();
  var i;
  if (G.state === 'menu') drawMenu();
  else if (G.state === 'trace') {
    drawCard();
    if (TR.nameDone) drawNameCelebration();
    else {
      drawRules();
      drawStrip();
      drawTraceLetter();
      if (TR.done) {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#3d7a2e';
        ctx.font = '800 ' + Math.round(clamp(view.w * 0.06, 20, 36)) + 'px "Segoe UI", sans-serif';
        ctx.fillText('YES!', L.card.x + L.card.w / 2, L.card.y + L.card.h - 26);
      }
    }
    for (i = 0; i < zones.length; i++) drawBtn(zones[i]);
  } else if (G.state === 'word') drawWord();
  drawParts();
  if (G.toastT > 0 && G.toast) {
    ctx.save();
    ctx.globalAlpha = clamp(G.toastT / 0.6, 0, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(74,54,40,0.7)';
    ctx.font = '700 13px "Segoe UI", sans-serif';
    /* inside the card, never under the button row */
    ctx.fillText(G.toast, L.card.x + L.card.w / 2, L.card.y + L.card.h - 6);
    ctx.restore();
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(253,240,218,0.55)';
    ctx.fillRect(0, 0, view.w, view.h);
  }
}

/* ----------------------------------------------------------------- loop -- */
var lastT = 0;
function frame(now) {
  window.requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  var dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  pollPad();
  update(dt);
  render();
}

/* ----------------------------------------------------------------- boot -- */
resize();
if (window.ResizeObserver) {
  try { new window.ResizeObserver(resize).observe(stage); } catch (e) {}
}
setMuted(muted);
titleScreen();
window.requestAnimationFrame(frame);

/* ==================================================== WHO IS READING == */
/* Shared across every spoken game in the arcade. She picks a character once
   and Char, Echo, Scan, Trace and Tally all speak in it — one key, one choice,
   because being asked the same question in five places is not a feature.
 *
 * What is possible has to be said plainly, because it shapes this whole
 * design: speechSynthesis can only use voices ALREADY INSTALLED on the device.
 * These games ship no audio files and call no APIs, so no custom voice can
 * travel with them. The honest levers are which device voice is used and its
 * pitch and speed — and those change the character more than the name does.
 *
 * She cannot read a list of voice names, so she picks by EAR: four faces, and
 * tapping one plays it introducing itself. Nothing here is ever required — if
 * speech is missing the button hides itself and the game plays on in silence,
 * exactly as it did before. */
var OC_VOICE_KEY = 'overclock_voice_v1';
var OC_CHARACTERS = [
  { id: 'sunny', name: 'Sunny', pitch: 1.08, rate: 0.85, hint: 'warm and steady',
    line: 'Hello. I am Sunny. I will read everything to you.',
    face: '<circle cx="50" cy="50" r="34" fill="#ffd54f"/>' +
      '<circle cx="39" cy="43" r="4.5" fill="#4a3520"/><circle cx="61" cy="43" r="4.5" fill="#4a3520"/>' +
      '<path d="M36 60 q14 12 28 0" stroke="#4a3520" stroke-width="4" fill="none" stroke-linecap="round"/>' },
  { id: 'chip', name: 'Chip', pitch: 0.62, rate: 0.8, hint: 'a deep robot',
    line: 'Greetings. I am Chip. I am a computer.',
    face: '<rect x="20" y="24" width="60" height="52" rx="8" fill="#90a4ae"/>' +
      '<rect x="32" y="40" width="12" height="8" rx="2" fill="#1b2748"/><rect x="56" y="40" width="12" height="8" rx="2" fill="#1b2748"/>' +
      '<rect x="34" y="60" width="32" height="5" rx="2.5" fill="#1b2748"/>' +
      '<line x1="50" y1="24" x2="50" y2="12" stroke="#90a4ae" stroke-width="4"/><circle cx="50" cy="9" r="5" fill="#ef6c00"/>' },
  { id: 'pip', name: 'Pip', pitch: 1.5, rate: 1.0, hint: 'quick and squeaky',
    line: 'Hi hi! I am Pip! Lets go!',
    face: '<circle cx="50" cy="52" r="30" fill="#f06292"/>' +
      '<circle cx="40" cy="46" r="5" fill="#fff"/><circle cx="60" cy="46" r="5" fill="#fff"/>' +
      '<circle cx="41" cy="47" r="2.5" fill="#3e2723"/><circle cx="61" cy="47" r="2.5" fill="#3e2723"/>' +
      '<path d="M40 63 q10 9 20 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M28 30 l8 12 M72 30 l-8 12" stroke="#f06292" stroke-width="5" stroke-linecap="round"/>' },
  { id: 'moss', name: 'Moss', pitch: 0.95, rate: 0.62, hint: 'slow and calm',
    line: 'Hello. I am Moss. I will take my time.',
    face: '<circle cx="50" cy="52" r="31" fill="#66bb6a"/>' +
      '<path d="M38 46 q4 -4 8 0 M54 46 q4 -4 8 0" stroke="#1b3a1e" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
      '<path d="M38 62 q12 8 24 0" stroke="#1b3a1e" stroke-width="4" fill="none" stroke-linecap="round"/>' }
];
var OC_VOICE = { charId: 'sunny', uri: '' };
var OC_LIST = [];
function ocChar(id) { var i; for (i = 0; i < OC_CHARACTERS.length; i++) if (OC_CHARACTERS[i].id === id) return OC_CHARACTERS[i]; return OC_CHARACTERS[0]; }
function ocCur() { return ocChar(OC_VOICE.charId); }
function ocLoadVoice() {
  var raw = null, o = null;
  try { raw = localStorage.getItem(OC_VOICE_KEY); } catch (e) {}
  if (!raw) return;
  try { o = JSON.parse(raw); } catch (e) { return; }
  if (!o || typeof o !== 'object') return;
  if (typeof o.charId === 'string' && ocChar(o.charId).id === o.charId) OC_VOICE.charId = o.charId;
  if (typeof o.uri === 'string') OC_VOICE.uri = o.uri;
}
function ocSaveVoice() {
  try { localStorage.setItem(OC_VOICE_KEY, JSON.stringify({ charId: OC_VOICE.charId, uri: OC_VOICE.uri })); } catch (e) {}
}
function ocVoices() {
  var out = [], vs = [], i;
  try { vs = window.speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
  for (i = 0; i < vs.length; i++) if (vs[i] && /^en/i.test(vs[i].lang || '')) out.push(vs[i]);
  if (!out.length) out = vs.slice(0, 8);
  OC_LIST = out;
  return out;
}
function ocPickedVoice(fallback) {
  var i;
  if (!OC_LIST.length) ocVoices();
  if (OC_VOICE.uri) for (i = 0; i < OC_LIST.length; i++) if (OC_LIST[i].voiceURI === OC_VOICE.uri) return OC_LIST[i];
  return fallback || OC_LIST[0] || null;
}
/* the one call every game's say() makes */
function ocApply(u, fallbackVoice, rateOverride) {
  var C = ocCur();
  u.rate = rateOverride || C.rate;
  u.pitch = C.pitch;
  var v = ocPickedVoice(fallbackVoice);
  if (v) u.voice = v;
  return u;
}
function ocSpeak(text) {
  try {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return false;
    window.speechSynthesis.cancel();
    var u = new window.SpeechSynthesisUtterance(String(text));
    ocApply(u, null);
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}
function ocSpeechOK() {
  try { return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); } catch (e) { return false; }
}
/* ---- the picker: its own overlay and its own styles, so it drops into any
        of these games without touching that game's screen system ---- */
function ocVoiceUI() {
  if (!ocSpeechOK()) return;
  var st = document.createElement('style');
  st.textContent =
    '#ocVoiceBtn{position:fixed;left:max(10px,env(safe-area-inset-left));' +
    'bottom:max(10px,env(safe-area-inset-bottom));z-index:40;min-height:44px;padding:0 12px 0 8px;' +
    'display:inline-flex;align-items:center;gap:7px;border-radius:14px;cursor:pointer;' +
    'border:2px solid rgba(128,128,128,0.38);background:rgba(255,255,255,0.9);color:#333;' +
    'font:700 12px "Segoe UI",system-ui,sans-serif;letter-spacing:0.06em;}' +
    '#ocVoiceBtn svg{width:28px;height:28px;display:block}' +
    'body.playing #ocVoiceBtn{display:none}' +
    '#ocVoiceWrap{position:fixed;inset:0;z-index:60;background:rgba(12,18,14,0.72);' +
    'display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}' +
    '#ocVoiceWrap.on{display:flex}' +
    '#ocVoicePanel{background:#fff;border-radius:22px;padding:16px;max-width:560px;width:100%;' +
    'font-family:"Segoe UI",system-ui,sans-serif;color:#2f4030;box-shadow:0 12px 40px rgba(0,0,0,0.35)}' +
    '#ocVoicePanel h3{margin:0 0 12px;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;' +
    'text-align:center;color:#5d7159}' +
    '#ocVoiceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}' +
    '.ocvc{min-height:110px;border-radius:18px;border:4px solid rgba(47,64,48,0.18);background:#fff;' +
    'cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}' +
    '.ocvc.on{border-color:#43a047;background:#e8f5e9}' +
    '.ocvc svg{width:56px;height:56px;display:block}' +
    '.ocvc b{font-size:15px}.ocvc i{font-style:normal;font-size:11px;color:#5d7159;font-weight:700}' +
    '#ocVoiceGrown{font-size:11px;color:#5d7159;line-height:1.5;margin-top:10px;text-align:center}' +
    '#ocVoiceGrown select{font:inherit;font-size:11px;padding:3px 5px;border-radius:8px;' +
    'border:2px solid rgba(47,64,48,0.18);max-width:180px}' +
    '#ocVoiceDone{margin-top:12px;width:100%;min-height:52px;border-radius:14px;border:4px solid #2e7d32;' +
    'background:#81c784;color:#06280b;font:800 15px "Segoe UI",system-ui,sans-serif;letter-spacing:0.14em;cursor:pointer}' +
    '@media (max-height:460px){#ocVoiceGrid{grid-template-columns:repeat(4,1fr)}' +
    '.ocvc{min-height:88px}.ocvc i{display:none}#ocVoiceGrown{display:none}}';
  document.head.appendChild(st);

  var btn = document.createElement('button');
  btn.id = 'ocVoiceBtn'; btn.type = 'button';
  btn.setAttribute('aria-label', 'Choose who reads to you');

  var wrap = document.createElement('div');
  wrap.id = 'ocVoiceWrap';
  wrap.innerHTML = '<div id="ocVoicePanel"><h3>Who should read to you?</h3>' +
    '<div id="ocVoiceGrid"></div><div id="ocVoiceGrown"></div>' +
    '<button id="ocVoiceDone" type="button">DONE</button></div>';

  function svg(inner, cls) {
    return '<svg viewBox="0 0 100 100" class="' + (cls || '') + '" aria-hidden="true">' + inner + '</svg>';
  }
  function paintBtn() { btn.innerHTML = svg(ocCur().face) + '<span>' + ocCur().name + '</span>'; }
  function paintGrid() {
    var g = wrap.querySelector('#ocVoiceGrid'), h = '', i, c;
    for (i = 0; i < OC_CHARACTERS.length; i++) {
      c = OC_CHARACTERS[i];
      h += '<button class="ocvc' + (c.id === OC_VOICE.charId ? ' on' : '') + '" type="button" data-oc="' + c.id +
        '" aria-label="' + c.name + ', ' + c.hint + '">' + svg(c.face) +
        '<b>' + c.name + '</b><i>' + c.hint + '</i></button>';
    }
    g.innerHTML = h;
    var gr = wrap.querySelector('#ocVoiceGrown'), list = ocVoices();
    if (list.length > 1) {
      var cur = ocPickedVoice(null), s = 'Grown-ups: the device voice underneath is <select id="ocVoiceSel">';
      for (i = 0; i < list.length && i < 24; i++) {
        s += '<option value="' + list[i].voiceURI + '"' +
             (cur && list[i].voiceURI === cur.voiceURI ? ' selected' : '') + '>' +
             String(list[i].name).slice(0, 26) + '</option>';
      }
      gr.innerHTML = s + '</select>. More can be added in the device&rsquo;s own settings.';
      var sel = wrap.querySelector('#ocVoiceSel');
      if (sel) sel.addEventListener('change', function () { OC_VOICE.uri = sel.value; ocSaveVoice(); ocSpeak(ocCur().line); });
    } else { gr.innerHTML = ''; }
  }
  btn.addEventListener('click', function () { paintGrid(); wrap.classList.add('on'); });
  wrap.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-oc]') : null;
    if (t) {
      OC_VOICE.charId = ocChar(t.getAttribute('data-oc')).id;
      ocSaveVoice(); paintGrid(); paintBtn();
      ocSpeak(ocCur().line);
      return;
    }
    if (e.target === wrap || (e.target && e.target.id === 'ocVoiceDone')) {
      wrap.classList.remove('on');
      try { window.speechSynthesis.cancel(); } catch (err) {}
    }
  });
  document.body.appendChild(btn);
  document.body.appendChild(wrap);
  paintBtn();
}
ocLoadVoice();
try {
  if (ocSpeechOK() && window.speechSynthesis) window.speechSynthesis.onvoiceschanged = ocVoices;
} catch (e) {}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ocVoiceUI);
else ocVoiceUI();
window.setTimeout(function () { ocVoices(); }, 400);

</script>
