<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Syntax — Sentence Lab</title>
<meta name="theme-color" content="#0b0f1e">
<meta name="description" content="A calm sentence lab. Capitals, end marks, commas, apostrophes and homophones — one rule at a time, always explained.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Syntax">
<meta name="format-detection" content="telephone=no">
<style>
  :root {
    --bg: #0b0f1e;
    --accent: #ffcc4d;
    --fg: #eaf2ff;
    --dim: rgba(234,242,255,0.58);
    --panel: rgba(9,13,30,0.62);
    --line: rgba(255,255,255,0.13);
    --ok: #4fd39a;
    --ok-edge: #7ff0c0;
    --bad: #ff8a7a;
    --bad-edge: #ffbdb3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: manipulation;
  }
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,204,77,0.08), rgba(255,204,77,0) 60%),
      radial-gradient(90% 70% at 50% 110%, rgba(79,211,154,0.07), rgba(79,211,154,0) 65%),
      var(--bg);
  }

  #brand {
    position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left));
    font-size: 18px; font-weight: 700; letter-spacing: 0.22em; color: var(--accent);
    text-shadow: 0 0 18px rgba(255,204,77,0.35); z-index: 4; pointer-events: none;
  }
  #brand small { display: block; font-size: 8.5px; letter-spacing: 0.3em; color: var(--dim); font-weight: 600; }
  body.playing #brand { display: none; }

  #topbtns {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    right: max(8px, env(safe-area-inset-right));
    display: flex; gap: 6px; z-index: 6;
  }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line);
    font-family: inherit; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .iconbtn:active { background: rgba(255,204,77,0.25); }
  body:not(.playing) #topbtns { display: none; }

  /* ------------------------------------------------------------- play -- */
  #play {
    position: absolute; inset: 0; display: none;
    flex-direction: column; gap: 6px;
    padding: 8px max(10px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-right));
  }
  body.playing #play { display: flex; }

  #hud {
    flex: 0 0 auto; min-height: 44px; padding-right: 104px;
    display: flex; flex-direction: column; justify-content: center;
  }
  #hudTitle { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
  #hudSub { font-size: 11px; color: var(--dim); letter-spacing: 0.05em; margin-top: 2px; }

  #scroll { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  /* centres a short item on a tall phone, but still grows and scrolls for the
     long ones — min-height, not justify-content on the scroller, or the top of
     an over-tall paragraph becomes unreachable */
  #inner { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding-bottom: 10px; }
  #prompt {
    font-size: clamp(12.5px, 3.6vw, 15px); color: var(--fg); line-height: 1.35;
    margin: 2px 0 10px; text-align: center;
  }
  #work { display: flex; flex-direction: column; gap: 10px; align-items: center; }

  .tilerow {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    width: 100%; max-width: 700px;
  }
  .tilerow.left { justify-content: flex-start; }
  .wtile {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    min-height: 46px; min-width: 44px; padding: 4px 10px;
    border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.05); color: var(--fg);
    font-family: inherit; font-size: clamp(14px, 4vw, 18px); font-weight: 600;
    line-height: 1.15; letter-spacing: 0.01em;
    cursor: pointer; overflow-wrap: anywhere; max-width: 100%;
  }
  .wtile.flat { cursor: default; background: transparent; border-color: transparent; padding: 4px 3px; min-width: 0; }
  .wtile.on { background: rgba(255,204,77,0.18); border-color: rgba(255,204,77,0.75); color: var(--accent); }
  .wtile.ok { background: rgba(79,211,154,0.16); border: 2px solid var(--ok-edge); color: var(--ok); }
  .wtile.bad { background: rgba(255,138,122,0.14); border: 2px dashed var(--bad-edge); color: var(--bad); }
  .wtile.miss { background: rgba(255,204,77,0.12); border: 2px dotted var(--accent); color: var(--accent); }
  .wtile.fixed { background: rgba(79,211,154,0.16); border: 2px solid var(--ok-edge); color: var(--ok); }
  .wtile .mk { font-size: 12px; font-weight: 800; }
  .wtile .cm { color: var(--accent); font-weight: 800; }
  .wtile[disabled] { opacity: 0.9; }

  .blank {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 46px; min-width: 78px; padding: 4px 10px;
    border-radius: 10px; border: 2px dashed rgba(255,204,77,0.7);
    background: rgba(255,204,77,0.08); color: var(--accent);
    font-size: clamp(14px, 4vw, 18px); font-weight: 700;
  }

  .sentbox {
    width: 100%; max-width: 640px;
    border: 1px solid var(--line); border-radius: 12px;
    background: rgba(255,255,255,0.04);
    padding: 12px 12px; text-align: center;
    font-size: clamp(15px, 4.4vw, 20px); line-height: 1.45; overflow-wrap: anywhere;
  }

  .line {
    width: 100%; max-width: 700px; min-height: 58px;
    border: 1px dashed rgba(255,255,255,0.22); border-radius: 12px;
    background: rgba(255,255,255,0.03); padding: 6px;
    display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; justify-content: center;
  }
  .line .hint { color: var(--dim); font-size: 12px; align-self: center; margin: auto; }
  .banklabel { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); }

  .opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 640px; }
  .opt {
    min-height: 48px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--fg);
    font-family: inherit; font-size: clamp(13.5px, 3.8vw, 16px); font-weight: 600;
    cursor: pointer; overflow-wrap: anywhere; max-width: 100%;
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  .opt.on { background: rgba(255,204,77,0.18); border-color: rgba(255,204,77,0.75); color: var(--accent); }
  .opt.ok { background: rgba(79,211,154,0.16); border: 2px solid var(--ok-edge); color: var(--ok); }
  .opt.bad { background: rgba(255,138,122,0.14); border: 2px dashed var(--bad-edge); color: var(--bad); }
  .opt.wide { width: 100%; }
  .mark { min-width: 56px; min-height: 52px; font-size: 24px; font-weight: 800; }

  #feedback { width: 100%; max-width: 640px; margin: 4px auto 0; }
  .fb {
    border-radius: 12px; padding: 11px 13px;
    font-size: clamp(12.5px, 3.5vw, 15px); line-height: 1.42;
    border: 1px solid var(--line); background: rgba(255,255,255,0.05);
  }
  .fb.good { border: 1px solid var(--ok-edge); background: rgba(79,211,154,0.12); }
  .fb.teach { border: 1px solid rgba(255,204,77,0.55); background: rgba(255,204,77,0.09); }
  .fb .hd { font-weight: 800; letter-spacing: 0.06em; display: block; margin-bottom: 4px; }
  .fb.good .hd { color: var(--ok); }
  .fb.teach .hd { color: var(--accent); }
  .fb p { margin: 5px 0 0; }
  .fb b { color: var(--accent); }

  #actions { flex: 0 0 auto; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding-top: 4px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 50px; padding: 0 24px;
    border-radius: 10px; border: 1px solid rgba(255,204,77,0.6);
    background: rgba(255,204,77,0.15); color: var(--accent);
    font-family: inherit; font-size: 13.5px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; cursor: pointer;
  }
  .btn:active { background: rgba(255,204,77,0.32); }
  .btn.ghost { border-color: var(--line); color: var(--fg); background: rgba(255,255,255,0.05); }
  .btn[disabled] { opacity: 0.4; }
  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  /* ------------------------------------------------------------ overlay -- */
  #overlay {
    position: absolute; inset: 0; z-index: 10; display: none;
    align-items: safe center; justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 90% at 50% 0%, rgba(12,17,36,0.86), rgba(5,7,16,0.96));
    overflow-y: auto;
  }
  #overlay.on { display: flex; }
  .card {
    width: min(560px, 100%);
    background: rgba(13,18,38,0.94);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 18px 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.65);
    text-align: center;
  }
  .eyebrow { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--dim); }
  h1 { margin: 6px 0 2px; font-size: clamp(30px, 9vw, 50px); letter-spacing: 0.16em; font-weight: 700; line-height: 1; color: var(--accent); text-shadow: 0 0 26px rgba(255,204,77,0.3); }
  h2 { margin: 2px 0 6px; font-size: clamp(18px, 5.4vw, 26px); letter-spacing: 0.07em; font-weight: 700; }
  .tagline { font-size: 12.5px; color: var(--dim); letter-spacing: 0.03em; margin-bottom: 10px; line-height: 1.45; }
  .keys { display: grid; grid-template-columns: 1fr; gap: 5px; font-size: 12.5px; color: var(--dim); margin: 10px auto 4px; max-width: 360px; text-align: left; }
  .keys > div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 4px; }
  .keys span { color: var(--fg); font-weight: 700; }

  .stagelist { display: flex; flex-direction: column; gap: 7px; margin: 10px 0 4px; text-align: left; }
  .srow {
    display: flex; align-items: center; gap: 9px; width: 100%;
    min-height: 50px; padding: 6px 11px; border-radius: 11px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--fg);
    font-family: inherit; font-size: 13.5px; font-weight: 600; text-align: left; cursor: pointer;
  }
  .srow .num { flex: 0 0 26px; height: 26px; border-radius: 7px; background: rgba(255,204,77,0.16); color: var(--accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .srow .nm { flex: 1 1 auto; line-height: 1.2; overflow-wrap: anywhere; }
  .srow .st { flex: 0 0 auto; font-size: 11px; color: var(--dim); letter-spacing: 0.06em; }
  .srow.done { border-color: rgba(79,211,154,0.5); }
  .srow.done .st { color: var(--ok); }
  .srow.locked { opacity: 0.45; cursor: not-allowed; }

  .prow { display: flex; align-items: center; gap: 9px; margin: 6px 0; }
  .prow .pn { flex: 0 0 96px; font-size: 11.5px; letter-spacing: 0.05em; color: var(--fg); text-align: left; }
  .bar { flex: 1 1 auto; height: 12px; border-radius: 7px; background: rgba(255,255,255,0.08); overflow: hidden; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, rgba(255,204,77,0.85), rgba(79,211,154,0.85)); }
  .prow .pv { flex: 0 0 78px; font-size: 11px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  .prow .pv.weak { color: var(--bad); font-weight: 700; }
  .paused { font-size: clamp(24px, 7vw, 40px); font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); }

  @media (max-height: 620px) {
    .card { padding: 13px 14px; border-radius: 12px; }
    .keys { display: none; }
    h1 { font-size: clamp(26px, 7vw, 38px); }
    .srow { min-height: 46px; }
  }
  @media (max-width: 380px) {
    .btn { padding: 0 16px; font-size: 12.5px; letter-spacing: 0.1em; }
    .wtile { padding: 4px 8px; gap: 3px; }
    .prow .pn { flex-basis: 82px; font-size: 11px; }
    .prow .pv { flex-basis: 66px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="brand">SYNTAX<small>SENTENCE LAB</small></div>
  <div id="topbtns">
    <button class="iconbtn" id="muteBtn" type="button" aria-label="Mute">&#9835;</button>
    <button class="iconbtn" id="pauseBtn" type="button" aria-label="Menu">&#10073;&#10073;</button>
  </div>
  <div id="play">
    <div id="hud"><div id="hudTitle">&nbsp;</div><div id="hudSub">&nbsp;</div></div>
    <div id="scroll">
      <div id="inner">
        <div id="prompt"></div>
        <div id="work"></div>
        <div id="feedback"></div>
      </div>
    </div>
    <div id="actions"></div>
  </div>
  <div id="overlay"></div>
</div>
<script>
/* =========================================================================
   SYNTAX — the sentence lab for the Overclock arcade.
   The pun is grammar syntax / code syntax; the job is teaching a kid to
   write one clean sentence. Seven stages, every wrong answer explained in
   plain words, weak rules resurfaced, a parent-readable progress panel.
   One file, no assets, oscillator audio, no timers and no way to lose.
   ========================================================================= */
"use strict";

var SYNTAX_FILE_MARKER = "SYNTAX_OVERCLOCK_SENTENCE_LAB_V1";
var K_SAVE = 'syntax_v1';
var K_MUTE = 'syntax_muted_v1';

/* ================================================================ words == */
/* These lists are the game's teaching vocabulary AND the ground truth the
   content self-check runs against, so every authored sentence must be
   spelled out of them. */
var PROPER = {
  sarah: 'name', ben: 'name', mia: 'name', jordan: 'name', anna: 'name',
  milo: 'pet', rusty: 'pet', pepper: 'pet', clover: 'pet',
  oakwood: 'place', riverside: 'place', ohio: 'place', texas: 'place',
  monday: 'day', tuesday: 'day', wednesday: 'day', friday: 'day', saturday: 'day', sunday: 'day',
  march: 'month', june: 'month', october: 'month'
};
var CAP_WHY = {
  name: 'Names of people always get a capital letter.',
  pet: "A pet's name is a name too, so it gets a capital letter.",
  place: 'The name of a place always gets a capital letter.',
  day: 'Days of the week always get a capital letter.',
  month: 'The names of months always get a capital letter.',
  start: 'Every sentence starts with a capital letter.',
  i: 'The word I is always a capital, even all by itself.'
};
var QUESTION_STARTERS = ['who','what','where','when','why','how','is','are','was','were','do','does','did','can','could','will','would','should','have','has','had','am','may'];
var EXCLAIM_CUES = ['wow','look','watch','hooray','yay','oh','help','won','amazing','huge','never','stop','hurry','great'];
var INTRO_STARTERS = ['after','before','when','while','if','since','because','although','finally','first','then','next','yesterday','on','in','during','at','later','once','suddenly','every'];
var CONJ = ['and','but','or','so','yet'];
var SUBORDINATORS = ['because','when','while','if','after','before','since','although','unless','until','though','whenever'];
var PRONOUNS = ['i','he','she','we','they','it','you','who','everyone','nobody','there'];
/* verbs that take a whole clause after them — "Sarah said we needed a bath" is
   one sentence, not two, so these switch the run-on detector off */
var REPORT_VERBS = ['said','says','say','think','thinks','know','knows','told','tell','felt','feel','hope','hopes','wish','asked','ask','saw','see','sees','heard','hear'];
var DETS = ['the','my','our','a','an','his','her','their','its','this','that','these','those','some','all','every','both','two','one'];
var VERBS = ['ran','run','runs','sat','sit','sits','barked','bark','barks','washed','wash','dried','dry','rode','ride','rides','got','get','gets','was','were','is','are','am','be','been','blew','blow','rained','rain','rains','turned','turn','turns','stopped','stop','stops','went','go','goes','planted','plant','plants','played','play','plays','feed','feeds','fed','sleeps','sleep','slept','naps','nap','likes','like','liked','love','loves','helped','help','helps','visit','visits','drove','drive','drives','won','win','wins','watched','watch','watches','look','looks','looked','does','do','did','has','have','had','will','can','could','would','should','may','might','ate','eat','eats','made','make','makes','saw','see','sees','jumped','jump','jumps','walked','walk','walks','read','reads','put','chased','chase','chases','found','find','finds','took','take','takes','gave','give','gives','felt','feel','feels','said','say','says','called','call','calls','painted','paint','baked','bake','filled','fill','spilled','spill','waited','wait','waits','carried','carry','picked','pick','picks','wagged','wag','licked','lick','purred','purr','hopped','hop','dug','dig','swim','swam','threw','throw','caught','catch','need','needs','want','wants','know','knows','think','thinks','shook','shake','covered','cover','curls','curl','bring','brings','brought','come','comes','came','packed','pack','grabbed','grab','wanted','hanging','hang','smells','smell','stayed','stay','told','tell','left','leave','loved','finished','finish'];
var NOUNS = ['dog','dogs','cat','cats','bike','bikes','park','school','ball','balls','yard','porch','kite','game','games','team','leash','leashes','bed','window','windows','bird','birds','book','books','pancakes','lunch','noon','morning','day','days','rain','mud','soup','truck','seeds','sister','brother','puppy','puppies','fish','apples','cheese','crackers','glove','bat','cap','homework','sun','pizza','water','blanket','room','jacket','jackets','shoes','shoe','hole','bath','fur','smell','tail','ears','toys','box','door','doors','backpacks','backpack','song','songs','mail','fence','hill','wagon','sock','socks','snack','snacks','fish','walk','house','store','town','library','practice','kitchen','field','trail','tree','trees','table','chair','floor','coat','boots','gloves','friend','friends','class','teacher','bus'];
var NOUNS_PLURAL = ['dogs','cats','bikes','balls','windows','birds','books','puppies','apples','crackers','leashes','toys','doors','backpacks','songs','jackets','shoes','socks','snacks','friends','trees','boots','gloves','seeds','fish','crackers','games','days'];
var ADJECTIVES = ['new','soft','red','blue','big','muddy','huge','loud','warm','hot','cold','sunny','softest','best','funny','happy','tired','ready','late','excited','quiet','busy','wet','dry','clean','dirty','little','tall','small','sleepy','hungry','proud','kind','brave','always'];
var GERUNDS = ['going','coming','playing','running','riding','reading','waiting','singing','sleeping','helping','looking','making','getting','staying','bringing'];
var PLACE_NOUNS = ['school','park','town','store','house','bed','practice','library','game','yard','kitchen','field','class','bus'];
var PLACE_PREPS = ['over','in','out','up','down','under','right','and','to','back','from','near'];
var CONTRACTIONS = {
  "it's": ['it is','it has'],
  "let's": ['let us'],
  "don't": ['do not'],
  "we're": ['we are'],
  "they're": ['they are'],
  "you're": ['you are'],
  "can't": ['can not','cannot'],
  "didn't": ['did not'],
  "isn't": ['is not'],
  "i'm": ['i am'],
  "she's": ['she is','she has'],
  "he's": ['he is'],
  "that's": ['that is'],
  "we'll": ['we will']
};

function has(list, w) { return list.indexOf(w) >= 0; }
function bare(t) { return String(t).toLowerCase().replace(/[^a-z']/g, ''); }
function words_(s) { return String(s).toLowerCase().replace(/[^a-z' ]/g, ' ').split(/\s+/).filter(Boolean); }
function isVerb(w) { return has(VERBS, w); }
function isSubjWord(w) { return has(PRONOUNS, w) || has(DETS, w) || !!PROPER[w]; }

/* how many subject+verb clauses live in a stretch of text */
function clauseCount(text) {
  var ws = words_(text), n = 0, i = 0;
  while (i < ws.length) {
    if (isSubjWord(ws[i])) {
      var lim = Math.min(ws.length, i + 8), j = i + 1, found = -1;
      while (j < lim) { if (isVerb(ws[j])) { found = j; break; } j++; }
      if (found >= 0) { n++; i = found + 1; continue; }
    }
    i++;
  }
  return n;
}
function startsSub(text) { return has(SUBORDINATORS, words_(text)[0] || ''); }
function isRunon(text) {
  if (/[,;]/.test(text)) return false;
  var ws = words_(text);
  for (var i = 0; i < ws.length; i++) if (has(CONJ, ws[i]) || has(REPORT_VERBS, ws[i])) return false;
  return clauseCount(text) >= 2;
}
function isComplete(text) {
  if (isRunon(text)) return false;
  return startsSub(text) ? clauseCount(text) >= 2 : clauseCount(text) >= 1;
}
function classify(text) { return isRunon(text) ? 'runon' : (isComplete(text) ? 'sentence' : 'fragment'); }

/* the possessive rule, done by machine so the content can be checked */
function expectedPossessive(owner) {
  var o = String(owner);
  if (o.toLowerCase() === 'it') return 'its';
  return /s$/.test(o) ? o + "'" : o + "'s";
}
/* PROPER lookup that tolerates Ben's / Bens */
function properOf(tok) {
  var b = bare(tok);
  if (PROPER[b]) return PROPER[b];
  var s = b.replace(/'s$/, '').replace(/'$/, '');
  if (PROPER[s]) return PROPER[s];
  s = b.replace(/s$/, '');
  if (PROPER[s]) return PROPER[s];
  return null;
}
/* independent capitalisation audit: which token indexes are mis-capitalised */
function capFaults(tokens) {
  var bad = [], startNext = true;
  for (var i = 0; i < tokens.length; i++) {

    var want = startNext || !!properOf(t) || bare(t) === 'i';
    if (want !== isCap) bad.push(i);
    startNext = /[.!?]["')]?$/.test(t);
  }
  return bad;
}

<script>
/* ================================================================ audio == */
function loadStr(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function saveStr(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

var actx = null, master = null, muted = loadStr(K_MUTE, '0') === '1';
function initAudio() {
  if (actx) { if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} } return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.32;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function setMuted(m) {
  muted = !!m; saveStr(K_MUTE, muted ? '1' : '0');
  if (master) master.gain.value = muted ? 0 : 0.32;
  var b = document.getElementById('muteBtn');
  if (b) b.innerHTML = muted ? '&#215;' : '&#9835;';
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!actx || muted) return;
  var t = actx.currentTime + (delay || 0);
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(24, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

  tap:   function () { tone('sine', 520, 520, 0.05, 0.06); },

  learn: function () { tone('triangle', 300, 250, 0.18, 0.07); tone('triangle', 250, 240, 0.22, 0.05, 0.16); },

function freshSave() {
  var r = {};
  for (var i = 0; i < RULE_ORDER.length; i++) r[RULE_ORDER[i]] = { seen: 0, right: 0 };
  return { v: 1, unlocked: 1, rules: r, done: {} };

function num(v) { var n = Number(v); return (isFinite(n) && n >= 0) ? Math.floor(n) : 0; }
function loadSave() {
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(K_SAVE) || 'null'); } catch (e) { raw = null; }
  var out = freshSave();
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  var u = Number(raw.unlocked);
  out.unlocked = (isFinite(u) && u >= 1) ? Math.min(STAGES.length, Math.floor(u)) : 1;
  if (raw.rules && typeof raw.rules === 'object' && !Array.isArray(raw.rules)) {
    for (var i = 0; i < RULE_ORDER.length; i++) {
      var k = RULE_ORDER[i], v = raw.rules[k];
      if (v && typeof v === 'object' && !Array.isArray(v)) {

  if (raw.done && typeof raw.done === 'object' && !Array.isArray(raw.done)) {
    for (var s = 0; s < STAGES.length; s++) {

  return out;
}

        '<button class="btn" data-act="again">TRY IT AGAIN</button>' +

overlay.addEventListener('click', function (e) {
  var t = e.target;
  var b = (t && t.closest) ? t.closest('[data-act]') : null;
  if (!b || b.disabled) return;
  initAudio();
  var act = b.getAttribute('data-act');
  if (act === 'menu') menuScreen();
  else if (act === 'title') titleScreen();
  else if (act === 'progress') progressScreen();
  else if (act === 'stage') startStage(parseInt(b.getAttribute('data-stage'), 10));
  else if (act === 'again') startStage(G.stage);
  else if (act === 'nextstage') startStage(G.stage + 1);
  else if (act === 'resume') { hideOverlay(); G.screen = 'play'; document.body.classList.add('playing'); }

<script>
/* ================================================================ queue == */
function shuffled(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
function buildQueue(stageIdx) {
  var st = STAGES[stageIdx];
  var q = shuffled(st.items);
  /* weak rules first, so a shaky rule is what the child meets soonest */
  q.sort(function (a, b) { return weakness(b.rule) - weakness(a.rule); });
  return q;
}
/* mixed practice draws from every unlocked stage, weighted toward weak rules */
function buildMixedQueue(n) {
  var pool = [];
  for (var s = 0; s < Math.min(SV.unlocked, STAGES.length); s++) {
    var st = STAGES[s];
    for (var i = 0; i < st.items.length; i++) {
      var reps = 1 + Math.round(weakness(st.items[i].rule) * 3);
      for (var k = 0; k < reps; k++) pool.push(st.items[i]);
    }
  }
  var out = [], seen = [], guard = 0;
  pool = shuffled(pool);
  while (out.length < (n || 10) && guard < 4000) {
    guard++;
    var pick = pool[(Math.random() * pool.length) | 0];
    if (!pick) break;
    if (seen.indexOf(pick) >= 0 && out.length < Math.min(n || 10, pool.length)) continue;
    seen.push(pick); out.push(pick);
  }
  return out;
}
function requeueRule(item) {
  /* the missed item comes straight back, and one more of the same rule with it */
  var at = Math.min(2, G.queue.length);
  G.queue.splice(at, 0, item);
  var st = STAGES[item.stage];
  if (st) {
    for (var i = 0; i < st.items.length; i++) {
      var cand = st.items[i];
      if (cand !== item && cand.rule === item.rule && G.queue.indexOf(cand) < 0) {
        G.queue.splice(Math.min(4, G.queue.length), 0, cand);
        break;
      }
    }
  }
}
function ruleCountInQueue(rule) {
  var n = 0;
  for (var i = 0; i < G.queue.length; i++) if (G.queue[i].rule === rule) n++;
  return n;
}

function startStage(i) {
  if (!isFinite(i) || i < 0 || i >= STAGES.length) return;
  if (i + 1 > SV.unlocked) return;
  initAudio();
  G.stage = i;
  G.mixed = false;
  G.queue = buildQueue(i);
  G.asked = 0; G.firstRight = 0;
  hideOverlay();
  G.screen = 'play';
  document.body.classList.add('playing');
  nextItem();
}
function startMixed() {
  initAudio();
  G.stage = -1; G.mixed = true;
  G.queue = buildMixedQueue(10);
  G.asked = 0; G.firstRight = 0;
  hideOverlay();
  G.screen = 'play';
  document.body.classList.add('playing');
  nextItem();
}
function nextItem() {
  if (!G.queue.length) {
    if (G.mixed) { G.stage = 0; mixedDoneScreen(); return; }
    stageDoneScreen(); return;
  }
  G.item = G.queue.shift();
  G.phase = 'answer';
  G.firstTry = true;
  G.sel = null;
  clear(fbEl);
  render();
}
function mixedDoneScreen() {
  G.screen = 'stagedone';
  document.body.classList.remove('playing');
  var pct = G.asked ? Math.round(G.firstRight / G.asked * 100) : 0;
  sfx.unlock();
  showOverlay(
    '<div class="card">' +
      '<div class="eyebrow">Mixed practice</div>' +
      '<h2>ROUND FINISHED</h2>' +
      '<div class="tagline">Right on the first try: <b style="color:var(--accent)">' + G.firstRight + ' of ' + G.asked + '</b> (' + pct + '%).</div>' +
      '<div class="btnrow">' +
        '<button class="btn" data-act="mixed">ANOTHER ROUND</button>' +
        '<button class="btn ghost" data-act="progress">PROGRESS</button>' +
        '<button class="btn ghost" data-act="menu">LESSONS</button>' +
      '</div>' +
    '</div>');
}
</script>
<script>
/* =============================================================== render == */

}

/* words of a stage-1 item, with the answer key derived from the correct form */
function capsParts(item) {

/* ------------------------------------------------------------- stage 1 -- */

/* ------------------------------------------------------------- stage 2 -- */

/* ------------------------------------------------------------- stage 3 -- */

/* ------------------------------------------------------------- stage 4 -- */
var COMMA_WHY = {
  list: 'When you list three or more things, a comma goes after each one before the last: <b>apples, cheese, and crackers</b>.',
  intro: 'When a sentence starts with a scene-setting part, a comma goes right after that part, before the main idea.',
  compound: 'When <b>and</b>, <b>but</b>, <b>or</b> or <b>so</b> joins two whole sentences, a comma goes just before that joining word.'
};
function commaWords(it) { return it.w.split(/\s+/); }
function renderComma(it) {
  var ws = commaWords(it);
  if (!G.sel) G.sel = { at: [] };

}

var HOMO_WHY = {
  their: '<b>their</b> shows who owns something — their backpacks, their dog.',
  there: '<b>there</b> points to a place, or teams up with is and are: "over there", "there is".',

  return lines;
}

/* ------------------------------------------------------------- stage 7 -- */
function paraTokens(it) {
  var toks = it.clean.split(/\s+/).slice();
  for (var i = 0; i < it.errors.length; i++) toks[it.errors[i].i] = it.errors[i].wrong;
  return toks;
}
function errorAt(it, i) {
  for (var k = 0; k < it.errors.length; k++) if (it.errors[k].i === i) return it.errors[k];
  return null;
}
function renderPara(it) {
  if (!G.sel) G.sel = { toks: paraTokens(it), fixed: [], open: -1 };
  var found = G.sel.fixed.length, total = it.errors.length;
  promptEl.innerHTML = 'This story has <b>' + total + '</b> mistakes hiding in it. Tap a word you think is wrong.<br>Found so far: <b>' + found + ' of ' + total + '</b>';
  var row = el('div', 'tilerow left');
  for (var i = 0; i < G.sel.toks.length; i++) {
    (function (i) {
      var isFixed = G.sel.fixed.indexOf(i) >= 0;
      var b = btn('wtile' + (isFixed ? ' fixed' : '') + (G.sel.open === i ? ' on' : ''));
      if (isFixed) b.appendChild(el('span', 'mk', '✓'));
      b.appendChild(document.createTextNode(G.sel.toks[i]));
      if (G.phase === 'result' || isFixed) b.disabled = true;
      else b.onclick = function () { initAudio(); sfx.tap(); G.sel.open = (G.sel.open === i ? -1 : i); render(); openPara(i); };
      row.appendChild(b);
    })(i);
  }
  workEl.appendChild(row);
  if (G.sel.open >= 0 && G.phase !== 'result') {
    var e = errorAt(it, G.sel.open);
    var lab = el('div', 'banklabel', 'What should this word be?');
    workEl.appendChild(lab);
    var opts = el('div', 'opts');
    var choices = e ? e.opts : [G.sel.toks[G.sel.open], G.sel.toks[G.sel.open].toUpperCase()];
    if (!e) choices = [G.sel.toks[G.sel.open]];
    choices.forEach(function (o) {
      var b = btn('opt', o);
      b.setAttribute('data-p', o);
      b.onclick = function () { initAudio(); pickPara(o); };
      opts.appendChild(b);
    });
    workEl.appendChild(opts);
    /* on a short landscape screen the chooser opens below the fold — bring it up */
    try { opts.scrollIntoView({ block: 'nearest' }); } catch (e2) {}
  }
  actions(G.phase === 'result'
    ? [{ label: 'NEXT', act: 'next' }]
    : [{ label: 'FOUND THEM ALL?', act: 'check', disabled: G.sel.fixed.length < it.errors.length }]);
}
function openPara(i) {
  var it = G.item, e = errorAt(it, i);
  if (!e) {
    feedback('teach', 'That one is fine', ['<b>' + esc(G.sel.toks[i]) + '</b> is already correct here. Keep looking — nothing bad happens for checking.']);
    sfx.learn();
    G.sel.open = -1;
    render();
  } else {
    clear(fbEl);
  }
}
function pickPara(word) {
  var it = G.item, i = G.sel.open, e = errorAt(it, i);
  if (!e) return;
  if (word === e.right) {
    G.sel.toks[i] = word;
    if (G.sel.fixed.indexOf(i) < 0) G.sel.fixed.push(i);
    G.sel.open = -1;
    sfx.good();
    recordRule(e.rule, true);
    feedback('good', 'Fixed it', ['<b>' + esc(e.wrong) + '</b> → <b>' + esc(e.right) + '</b>. ' + e.why]);
  } else {
    sfx.learn();
    recordRule(e.rule, false);
    G.lastWrongRule = e.rule;
    feedback('teach', 'Not quite — here is the rule', [e.why, 'Try that word again.']);
  }
  render();
}
</script>
<script>
/* ================================================================ check == */
function checkAnswer() {
  var it = G.item;
  if (!it) return;
  var sid = it.stageId;

  if (sid === 'caps') {
    var r = checkCaps();
    G.asked++;
    recordRule('capitals', r.parts.capitals);
    recordRule('endmarks', r.parts.endmarks);
    if (r.ok) {
      G.firstRight++;
      sfx.good();
      G.phase = 'result'; render();
      feedback('good', 'Yes — that is it', ['"' + esc(it.c) + '"', MARK_WHY[it.k]]);
    } else {
      sfx.learn();
      if (!r.parts.capitals) { G.lastWrongRule = 'capitals'; requeueRule(it); }
      else { G.lastWrongRule = 'endmarks'; requeueRule(it); }
      G.phase = 'result'; render();
      r.lines.push('The whole thing: "' + esc(it.c) + '"');
      feedback('teach', 'Let us look at that one', r.lines);
    }
    return;
  }

  if (sid === 'type') {
    if (G.phase === 'answer') {
      var ok = G.sel.pick === it.type;
      G.asked++;
      recordRule('structure', ok);
      if (!ok) {
        sfx.learn(); G.lastWrongRule = 'structure'; requeueRule(it);
        G.phase = 'result'; render();
        feedback('teach', 'It is a ' + TYPE_LABEL[it.type].toLowerCase(), [
          '"' + esc(it.t) + '"', it.why || '', TYPE_WHY[it.type]
        ]);
        return;
      }
      G.firstRight++;
      sfx.good();
      if (it.fix) { G.phase = 'fix'; G.sel.fix = -1; render(); feedback('good', 'Right', ['"' + esc(it.t) + '" — ' + (it.why || TYPE_WHY[it.type])]); return; }
      G.phase = 'result'; render();
      feedback('good', 'Right — nothing to fix', [it.why || TYPE_WHY[it.type]]);
      return;
    }
    /* fix phase */
    var fok = G.sel.fix === it.fix.a;
    recordRule('structure', fok);
    if (fok) { sfx.good(); G.phase = 'result'; render(); feedback('good', 'Fixed', ['<b>' + esc(it.fix.opts[it.fix.a]) + '</b> — now it stands on its own.']); }
    else {
      sfx.learn(); G.lastWrongRule = 'structure'; requeueRule(it);
      G.phase = 'result'; render();
      feedback('teach', 'Here is the fix', [
        '<b>' + esc(it.fix.opts[it.fix.a]) + '</b>',
        'The one you picked is still a ' + TYPE_LABEL[classify(it.fix.opts[G.sel.fix])].toLowerCase() + '. ' + TYPE_WHY[it.type]
      ]);
    }
    return;
  }

  if (sid === 'build') {
    var built = G.sel.line.join(' ');
    var bok = checkBuild(it, built);
    G.asked++;
    recordRule('building', bok);
    G.phase = 'result';
    if (bok) {
      G.firstRight++; sfx.good(); render();
      var others = it.valid.filter(function (v) { return v !== normOrder(built); });
      var l = ['<b>' + esc(displayWord(G.sel.line[0], true) + ' ' + G.sel.line.slice(1).map(function (w) { return displayWord(w, false); }).join(' ')) + '.</b>'];
      if (others.length) l.push('There is more than one right answer here. This also works: "' + esc(others.map(function (o) { return o.charAt(0).toUpperCase() + o.slice(1) + '.'; }).join('  /  ')) + '"');
      feedback('good', 'That works', l);
    } else {
      sfx.learn(); G.lastWrongRule = 'building'; requeueRule(it);
      G.sel.line = it.valid[0].split(' ');
      G.sel.bank = [];
      render();
      feedback('teach', 'Nearly — try this order', [
        'You built: "' + esc(built) + '"',
        'A sentence needs the naming part and the action in an order we can follow. One that works: <b>' + esc(it.valid[0].charAt(0).toUpperCase() + it.valid[0].slice(1)) + '.</b>',
        it.valid.length > 1 ? 'These work too: ' + esc(it.valid.slice(1).join('  /  ')) : ''
      ]);
    }
    return;
  }

  if (sid === 'comma') {
    var ws = commaWords(it);
    var got = G.sel.at.slice().sort(function (a, b) { return a - b; });
    var want = it.a.slice().sort(function (a, b) { return a - b; });
    var cok = got.length === want.length && got.every(function (v, i) { return v === want[i]; });
    G.asked++;
    recordRule('commas', cok);
    G.phase = 'result'; render();
    if (cok) { G.firstRight++; sfx.good(); feedback('good', 'Commas in the right spots', [COMMA_WHY[it.r]]); }
    else {
      sfx.learn(); G.lastWrongRule = 'commas'; requeueRule(it);
      var lines = [COMMA_WHY[it.r]];
      for (var i = 0; i < want.length; i++) lines.push('A comma goes after <b>' + esc(ws[want[i]]) + '</b>.');
      feedback('teach', 'Here is where they go', lines);
    }
    return;
  }

  if (sid === 'apos') {
    var aok = G.sel.pick === it.a;
    G.asked++;
    recordRule('apostrophes', aok);
    G.phase = 'result'; render();
    if (aok) { G.firstRight++; sfx.good(); feedback('good', 'Right', [aposWhy(it)]); }
    else {
      sfx.learn(); G.lastWrongRule = 'apostrophes'; requeueRule(it);
      feedback('teach', 'Here is the rule', [
        'It should be <b>' + esc(it.a) + '</b>: "' + esc(filledSentence(it, it.a)) + '"',
        aposWhy(it)
      ]);
    }
    return;
  }

  if (sid === 'homo') {
    var hok = G.sel.pick === it.a;
    G.asked++;
    recordRule('homophones', hok);
    G.phase = 'result'; render();
    if (hok) { G.firstRight++; sfx.good(); feedback('good', 'Right word', homoWhy(it, it.a)); }
    else {
      sfx.learn(); G.lastWrongRule = 'homophones'; requeueRule(it);
      feedback('teach', 'These three trip everybody up', homoWhy(it, G.sel.pick));
    }
    return;
  }

  if (sid === 'para') {
    G.asked++;
    var allFound = G.sel.fixed.length >= it.errors.length;
    if (allFound) { G.firstRight++; sfx.good(); }
    G.phase = 'result'; render();
    feedback('good', 'Every mistake found', [
      'All <b>' + it.errors.length + '</b> of them. Here is the clean version:',
      '<b>' + esc(it.clean) + '</b>'
    ]);
    return;
  }
}
</script>
<script>
/* ================================================================ input == */
window.addEventListener('touchstart', function () { document.body.classList.add('touch'); }, { passive: true, once: true });

document.getElementById('muteBtn').addEventListener('click', function () { initAudio(); setMuted(!muted); });
document.getElementById('pauseBtn').addEventListener('click', function () { initAudio(); if (G.screen === 'play') pauseScreen(); });

window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'm' || k === 'M') { initAudio(); setMuted(!muted); return; }
  if (k === 'Escape' || k === 'p' || k === 'P') {
    if (G.screen === 'play') { initAudio(); pauseScreen(); e.preventDefault(); }
    else if (G.screen === 'paused') { hideOverlay(); G.screen = 'play'; document.body.classList.add('playing'); }
    return;
  }
  if (G.screen !== 'play') {
    if (k === 'Enter') {
      var b = overlay.querySelector('[data-act]:not([disabled])');
      if (b) b.click();
    }
    return;
  }
  if (k === 'Enter' || k === ' ') { e.preventDefault(); primaryAction(); return; }
  if (/^[1-9]$/.test(k)) {
    var pool = workEl.querySelectorAll('.opt:not([disabled]), .wtile:not([disabled]):not(.flat)');
    var i = parseInt(k, 10) - 1;
    if (pool[i]) { pool[i].click(); e.preventDefault(); }
  }
});

/* gamepad: dpad moves the highlight, A presses it, Start opens the menu */
var padSel = -1, padPrev = [];
function padDown(p, i) {
  var now = !!(p.buttons[i] && p.buttons[i].pressed);
  var was = !!padPrev[i];
  padPrev[i] = now;
  return now && !was;
}
function focusables() {
  return Array.prototype.slice.call(document.querySelectorAll(
    G.screen === 'play' ? '#work .opt:not([disabled]), #work .wtile:not([disabled]):not(.flat), #actions .btn:not([disabled])'
                        : '#overlay [data-act]:not([disabled])'));
}
function padMove(d) {
  var list = focusables();
  if (!list.length) return;
  padSel = (padSel + d + list.length) % list.length;
  try { list[padSel].focus(); } catch (e) {}
}
function pollPad() {
  if (!navigator.getGamepads) return;
  var ps = navigator.getGamepads(), p = null;
  for (var i = 0; i < ps.length; i++) if (ps[i]) { p = ps[i]; break; }
  if (!p) { padSel = -1; return; }
  var ax = p.axes && p.axes.length > 0 ? p.axes[0] : 0;
  if (padDown(p, 15) || (ax > 0.6 && !padPrev.axR)) { padMove(1); }
  if (padDown(p, 14) || (ax < -0.6 && !padPrev.axL)) { padMove(-1); }
  padPrev.axR = ax > 0.6; padPrev.axL = ax < -0.6;
  if (padDown(p, 13)) padMove(1);
  if (padDown(p, 12)) padMove(-1);
  if (padDown(p, 0)) {
    initAudio();
    var list = focusables();
    if (padSel >= 0 && list[padSel]) list[padSel].click();
    else if (list.length) list[0].click();
  }
  if (padDown(p, 9)) { if (G.screen === 'play') pauseScreen(); else if (G.screen === 'paused') { hideOverlay(); G.screen = 'play'; document.body.classList.add('playing'); } }
}

/* auto-pause when the tab stops compositing — nothing is timed, but a
   half-answered question should not sit under a hidden window */
function softPause() { if (G.screen === 'play') pauseScreen(); }
window.addEventListener('blur', softPause);
document.addEventListener('visibilitychange', function () { if (document.hidden) softPause(); });

/* ================================================================= loop == */
/* Nothing simulates here — the loop only services the gamepad, so the game
   is fully static between inputs (staticOk in the harness). */
var lastT = 0;
function frame(now) {
  window.requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  var dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  pollPad();
}

/* ================================================================= boot == */
setMuted(muted);
titleScreen();
window.requestAnimationFrame(frame);
</script>
</body>
</html>
