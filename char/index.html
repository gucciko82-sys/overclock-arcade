<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Char — Letters and Sounds</title>
<meta name="theme-color" content="#fff3e0">
<meta name="description" content="A char is one letter. Find it, match big to little, hear its sound, and spot what it starts. Four gentle activities that find a child's level by playing with her, then keep climbing — everything spoken aloud, nothing to lose.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Char">
<meta name="format-detection" content="telephone=no">
<style>
  :root {
    --bg: #fff3e0;
    --bg2: #ffe0b2;
    --ink: #4a3520;
    --dim: #7d6448;
    --card: #ffffff;
    --line: rgba(74,53,32,0.18);
    --accent: #ef6c00;
    --blue: #1565c0;
    --green: #2e7d32;
    --purple: #6a1b9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Trebuchet MS", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #fffdf7 0%, var(--bg) 46%, var(--bg2) 100%);
  }
  button { font-family: inherit; color: inherit; touch-action: manipulation; }

  #stage { position: fixed; inset: 0; overflow: hidden; }

  /* ---- top-right icon buttons: the 100x52 reserve ---- */
  #topbtns {
    position: absolute;
    top: max(6px, env(safe-area-inset-top));
    right: max(6px, env(safe-area-inset-right));
    display: flex; gap: 6px; z-index: 8;
  }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--card); color: var(--ink);
    border: 2px solid var(--line);
    font-size: 19px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 2px 0 rgba(74,53,32,0.14);
  }
  .iconbtn:active { transform: translateY(2px); box-shadow: none; }
  .iconbtn.off { opacity: 0.45; }
  body:not(.playing) #homeBtn { display: none; }

  /* ---- screens ---- */
  #app {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 58px max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-right));
  }
  #app.scroll { overflow-y: auto; }
  .screen { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px;
            width: 100%; max-width: 880px; align-self: center; }

  /* progress dots — how far through this short set, not a score */
  .dots { flex: 0 0 auto; height: 20px; display: flex; gap: 8px; justify-content: center; align-items: center; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; background: rgba(74,53,32,0.16); display: block; }
  .dots i.on { background: #ffb300; box-shadow: 0 0 0 3px rgba(255,179,0,0.22); }

  /* Layout is IDENTICAL every round: dots, label, prompt slot, speaker,
     clue line, choices. Nothing moves between activities or items. */
  .prompt { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px; text-align: center; }
  .eyebrow { flex: 0 0 auto; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
             color: var(--dim); font-weight: 700; }
  .slot { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .bigletter { font-size: clamp(52px, 15vh, 122px); font-weight: 800; line-height: 1;
               color: var(--purple); text-shadow: 0 4px 0 rgba(106,27,154,0.15); }
  .bigletter.blue { color: var(--blue); text-shadow: 0 4px 0 rgba(21,101,192,0.15); }
  .hintword { flex: 0 0 auto; min-height: 26px; font-size: clamp(15px, 4vw, 21px);
              font-weight: 700; color: var(--dim); display: flex; align-items: center; justify-content: center; }
  .hintword b { color: var(--green); font-size: 1.5em; }

  /* the replay speaker — same size, same place, every single screen */
  .speaker {
    flex: 0 0 auto;
    width: 104px; height: 104px; border-radius: 50%;
    border: 4px solid rgba(239,108,0,0.55);
    background: #fff3e0; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(239,108,0,0.3);
  }
  .speaker:active { transform: translateY(3px); box-shadow: none; }
  .speaker svg { width: 60px; height: 60px; display: block; }
  .speaker.pulse { animation: pulse 1.3s ease-in-out 2; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  body.nospeech .speaker { display: none !important; }

  /* ---- answer choices: big, well spaced, forgiving ---- */
  .choices {
    flex: 0 0 auto; display: grid; gap: 14px; align-items: stretch;
    grid-template-columns: repeat(2, 1fr);
  }
  .choices.c3 { grid-template-columns: repeat(3, 1fr); }
  .choices.c4 { grid-template-columns: repeat(2, 1fr); }
  .choice {
    min-width: 90px; min-height: 122px;
    border-radius: 24px; border: 4px solid var(--line);
    background: var(--card); cursor: pointer; padding: 6px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 4px 0 rgba(74,53,32,0.13);
    position: relative; overflow: hidden;
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .choice:active { transform: translateY(3px); }
  .choice .glyph { font-size: clamp(40px, 8.4vh, 66px); font-weight: 800; line-height: 1; color: var(--blue); }
  .choice .glyph.pairg { font-size: clamp(31px, 6.4vh, 52px); color: var(--purple); }
  .choice .word { font-size: 13px; font-weight: 700; color: var(--dim); letter-spacing: 0.04em; }
  .choice .pic { width: clamp(62px, 12vh, 100px); height: clamp(62px, 12vh, 100px); display: block; }
  /* the only two states: chosen-and-right, or here-is-the-one. Never a "wrong" state. */
  .choice.right { border-color: #43a047; background: #e8f5e9; animation: bounce 0.5s ease; }
  .choice.show  { border-color: #43a047; background: #e8f5e9; animation: nudge 1s ease-in-out 2; }
  @keyframes bounce { 0% { transform: scale(1); } 35% { transform: scale(1.1); } 65% { transform: scale(0.98); } 100% { transform: scale(1); } }
  @keyframes nudge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* ---- menu ---- */
  .tiles { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .tile {
    min-height: 110px; border-radius: 26px; border: 4px solid var(--line);
    background: var(--card); cursor: pointer; padding: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    box-shadow: 0 4px 0 rgba(74,53,32,0.13);
  }
  .tile:active { transform: translateY(3px); box-shadow: none; }
  .tile svg { width: clamp(56px, 15vh, 132px); height: clamp(56px, 15vh, 132px); display: block; }
  .tile .word { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
  .menuhead { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
  .grownlink {
    flex: 0 0 auto; align-self: center; min-height: 44px; padding: 0 20px; margin-top: 2px;
    border-radius: 12px; border: 2px solid var(--line); background: rgba(255,255,255,0.6);
    font-size: 11px; font-weight: 800; letter-spacing: 0.18em; color: var(--dim);
    text-transform: uppercase; cursor: pointer;
  }

  /* ---- title / finish ---- */
  .center { align-items: center; justify-content: center; text-align: center; gap: 14px; }
  h1 { margin: 0; font-size: clamp(48px, 15vw, 96px); font-weight: 800; letter-spacing: 0.16em;
       color: var(--accent); text-shadow: 0 5px 0 rgba(239,108,0,0.22); }
  .tagline { font-size: clamp(13px, 3.6vw, 17px); color: var(--dim); font-weight: 700; max-width: 470px; }
  .btn {
    min-height: 84px; min-width: 210px; padding: 0 34px;
    border-radius: 26px; border: 4px solid #2e7d32; background: #81c784; color: #06280b;
    font-size: 26px; font-weight: 800; letter-spacing: 0.22em; cursor: pointer;
    box-shadow: 0 5px 0 rgba(27,94,32,0.5);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:active { transform: translateY(4px); box-shadow: none; }
  .btn::before { content: "\25B6"; margin-right: 14px; font-size: 22px; }
  .grownup { font-size: 11.5px; color: var(--dim); line-height: 1.55; max-width: 470px; }
  .bigrow { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .bigbtn {
    min-width: 132px; min-height: 132px; border-radius: 30px; border: 4px solid var(--line);
    background: var(--card); cursor: pointer; padding: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    box-shadow: 0 5px 0 rgba(74,53,32,0.14);
  }
  .bigbtn.go { border-color: #2e7d32; background: #e8f5e9; }
  .bigbtn:active { transform: translateY(4px); box-shadow: none; }
  .bigbtn svg { width: 74px; height: 74px; display: block; }
  .bigbtn .word { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; }
  .starrow { display: flex; gap: 6px; justify-content: center; }
  .starrow svg { width: 40px; height: 40px; }

  /* ---- grown-up progress ---- */
  .gu { text-align: left; font-size: 13px; color: var(--ink); }
  .gu h2 { margin: 0 0 8px; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .gcard { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .gcard .gt { font-weight: 800; font-size: 14px; margin-bottom: 2px; }
  .gcard .gl { font-size: 12px; color: var(--dim); }
  .gcard .lvlbar { display: flex; gap: 3px; margin: 6px 0 4px; }
  .gcard .lvlbar i { flex: 1 1 0; height: 9px; border-radius: 4px; background: rgba(74,53,32,0.14); display: block; }
  .gcard .lvlbar i.on { background: #66bb6a; }
  .gcard .lvlbar i.now { background: var(--accent); }
  .gcard svg.spark { width: 100%; height: 46px; display: block; margin-top: 4px; }
  .gnote { font-size: 11.5px; color: var(--dim); line-height: 1.55; margin: 4px 0 10px; }

  /* ---- stars / banner ---- */
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 7; overflow: hidden; }
  .star { position: absolute; width: 40px; height: 40px; animation: fly 1s ease-out forwards; }
  @keyframes fly {
    0% { transform: translate(0,0) scale(0.3) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.25) rotate(190deg); opacity: 0; }
  }
  #banner {
    position: absolute; left: 50%; top: 10%; transform: translateX(-50%);
    background: rgba(255,255,255,0.94); border: 3px solid var(--line);
    border-radius: 18px; padding: 8px 18px; font-size: 17px; font-weight: 800;
    color: var(--green); z-index: 9; display: none; max-width: 88%; text-align: center;
  }
  #banner.on { display: block; }
  #banner.soft { color: var(--dim); }

  /* ---- gallery (verification aid, not part of play) ---- */
  #gallery { position: absolute; inset: 0; overflow: auto; background: var(--bg); z-index: 20; padding: 10px; display: none; }
  #gallery.on { display: block; }
  #gallery .g { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  #gallery .gi { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 6px; text-align: center; }
  #gallery .gi svg { width: 100%; height: auto; display: block; }
  #gallery .gi b { font-size: 13px; }

  @media (min-width: 700px) { .choices.c4 { grid-template-columns: repeat(4, 1fr); } }
  @media (max-height: 460px) {
    #app { padding-top: 52px; }
    .screen { gap: 6px; }
    .dots { height: 16px; }
    .choices { gap: 10px; }
    .choices.c4 { grid-template-columns: repeat(4, 1fr); }
    .choice { min-height: 104px; border-radius: 18px; }
    .tiles { grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .tile { min-height: 92px; border-radius: 18px; }
    .speaker { width: 88px; height: 88px; }
    .speaker svg { width: 50px; height: 50px; }
    .btn { min-height: 68px; font-size: 22px; }
    .bigbtn { min-width: 116px; min-height: 116px; }
    .bigbtn svg { width: 58px; height: 58px; }
    .grownup { display: none; }
    .hintword { min-height: 20px; }
  }
  @media (max-width: 374px) { .choices { gap: 12px; } .tiles { gap: 12px; } }
</style>
</head>
<body>
<div id="stage">
  <div id="topbtns">
    <button class="iconbtn" id="muteBtn" type="button" aria-label="Sound on or off">&#9835;</button>
    <button class="iconbtn" id="homeBtn" type="button" aria-label="Back to the picture menu">&#9632;</button>
  </div>
  <div id="app"></div>
  <div id="fx"></div>
  <div id="banner"></div>
  <div id="gallery"></div>
</div>
<script>
/* =========================================================================
   CHAR — letters and sounds, for the Overclock family arcade.

   A `char` is a single character. This is the rung BELOW Scan: Scan starts
   at letter sounds and climbs to blending, sight words and passages. Char is
   for a reader still learning which squiggle is which — and it hands off to
   Scan when she's ready.

   WHO IT IS FOR, and every rule that follows from it:

   * She cannot read. So every prompt is SPOKEN with the browser's own
     speechSynthesis and ALSO drawn. Text on screen is for the grown-up.
     A big speaker button sits in the same place on every screen.
   * She may be working below her age, and her motor control may be
     affected. So targets are huge and well spaced, taps are single and
     forgiving, and the layout never moves between items.
   * She is bright and has been short of air, not short of ability. So the
     ladder does not stop at the easy start — it climbs to four choices,
     letter sounds and first sounds, then points at Scan.
   * The game FINDS HER LEVEL by playing with her. No difficulty screen, no
     guessing. Up after four in a row, down fast after two misses, and an
     occasional quiet probe one rung above so she can never get stuck low.
   * There is no failure state anywhere. No red, no buzzer, no shake, no
     score, no timer. A miss simply says the right answer warmly, shows it,
     and brings the letter back later as ordinary practice.
   * She is never asked to say anything. Everything is tapping.

   speechSynthesis is a browser API, not an asset — but it is missing often
   enough (headless, kiosks, some Linux builds) that the whole game has to
   work in silence. When it is missing the speaker is hidden and the
   pictures carry the question.
   ========================================================================= */

/* ============================================================ storage == */
var K_SAVE  = 'char_v1';
var K_MUTED = 'char_muted_v1';
function loadStr(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function saveStr(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

/* ============================================================ letters == */
/* Letters and Sounds order — the first six spell more words than the whole
   rest of the alphabet does, which is why they come first. `snd` is a
   spelled-out approximation of the PHONEME (/b/, not "bee") tuned so
   speechSynthesis renders it close enough; `nm` is the letter NAME. */
var LETTERS = [
  { u: 'S', l: 's', nm: 'ess',        snd: 'sss',  key: 'sun' },
  { u: 'A', l: 'a', nm: 'ay',         snd: 'aah',  key: 'apple' },
  { u: 'T', l: 't', nm: 'tee',        snd: 'tuh',  key: 'tree' },
  { u: 'P', l: 'p', nm: 'pee',        snd: 'puh',  key: 'pig' },
  { u: 'I', l: 'i', nm: 'eye',        snd: 'ih',   key: 'igloo' },
  { u: 'N', l: 'n', nm: 'enn',        snd: 'nnn',  key: 'nest' },
  { u: 'M', l: 'm', nm: 'emm',        snd: 'mmm',  key: 'moon' },
  { u: 'D', l: 'd', nm: 'dee',        snd: 'duh',  key: 'dog' },
  { u: 'G', l: 'g', nm: 'jee',        snd: 'guh',  key: 'grapes' },
  { u: 'O', l: 'o', nm: 'oh',         snd: 'awh',  key: 'octopus' },
  { u: 'C', l: 'c', nm: 'see',        snd: 'kuh',  key: 'cat' },
  { u: 'K', l: 'k', nm: 'kay',        snd: 'kuh',  key: 'key' },
  { u: 'E', l: 'e', nm: 'ee',         snd: 'eh',   key: 'egg' },
  { u: 'U', l: 'u', nm: 'you',        snd: 'uh',   key: 'umbrella' },
  { u: 'R', l: 'r', nm: 'arr',        snd: 'rrr',  key: 'rainbow' },
  { u: 'H', l: 'h', nm: 'aitch',      snd: 'huh',  key: 'hat' },
  { u: 'B', l: 'b', nm: 'bee',        snd: 'buh',  key: 'ball' },
  { u: 'F', l: 'f', nm: 'eff',        snd: 'fff',  key: 'fish' },
  { u: 'L', l: 'l', nm: 'ell',        snd: 'lll',  key: 'leaf' },
  { u: 'J', l: 'j', nm: 'jay',        snd: 'juh',  key: 'jet' },
  { u: 'V', l: 'v', nm: 'vee',        snd: 'vvv',  key: 'van' },
  { u: 'W', l: 'w', nm: 'double you', snd: 'wuh',  key: 'web' },
  { u: 'Y', l: 'y', nm: 'why',        snd: 'yuh',  key: '' },
  { u: 'Z', l: 'z', nm: 'zee',        snd: 'zzz',  key: '' },
  { u: 'X', l: 'x', nm: 'ex',         snd: 'ks',   key: '' },
  { u: 'Q', l: 'q', nm: 'cue',        snd: 'kwuh', key: '' }
];
function letterIndex(low) { var i; for (i = 0; i < LETTERS.length; i++) if (LETTERS[i].l === low) return i; return -1; }
function soundOf(low) { var i = letterIndex(low); return i < 0 ? '' : LETTERS[i].snd; }

/* Letters that get mistaken for each other — by shape. The easy rungs pull
   distractors from DIFFERENT groups (S vs T), the hard rungs deliberately
   pull from the SAME group (b vs d). */
var SHAPE_GROUPS = ['bdpqg', 'mnhr', 'uvwy', 'iljtf', 'ceoas', 'kxz'];
function shapeGroup(low) {
  var i; for (i = 0; i < SHAPE_GROUPS.length; i++) if (SHAPE_GROUPS[i].indexOf(low) >= 0) return i;
  return -1;
}

/* ============================================================ pictures == */
/* Every picture is drawn procedurally as SVG — no asset files anywhere.
   Each returns the INNER markup of a 0 0 100 100 viewBox so the menu icons
   can reuse the same drawings at a smaller scale. `?gallery=1` renders the
   whole table at once, because a child cannot answer "which starts with
   /k/" if the cat looks like a blob. */
function star5(cx, cy, r, fill) {
  var pts = [], i, a, rr;
  for (i = 0; i < 10; i++) {
    a = -Math.PI / 2 + i * Math.PI / 5;
    rr = (i % 2 === 0) ? r : r * 0.45;
    pts.push((cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1));
  }
  return '<polygon points="' + pts.join(' ') + '" fill="' + fill + '"/>';
}

var PICS = [
  { w: 'sun', ltr: 's', art: function () {
      var s = '', i, a;
      for (i = 0; i < 12; i++) {
        a = i * Math.PI / 6;
        s += '<line x1="' + (50 + Math.cos(a) * 31).toFixed(1) + '" y1="' + (50 + Math.sin(a) * 31).toFixed(1) +
             '" x2="' + (50 + Math.cos(a) * 45).toFixed(1) + '" y2="' + (50 + Math.sin(a) * 45).toFixed(1) +
             '" stroke="#f9a825" stroke-width="7" stroke-linecap="round"/>';
      }
      return s + '<circle cx="50" cy="50" r="26" fill="#ffca28" stroke="#f9a825" stroke-width="3"/>' +
        '<circle cx="42" cy="45" r="3.2" fill="#8d6e00"/><circle cx="58" cy="45" r="3.2" fill="#8d6e00"/>' +
        '<path d="M41 57 Q50 65 59 57" stroke="#8d6e00" stroke-width="3" fill="none" stroke-linecap="round"/>';
    } },
  { w: 'apple', ltr: 'a', art: function () {
      return '<path d="M50 33 C44 22 27 22 21 37 C15 52 22 74 36 86 C42 91 48 87 50 85 C52 87 58 91 64 86 C78 74 85 52 79 37 C73 22 56 22 50 33 Z" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>' +
        '<path d="M33 42 C29 47 28 55 30 62" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round"/>' +
        '<path d="M50 33 C50 24 52 18 57 13" stroke="#6d4c41" stroke-width="5" fill="none" stroke-linecap="round"/>' +
        '<ellipse cx="66" cy="19" rx="12" ry="6" fill="#43a047" stroke="#2e7d32" stroke-width="1.5" transform="rotate(-22 66 19)"/>';
    } },
  { w: 'tree', ltr: 't', art: function () {
      return '<rect x="44" y="56" width="13" height="34" rx="4" fill="#795548"/>' +
        '<circle cx="50" cy="36" r="23" fill="#388e3c"/>' +
        '<circle cx="32" cy="49" r="17" fill="#2e7d32"/>' +
        '<circle cx="68" cy="49" r="17" fill="#2e7d32"/>' +
        '<circle cx="50" cy="52" r="16" fill="#43a047"/>' +
        '<ellipse cx="50" cy="91" rx="26" ry="5" fill="#c5e1a5"/>';
    } },
  { w: 'pig', ltr: 'p', art: function () {
      return '<polygon points="26,32 32,12 46,29" fill="#f06292"/>' +
        '<polygon points="74,32 68,12 54,29" fill="#f06292"/>' +
        '<circle cx="50" cy="54" r="29" fill="#f8bbd0" stroke="#ec407a" stroke-width="2.5"/>' +
        '<circle cx="39" cy="46" r="3.6" fill="#3e2723"/><circle cx="61" cy="46" r="3.6" fill="#3e2723"/>' +
        '<ellipse cx="50" cy="63" rx="15" ry="11" fill="#f48fb1" stroke="#ec407a" stroke-width="2"/>' +
        '<ellipse cx="45" cy="63" rx="2.6" ry="4" fill="#ad1457"/><ellipse cx="55" cy="63" rx="2.6" ry="4" fill="#ad1457"/>';

var actx = null, master = null, muted = false;

    if (!AC) return;

    master.connect(actx.destination);
  } catch (e) { actx = null; master = null; }
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!actx || !master || muted) return;

    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}

  tap:  function () { tone('sine', 620, 720, 0.09, 0.16); },

  /* The "here it is" cue. Deliberately warm and RISING — there is no buzzer
     anywhere in this game, and nothing that could read as a wrong-answer noise. */
  here: function () { tone('sine', 440, 440, 0.18, 0.15, 0); tone('sine', 523, 523, 0.24, 0.15, 0.16); },
  open: function () { tone('triangle', 440, 660, 0.2, 0.16); },
  levelup: function () { var i; for (i = 0; i < 4; i++) tone('triangle', 523 * Math.pow(1.19, i), 523 * Math.pow(1.19, i), 0.18, 0.16, i * 0.1); },

    var ns = [523, 659, 784, 1047], i;

function setMuted(v) {
  muted = !!v;
  if (master) { try { master.gain.value = muted ? 0 : 0.5; } catch (e) {} }

/* ============================================================== state == */

  return o;
}

    pool: DEFAULT_POOL,
    letters: {},                       /* low -> {a: right, w: missed} */
    requeue: [],
    lvl: blankPerAct(0),               /* the found level, per activity */
    streak: blankPerAct(0),

    since: blankPerAct(0),             /* items since the last probe */

/* Defensive read: a corrupt save renders a fresh game, never crashes. The

function loadSave() {

  try { raw = localStorage.getItem(K_SAVE); } catch (e) { raw = null; }
  if (!raw) return st;
  try { o = JSON.parse(raw); } catch (e) { return st; }
  if (!o || typeof o !== 'object' || Object.prototype.toString.call(o) === '[object Array]') return st;

  if (typeof o.pool === 'number' && isFinite(o.pool)) st.pool = Math.max(DEFAULT_POOL, Math.min(LETTERS.length, Math.floor(o.pool)));
  if (typeof o.stars === 'number' && isFinite(o.stars) && o.stars >= 0) st.stars = Math.min(999999, Math.floor(o.stars));
  if (typeof o.rounds === 'number' && isFinite(o.rounds) && o.rounds >= 0) st.rounds = Math.min(999999, Math.floor(o.rounds));
  if (typeof o.act === 'string' && actIndex(o.act) >= 0) st.act = o.act;

  if (o.letters && typeof o.letters === 'object' && Object.prototype.toString.call(o.letters) !== '[object Array]') {

      if (!v || typeof v !== 'object') continue;
      var a = (typeof v.a === 'number' && isFinite(v.a) && v.a >= 0) ? Math.floor(v.a) : 0;
      var w = (typeof v.w === 'number' && isFinite(v.w) && v.w >= 0) ? Math.floor(v.w) : 0;

    }

      if (typeof lv === 'number' && isFinite(lv) && lv >= 0) st.lvl[id] = Math.min(maxRung(id), Math.floor(lv));

        if (Object.prototype.toString.call(e2) !== '[object Array]' || e2.length < 2) continue;
        if (typeof e2[0] !== 'number' || !isFinite(e2[0]) || typeof e2[1] !== 'number' || !isFinite(e2[1])) continue;
        clean.push([Math.max(0, Math.floor(e2[0])), Math.max(0, Math.min(maxRung(hid), Math.floor(e2[1])))]);

function writeSave() {

    localStorage.setItem(K_SAVE, JSON.stringify({
      v: 1, pool: state.pool, stars: state.stars, rounds: state.rounds, act: state.act,
      letters: state.letters, requeue: state.requeue,
      lvl: state.lvl, played: state.played, hist: state.hist,

/* ============================================== letter picking & weight == */

  if (it.act === 'case') {

}

}

  if (it.act === 'case') return p + ' Big ' + L.nm + ' and little ' + L.nm + ' go together.';

function sparkline(id) {
  var h = state.hist[id] || [], mx = maxRung(id), i;
  var W = 200, H = 46, pad = 4;
  if (h.length < 2) {
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<line x1="0" y1="' + (H - pad) + '" x2="' + W + '" y2="' + (H - pad) + '" stroke="rgba(74,53,32,0.18)" stroke-width="2"/>' +
      '<text x="4" y="18" font-size="11" fill="#7d6448" font-family="Segoe UI, sans-serif">not enough play yet</text></svg>';
  }

  var d = '', px, py;
  for (i = 0; i < h.length; i++) {
    px = pad + (h[i][0] / maxX) * (W - pad * 2);
    py = (H - pad) - (h[i][1] / Math.max(1, mx)) * (H - pad * 2);
    d += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ' ' + py.toFixed(1);
    if (i < h.length - 1) {
      var nx = pad + (h[i + 1][0] / maxX) * (W - pad * 2);
      d += 'L' + nx.toFixed(1) + ' ' + py.toFixed(1);   /* step, not a slope */

  }
  var s = '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  s += '<line x1="0" y1="' + (H - pad) + '" x2="' + W + '" y2="' + (H - pad) + '" stroke="rgba(74,53,32,0.18)" stroke-width="1.5"/>';
  s += '<path d="' + d + '" stroke="#ef6c00" stroke-width="2.5" fill="none"/>';
  for (i = 0; i < h.length; i++) {
    px = pad + (h[i][0] / maxX) * (W - pad * 2);
    py = (H - pad) - (h[i][1] / Math.max(1, mx)) * (H - pad * 2);
    s += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="2.6" fill="#ef6c00"/>';

function answer(idx) {
  var it = state.item;
  if (!it || state.busy || state.screen !== 'play') return;
  if (typeof idx !== 'number' || idx < 0 || idx >= it.choices.length) return;
  state.busy = true;
  clearTimers();

  var btns = app.querySelectorAll('.choice');
  var s = statFor(it.low);
  var right = (idx === it.correct);
  state.roundN++;

  if (right) {
    s.a++; dropRequeue(it.low);
    state.stars++; state.roundStars++;
    if (btns[idx]) {
      btns[idx].classList.add('right');
      var r = btns[idx].getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
    }
    SFX.yay();
    var rs = rightScript(it);
    banner('★ ' + rs.split('.')[0] + '.');
    say(rs);
  } else {
    /* No red, no buzzer, no shake, nothing marked wrong. Light up the right
       one, name it warmly, and put the letter back in the practice queue. */
    s.w++; addRequeue(it.low);
    if (btns[it.correct]) btns[it.correct].classList.add('show');
    SFX.here();
    var gs = gentleScript(it);
    banner(gs.split('.')[0] + '.', true);
    say(gs);
  }

  var moved = adapt(it.act, right, it.probe);
  writeSave();

  var wait = right ? 1600 : 2700;
  advTimer = window.setTimeout(function () {
    if (moved === 'up') {
      SFX.levelup();
      banner('Moving up');
      say('You are ready for something harder.');
      advTimer = window.setTimeout(afterFeedback, 2100);

  if (state.screen === 'done') { say('Good work. Tap the green arrow for more, or the squares to pick another game.'); return; }

app.addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  initAudio();
  var a = b.getAttribute('data-act');
  if (a === 'play')   { SFX.open(); goMenu(); return; }
  if (a === 'replay') { replay(); return; }
  if (a === 'grown')  { SFX.tap(); goGrown(); return; }
  if (a === 'home')   { SFX.tap(); goMenu(); return; }
  if (a === 'again')  { SFX.open(); startActivity(state.act); return; }
  if (a === 'pick') {
    SFX.open();
    var id = b.getAttribute('data-id');
    var ai = actIndex(id);
    say(ai >= 0 ? ACTS[ai].say : '');
    window.setTimeout(function () { startActivity(id); }, 560);
    return;
  }
  if (a === 'answer') {
    var i = parseInt(b.getAttribute('data-i'), 10);
    if (!isNaN(i)) answer(i);

  if (k === 'Escape') { if (state.screen !== 'title' && state.screen !== 'menu') goMenu(); return; }
  if (state.screen === 'title' && (k === 'Enter' || k === ' ')) { initAudio(); goMenu(); return; }

  var st = document.createElement('style');
  st.textContent =
    '#ocVoiceBtn{position:fixed;left:max(10px,env(safe-area-inset-left));' +
    'bottom:max(10px,env(safe-area-inset-bottom));z-index:40;min-height:44px;padding:0 12px 0 8px;' +
    'display:inline-flex;align-items:center;gap:7px;border-radius:14px;cursor:pointer;' +
    'border:2px solid rgba(128,128,128,0.38);background:rgba(255,255,255,0.9);color:#333;' +
    'font:700 12px "Segoe UI",system-ui,sans-serif;letter-spacing:0.06em;}' +
    '#ocVoiceBtn svg{width:28px;height:28px;display:block}' +
    'body.playing #ocVoiceBtn{display:none}' +
    '#ocVoiceWrap{position:fixed;inset:0;z-index:60;background:rgba(12,18,14,0.72);' +
    'display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}' +
    '#ocVoiceWrap.on{display:flex}' +
    '#ocVoicePanel{background:#fff;border-radius:22px;padding:16px;max-width:560px;width:100%;' +
    'font-family:"Segoe UI",system-ui,sans-serif;color:#2f4030;box-shadow:0 12px 40px rgba(0,0,0,0.35)}' +
    '#ocVoicePanel h3{margin:0 0 12px;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;' +
    'text-align:center;color:#5d7159}' +
    '#ocVoiceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}' +
    '.ocvc{min-height:110px;border-radius:18px;border:4px solid rgba(47,64,48,0.18);background:#fff;' +
    'cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}' +
    '.ocvc.on{border-color:#43a047;background:#e8f5e9}' +
    '.ocvc svg{width:56px;height:56px;display:block}' +
    '.ocvc b{font-size:15px}.ocvc i{font-style:normal;font-size:11px;color:#5d7159;font-weight:700}' +
    '#ocVoiceGrown{font-size:11px;color:#5d7159;line-height:1.5;margin-top:10px;text-align:center}' +
    '#ocVoiceGrown select{font:inherit;font-size:11px;padding:3px 5px;border-radius:8px;' +
    'border:2px solid rgba(47,64,48,0.18);max-width:180px}' +
    '#ocVoiceDone{margin-top:12px;width:100%;min-height:52px;border-radius:14px;border:4px solid #2e7d32;' +
    'background:#81c784;color:#06280b;font:800 15px "Segoe UI",system-ui,sans-serif;letter-spacing:0.14em;cursor:pointer}' +
    '@media (max-height:460px){#ocVoiceGrid{grid-template-columns:repeat(4,1fr)}' +
    '.ocvc{min-height:88px}.ocvc i{display:none}#ocVoiceGrown{display:none}}';
  document.head.appendChild(st);

  var btn = document.createElement('button');
  btn.id = 'ocVoiceBtn'; btn.type = 'button';
  btn.setAttribute('aria-label', 'Choose who reads to you');

  var wrap = document.createElement('div');
  wrap.id = 'ocVoiceWrap';
  wrap.innerHTML = '<div id="ocVoicePanel"><h3>Who should read to you?</h3>' +
    '<div id="ocVoiceGrid"></div><div id="ocVoiceGrown"></div>' +
    '<button id="ocVoiceDone" type="button">DONE</button></div>';

  function svg(inner, cls) {
    return '<svg viewBox="0 0 100 100" class="' + (cls || '') + '" aria-hidden="true">' + inner + '</svg>';
  }
  function paintBtn() { btn.innerHTML = svg(ocCur().face) + '<span>' + ocCur().name + '</span>'; }
  function paintGrid() {
    var g = wrap.querySelector('#ocVoiceGrid'), h = '', i, c;
    for (i = 0; i < OC_CHARACTERS.length; i++) {
      c = OC_CHARACTERS[i];
      h += '<button class="ocvc' + (c.id === OC_VOICE.charId ? ' on' : '') + '" type="button" data-oc="' + c.id +
        '" aria-label="' + c.name + ', ' + c.hint + '">' + svg(c.face) +
        '<b>' + c.name + '</b><i>' + c.hint + '</i></button>';
    }
    g.innerHTML = h;
    var gr = wrap.querySelector('#ocVoiceGrown'), list = ocVoices();
    if (list.length > 1) {
      var cur = ocPickedVoice(null), s = 'Grown-ups: the device voice underneath is <select id="ocVoiceSel">';
      for (i = 0; i < list.length && i < 24; i++) {
        s += '<option value="' + list[i].voiceURI + '"' +
             (cur && list[i].voiceURI === cur.voiceURI ? ' selected' : '') + '>' +
             String(list[i].name).slice(0, 26) + '</option>';
      }
      gr.innerHTML = s + '</select>. More can be added in the device&rsquo;s own settings.';
      var sel = wrap.querySelector('#ocVoiceSel');
      if (sel) sel.addEventListener('change', function () { OC_VOICE.uri = sel.value; ocSaveVoice(); ocSpeak(ocCur().line); });
    } else { gr.innerHTML = ''; }
  }
  btn.addEventListener('click', function () { paintGrid(); wrap.classList.add('on'); });
  wrap.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-oc]') : null;
    if (t) {
      OC_VOICE.charId = ocChar(t.getAttribute('data-oc')).id;
      ocSaveVoice(); paintGrid(); paintBtn();
      ocSpeak(ocCur().line);
      return;
    }
    if (e.target === wrap || (e.target && e.target.id === 'ocVoiceDone')) {
      wrap.classList.remove('on');
      try { window.speechSynthesis.cancel(); } catch (err) {}
    }
  });
  document.body.appendChild(btn);
  document.body.appendChild(wrap);
  paintBtn();
}
ocLoadVoice();
try {
  if (ocSpeechOK() && window.speechSynthesis) window.speechSynthesis.onvoiceschanged = ocVoices;
} catch (e) {}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ocVoiceUI);
else ocVoiceUI();
window.setTimeout(function () { ocVoices(); }, 400);

</script>
</body>
</html>
