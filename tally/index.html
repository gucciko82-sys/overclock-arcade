<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tally — First Numbers</title>
<meta name="theme-color" content="#f2f7ee">
<meta name="description" content="A tally is a count kept one mark at a time. Count them, find the number, spot which has more, and say what comes next. Four gentle activities that find a child's level by playing with her, then keep climbing — everything spoken aloud, nothing to lose.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="format-detection" content="telephone=no">
<style>
  :root {
    --bg: #f2f7ee;
    --bg2: #d9ead3;
    --ink: #2f4030;
    --dim: #5d7159;
    --card: #ffffff;
    --line: rgba(47,64,48,0.18);
    --accent: #2e7d5b;
    --accent2: #43a047;
    --blue: #1565c0;
    --green: #2e7d32;
    --purple: #6a1b9a;
    --warm: #ef6c00;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Trebuchet MS", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #fbfefa 0%, var(--bg) 46%, var(--bg2) 100%);
  }
  button { font-family: inherit; color: inherit; touch-action: manipulation; }

  #stage { position: fixed; inset: 0; overflow: hidden; }

  /* ---- top-right icon buttons: the 100x52 reserve ---- */
  #topbtns {
    position: absolute;
    top: max(6px, env(safe-area-inset-top));
    right: max(6px, env(safe-area-inset-right));
    display: flex; gap: 6px; z-index: 8;
  }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--card); color: var(--ink);
    border: 2px solid var(--line);
    font-size: 19px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 2px 0 rgba(47,64,48,0.14);
  }
  .iconbtn:active { transform: translateY(2px); box-shadow: none; }
  .iconbtn.off { opacity: 0.45; }
  body:not(.playing) #homeBtn { display: none; }

  /* ---- screens ---- */
  #app {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 58px max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-right));
  }
  #app.scroll { overflow-y: auto; }
  .screen { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px;
            width: 100%; max-width: 880px; align-self: center; }

  /* progress dots — how far through this short set, not a score */
  .dots { flex: 0 0 auto; height: 20px; display: flex; gap: 8px; justify-content: center; align-items: center; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; background: rgba(47,64,48,0.16); display: block; }
  .dots i.on { background: #ffb300; box-shadow: 0 0 0 3px rgba(255,179,0,0.22); }

  /* Layout is IDENTICAL every round: dots, label, prompt slot, speaker,
     clue line, choices. Nothing moves between activities or items. */
  .prompt { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px; text-align: center; }
  .eyebrow { flex: 0 0 auto; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
             color: var(--dim); font-weight: 700; }
  .slot { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .slot svg.grp { width: auto; max-width: 100%; height: 100%; max-height: 100%; display: block; }
  .bignum { font-size: clamp(52px, 15vh, 122px); font-weight: 800; line-height: 1;
            color: var(--blue); text-shadow: 0 4px 0 rgba(21,101,192,0.15); }
  /* the sequence strip for WHAT COMES NEXT — one row, the gap clearly a gap */
  .seq { display: flex; gap: clamp(6px, 2.2vw, 16px); align-items: center; justify-content: center; flex-wrap: nowrap; }
  .seq span {
    font-size: clamp(30px, 8.6vh, 70px); font-weight: 800; line-height: 1; color: var(--blue);
    min-width: clamp(36px, 9vw, 74px); text-align: center;
  }
  .seq span.gap {
    color: var(--warm); border-bottom: 6px solid rgba(239,108,0,0.5);
    border-radius: 3px;
  }
  .hintword { flex: 0 0 auto; min-height: 26px; font-size: clamp(15px, 4vw, 21px);
              font-weight: 700; color: var(--dim); display: flex; align-items: center; justify-content: center; }
  .hintword b { color: var(--green); font-size: 1.35em; }

  /* the replay speaker — same size, same place, every single screen */
  .speaker {
    flex: 0 0 auto;
    width: 104px; height: 104px; border-radius: 50%;
    border: 4px solid rgba(46,125,91,0.55);
    background: #eaf4e6; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(46,125,91,0.3);
  }
  .speaker:active { transform: translateY(3px); box-shadow: none; }
  .speaker svg { width: 60px; height: 60px; display: block; }
  .speaker.pulse { animation: pulse 1.3s ease-in-out 2; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  body.nospeech .speaker { display: none !important; }

  /* ---- answer choices: big, well spaced, forgiving ---- */
  .choices {
    flex: 0 0 auto; display: grid; gap: 14px; align-items: stretch;
    grid-template-columns: repeat(2, 1fr);
  }
  .choices.c1 { grid-template-columns: 1fr; }
  .choices.c3 { grid-template-columns: repeat(3, 1fr); }
  .choices.c4 { grid-template-columns: repeat(2, 1fr); }
  .choice {
    min-width: 90px; min-height: 122px;
    border-radius: 24px; border: 4px solid var(--line);
    background: var(--card); cursor: pointer; padding: 6px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 4px 0 rgba(47,64,48,0.13);
    position: relative; overflow: hidden;
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .choice:active { transform: translateY(3px); }
  .choice .glyph { font-size: clamp(40px, 8.4vh, 66px); font-weight: 800; line-height: 1; color: var(--blue); }
  .choice .word { font-size: 13px; font-weight: 700; color: var(--dim); letter-spacing: 0.04em; }
  /* A group of things to compare fills its whole card. The sizing here is
     fussier than it looks: an <svg> given `width: 100%` and a viewBox
     computes its own HEIGHT from the viewBox ratio, so a 730px-wide card
     silently became 245px tall and shoved the (unshrinkable) speaker button
     down on top of the cards in landscape. Height must be handed DOWN from
     the layout instead: the row takes the leftover space, the card fills the
     row, and the svg is a flex child with `height: 0` so the flex algorithm
     — not the artwork's aspect ratio — decides how tall it is. The drawing
     then letterboxes inside it via the default preserveAspectRatio. */
  .choices.groups { flex: 1 1 auto; min-height: 0; }
  .choices.groups .choice { min-height: 88px; padding: 6px; }
  .choices.groups .choice svg { width: 100%; height: 0; flex: 1 1 auto; min-height: 0; display: block; }
  .screen.grpmode .prompt { flex: 0 0 auto; }
  /* the only two states: chosen-and-right, or here-is-the-one. Never a "wrong" state. */
  .choice.right { border-color: #43a047; background: #e8f5e9; animation: bounce 0.5s ease; }
  .choice.show  { border-color: #43a047; background: #e8f5e9; animation: nudge 1s ease-in-out 2; }
  @keyframes bounce { 0% { transform: scale(1); } 35% { transform: scale(1.1); } 65% { transform: scale(0.98); } 100% { transform: scale(1); } }
  @keyframes nudge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* ---- menu ---- */
  .tiles { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .tile {
    min-height: 110px; border-radius: 26px; border: 4px solid var(--line);
    background: var(--card); cursor: pointer; padding: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    box-shadow: 0 4px 0 rgba(47,64,48,0.13);
  }
  .tile:active { transform: translateY(3px); box-shadow: none; }
  .tile svg { width: clamp(56px, 15vh, 132px); height: clamp(56px, 15vh, 132px); display: block; }
  .tile .word { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
  .menuhead { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
  .grownlink {
    flex: 0 0 auto; align-self: center; min-height: 44px; padding: 0 20px; margin-top: 2px;
    border-radius: 12px; border: 2px solid var(--line); background: rgba(255,255,255,0.6);
    font-size: 11px; font-weight: 800; letter-spacing: 0.18em; color: var(--dim);
    text-transform: uppercase; cursor: pointer;
  }

  /* ---- who is reading to you ---- */
  .voicegrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 520px; }
  .voicecard {
    min-height: 118px; border-radius: 22px; border: 4px solid var(--line);
    background: var(--card); cursor: pointer; padding: 8px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 4px 0 rgba(47,64,48,0.13);
  }
  .voicecard:active { transform: translateY(3px); box-shadow: none; }
  .voicecard.on { border-color: #43a047; background: #e8f5e9; }
  .voicecard svg { width: clamp(46px, 9vh, 74px); height: clamp(46px, 9vh, 74px); display: block; }
  .voicecard .vname { font-size: 16px; font-weight: 800; color: var(--ink); }
  .voicecard .vhint { font-size: 11.5px; font-weight: 700; color: var(--dim); }
  .menufoot { flex: 0 0 auto; display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 2px; flex-wrap: wrap; }
  .voicelink { display: inline-flex; align-items: center; gap: 7px; text-transform: none; letter-spacing: 0.06em; font-size: 12px; }
  .voicelink svg { width: 26px; height: 26px; display: block; }
  .vgrown { font-size: 11.5px; color: var(--dim); line-height: 1.5; max-width: 520px; text-align: center; }
  .vgrown select { font: inherit; font-size: 12px; padding: 4px 6px; border-radius: 8px;
                   border: 2px solid var(--line); background: #fff; color: var(--ink); max-width: 190px; }

  /* ---- title / finish ---- */
  .center { align-items: center; justify-content: center; text-align: center; gap: 14px; }
  h1 { margin: 0; font-size: clamp(48px, 15vw, 96px); font-weight: 800; letter-spacing: 0.16em;
       color: var(--accent); text-shadow: 0 5px 0 rgba(46,125,91,0.22); }
  .tagline { font-size: clamp(13px, 3.6vw, 17px); color: var(--dim); font-weight: 700; max-width: 470px; }
  .btn {
    min-height: 84px; min-width: 210px; padding: 0 34px;
    border-radius: 26px; border: 4px solid #2e7d32; background: #81c784; color: #06280b;
    font-size: 26px; font-weight: 800; letter-spacing: 0.22em; cursor: pointer;
    box-shadow: 0 5px 0 rgba(27,94,32,0.5);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:active { transform: translateY(4px); box-shadow: none; }
  .btn::before { content: "\25B6"; margin-right: 14px; font-size: 22px; }
  .grownup { font-size: 11.5px; color: var(--dim); line-height: 1.55; max-width: 470px; }
  .bigrow { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .bigbtn {
    min-width: 132px; min-height: 132px; border-radius: 30px; border: 4px solid var(--line);
    background: var(--card); cursor: pointer; padding: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    box-shadow: 0 5px 0 rgba(47,64,48,0.14);
  }
  .bigbtn.go { border-color: #2e7d32; background: #e8f5e9; }
  .bigbtn:active { transform: translateY(4px); box-shadow: none; }
  .bigbtn svg { width: 74px; height: 74px; display: block; }
  .bigbtn .word { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; }
  .starrow { display: flex; gap: 6px; justify-content: center; }
  .starrow svg { width: 40px; height: 40px; }

  /* ---- grown-up progress ---- */
  .gu { text-align: left; font-size: 13px; color: var(--ink); }
  .gu h2 { margin: 0 0 8px; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .gcard { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .gcard .gt { font-weight: 800; font-size: 14px; margin-bottom: 2px; }
  .gcard .gl { font-size: 12px; color: var(--dim); }
  .gcard .lvlbar { display: flex; gap: 3px; margin: 6px 0 4px; }
  .gcard .lvlbar i { flex: 1 1 0; height: 9px; border-radius: 4px; background: rgba(47,64,48,0.14); display: block; }
  .gcard .lvlbar i.on { background: #66bb6a; }
  .gcard .lvlbar i.now { background: var(--accent); }
  .gcard svg.spark { width: 100%; height: 46px; display: block; margin-top: 4px; }
  .gnote { font-size: 11.5px; color: var(--dim); line-height: 1.55; margin: 4px 0 10px; }

  /* ---- stars / banner ---- */
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 7; overflow: hidden; }
  .star { position: absolute; width: 40px; height: 40px; animation: fly 1s ease-out forwards; }
  @keyframes fly {
    0% { transform: translate(0,0) scale(0.3) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.25) rotate(190deg); opacity: 0; }
  }
  #banner {
    position: absolute; left: 50%; top: 10%; transform: translateX(-50%);
    background: rgba(255,255,255,0.94); border: 3px solid var(--line);
    border-radius: 18px; padding: 8px 18px; font-size: 17px; font-weight: 800;
    color: var(--green); z-index: 9; display: none; max-width: 88%; text-align: center;
  }
  #banner.on { display: block; }
  #banner.soft { color: var(--dim); }

  /* ---- gallery (verification aid, not part of play) ---- */
  #gallery { position: absolute; inset: 0; overflow: auto; background: var(--bg); z-index: 20; padding: 10px; display: none; }
  #gallery.on { display: block; }
  #gallery .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #gallery .gi { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 6px; text-align: center; }
  #gallery .gi svg { width: 100%; height: auto; display: block; }
  #gallery .gi b { font-size: 13px; }

  @media (min-width: 700px) { .choices.c4 { grid-template-columns: repeat(4, 1fr); } }
  @media (max-height: 460px) {
    #app { padding-top: 52px; }
    .screen { gap: 6px; }
    .dots { height: 16px; }
    .choices { gap: 10px; }
    .choices.c4 { grid-template-columns: repeat(4, 1fr); }
    .choice { min-height: 104px; border-radius: 18px; }
    .choices.groups .choice { min-height: 80px; }
    .prompt { gap: 4px; }
    .bignum { font-size: clamp(34px, 12vh, 60px); }
    /* 342px of usable height cannot hold the decorative plus/minus AND the
       speaker AND two panels of things to count. The symbol is the only one
       of the three that carries nothing: the question is spoken, the hint
       line repeats it in words, and the panels are the answer. */
    .screen.grpmode .slot { display: none; }
    .tiles { grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .tile { min-height: 92px; border-radius: 18px; }
    .speaker { width: 64px; height: 64px; }
    .speaker svg { width: 38px; height: 38px; }
    .hintword { font-size: 13px; }
    .btn { min-height: 68px; font-size: 22px; }
    .bigbtn { min-width: 116px; min-height: 116px; }
    .bigbtn svg { width: 58px; height: 58px; }
    .grownup { display: none; }
    .voicegrid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .voicecard { min-height: 92px; border-radius: 16px; }
    .voicecard .vhint { display: none; }
    .vgrown { display: none; }
    .hintword { min-height: 20px; }
    .seq span { font-size: clamp(26px, 13vh, 52px); }
  }
  @media (max-width: 374px) { .choices { gap: 12px; } .tiles { gap: 12px; } }
</style>
</head>
<body>
<div id="stage">
  <div id="topbtns">
    <button class="iconbtn" id="muteBtn" type="button" aria-label="Sound on or off">&#9835;</button>
    <button class="iconbtn" id="homeBtn" type="button" aria-label="Back to the picture menu">&#9632;</button>
  </div>
  <div id="app"></div>
  <div id="fx"></div>
  <div id="banner"></div>
  <div id="gallery"></div>
</div>
<script>
/* =========================================================================
   TALLY — first numbers, for the Overclock family arcade.

   A tally is a count kept one mark at a time. This is the rung BELOW Sum:
   Sum starts at written addition and climbs to fractions, and it assumes a
   reader. Tally is for a child who is still working out that four things
   are four things however you arrange them — and it hands off to Sum.

   WHO IT IS FOR, and every rule that follows from it (same family as Char,
   Trace and Echo — see those files, and keep all four consistent):

   * She cannot read. Every prompt is SPOKEN with the browser's own
     speechSynthesis and ALSO drawn. Text on screen is for the grown-up.
     A big speaker button sits in the same place on every screen.
   * She may be working below her age, and her motor control may be
     affected. Targets are huge and well spaced, taps are single and
     forgiving, and the layout never moves between items.
   * She is bright and has been short of air, not short of ability. The
     ladder does not stop at the easy start — it climbs to teen numbers,
     ten-frames, comparison and counting in twos, then points at Sum.
   * The game FINDS HER LEVEL by playing with her. No difficulty screen.
     Up after four in a row, down fast after two misses, and an occasional
     quiet probe one rung above so she can never get stuck low. A probe
     must be right TWICE running before it promotes — one lucky tap on a
     two-choice question is not evidence, and that bug was found the hard
     way in Char and Echo.
   * There is no failure state anywhere. No red, no buzzer, no shake, no
     score, no timer. A miss says the right answer warmly, shows it, and
     brings the number back later as ordinary practice.
   * She is never asked to say anything. Everything is tapping.

   ON COUNTING SPECIFICALLY. The arrangement is half the difficulty, so the
   rungs move through it deliberately: a neat row first (easy to track),
   then dot patterns (subitising — seeing four without counting), then
   scattered (needs a real strategy), then ten-frames for the teens (which
   is how ten-and-some is taught). Distractors are far apart low down and
   plus-or-minus-one high up, because "off by one" is the mistake that
   actually means something.

   speechSynthesis is a browser API, not an asset — but it is missing often
   enough (headless, kiosks, some Linux builds) that the whole game has to
   work in silence. When it is missing the speaker is hidden and the
   pictures carry the question.
   ========================================================================= */

/* ============================================================ storage == */
var K_SAVE  = 'tally_v1';
var K_MUTED = 'tally_muted_v1';
function loadStr(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function saveStr(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

/* ============================================================ numbers == */
var MAXN = 100;    /* the numbers she is asked to recognise and count */
var MAXKEY = 200;  /* the numbers the save file will track — counting by ten
                      walks past twenty, and dropping those stats on load
                      would silently lose her practice on that rung */
var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
             'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen',
             'eighteen', 'nineteen', 'twenty'];
var TENS = { 20: 'twenty', 30: 'thirty', 40: 'forty', 50: 'fifty',
             60: 'sixty', 70: 'seventy', 80: 'eighty', 90: 'ninety', 100: 'one hundred' };
/* Speech reads a bare numeral well enough, but not reliably and not at the
   same pace as the rest of the sentence — "ten, twenty, 30" was audibly a
   different voice mid-count. Every number this game can say has a word. */
function word(n) {
  if (n >= 0 && n < WORDS.length) return WORDS[n];
  if (TENS[n]) return TENS[n];
  var t = Math.floor(n / 10) * 10, u = n - t;
  if (TENS[t] && u > 0 && u < 10) return TENS[t] + '-' + WORDS[u];
  return String(n);
}
function has(arr, v) { var i; for (i = 0; i < arr.length; i++) if (arr[i] === v) return true; return false; }
function clampInt(v, lo, hi, d) {
  if (typeof v !== 'number' || !isFinite(v)) return d;
  v = Math.floor(v);
  return v < lo ? lo : (v > hi ? hi : v);
}
/* Deterministic per item, so a re-render never moves the things she is
   counting. Nothing here is used for game logic timing. */
function rngFrom(seed) {
  var s = (seed >>> 0) || 1;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function pickInt(rand, lo, hi) { return lo + Math.floor(rand() * (hi - lo + 1)); }

/* ============================================================= things == */
/* Six countable things, each a different SHAPE as well as a different
   colour — she must be able to tell them apart at thumbnail size and in
   greyscale. Every one is drawn from (cx, cy, r) so any layout can place
   it. Within one question every thing is identical: counting a mixed pile
   is a different (harder) skill and is not what is being asked here. */
var THINGS = [
  { id: 'apple', w: 'apples', one: 'apple', art: function (cx, cy, r) {
      return '<path d="M' + (cx - r * 0.98) + ' ' + (cy + r * 0.12) +
        ' a' + (r * 0.62) + ' ' + (r * 0.9) + ' 0 0 1 ' + (r * 0.98) + ' ' + (-r * 0.62) +
        ' a' + (r * 0.62) + ' ' + (r * 0.9) + ' 0 0 1 ' + (r * 0.98) + ' ' + (r * 0.62) +
        ' a' + (r * 1.06) + ' ' + (r * 1.14) + ' 0 0 1 ' + (-r * 1.96) + ' 0 z" fill="#e53935"/>' +
        '<rect x="' + (cx - r * 0.09) + '" y="' + (cy - r * 1.02) + '" width="' + (r * 0.18) + '" height="' + (r * 0.5) + '" rx="' + (r * 0.09) + '" fill="#6d4c41"/>' +

/* ====================================================== group layouts == */

   full frame plus a second for 11-20, so "fourteen" reads as ten and four. */
function layoutFrame(n) {

   *
   * Past twenty they must NOT keep stacking. Ten frames in a column is a block
   * ten times taller than it is wide, and the slot is short, so the whole
   * thing scales down to a stripe of unreadable specks — ninety flowers came
   * out roughly the size of this sentence. Nobody can count that.
   *
   * So above twenty it becomes a HUNDRED SQUARE: ten to a row, rows stacked,
   * with a wider gutter every five columns and every five rows so it stays
   * countable in fives. That is both the readable aspect ratio and the thing
   * a hundred square is for. */

  function cy(row) { return 8 + row * cell + Math.floor(row / 5) * GUT + cell / 2; }

/* Elizabeth topped out all four of these ladders in a day. That is the game's

 * growth function that takes a tier number and returns a harder rung, and the
 * ladder is built by running it until TOP_TIER. Raising that one number gives
 * her more ladder — nobody has to hand-write another rung, and nothing below
 * her current level moves, so her saved place is untouched.
 *

 * changes, because bigger numbers alone is not harder thinking. Ten-frames

          for (j = 0; j < gN; j++) vals.push(base + j * (1 + Math.floor(rand() * 3)));

          tens = pickInt(rand, 1, Math.min(9, Math.floor(R.max / 10)));
          ones = pickInt(rand, 1, 9);
          while (ones === tens) ones = pickInt(rand, 1, 9);
          vals.push(tens * 10 + ones);
          vals.push(ones * 10 + tens);
          while (vals.length < gN) vals.push(pickInt(rand, Math.min(tens, ones) * 10, R.max));
        } else {                                 /* same tens, ones decide it */
          tens = pickInt(rand, 1, Math.max(1, Math.floor(R.max / 10) - 1));
          for (j = 0; j < gN; j++) vals.push(tens * 10 + pickInt(rand, 0, 9));
        }
        for (j = 0; j < vals.length; j++) if (vals[j] > R.max) vals[j] = R.max - j;
      } else {
        for (j = 0; j < gN; j++) {
          v2 = pickInt(rand, 1, R.max);
          vals.push(v2);
        }
      }
      vals.sort(function (a, b) { return a - b; });
      ok = true;
      for (j = 1; j < vals.length; j++) if (vals[j] === vals[j - 1]) ok = false;
      if (ok && (vals[vals.length - 1] - vals[vals.length - 2]) < R.gap) ok = false;
      if (ok && (R.mode === 'fewer' || R.mode === 'smallnum') && (vals[1] - vals[0]) < R.gap) ok = false;
      if (ok) break;
    }
    if (!ok) { vals = []; for (j = 0; j < gN; j++) vals.push(j * Math.max(1, R.gap) + 1); }
    /* Shuffle which panel holds which count, then work out the answer. */
    var order = vals.slice(), i2, k2, tmp;
    for (i2 = order.length - 1; i2 > 0; i2--) { k2 = Math.floor(rand() * (i2 + 1)); tmp = order[i2]; order[i2] = order[k2]; order[k2] = tmp; }
    var thing = Math.floor(rand() * THINGS.length);
    var rFix = radiusFor(Math.max.apply(null, order), R.layout);
    var want = (R.mode === 'fewer' || R.mode === 'smallnum') ? Math.min.apply(null, order) : Math.max.apply(null, order);
    for (i2 = 0; i2 < order.length; i2++) {
      if (R.mode === 'bignum' || R.mode === 'smallnum') {
        it.groups.push({ n: order[i2] });
      } else {
        /* Same thing in every panel: if one side is ducks and the other is
           blocks she can answer by preferring ducks, and the question stops
           being about quantity. */
        it.groups.push({ n: order[i2], thing: thing, group: layoutFor(order[i2], R.layout, seed + i2 * 7919, rFix) });
      }
      if (order[i2] === want) it.correct = i2;
    }
    if (R.mode !== 'bignum' && R.mode !== 'smallnum') normalizeGroups(it.groups);
    it.choices = order;
    it.kind = (R.mode === 'bignum' || R.mode === 'smallnum') ? 'num' : 'group';
    it.n = want; it.key = want;

  } else {
    /* next */
    it.mode = R.mode;
    var step = 1, start;
    if (R.mode === 'tens') step = 10;
    if (R.mode === 'twos') step = R.step || ((rand() < 0.5) ? 2 : 5);
    if (R.mode === 'back') step = -(R.step || 1);
    if (R.mode === 'back') {
      /* Counting down is a genuinely different skill from counting up, and it
         is the one that makes taking-away make sense later. */
      start = pickInt(rand, R.lo + Math.abs(step) * R.span, R.hi);
      it.seq = [];
      var sb;
      for (sb = 0; sb < R.span; sb++) it.seq.push(start + step * sb);
      it.answer = start + step * R.span;
      it.blank = R.span;
    } else if (R.mode === 'tens' && R.anyStart) {
      /* Counting by ten from a number that is NOT a multiple of ten:
         twenty-three, thirty-three, forty-three... the ones digit never moves. */
      start = pickInt(rand, R.lo, R.hi);
      it.seq = [start, start + 10, start + 20];
      it.answer = start + 30;
      it.blank = 3;
    } else if (R.mode === 'tens') {
      start = 10;
      it.seq = [10, 20, 30];
      it.answer = 40;
      /* Counting by ten past twenty is still counting by ten; the numerals
         stay inside twenty for what she has to TAP by using a short run. */
      var runs = [[10, 20, 30, 40], [20, 30, 40, 50], [10, 20, 30, 40]];
      var pick = runs[Math.floor(rand() * runs.length)];
      it.seq = pick.slice(0, 3); it.answer = pick[3];
      it.blank = 3;
    } else if (R.mode === 'twos') {
      var maxStart = Math.max(step, R.hi - step * 3);
      start = step * (1 + Math.floor(rand() * Math.max(1, Math.floor(maxStart / step))));
      it.seq = [start, start + step, start + step * 2];
      it.answer = start + step * 3;
      it.blank = 3;
    } else if (R.mode === 'before') {
      start = pickInt(rand, R.lo, Math.max(R.lo, R.hi - R.span + 1));
      it.seq = [];
      var s2;
      for (s2 = 0; s2 < R.span; s2++) it.seq.push(start + s2);
      it.answer = start - 1;
      if (it.answer < 0) { it.answer = 0; }
      it.blank = -1;                       /* the gap sits before the run */
    } else if (R.mode === 'middle') {
      start = pickInt(rand, R.lo, Math.max(R.lo, R.hi - R.span));
      it.seq = [];
      var s3;
      for (s3 = 0; s3 < R.span; s3++) it.seq.push(start + s3);
      it.blank = 1 + Math.floor(rand() * Math.max(1, R.span - 2));
      it.answer = it.seq[it.blank];
    } else {
      start = pickInt(rand, R.lo, Math.max(R.lo, R.hi - R.span));
      it.seq = [];
      var s4;
      for (s4 = 0; s4 < R.span; s4++) it.seq.push(start + s4);
      it.answer = start + R.span;
      it.blank = R.span;
    }
    var c3;
    if (R.mode === 'tens' || R.mode === 'back' || (R.mode === 'twos' && R.step >= 5)) {
      c3 = stepChoices(it.answer, R.choices, Math.abs(step) || 10, rand);
    } else {
      var cl = Math.max(0, Math.min(R.cLo, it.answer));
      var ch = Math.max(R.cHi, it.answer);
      c3 = numChoices(it.answer, R.choices, cl, ch, R.tight, rand);
    }
    it.choices = c3.list; it.correct = c3.idx; it.kind = 'num';
    it.n = it.answer; it.key = it.answer;
  }
  return it;
}

/* Every so often, quietly ask one question from the rung above. She is
   never told, nothing is lost if she misses it, and it takes TWO in a row
   to actually move her up — one lucky tap on a two-choice question is not
   evidence of anything. */
function nextItemSpec() {
  var id = state.act, lvl = state.lvl[id];
  var wantProbe = (state.probeHit[id] > 0) || (lvl < maxRung(id) && state.since[id] >= PROBE_EVERY);
  if (wantProbe && lvl < maxRung(id)) return buildItem(id, lvl + 1, true);
  return buildItem(id, lvl, false);
}

/* ============================================== the level, found and moved == */
function noteHist(id) {
  var h = state.hist[id];
  if (Object.prototype.toString.call(h) !== '[object Array]') { h = state.hist[id] = []; }
  h.push([state.played[id], state.lvl[id]]);
  while (h.length > 60) h.shift();
}
function promote(id) {
  if (state.lvl[id] >= maxRung(id)) return false;
  state.lvl[id]++;
  state.streak[id] = 0;
  state.recent[id] = [];
  noteHist(id);
  return true;
}
function demote(id) {
  if (state.lvl[id] <= 0) { state.recent[id] = []; state.streak[id] = 0; return false; }
  state.lvl[id]--;
  state.streak[id] = 0;
  state.recent[id] = [];      /* hysteresis: a clean slate, so it can't yo-yo */
  noteHist(id);
  return true;
}
/* How many answer buttons a rung puts in front of her — this IS the guess
   floor. Two panels means half of all wrong answers come back right. */
function rungChoices(id, lvl) {
  var R = rungOf(id, lvl);
  return R.choices || R.groups || 2;
}
/* The gates have to be harder where luck is cheaper.
 *
 * Char, Echo, Find and What-comes-next all widen from two buttons to four
 * as they climb, so the guess floor falls from 50% to 25% and naturally
 * brakes the climb. WHICH HAS MORE cannot do that — comparing five groups
 * at once is a different, worse question — so it sits at two or three
 * panels the whole way up, and a flat four-in-a-row gate let a simulated
 * floor-level learner drift a FULL RUNG above her true level on luck alone.
 * Measured, not guessed: see the ladder simulation in the build log.
 *
 * Four in a row on two buttons is 1-in-16 by chance; five is 1-in-32. A
 * learner who genuinely has the rung still clears five about half the time,
 * so this costs her almost nothing and costs luck half its power. */
function promoteNeed(id) {
  return rungChoices(id, state.lvl[id]) <= 2 ? PROMOTE_STREAK + 1 : PROMOTE_STREAK;
}
function probeNeed(id) {
  return rungChoices(id, Math.min(maxRung(id), state.lvl[id] + 1)) <= 2 ? 3 : 2;
}
/* Aim for 75-85% success: up after four in a row (five where the guess
   floor is 50%), down fast after two misses in the recent window. These
   constants were measured by running simulated learners of known ability
   through this exact function — do not change them without re-running that
   simulation. Returns 'up' | 'down' | ''. */
function adapt(id, wasRight, wasProbe) {
  var moved = '';
  state.played[id]++;
  state.since[id]++;
  if (wasProbe) {
    if (wasRight) {
      state.probeHit[id]++;
      if (state.probeHit[id] >= probeNeed(id)) {
        state.probeHit[id] = 0; state.since[id] = 0;
        if (promote(id)) moved = 'up';
      }
      /* otherwise: ask the rung above again next item */
    } else {
      state.probeHit[id] = 0; state.since[id] = 0; state.streak[id] = 0;
    }
    return moved;
  }
  var r = state.recent[id];
  if (Object.prototype.toString.call(r) !== '[object Array]') r = state.recent[id] = [];
  r.push(wasRight ? 1 : 0);
  while (r.length > RECENT_WINDOW) r.shift();

  if (wasRight) {
    state.streak[id]++;
    if (state.streak[id] >= promoteNeed(id) && promote(id)) moved = 'up';
  } else {
    state.streak[id] = 0;
    var misses = 0, i;
    for (i = 0; i < r.length; i++) if (!r[i]) misses++;
    if (misses >= DEMOTE_MISSES && demote(id)) moved = 'down';
  }
  return moved;
}

/* ============================================================= scripts == */
function plural(n, t) { return n === 1 ? t.one : t.w; }
function seqSpoken(it) {
  var parts = [], i;
  for (i = 0; i < it.seq.length; i++) parts.push(word(it.seq[i]));
  return parts.join(', ');
}
function promptScript(it) {
  var t;
  if (it.act === 'howmany') {
    t = thingAt(it.thing);
    return 'How many ' + t.w + '? Count them, then tap the number.';
  }
  if (it.act === 'find') {
    return 'Find the number ' + word(it.n) + '. Tap ' + word(it.n) + '.';
  }
  if (it.act === 'more') {
    if (it.mode === 'bignum') return 'Which is the bigger number? Tap the bigger number.';
    if (it.mode === 'smallnum') return 'Which is the smaller number? Tap the smaller number.';
    if (it.mode === 'fewer') return 'Which one has less? Tap the one with less.';
    if (it.mode === 'most') return 'Which one has the most? Tap the one with the most.';
    return 'Which one has more? Tap the one with more.';
  }
  if (it.mode === 'before') return seqSpoken(it) + '. What comes before ' + word(it.seq[0]) + '?';
  if (it.mode === 'middle') {
    var shown = [], i;
    for (i = 0; i < it.seq.length; i++) shown.push(i === it.blank ? 'something' : word(it.seq[i]));
    return shown.join(', ') + '. Which number is missing?';
  }
  return seqSpoken(it) + '. What comes next?';
}
function echoScript(it) {
  if (it.act === 'howmany') return 'How many?';
  if (it.act === 'find') return word(it.n) + '.';
  if (it.act === 'more') {
    if (it.mode === 'bignum') return 'The bigger number.';
    if (it.mode === 'smallnum') return 'The smaller number.';
    if (it.mode === 'fewer') return 'Which has less?';
    if (it.mode === 'most') return 'Which has the most?';
    return 'Which has more?';
  }
  if (it.mode === 'before') return 'What comes before?';
  if (it.mode === 'middle') return 'Which one is missing?';
  return 'What comes next?';
}
var PRAISE = ['Yes.', 'That is right.', 'Good counting.', 'Nice work.', 'You got it.', 'Correct.'];
function praiseFor(it) { return PRAISE[Math.abs(it.seed) % PRAISE.length]; }
function answerPhrase(it) {
  var t;
  if (it.act === 'howmany') { t = thingAt(it.thing); return word(it.n) + ' ' + plural(it.n, t); }
  if (it.act === 'find') return 'That is ' + word(it.n) + '.';
  if (it.act === 'more') {
    if (it.mode === 'bignum') return word(it.n) + ' is the bigger number.';
    if (it.mode === 'smallnum') return word(it.n) + ' is the smaller number.';
    t = thingAt(it.groups[it.correct].thing);
    if (it.mode === 'fewer') return 'That one has ' + word(it.n) + ' ' + plural(it.n, t) + ', and that is less.';
    return 'That one has ' + word(it.n) + ' ' + plural(it.n, t) + '.';
  }
  return word(it.answer) + '.';
}
function rightScript(it) { return praiseFor(it) + ' ' + answerPhrase(it); }
function gentleScript(it) {
  /* No "wrong", no "try again", nothing that reads as a correction. Say the
     answer warmly, show it, and move on. */
  if (it.act === 'howmany') {
    var t = thingAt(it.thing);
    /* "There ARE one star" is the kind of thing that goes straight past a
       reader and lands squarely on a child who is being read to. */
    return 'There ' + (it.n === 1 ? 'is ' : 'are ') + word(it.n) + ' ' + plural(it.n, t) +
      '. Let us count them together next time.';
  }
  if (it.act === 'find') return 'This one is ' + word(it.n) + '.';
  if (it.act === 'more') {
    if (it.mode === 'bignum') return word(it.n) + ' is the bigger number.';
    if (it.mode === 'smallnum') return word(it.n) + ' is the smaller number.';
    return 'This one is the one. ' + answerPhrase(it);
  }
  if (it.mode === 'before') return word(it.answer) + ' comes before ' + word(it.seq[0]) + '.';
  if (it.mode === 'middle') return 'The missing number is ' + word(it.answer) + '.';
  return word(it.answer) + ' comes next.';
}

function choiceInner(it, i) {
  if (it.kind === 'group') {

  }
  return '<span class="glyph">' + it.choices[i] + '</span>';
}
function choicesHtml(it) {

  for (i = 0; i < it.choices.length; i++) {

      '" aria-label="choice ' + (i + 1) + '">' + choiceInner(it, i) + '</button>';
  }

}

/* Identical structure for all four activities, every item: dots, label,
   prompt slot, speaker, clue line, choices. Nothing ever moves. */
function renderPlay() {
  var it = state.item;
  if (!it) { state.item = it = nextItemSpec(); }
  var A = actById(it.act);
  var slot = '', clue = '', i;

  if (it.act === 'howmany') {
    slot = groupSvg(it.group, thingAt(it.thing), 'grp');
    clue = 'how many?';
  } else if (it.act === 'find') {
    slot = '<div class="bignum">?</div>';
    clue = 'listen, then find it';
  } else if (it.act === 'more') {
    slot = '<div class="bignum">' + ((it.mode === 'fewer' || it.mode === 'smallnum') ? '&#8722;' : '&#43;') + '</div>';
    clue = it.mode === 'smallnum' ? 'tap the smaller number'
         : it.mode === 'bignum' ? 'tap the bigger number'
         : it.mode === 'fewer' ? 'tap the one with less'
         : it.mode === 'most' ? 'tap the one with the most'
         : 'tap the one with more';
  } else {
    var parts = '<div class="seq">';
    if (it.blank === -1) parts += '<span class="gap">?</span>';
    for (i = 0; i < it.seq.length; i++) {
      if (it.blank === i) parts += '<span class="gap">?</span>';
      else parts += '<span>' + it.seq[i] + '</span>';
    }
    if (it.blank === it.seq.length) parts += '<span class="gap">?</span>';
    slot = parts + '</div>';
    clue = it.mode === 'before' ? 'what came before?'
         : it.mode === 'middle' ? 'which one is missing?'
         : it.mode === 'back' ? 'keep counting down'
         : 'what comes next?';
  }

  app.innerHTML = '<div class="screen' + (it.kind === 'group' ? ' grpmode' : '') + '">' + dotsRow() +
    '<div class="prompt">' +
      '<div class="eyebrow">' + A.label + '</div>' +
      '<div class="slot">' + slot + '</div>' +
      speakerBtn('') +
      '<div class="hintword"><span>' + clue + '</span></div>' +
    '</div>' +
    choicesHtml(it) + '</div>';
}

        '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="30,20 82,50 30,80" fill="#2e7d32"/></svg>' +
        '<span class="word">More</span></button>' +
      '<button class="bigbtn" type="button" data-act="home" aria-label="Choose another game">' +
        '<svg viewBox="0 0 100 100" aria-hidden="true">' +
          '<rect x="12" y="12" width="34" height="34" rx="7" fill="#1565c0"/>' +
          '<rect x="54" y="12" width="34" height="34" rx="7" fill="#2e7d5b"/>' +
          '<rect x="12" y="54" width="34" height="34" rx="7" fill="#2e7d32"/>' +
          '<rect x="54" y="54" width="34" height="34" rx="7" fill="#6a1b9a"/></svg>' +
        '<span class="word">Games</span></button>' +
    '</div>' + '<div class="grownup">' + doneNote() + '</div></div>';
  app.innerHTML = h;
}
function doneNote() {
  var id = state.act, lv = state.lvl[id], mx = maxRung(id);
  var s = 'Level ' + (lv + 1) + ' of ' + (mx + 1) + ' &mdash; ' + rungOf(id, lv).name +
    '. Tally moves this on its own as she plays; nothing here needs setting. ';
  s += (allTopped()
    ? 'She has topped out every ladder in Tally &mdash; SUM is the next game up: written adding, taking away and beyond.'
    : 'When every ladder here is topped out, SUM is the next game up: written adding and taking away.');
  return s;
}
function allTopped() { var i; for (i = 0; i < ACTS.length; i++) if (state.lvl[ACTS[i].id] < maxRung(ACTS[i].id)) return false; return true; }

/* ---- grown-up progress: real growth, per activity, over time ---- */
function sparkline(id) {
  var h = state.hist[id] || [], mx = maxRung(id), i;
  var W = 200, H = 46, pad = 4;
  if (h.length < 2) {
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<line x1="0" y1="' + (H - pad) + '" x2="' + W + '" y2="' + (H - pad) + '" stroke="rgba(47,64,48,0.18)" stroke-width="2"/>' +
      '<text x="4" y="18" font-size="11" fill="#5d7159" font-family="Segoe UI, sans-serif">not enough play yet</text></svg>';
  }
  var maxX = Math.max(1, h[h.length - 1][0]);
  var d = '', px, py;
  for (i = 0; i < h.length; i++) {
    px = pad + (h[i][0] / maxX) * (W - pad * 2);
    py = (H - pad) - (h[i][1] / Math.max(1, mx)) * (H - pad * 2);
    d += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ' ' + py.toFixed(1);
    if (i < h.length - 1) {
      var nx = pad + (h[i + 1][0] / maxX) * (W - pad * 2);
      d += 'L' + nx.toFixed(1) + ' ' + py.toFixed(1);   /* step, not a slope */
    }
  }
  var s = '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  s += '<line x1="0" y1="' + (H - pad) + '" x2="' + W + '" y2="' + (H - pad) + '" stroke="rgba(47,64,48,0.18)" stroke-width="1.5"/>';
  s += '<path d="' + d + '" stroke="#2e7d5b" stroke-width="2.5" fill="none"/>';
  for (i = 0; i < h.length; i++) {
    px = pad + (h[i][0] / maxX) * (W - pad * 2);
    py = (H - pad) - (h[i][1] / Math.max(1, mx)) * (H - pad * 2);
    s += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="2.6" fill="#2e7d5b"/>';
  }
  return s + '</svg>';
}
function numbersSolid() {
  var n = 0, i, s, t;
  for (i = 1; i <= MAXN; i++) {
    s = state.nums[String(i)];
    if (!s) continue;
    t = s.a + s.w;
    if (t >= 4 && s.a / t >= 0.75) n++;
  }
  return n;
}
function renderGrown() {
  var h = '<div class="screen gu"><h2>Progress</h2>' +
    '<div class="gnote">Tally finds her level by playing with her: up a rung after four right in a row, down a rung after two misses, ' +
    'and every so often a quiet try at the rung above &mdash; which has to come back right twice before it counts, so a lucky tap ' +
    'cannot hand her a level. Nothing here needs setting, and her level is remembered between sessions: she resumes, she is never re-tested.</div>';
  var i, j, id, lv, mx, a, tot, right;
  for (i = 0; i < ACTS.length; i++) {
    id = ACTS[i].id; lv = state.lvl[id]; mx = maxRung(id); a = ACTS[i];
    h += '<div class="gcard"><div class="gt">' + a.label + '</div>' +
      '<div class="gl">Level ' + (lv + 1) + ' of ' + (mx + 1) + ' &mdash; ' + rungOf(id, lv).name + '</div>' +
      '<div class="lvlbar">';
    for (j = 0; j <= mx; j++) h += '<i class="' + (j < lv ? 'on' : (j === lv ? 'now' : '')) + '"></i>';
    h += '</div><div class="gl">' + state.played[id] + ' turns played</div>' + sparkline(id) + '</div>';
  }
  tot = 0; right = 0;
  for (i = 1; i <= MAXN; i++) {
    var s = state.nums[String(i)];
    if (s) { tot += s.a + s.w; right += s.a; }
  }
  h += '<div class="gcard"><div class="gt">Numbers</div>' +
    '<div class="gl">' + numbersSolid() + ' of ' + MAXN + ' numbers solid &middot; ' +
    (tot ? Math.round(100 * right / tot) : 0) + '% right over ' + tot + ' turns</div></div>';
  h += '<div class="gnote">' + (allTopped()
      ? 'Every ladder in Tally is topped out. SUM is the next game up &mdash; written adding, taking away, times tables and fractions.'
      : 'Next game up when these ladders top out: SUM &mdash; written adding and taking away.') + '</div>';
  h += '<div style="text-align:center"><button class="btn" type="button" data-act="home">BACK</button></div></div>';
  app.innerHTML = h;
}

/* ============================================================== effects == */
function burst(x, y) {
  var cols = ['#ffca28', '#ff8a65', '#66bb6a', '#42a5f5', '#ab47bc'], i;
  for (i = 0; i < 9; i++) {
    var d = document.createElement('div');
    d.className = 'star';
    var a = (i / 9) * Math.PI * 2 + Math.random();
    d.style.left = (x - 20) + 'px';
    d.style.top = (y - 20) + 'px';
    d.style.setProperty('--dx', (Math.cos(a) * (60 + Math.random() * 70)).toFixed(0) + 'px');
    d.style.setProperty('--dy', (Math.sin(a) * (60 + Math.random() * 70) - 30).toFixed(0) + 'px');
    d.innerHTML = '<svg viewBox="0 0 40 40">' + star5(20, 20, 19, cols[i % cols.length]) + '</svg>';
    fx.appendChild(d);
  }
  window.setTimeout(function () { while (fx.firstChild) fx.removeChild(fx.firstChild); }, 1100);
}
var bannerTimer = 0;
function hideBanner() { bannerEl.classList.remove('on'); if (bannerTimer) { window.clearTimeout(bannerTimer); bannerTimer = 0; } }
function banner(text, soft) {
  bannerEl.textContent = text;
  bannerEl.classList.toggle('soft', !!soft);
  bannerEl.classList.add('on');
  if (bannerTimer) window.clearTimeout(bannerTimer);
  bannerTimer = window.setTimeout(function () { bannerEl.classList.remove('on'); }, 1900);
}

/* ================================================================ flow == */
var advTimer = 0, echoTimer = 0;
function clearTimers() {
  if (advTimer) { window.clearTimeout(advTimer); advTimer = 0; }
  if (echoTimer) { window.clearTimeout(echoTimer); echoTimer = 0; }
}
/* Say the question, then after a clear pause say the key part again. */
function speakPrompt(it) {
  if (echoTimer) { window.clearTimeout(echoTimer); echoTimer = 0; }
  say(promptScript(it));
  echoTimer = window.setTimeout(function () {
    echoTimer = 0;
    if (state.screen === 'play' && state.item === it && !state.busy) say(echoScript(it));
  }, 2400);
}
function nextItem() {
  clearTimers();
  state.busy = false;
  state.item = nextItemSpec();
  renderPlay();
  window.setTimeout(function () { speakPrompt(state.item); }, 60);
}
function goMenu() {
  clearTimers(); stopSpeech(); hideBanner();
  state.screen = 'menu'; state.busy = false;
  render(); writeSave();
  window.setTimeout(function () { say('Pick a game. Tap a picture.'); }, 60);
}
function goGrown() {
  clearTimers(); stopSpeech(); hideBanner();
  state.screen = 'grown'; state.busy = false;
  render();
}
function startActivity(id) {
  if (actIndex(id) < 0) id = 'howmany';
  clearTimers(); hideBanner();
  state.act = id;
  state.screen = 'play';
  state.busy = false;
  state.roundN = 0; state.roundStars = 0;
  state.item = nextItemSpec();
  document.body.classList.add('playing');
  render(); writeSave();
  window.setTimeout(function () { speakPrompt(state.item); }, 80);
}
function finishRound() {
  clearTimers();
  state.rounds++;
  state.screen = 'done';
  state.busy = false;
  render();
  SFX.fanfare();
  writeSave();
  window.setTimeout(function () {
    say('That is the end of this set. Good work. Tap the green arrow for more, or the squares to pick another game.');
  }, 400);
}

function answer(idx) {
  var it = state.item;
  if (!it || state.busy || state.screen !== 'play') return;
  if (typeof idx !== 'number' || idx < 0 || idx >= it.choices.length) return;
  state.busy = true;
  clearTimers();

  var btns = app.querySelectorAll('.choice');
  var s = statFor(it.key);
  var right = (idx === it.correct);
  state.roundN++;

  if (right) {
    s.a++; dropRequeue(it.key);
    state.stars++; state.roundStars++;
    if (btns[idx]) {
      btns[idx].classList.add('right');
      var r = btns[idx].getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
    }
    SFX.yay();
    var rs = rightScript(it);
    banner('★ ' + rs.split('.')[0] + '.');
    say(rs);
  } else {
    /* No red, no buzzer, no shake, nothing marked wrong. Light up the right
       one, name it warmly, and put the number back in the practice queue. */
    s.w++; addRequeue(it.key);
    if (btns[it.correct]) btns[it.correct].classList.add('show');
    SFX.here();
    var gs = gentleScript(it);
    banner(gs.split('.')[0] + '.', true);
    say(gs);
  }

  var moved = adapt(it.act, right, it.probe);
  writeSave();

  var wait = right ? 1700 : 3000;
  advTimer = window.setTimeout(function () {
    if (moved === 'up') {
      SFX.levelup();
      banner('Moving up');
      say('You are ready for something harder.');
      advTimer = window.setTimeout(afterFeedback, 2100);
    } else {
      afterFeedback();
    }
  }, wait);
}
function afterFeedback() {
  if (state.roundN >= ROUND_LEN) finishRound();
  else nextItem();
}

function replay() {
  initAudio(); SFX.tap();
  if (state.screen === 'menu') { say('Pick a game. Tap a picture.'); return; }
  if (state.screen === 'done') { say('Good work. Tap the green arrow for more, or the squares to pick another game.'); return; }
  if (state.screen === 'play' && state.item) { speakPrompt(state.item); }
}

/* ================================================================ input == */
app.addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  initAudio();
  var a = b.getAttribute('data-act');
  if (a === 'play')   { SFX.open(); goMenu(); return; }
  if (a === 'replay') { replay(); return; }
  if (a === 'grown')  { SFX.tap(); goGrown(); return; }
  if (a === 'voicescreen') {
    SFX.open(); clearTimers(); stopSpeech(); hideBanner();
    state.screen = 'voice'; state.busy = false; render();
    window.setTimeout(function () { say('Who should read to you? Tap a face to hear it.'); }, 80);
    return;
  }
  if (a === 'voice') {
    var vid = b.getAttribute('data-id');
    VOICE.charId = charById(vid).id;
    saveVoicePref();
    SFX.tap();
    render();
    window.setTimeout(function () { say(curChar().line); }, 60);
    return;
  }
  if (a === 'home')   { SFX.tap(); goMenu(); return; }
  if (a === 'again')  { SFX.open(); startActivity(state.act); return; }
  if (a === 'pick') {
    SFX.open();
    var id = b.getAttribute('data-id');
    var ai = actIndex(id);
    say(ai >= 0 ? ACTS[ai].say : '');
    window.setTimeout(function () { startActivity(id); }, 700);
    return;
  }
  if (a === 'answer') {
    var i = parseInt(b.getAttribute('data-i'), 10);
    if (!isNaN(i)) answer(i);
    return;
  }
});
document.getElementById('muteBtn').addEventListener('click', function () {
  initAudio(); setMuted(!muted);
  if (!muted) { SFX.tap(); replay(); }
});
document.getElementById('homeBtn').addEventListener('click', function () {
  initAudio(); SFX.tap(); goMenu();
});
/* Keyboard, for the grown-up alongside: 1-4 answer, R repeats, M mutes,
   Escape goes back to the picture menu. */
document.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'm' || k === 'M') { initAudio(); setMuted(!muted); return; }
  if (k === 'r' || k === 'R') { replay(); return; }
  if (k === 'Escape') { if (state.screen !== 'title' && state.screen !== 'menu') goMenu(); return; }
  if (state.screen === 'title' && (k === 'Enter' || k === ' ')) { initAudio(); goMenu(); return; }
  if (state.screen === 'play' && k >= '1' && k <= '4') { initAudio(); answer(parseInt(k, 10) - 1); }
});
function hush() { stopSpeech(); }
window.addEventListener('blur', hush);
document.addEventListener('visibilitychange', function () { if (document.hidden) hush(); });

/* ============================================================= gallery == */
/* ?gallery=1 — a verification aid, not part of play. Renders every thing at
   several counts and every layout at once, so a human can check that six
   ducks really do read as six separate ducks. */
function renderGallery() {
  var g = document.getElementById('gallery'), h = '<div class="g">', i, n;
  for (i = 0; i < THINGS.length; i++) {
    h += '<div class="gi">' + svgWrap(THINGS[i].art(50, 52, 34), '', '0 0 100 100') + '<b>' + THINGS[i].w + '</b></div>';
  }
  var demos = [[3, 'row'], [5, 'row'], [4, 'dice'], [6, 'dice'], [7, 'row'], [9, 'scatter'], [10, 'frame'], [14, 'frame'], [20, 'frame'], [10, 'scatter']];
  for (i = 0; i < demos.length; i++) {
    n = demos[i][0];
    var gl = layoutFor(n, demos[i][1], 12345 + i * 31);
    h += '<div class="gi" style="background:#f7fbf5">' + groupSvg(gl, THINGS[i % THINGS.length], '') +
      '<b>' + n + ' &middot; ' + demos[i][1] + '</b></div>';
  }
  for (i = 0; i < ACTS.length; i++) {
    h += '<div class="gi" style="background:#eef7ea">' + svgWrap(ACTS[i].icon(), '', '0 0 100 100') + '<b>' + ACTS[i].id + '</b></div>';
  }
  g.innerHTML = h + '</div>';
  g.classList.add('on');
}

/* ================================================================ boot == */
function boot() {
  state = loadSave();
  state.screen = 'title';
  state.item = null; state.busy = false;
  state.roundN = 0; state.roundStars = 0;
  setMuted(loadStr(K_MUTED, '0') === '1');
  loadVoicePref();
  refreshVoices();
  try { if (speechApi()) window.speechSynthesis.onvoiceschanged = refreshVoices; } catch (e) {}
  window.setTimeout(refreshVoices, 350);
  window.setTimeout(refreshVoices, 1200);
  render();
  try { if (/[?&]gallery=1/.test(window.location.search)) renderGallery(); } catch (e) {}
}
boot();

/* Test surface — the harness pokes at these. Keeping the script top-level
   (no IIFE) is deliberate. */
var TALLY_TEST = {
  marker: 'TALLY_FIRST_NUMBERS_V1_MARKER',
  buildItem: buildItem, startActivity: startActivity, answer: answer, adapt: adapt,
  promptScript: promptScript, echoScript: echoScript, rightScript: rightScript, gentleScript: gentleScript,
  layoutFor: layoutFor, numChoices: numChoices, word: word,
  nextItemSpec: nextItemSpec, PROBE_EVERY: PROBE_EVERY,
  PROMOTE_STREAK: PROMOTE_STREAK, DEMOTE_MISSES: DEMOTE_MISSES, RECENT_WINDOW: RECENT_WINDOW,
  loadSave: loadSave, writeSave: writeSave, freshState: freshState,
  maxRung: maxRung, rungOf: rungOf, ACTS: ACTS, THINGS: THINGS, ROUND_LEN: ROUND_LEN,
  getState: function () { return state; },
  setState: function (s) { state = s; }
};
window.TALLY_TEST = TALLY_TEST;
</script>
</body>
